\n       COUNT(o.id)             AS order_count,\n       COALESCE(SUM(o.total), 0) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) >= 2\nORDER BY revenue DESC;","note":"LEFT JOIN keeps customers with no orders, and COUNT(o.id) counts only matched orders. HAVING then keeps customers with at least two orders."},{"task":"CTE + subquery","code":"WITH spend AS (\n    SELECT customer_id, SUM(total) AS spent\n    FROM orders\n    WHERE created_at >= '2026-01-01'\n    GROUP BY customer_id\n)\nSELECT c.name, s.spent\nFROM spend s\nJOIN customers c ON c.id = s.customer_id\nWHERE s.spent > (SELECT AVG(spent) FROM spend)\nORDER BY s.spent DESC;","note":"The CTE names an intermediate result so each step reads top to bottom. The subquery compares every customer with the average."},{"task":"Transaction","code":"BEGIN;\n\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n\n-- If either statement fails, run ROLLBACK instead:\n-- both changes are undone together.\nCOMMIT;","note":"Atomicity in practice: a transfer must never debit one account without crediting the other."},{"task":"Index & plan","code":"CREATE INDEX idx_orders_customer ON orders (customer_id);\n\n-- PostgreSQL: runs the query and shows the real plan and timings\nEXPLAIN ANALYZE\nSELECT * FROM orders WHERE customer_id = 42;","note":"Before the index, expect a sequential scan of the whole table; after it, an index scan. Indexes speed up reads but add cost to every write."},{"task":"Safe query (Python)","code":"# UNSAFE: user input becomes part of the SQL text (SQL injection)\n# cur.execute(f\"SELECT * FROM customers WHERE name = '{name}'\")\n\n# SAFE: the driver sends the value separately from the SQL\ncur.execute(\"SELECT * FROM customers WHERE name = %s\", (name,))\nrow = cur.fetchone()","note":"Placeholder syntax varies by driver (%s in psycopg and mysql-connector, ? in sqlite3 and JDBC, @name in ADO.NET), but the rule is the same: never concatenate input into SQL."}],"snippets":[{"task":"Sum the even numbers","note":"Python and C# read almost like a sentence. Go deliberately has no built-in filter/map, so a plain loop is idiomatic. Rust's iterator chain compiles down to the same machine code as the loop.","code":{"Python":"nums = [1, 2, 3, 4, 5, 6]\ntotal = sum(n for n in nums if n % 2 == 0)\nprint(total)  # 12","TypeScript":"const nums: number[] = [1, 2, 3, 4, 5, 6];\nconst total = nums.filter((n) => n % 2 === 0).reduce((acc, n) => acc + n, 0);\nconsole.log(total); // 12","Java":"import java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\n        int total = nums.stream().filter(n -> n % 2 == 0).mapToInt(Integer::intValue).sum();\n        System.out.println(total); // 12\n    }\n}","C#":"int[] nums = [1, 2, 3, 4, 5, 6];\nvar total = nums.Where(n => n % 2 == 0).Sum();\nConsole.WriteLine(total); // 12","Go":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnums := []int{1, 2, 3, 4, 5, 6}\n\ttotal := 0\n\tfor _, n := range nums {\n\t\tif n%2 == 0 {\n\t\t\ttotal += n\n\t\t}\n\t}\n\tfmt.Println(total) // 12\n}","Rust":"fn main() {\n    let nums = vec![1, 2, 3, 4, 5, 6];\n    let total: i32 = nums.iter().filter(|&&n| n % 2 == 0).sum();\n    println!(\"{total}\"); // 12\n}"}},{"task":"Validate input in a function","note":"Two error models: Python, TypeScript, Java and C# throw exceptions; Go returns an error value next to the result and Rust returns a Result the caller must handle. Boundary tests for all six: 17, 18, 65, 66 and -1.","code":{"Python":"def is_working_age(age: int) -> bool:\n    if age < 0:\n        raise ValueError(f\"age must be >= 0, got {age}\")\n    return 18 <= age <= 65\n\nprint(is_working_age(18), is_working_age(66))  # True False","TypeScript":"function isWorkingAge(age: number): boolean {\n  if (!Number.isInteger(age) || age < 0) {\n    throw new RangeError(`age must be a non-negative integer, got ${age}`);\n  }\n  return age >= 18 && age <= 65;\n}\n\nconsole.log(isWorkingAge(18), isWorkingAge(66)); // true false","Java":"public class Main {\n    static boolean isWorkingAge(int age) {\n        if (age < 0) {\n            throw new IllegalArgumentException(\"age must be >= 0, got \" + age);\n        }\n        return age >= 18 && age <= 65;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isWorkingAge(18) + \" \" + isWorkingAge(66)); // true false\n    }\n}","C#":"static bool IsWorkingAge(int age)\n{\n    ArgumentOutOfRangeException.ThrowIfNegative(age);\n    return age is >= 18 and <= 65;\n}\n\nConsole.WriteLine($\"{IsWorkingAge(18)} {IsWorkingAge(66)}\"); // True False","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc isWorkingAge(age int) (bool, error) {\n\tif age < 0 {\n\t\treturn false, errors.New(\"age must be >= 0\")\n\t}\n\treturn age >= 18 && age <= 65, nil\n}\n\nfunc main() {\n\tok, err := isWorkingAge(18)\n\tfmt.Println(ok, err) // true <nil>\n}","Rust":"fn is_working_age(age: i32) -> Result<bool, String> {\n    if age < 0 {\n        return Err(format!(\"age must be >= 0, got {age}\"));\n    }\n    Ok((18..=65).contains(&age))\n}\n\nfn main() {\n    println!(\"{:?}\", is_working_age(18)); // Ok(true)\n    println!(\"{:?}\", is_working_age(-1)); // Err(\"age must be >= 0, got -1\")\n}"}},{"task":"Read a file and handle errors","note":"Catch the specific error you expect (file not found) and let everything else surface. Java makes you declare checked exceptions (throws IOException); in Go and Rust the error is a value you have to look at, and Rust's match won't compile until every case is handled.","code":{"Python":"from pathlib import Path\n\ntry:\n    print(Path(\"config.txt\").read_text(encoding=\"utf-8\"))\nexcept FileNotFoundError:\n    print(\"config.txt not found\")","TypeScript":"import { readFile } from \"node:fs/promises\";\n\ntry {\n  console.log(await readFile(\"config.txt\", \"utf8\"));\n} catch (err) {\n  if ((err as NodeJS.ErrnoException).code === \"ENOENT\") {\n    console.log(\"config.txt not found\");\n  } else {\n    throw err;\n  }\n}","Java":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try {\n            System.out.println(Files.readString(Path.of(\"config.txt\")));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"config.txt not found\");\n        }\n    }\n}","C#":"try\n{\n    Console.WriteLine(File.ReadAllText(\"config.txt\"));\n}\ncatch (FileNotFoundException)\n{\n    Console.WriteLine(\"config.txt not found\");\n}","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\tdata, err := os.ReadFile(\"config.txt\")\n\tif errors.Is(err, fs.ErrNotExist) {\n\t\tfmt.Println(\"config.txt not found\")\n\t\treturn\n\t}\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tfmt.Print(string(data))\n}","Rust":"use std::fs;\nuse std::io::ErrorKind;\n\nfn main() {\n    match fs::read_to_string(\"config.txt\") {\n        Ok(text) => println!(\"{text}\"),\n        Err(e) if e.kind() == ErrorKind::NotFound => println!(\"config.txt not found\"),\n        Err(e) => panic!(\"{e}\"),\n    }\n}"}},{"task":"Run two tasks concurrently","note":"Same goal, three models: async/await on an event loop (Python, TypeScript, C#), threads (Java virtual threads, Rust scoped threads) and goroutines (Go). Both tasks wait at the same time, so the total is about 1 second, not 2.","code":{"Python":"import asyncio\n\nasync def fetch(name: str, seconds: float) -> str:\n    await asyncio.sleep(seconds)  # stands in for a network call\n    return f\"{name} done\"\n\nasync def main() -> None:\n    results = await asyncio.gather(fetch(\"users\", 1), fetch(\"orders\", 1))\n    print(results)  # ~1 s total, not 2\n\nasyncio.run(main())","TypeScript":"const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));\n\nasync function fetchData(name: string, ms: number): Promise<string> {\n  await sleep(ms); // stands in for a network call\n  return `${name} done`;\n}\n\nconst results = await Promise.all([fetchData(\"users\", 1000), fetchData(\"orders\", 1000)]);\nconsole.log(results); // ~1 s total, not 2","Java":"import java.util.concurrent.Executors;\n\npublic class Main {\n    static String fetch(String name) throws InterruptedException {\n        Thread.sleep(1000); // stands in for a network call\n        return name + \" done\";\n    }\n\n    public static void main(String[] args) throws Exception {\n        try (var pool = Executors.newVirtualThreadPerTaskExecutor()) {\n            var users = pool.submit(() -> fetch(\"users\"));\n            var orders = pool.submit(() -> fetch(\"orders\"));\n            System.out.println(users.get() + \", \" + orders.get()); // ~1 s total\n        }\n    }\n}","C#":"static async Task<string> FetchAsync(string name)\n{\n    await Task.Delay(1000); // stands in for a network call\n    return $\"{name} done\";\n}\n\nvar results = await Task.WhenAll(FetchAsync(\"users\"), FetchAsync(\"orders\"));\nConsole.WriteLine(string.Join(\", \", results)); // ~1 s total","Go":"package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc fetch(name string) string {\n\ttime.Sleep(time.Second) // stands in for a network call\n\treturn name + \" done\"\n}\n\nfunc main() {\n\tnames := []string{\"users\", \"orders\"}\n\tresults := make([]string, len(names))\n\tvar wg sync.WaitGroup\n\tfor i, name := range names {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = fetch(name)\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(results) // ~1 s total\n}","Rust":"use std::thread;\nuse std::time::Duration;\n\nfn fetch(name: &str) -> String {\n    thread::sleep(Duration::from_secs(1)); // stands in for a network call\n    format!(\"{name} done\")\n}\n\nfn main() {\n    let (users, orders) = thread::scope(|s| {\n        let a = s.spawn(|| fetch(\"users\"));\n        let b = s.spawn(|| fetch(\"orders\"));\n        (a.join().unwrap(), b.join().unwrap())\n    });\n    println!(\"{users}, {orders}\"); // ~1 s total\n}"}}]}},"uk":{"ui":{"appName":"Programming Languages Hub","viewsAria":"Розділи","viewHub":"Навчальний хаб","viewRoles":"Рольові модулі","language":"Мова","theme":"Тема: {t}","themeAuto":"авто","themeLight":"світла","themeDark":"темна","contents":"Зміст","searchPh":"Пошук у хабі…","searchAria":"Пошук у хабі","searchHits":"Збіги: {n} з {m} розділів · Enter — перейти","searchNone":"Нічого не знайдено","lvIntern":"Стажер","lvJunior":"Junior","lvMid":"Middle","lvlIntern":"Стажування","lvlJunior":"Junior","lvlMid":"Middle","ready":"Готово: {d} з {n}","all":"Усі","allLangs":"<strong>Усі мови ({n}).<\/strong> Оберіть мету, щоб звузити список.","goalAria":"Фільтр за метою","check":"Перевірка {i} з {n}","showHint":"Показати підказку","hideHint":"Сховати підказку","question":"Запитання {i} з {n}","answers":"Відповіді","answered":"Відповіді: {d} / {n}","score":"Результат: {s} / {n}","correct":"Правильно.","wrong":"Не зовсім.","submit":"Надіслати відповіді","retakeExam":"Скласти іспит ще раз","answerAll":"Спочатку дайте відповідь на всі {n} запитань (відповідей: {d})","examResult":"{s} / {n} ({p}%): {v}.","passed":"складено","notPassed":"поки не складено","passedMsg":"Перегляньте відповіді з позначкою ✗ вище.","failedMsg":"Прочитайте пояснення під кожною ✗, поверніться до цих розділів і складіть іспит ще раз.","best":"Найкраще: {s} / {n}","notAttempted":"Ще не складали","examIntro":"{n} запитань за всім хабом. Дайте відповідь на кожне, потім надішліть, щоб побачити результат. Прохідний бал — 70% ({p} з {n}). Найкращий результат зберігається на цьому пристрої.","toReview":"На повторення: {n}","tileQuizzes":"Тести розділів","tileNone":"Ще жодного не пройдено","tileAvg":"Середній найкращий результат {p}%","tileExam":"Підсумковий іспит","tilePassed":"Складено","tilePassMark":"Прохідний бал {p}","tileReview":"Запитання на повторення","tileReviewLink":"Повторити помилки →","tileNothing":"Поки жодної помилки","copy":"Копіювати код","copied":"Скопійовано","copyFailed":"Не вдалося скопіювати","taskAria":"Завдання","langAria":"Мова","sqlAria":"Приклад SQL","phase":"Етап {i}","learn":"Вивчити","build":"Створити","doneWhen":"Готово, коли"},"hero":"<div class=\"label\">Навчальний хаб · Стажер → Junior → Middle · Розширене видання, вересень 2026<\/div>\n<h1>Programming Languages Hub<\/h1>\n<p class=\"lede\">Що таке мови програмування, як вихідний код перетворюється на поведінку програми, які екосистеми важливі у 2026 році, яке місце поруч із ними посідає SQL і що потрібно знати на кожному етапі кар'єри. Фундаментальні знання, що переносяться між мовами, а не завчена одна мова. Пройдіть структурований шлях від першої програми до middle-інженера й перевіряйте себе тестом після кожної частини.<\/p>\n<div class=\"pipe\" aria-label=\"Ментальна модель\"><b>намір людини<\/b><i>→<\/i><b>вихідний код<\/b><i>→<\/i><b>парсер / компілятор / середовище виконання<\/b><i>→<\/i><b>машинні інструкції + бібліотеки<\/b><i>→<\/i><b>ОС / залізо<\/b><i>→<\/i><b>видима поведінка<\/b><\/div>\n<div class=\"progress\" id=\"progress\"><\/div>\n<div class=\"stats\" id=\"summary\"><\/div>","sections":{"what":"<h2>Що таке мова програмування?<\/h2>\n<p>Формальна система для запису алгоритмів, обробки даних, правил і взаємодії з комп'ютером. Код дотримується <strong>синтаксису<\/strong> мови (як пишеться коректний код) і її <strong>семантики<\/strong> (що він означає). Потім компілятор, інтерпретатор, віртуальна машина, середовище виконання або їх поєднання виконує його чи перетворює на операції, які може виконати комп'ютер.<\/p>\n<p class=\"tip\"><b>Погляд на кар'єру<\/b>Мови — найпомітніша навичка в резюме, але роботодавці наймають за фундаментальні знання, які несе мова: декомпозицію задач, дисципліну налагодження, тестування та системне мислення. Сприймайте мову як засіб для опанування основ.<\/p>","tools":"<h2>Мова, інструменти та фреймворк<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Що це<\/th><th>Визначення<\/th><th>Приклади<\/th><\/tr><\/thead><tbody id=\"t-tools\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Запитання на співбесіді<\/b>Бібліотека чи фреймворк — це питання «хто кого викликає»: ваш код викликає бібліотеку, а фреймворк викликає ваш код. Також будьте готові відрізнити мову від її середовища виконання.<\/p>","exec":"<h2>Як виконується код<\/h2>\n<div class=\"models\">\n<div class=\"model\"><h3>Компіляція наперед (AOT)<\/h3><p>Компілюється в нативний машинний код до запуску.<\/p><code>C · C++ · Go · Rust<\/code><\/div>\n<div class=\"model\"><h3>Байт-код + віртуальна машина<\/h3><p>Компілюється в проміжну форму, яку виконує середовище виконання.<\/p><code>Java → байт-код JVM · C# → .NET IL<\/code><\/div>\n<div class=\"model\"><h3>Інтерпретація / середовище виконання<\/h3><p>Виконується середовищем виконання мови; сучасні також використовують JIT-компіляцію.<\/p><code>Python · JavaScript<\/code><\/div>\n<div class=\"model\"><h3>Транспіляція<\/h3><p>Одна мова перетворюється на іншу до виконання.<\/p><code>TypeScript → JavaScript<\/code><\/div>\n<\/div>\n<p class=\"note\"><strong>Пам'ятайте:<\/strong> «компільована» та «інтерпретована» — спрощені ярлики. Сучасні середовища виконання поєднують парсинг, байт-код, JIT-компіляцію, кешування, оптимізацію та нативне виконання.<\/p>\n<h3>Детальніше: що відбувається, коли ви «запускаєте» Python або JavaScript <span class=\"pill lv-mid\">Middle<\/span><\/h3>\n<ol class=\"steps\">\n<li><span><strong>Лексичний аналіз і парсинг:<\/strong> вихідний текст розбивається на токени й перетворюється на абстрактне синтаксичне дерево (AST).<\/span><\/li>\n<li><span><strong>Пониження:<\/strong> AST перетворюється на байт-код (CPython <code>.pyc<\/code>; байт-код V8 Ignition).<\/span><\/li>\n<li><span><strong>Виконання + профілювання:<\/strong> інтерпретатор виконує байт-код і збирає профілі типів і розгалужень для «гарячих» ділянок.<\/span><\/li>\n<li><span><strong>JIT-оптимізація:<\/strong> «гарячі» функції перекомпілюються в машинний код (V8 TurboFan, трасувальний JIT у PyPy). Порушені припущення спричиняють <em>деоптимізацію<\/em> назад в інтерпретатор.<\/span><\/li>\n<li><span><strong>Служби середовища:<\/strong> збирання сміття, вбудовані функції та межі FFI працюють поруч із вашим кодом.<\/span><\/li>\n<\/ol>\n<p class=\"note\"><strong>Наслідки:<\/strong> перший запуск коду Python повільніший за другий (кешування байт-коду); мікробенчмарки можуть обманювати (прогрів JIT); деоптимізація пояснює, чому функція раптом сповільнюється після зміни типу.<\/p>","quiz-1":"<div class=\"lvhead\"><h2>Тест: Основи<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Чотири запитання про те, що таке мова, інструменти й фреймворки та як виконується код. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","concepts":"<h2>Ключові концепції, що переносяться<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Концепція<\/th><th>Чому це важливо<\/th><\/tr><\/thead><tbody id=\"t-concepts\"><\/tbody><\/table><\/div>\n<h3>Детальніше: системи типів — найуніверсальніша концепція<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Вимір<\/th><th>Значення<\/th><th>Приклади<\/th><\/tr><\/thead><tbody id=\"t-types\"><\/tbody><\/table><\/div>\n<ul class=\"checks\" style=\"list-style:disc;padding-left:20px;display:grid;gap:8px\">\n<li><strong>Поступова типізація<\/strong> — компроміс індустрії: Python <code>typing<\/code> (mypy/pyright) і TypeScript додають статичні гарантії, не втрачаючи динамічної гнучкості.<\/li>\n<li><strong>Узагальнення (generics)<\/strong> дозволяють безпечно працювати з багатьма типами; розуміння варіантності (in/out, коваріантність/контраваріантність) — справжня ознака рівня middle.<\/li>\n<li><strong>Типи-суми та зіставлення зі зразком<\/strong> (enum + match у Rust, sealed-класи в Java/Kotlin, дискриміновані об'єднання в TS) роблять некоректні стани непредставними.<\/li>\n<li><strong>Типи й тестування:<\/strong> у статичних мовах компілятор — безкоштовний і швидкий набір тестів; динамічним мовам потрібно більше тестів, щоб покрити те, що впіймав би компілятор.<\/li>\n<\/ul>","code":"<h2>Одне завдання, шість мов<\/h2>\n<p>Чотири щоденні завдання, написані ідіоматично кожною мовою. Оберіть завдання, потім мову, і порівняйте, як кожна працює з колекціями, помилками та конкурентністю.<\/p>\n<div class=\"tabs\" id=\"taskTabs\" role=\"group\" aria-label=\"Завдання\"><\/div>\n<div class=\"codehead\"><div class=\"tabs\" id=\"langTabs\" role=\"group\" aria-label=\"Мова\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"copyBtn\">Копіювати код<\/button><\/div>\n<div class=\"label\" id=\"snipCap\"><\/div>\n<pre class=\"code\"><code id=\"snippet\"><\/code><\/pre>\n<p class=\"note\" id=\"snipNote\"><\/p>","langs":"<h2>Основні мови та їхні ніші<\/h2>\n<div class=\"tabs\" id=\"goalTabs\" role=\"group\" aria-label=\"Фільтр за метою\"><\/div>\n<div class=\"tw\"><table><thead><tr><th>Мова<\/th><th>Сильні сторони / екосистема<\/th><th>Що вивчати<\/th><th>Типове застосування<\/th><\/tr><\/thead><tbody id=\"t-langs\"><\/tbody><\/table><\/div>\n<p class=\"note\" id=\"goalWhy\"><\/p>\n<h3>Профілі мов, погляд 2026 року<\/h3>\n<div class=\"profiles\" id=\"profiles\"><\/div>","memory":"<h2>Моделі пам'яті: порівняння<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Модель<\/th><th>Мови<\/th><th>Компроміс<\/th><\/tr><\/thead><tbody id=\"t-mem\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Планка для middle:<\/strong> пояснити, навіщо існує GC, як виглядає витік пам'яті в мові з GC (ненавмисно утримані посилання) і коли варто платити за модель володіння або ручне керування пам'яттю.<\/p>","quiz-2":"<div class=\"lvhead\"><h2>Тест: Концепції, мови та пам'ять<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Чотири запитання про системи типів, основні мови та моделі пам'яті. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","sql":"<h2>SQL і програмування баз даних<\/h2>\n<p>SQL (Structured Query Language) зазвичай вважають мовою програмування, а точніше <strong>предметно-орієнтованою мовою (DSL)<\/strong> для запитів до реляційних баз даних і керування ними. Вона <strong>декларативна<\/strong>: розробник описує бажану операцію чи результат, а система керування базою даних вирішує, як це виконати. SQL доповнює мови загального призначення, як-от Python, Java, C#, JavaScript, Go і Rust.<\/p>\n<p class=\"tip\"><b>Декларативно чи імперативно<\/b>У Python ви пишете цикл, який проходить клієнтами й залишає німецьких. У SQL ви пишете <code>SELECT name FROM customers WHERE country = 'DE'<\/code>, а планувальник запитів бази даних сам вирішує, сканувати таблицю чи використати індекс. Більшість застосунків поєднують обидва підходи: мову загального призначення для логіки, SQL для даних.<\/p>\n<h3>Ключові навички SQL<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Навичка<\/th><th>Що знати<\/th><\/tr><\/thead><tbody id=\"t-sql\"><\/tbody><\/table><\/div>\n<h3>Прогрес у вивченні SQL<\/h3>\n<p>Позначте те, що вже вмієте. Ці рівні відповідають етапам структурованого навчального шляху.<\/p>\n<div class=\"sqllv\">\n<div class=\"lv-intern\"><span class=\"pill\">Стажування<\/span><ul class=\"checks\" data-lv=\"sqlintern\"><\/ul><\/div>\n<div class=\"lv-junior\"><span class=\"pill\">Junior<\/span><ul class=\"checks\" data-lv=\"sqljunior\"><\/ul><\/div>\n<div class=\"lv-mid\"><span class=\"pill\">Middle<\/span><ul class=\"checks\" data-lv=\"sqlmid\"><\/ul><\/div>\n<\/div>\n<h3>SQL на практиці<\/h3>\n<p>Приклади використовують невелику схему магазину: <code>customers(id, name, country)<\/code>, <code>orders(id, customer_id, total, created_at)<\/code> і <code>accounts(id, balance)<\/code>. Синтаксис PostgreSQL.<\/p>\n<div class=\"codehead\"><div class=\"tabs\" id=\"sqlTabs\" role=\"group\" aria-label=\"Приклад SQL\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"sqlCopy\">Копіювати код<\/button><\/div>\n<pre class=\"code\"><code id=\"sqlCode\"><\/code><\/pre>\n<p class=\"note\" id=\"sqlNote\"><\/p>\n<h3>Відмінності діалектів<\/h3>\n<div class=\"tw\"><table><thead><tr><th>База даних<\/th><th>Обмеження рядків<\/th><th>Ключ з автоінкрементом<\/th><th>Примітки<\/th><\/tr><\/thead><tbody id=\"t-dialects\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Переносима звичка:<\/strong> спочатку вивчіть стандартний SQL (PostgreSQL або SQLite — добрі майданчики для практики), а деталі діалектів шукайте, коли їх вимагає робота. JOIN, агрегація й транзакції працюють у будь-якій базі даних.<\/p>","quiz-sql":"<div class=\"lvhead\"><h2>Тест: SQL і бази даних<\/h2><span class=\"count score\"><\/span><\/div>\n<p>П'ять запитань про природу SQL, JOIN, агрегацію, ін'єкції та транзакції. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","landscape":"<h2>Популярність і зарплати у 2026 році<\/h2>\n<p>Популярність залежить від того, як її вимірювати. Кожен рейтинг називає свого лідера.<\/p>\n<div class=\"stats\">\n<div class=\"stat\"><span class=\"label\">Опитування · використання<\/span><span class=\"v\">JavaScript<\/span><span class=\"w\">~66–69% професійних розробників (Stack Overflow 2025, понад 49 000 респондентів)<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">GitHub · контриб'ютори<\/span><span class=\"v\">TypeScript<\/span><span class=\"w\">№1 із серпня 2025 року, ~67% зростання за рік<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Пошук · TIOBE<\/span><span class=\"v\">Python 21,81%<\/span><span class=\"w\">Лютий 2026, на 10+ пунктів попереду C — найбільший розрив за 25 років<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Симпатія розробників<\/span><span class=\"v\">Rust ~72%<\/span><span class=\"w\">Найулюбленіша мова ~10 років поспіль<\/span><\/div>\n<\/div>\n<p class=\"tip\"><b>Для тих, хто навчається<\/b>JS/TS домінують у загальній розробці; Python домінує в даних і AI та зростає найшвидше серед мейнстримних мов; SQL (ним користуються ~59–61% розробників) варто вивчити незалежно від основної мови.<\/p>\n<h3>Сигнали щодо зарплат · приблизні медіани в США, огляди 2026 року<\/h3>\n<div class=\"sal\" role=\"img\" aria-label=\"Діапазони зарплат за мовами, від 100 до 210 тисяч доларів США\">\n<div class=\"axis\"><span><\/span><div><span>$100K<\/span><span>$155K<\/span><span>$210K<\/span><\/div><span><\/span><\/div>\n<div id=\"sal\"><\/div>\n<\/div>\n<p class=\"note\"><strong>Оплата залежить від дефіциту фахівців і ціни помилки, а не від популярності.<\/strong> Для JS і Python найбільше вакансій і найбільше кандидатів; складні мови у сферах із високими ставками (Rust в інфраструктурі, C++ у HFT та іграх, Scala у фінансах) дають надбавку. Надбавка Python у ML (бурштинова смуга) походить від спеціалізації, а не від мови. Цифри орієнтовні й сильно залежать від регіону.<\/p>","quiz-3":"<div class=\"lvhead\"><h2>Тест: Ландшафт 2026 року<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Чотири запитання про рейтинги популярності та сигнали щодо зарплат. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","ai":"<h2>Розробка з AI-асистентами<\/h2>\n<p>AI-асистенти для програмування стали стандартом: 82% розробників в опитуванні Stack Overflow 2025 року використовували моделі GPT від OpenAI для розробки протягом минулого року. Це змінює те, що варто вивчати.<\/p>\n<div class=\"models\">\n<div class=\"model\"><h3>Основи важать ще більше<\/h3><p>Асистенти прискорюють тих, хто вміє переглядати, виправляти й перевіряти код, і збільшують прогалини в тих, хто не вміє.<\/p><\/div>\n<div class=\"model\"><h3>Перевірка — це професія<\/h3><p>Точно описуйте вимоги (вхідні дані, результати, граничні випадки, обмеження), а потім тестуйте результат як код, написаний не вами.<\/p><\/div>\n<div class=\"model\"><h3>Знайте, що ви постачаєте<\/h3><p>Ліцензія, безпека й правильність — на вас. Ніколи не вставляйте секрети в асистенти; перевіряйте згенеровані залежності.<\/p><\/div>\n<div class=\"model\"><h3>Синергія з мовою<\/h3><p>Допомога найкраща в мейнстримних мовах (Python, TypeScript, Java) і слабша в нішевих мовах і внутрішніх фреймворках.<\/p><\/div>\n<\/div>\n<p class=\"note\"><strong>Досі вирізняє:<\/strong> декомпозиція задач, архітектура, налагодження продакшн-систем і вміння зважувати компроміси.<\/p>","quiz-4":"<div class=\"lvhead\"><h2>Тест: Розробка з AI-асистентами<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Чотири запитання про роботу з AI-асистентами для програмування. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","intern":"<div class=\"lvhead\"><h2>Очікування на стажуванні<\/h2><span class=\"count\" data-c=\"intern\"><\/span><\/div>\n<p>Мета — не знати кожну можливість мови. Розумійте задачу, пишіть невеликі програми, запускайте, налагоджуйте й тестуйте їх і пояснюйте результат. Позначте те, що вже вмієте.<\/p>\n<p class=\"tip\"><b>Глибше: Рольові модулі<\/b>Окремі модулі для стажування, Junior і Middle з детальними уроками, нотатками для кожної мови, прикладами коду, тестом та іспитом для кожної ролі. <a href=\"#roles\">Відкрити рольові модулі →<\/a><\/p><ul class=\"checks\" data-lv=\"intern\"><\/ul>\n<p class=\"tip\"><b>Реалістичний план на 3 місяці<\/b>Тижні 1–4: основи + одна мова. Тижні 5–8: невеликі проєкти з тестами та Git. Тижні 9–12: невеликий API або проєкт з автоматизації з CI та рев'ю коду від ментора.<\/p>","junior":"<div class=\"lvhead\"><h2>Очікування від Junior<\/h2><span class=\"count\" data-c=\"junior\"><\/span><\/div><ul class=\"checks\" data-lv=\"junior\"><\/ul>","mid":"<div class=\"lvhead\"><h2>Очікування від Middle<\/h2><span class=\"count\" data-c=\"mid\"><\/span><\/div><ul class=\"checks\" data-lv=\"mid\"><\/ul>","depth":"<h2>Наскільки глибоко вчити на кожному етапі<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Етап<\/th><th>Вивчати глибоко<\/th><th>Може зачекати<\/th><\/tr><\/thead><tbody>\n<tr class=\"lv-intern\"><td><span class=\"pill\">Стажер<\/span><\/td><td>Синтаксис, типи, керування потоком, функції, колекції, базове ООП, помилки, тести, Git, налагодження.<\/td><td>Складне метапрограмування, внутрішня будова компілятора, складна конкурентність, мікрооптимізації.<\/td><\/tr>\n<tr class=\"lv-junior\"><td><span class=\"pill\">Junior<\/span><\/td><td>Ідіоми, модулі, керування залежностями, тестування, основи асинхронності й конкурентності, API, бази даних, CI/CD.<\/td><td>Тонкощі специфікації мови та вузькоспеціалізовані деталі середовища виконання, якщо вони не потрібні в роботі.<\/td><\/tr>\n<tr class=\"lv-mid\"><td><span class=\"pill\">Middle<\/span><\/td><td>Поведінка середовища виконання, архітектура, продуктивність, спостережуваність, безпека, конкурентність, архітектурні компроміси.<\/td><td>Знати напам'ять кожну можливість бібліотеки; натомість ефективно користуйтеся документацією.<\/td><\/tr>\n<\/tbody><\/table><\/div>","choose":"<h2>Як обрати першу або наступну мову<\/h2>\n<p>Обирайте за цільовою роботою, а не лише за популярністю. Фільтр за метою в розділі «Основні мови» використовує цю таблицю.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Мета<\/th><th>Розгляньте<\/th><th>Чому<\/th><\/tr><\/thead><tbody id=\"t-goals\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Поширене поєднання двох мов<\/b>Python (дані, автоматизація, тестування) + TypeScript (продуктова та веброзробка) покривають велику частку вакансій 2026 року. Додайте Go або Rust пізніше, якщо рухатиметеся в бік інфраструктури чи системного програмування.<\/p>","qa":"<h2>З погляду QA<\/h2>\n<p>QA-інженерові не потрібно ставати розробником на повну ставку. Уміння програмувати покращує дизайн тестів, автоматизацію, тестування API, налагодження, аналіз логів, роботу з CI/CD і спілкування з розробниками.<\/p>\n<ul class=\"checks\" data-lv=\"qa\"><\/ul>\n<p class=\"tip\"><b>ISTQB і мови програмування<\/b>Сертифікації ISTQB не залежать від інструментів і мов: вони не навчають жодної конкретної мови програмування й не вимагають володіння нею. ISTQB зосереджується виключно на методологіях, принципах, термінології та фреймворках тестування програмного забезпечення. Навички програмування з цієї сторінки доповнюють сертифікацію, але не є її частиною.<\/p>","path":"<h2>Структурований навчальний шлях<\/h2>\n<p>П'ять етапів від першої програми до middle-інженера. Кожен етап має мету, що вивчити, що створити, і критерії «готово, коли». Переходьте далі, коли виконали критерії, а не коли так каже календар.<\/p>\n<p class=\"tip\"><b>Як користуватися цим шляхом<\/b>Терміни розраховані приблизно на 10–15 годин на тиждень; ті, хто навчається повний день, часто можуть скоротити їх удвічі. Тримайтеся однієї основної мови до етапу 3. Більшість часу присвячуйте створенню та налагодженню, а не перегляду туторіалів. Після кожного етапу повторно проходьте відповідні тести й очищуйте список на повторення.<\/p>\n<div class=\"phases\" id=\"phases\"><\/div>\n<p class=\"note\"><strong>Як решта хабу пов'язана зі шляхом:<\/strong> пронумеровані кроки — у послідовності навчання нижче, чеклісти етапів (стажування, Junior, Middle) вимірюють готовність, таблиця проєктів пропонує проєкт для кожного рівня, а прогрес у SQL іде паралельно з етапами 2–5.<\/p>","sequence":"<h2>Рекомендована послідовність навчання<\/h2>\n<p>Справжній порядок: кожен крок спирається на попередній, а етапи структурованого шляху групують ці кроки. Позначайте кроки, коли завершуєте їх.<\/p><ol class=\"seq\" id=\"seq\"><\/ol>","projects":"<h2>Практичні проєкти за рівнями<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Рівень<\/th><th>Проєкт<\/th><th>Які навички показує<\/th><\/tr><\/thead><tbody id=\"t-proj\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Порада щодо портфоліо<\/b>Один завершений, протестований і задокументований проєкт з README, значком CI та живим демо кращий за п'ять напівготових репозиторіїв. Пишіть README для інженера, який наймає: задача, рішення щодо дизайну, як запустити, відомі обмеження.<\/p>","mistakes-s":"<h2>Типові помилки початківців<\/h2><ul class=\"mistakes\" id=\"mistakes\"><\/ul>","quiz-5":"<div class=\"lvhead\"><h2>Тест: Етапи кар'єри та QA<\/h2><span class=\"count score\"><\/span><\/div>\n<p>П'ять запитань про очікування на кожному етапі, вибір мови, погляд QA та проєкти. Оберіть відповідь, щоб побачити, чи вона правильна і чому.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Пройти тест ще раз<\/button>","selfcheck":"<h2>Самоперевірка<\/h2>\n<p>Чекліст перевірки в стилі QA у формі запитань. Спочатку дайте відповідь уголос, потім відкрийте підказку.<\/p><div class=\"quiz\" id=\"quiz\"><\/div>","exam":"<div class=\"lvhead\"><h2>Підсумковий іспит<\/h2><span class=\"count\" id=\"examBest\"><\/span><\/div>\n<p id=\"examIntro\"><\/p>\n<div class=\"quiz\" id=\"examQ\"><\/div>\n<div class=\"examfoot\"><button type=\"button\" class=\"act\" id=\"examSubmit\">Надіслати відповіді<\/button><span class=\"count\" id=\"examMsg\" aria-live=\"polite\"><\/span><\/div>\n<p class=\"note\" id=\"examResult\" aria-live=\"polite\" hidden><\/p>","review":"<div class=\"lvhead\"><h2>Повторити мої помилки<\/h2><span class=\"count\" id=\"reviewCount\"><\/span><\/div>\n<p>Кожне запитання, на яке ви помилилися в тестах розділів чи на підсумковому іспиті, потрапляє сюди. Дайте правильну відповідь, щоб прибрати його зі списку.<\/p>\n<div class=\"quiz\" id=\"reviewQ\"><\/div><p class=\"note\" id=\"reviewEmpty\" hidden>Немає чого повторювати. Тут з'являться запитання, на які ви помилилися в тестах та на іспиті.<\/p>\n<button type=\"button\" class=\"reset\" id=\"reviewRefresh\">Оновити список<\/button>","refs-s":"<h2>Довідкова карта<\/h2>\n<h3>Офіційна документація<\/h3><ul class=\"refs\" id=\"refs\"><\/ul>\n<h3>Практика<\/h3><ul class=\"refs\" id=\"practice\"><\/ul>\n<h3>Рольові модулі<\/h3>\n<p class=\"tip\"><b>Рольові модулі<\/b>Модулі для стажування, Junior і Middle з детальними уроками, нотатками для кожної мови, прикладами коду, тестом та іспитом для кожної ролі. <a href=\"#roles\">Відкрити рольові модулі →<\/a><\/p>\n<p class=\"note\"><strong>Джерела.<\/strong> Офіційна документація (Python, MDN, TypeScript, Dev.java, Microsoft Learn, Go, Kotlin) перевірена у вересні 2026 року. Дані про ринок: Stack Overflow Developer Survey 2025, GitHub Octoverse 2025, TIOBE (лютий 2026), PYPL і огляди зарплат 2026 року (Stack Overflow, DICE, статистика праці США). Сприймайте будь-який окремий рейтинг як один сигнал, а не як істину.<\/p>\n<p class=\"bottom\"><strong>Підсумок.<\/strong> Вивчіть одну мову достатньо глибоко, щоб зрозуміти основи, а потім опановуйте інші, порівнюючи системи типів, моделі виконання, моделі пам'яті, моделі конкурентності, інструменти та екосистеми. Для шляху в QA добрий старт — TypeScript/JavaScript і Python; Java, C#, Go, Rust і C++ покажуть інші інженерні моделі. У 2026 році додайте дві звички: перевіряйте код, згенерований AI, як код, написаний не вами, і вибирайте мови на основі даних (опитувань, активності комітів, місцевих вакансій), а не хайпу.<\/p>\n<button class=\"reset\" id=\"reset\" type=\"button\">Очистити мій прогрес на цьому пристрої<\/button>"},"data":{"tools":[["Мова програмування","Правила для запису обчислень.","Python, JavaScript, Java, C#, C++, Go, Rust, Kotlin"],["Компілятор / інтерпретатор / середовище виконання","Перетворює вихідний код на виконувану поведінку або виконує його.","JVM, середовище .NET, інтерпретатор Python пускається неявне перетворення типів.","Python (сильна) проти приведення типів у JavaScript через <code>==<\/code> (слабка)"],["Номінальна чи структурна","Типи збігаються за оголошеною назвою чи за формою.","Java/C# (номінальна) проти інтерфейсів TypeScript/Go (структурна)"],["Явна чи виведена","Типи виписуються вручну чи виводяться компілятором.","Haskell/Rust (активне виведення), Java до версії 10 (явна)"],["Nullability","Чи є null/None частиною кожного типу.","Kotlin, Swift, Rust і TS зі strictNullChecks розділяють типи, що допускають null; Optional у Java та typing.Optional у Python лише наближаються до цього"]],"memory":[["Збирач сміття (трасувальний)","Java, C#, Go, JavaScript","Найпростіше у використанні; паузи та накладні витрати. GC у Go налаштований на низькі затримки."],["Підрахунок посилань + збирач циклів","Python, Swift, Rust (Rc/Arc)","Передбачуваний, але цикли потребують уваги (застереження щодо <code>__del__<\/code> у Python)."],["Володіння / borrow checker","Rust","Без GC, безпека пам'яті на етапі компіляції; складніше навчання."],["Ручне керування","C, C++","Максимальний контроль; use-after-free та витоки — ваша відповідальність."]],"languages":[["Python","Читабельний синтаксис, широка стандартна бібліотека, велика екосистема.","Функції, структури даних, ООП, типізація, тестування, пакування.","Автоматизація, бекенд, дані, AI/ML, скрипти, QA"],["JavaScript","Рідна мова вебу, зрілі екосистеми для браузера й сервера.","Асинхронність, DOM, модулі, промиси, API.","Фронтенд, бекенд на Node.js, інструменти, автоматизація"],["TypeScript","JavaScript зі статичною перевіркою типів.","Типи, звуження, узагальнення, модулі, опції компілятора.","Вебзастосунки, Node.js, великі кодові бази JS, автоматизація тестів"],["Java","Зріла екосистема JVM, сильна типізація, корпоративні інструменти.","ООП, колекції, узагальнення, винятки, конкурентність, JVM.","Бекенд, корпоративні системи, екосистема Android, сервіси"],["C#","Сучасна мова з сильною типізацією для .NET.","ООП, LINQ, async/await, узагальнення, середовище .NET.","Бекенд, корпоративні системи, десктоп, хмара, ігри на Unity"],["C++","Продуктивність, низькорівневий контроль, зріла системна екосистема.","Пам'ять, RAII, шаблони, STL, системи збирання.","Системи, вбудовані пристрої, ігри, критичні до продуктивності задачі"],["Go","Простий синтаксис, швидка компіляція, вбудована конкурентність.","Пакети, інтерфейси, помилки, горутини, канали, тестування.","Хмарні сервіси, мережі, інфраструктура, інструменти"],["Rust","Безпека пам'яті без традиційного GC.","Володіння, запозичення, трейти, часи життя, Result/Option.","Системи, інфраструктура, ПЗ, критичне до безпеки"],["Kotlin","Лаконічна мова для JVM, сильна сумісність із Java.","Null-безпека, класи, колекції, корутини.","Android, бекенд на JVM, мультиплатформа"],["Swift","Екосистема Apple, сильні типи й безпека.","Optionals, структури/класи, протоколи, конкурентність.","iOS / macOS / watchOS / tvOS"],["PHP","Орієнтована на веб, дуже велика кількість розгортань.","Сучасний PHP, ООП, Composer, HTTP, тестування.","Веббекенди та екосистеми CMS"],["Ruby","Виразний синтаксис, продуктивна веб-екосистема.","Об'єкти, блоки, основи метапрограмування, тестування.","Веброзробка, автоматизація, скрипти"]],"goals":[["Веб-фронтенд",["JavaScript","TypeScript"],"Екосистема браузера та сучасні вебінструменти."],["Автоматизація QA",["TypeScript","JavaScript","Python","Java","C#"],"Сильні екосистеми автоматизації та добра інтеграція з інструментами тестування."],["Бекенд-сервіси",["Java","C#","Go","Python","TypeScript","Kotlin"],"Зрілі фреймворки та екосистеми сервісів."],["Системи / продуктивність",["C++","Rust","Go"],"Контроль, передбачувана продуктивність, ефективна системна розробка."],["Дані / AI / автоматизація",["Python"],"Сильні бібліотеки та продуктивна робота зі скриптами й даними."],["Android",["Kotlin"],"Сучасна екосистема Android."],["Платформи Apple",["Swift"],"Нативна розробка для Apple."]],"profiles":[["Python","Мова за замовчуванням в епоху AI/ML. Використання за даними Stack Overflow зросло на ~7 пунктів у 2024→2025 — найбільший стрибок серед усіх мов. Сучасний Python (3.12+): підказки типів, інструменти uv/ruff, асинхронність. Досі найкращий вибір для автоматизації QA та роботи з даними."],["TypeScript","Мова великомасштабної веброзробки: №1 за кількістю контриб'юторів на GitHub у 2025 році. Ключові професійні навички: узагальнення, дискриміновані об'єднання та strict mode."],["JavaScript","Досі найпоширеніша мова (~66–69% професійних розробників), бо без браузера не обійтися. Вивчайте середовище виконання (цикл подій, промиси) так само глибоко, як синтаксис."],["Rust","Найулюбленіша мова ~10 років (~72% хочуть і далі нею користуватися); кількість користувачів більш ніж подвоїлася з 2022 року. Почніть із володіння; повільний старт, але великий виграш у системах і високопродуктивних бекендах."],["Go","Прагматична хмарна мова (Kubernetes, Docker, більшість проєктів CNCF). Швидко вивчається після Python/Java; високі зарплати, широкий попит, невелика мова."],["Java / C#","Корпоративні «робочі конячки» з величезними й стабільними ринками праці. Активно модернізуються: records, зіставлення зі зразком, віртуальні потоки (Java); top-level statements, Span, minimal APIs (C#)."],["C++","Використання не зростає, але зосереджене в цінних сферах (ігри, HFT, вбудовані системи, браузери). Вивчайте, якщо цілитеся саме туди."],["Kotlin","Стандарт для Android і дедалі популярніший на сервері (Ktor, Spring). Корутини — ключова навичка, що вирізняє."],["Swift","Лише платформи Apple, але це прибуткова й стабільна ніша. SwiftUI + async/await — сучасна основа."]],"salaries":[["Solidity",200,200,"~$200K"],["Rust",155,185,"$155–185K"],["Go",132,155,"$132–155K"],["Scala",150,150,"~$150K"],["Kotlin / Swift",130,135,"$130–135K"],["TypeScript",128,132,"$128–132K"],["Python",125,125,"~$125K"],["Python · ML",150,175,"$150–175K+",1],["Java / C# / JS",110,130,"$110–130K"]],"checklists":{"intern":["Розуміти змінні, основні типи, оператори, умови, цикли та функції.","Використовувати базові колекції й обирати відповідну структуру для простої задачі.","Читати наявний код і відстежувати потік даних крізь функції та модулі.","Користуватися Git: clone, branch, status, diff, commit, pull, push, розв'язувати прості конфлікти.","Користуватися IDE/редактором, терміналом, форматером і дебагером.","Встановлювати залежності й розуміти базову конфігурацію пакета чи збирання.","Писати базові автотести; розуміти перевірки (assertions), фікстури/підготовку та ізоляцію.","Читати повідомлення про помилки й створювати мінімальний відтворюваний приклад.","Розуміти основи HTTP, JSON, REST і термінологію клієнт/сервер.","Гігієна безпеки: жодних секретів у комітах, валідація вводу, різниця між автентифікацією та авторизацією."],"junior":["Реалізовувати невеликі та середні функції з обмеженим наглядом.","Писати ідіоматичний код, а не буквально перекладати з іншої мови.","Правильно використовувати модулі, інтерфейси/абстракції, керування залежностями та конфігурацію.","Писати змістовні юніт- та інтеграційні тести; розуміти моки/стаби та їхні компроміси.","Системно налагоджувати за допомогою логів, стеків викликів, точок зупину, трасування та системи контролю версій.","Робити рев'ю pull request і пояснювати компроміси щодо читабельності, надійності, продуктивності та підтримуваності.","Розуміти основи баз даних, транзакції, індекси та типові збої API.","Розуміти асинхронне та конкурентне виконання там, де це важливо для екосистеми.","Використовувати CI-конвеєри та перевірки якості: лінтинг, форматування, тести, збирання, артефакти.","Розпізнавати ін'єкції, порушений контроль доступу, незахищені секрети та небезпечні залежності.","Відповідально користуватися AI-асистентами: згенеруйте, потім перевірте, і вмійте пояснити кожен рядок, який мержите."],"mid":["Проєктувати компоненти й інтерфейси з чіткими обов'язками та межами залежностей.","Обирати структури даних і алгоритми з огляду на складність та експлуатаційні обмеження.","Міркувати про продуктивність, пам'ять, конкурентність, відновлення після збоїв і спостережуваність.","Розуміти поведінку середовища виконання: GC, віртуальні машини/JIT, компіляцію, мережу, взаємодію з ОС.","Керувати налагодженням збоїв, наближених до продакшну; відрізняти симптоми від першопричин.","Проєктувати стратегії тестування, а не лише окремі тести.","Керувати залежностями, сумісністю версій, міграціями та зворотною сумісністю.","Робити архітектурні компроміси явними; оцінювати оборотність рішень та експлуатаційні ризики.","Менторити junior-розробників через рев'ю коду, парне програмування та технічні пояснення.","Долучатися до стандартів і автоматизації, не додаючи зайвої складності.","Критично оцінювати AI-інструменти: де вони пришвидшують команду, а де додають навантаження на рев'ю чи ризики."],"sqlintern":["Писати запити SELECT із фільтрацією WHERE та сортуванням ORDER BY.","З'єднувати дві таблиці простим INNER або LEFT JOIN.","Вставляти, оновлювати та видаляти рядки (CRUD).","Пояснювати, що таке таблиці, рядки, стовпці, первинні та зовнішні ключі."],"sqljunior":["З'єднувати кілька таблиць і агрегувати дані з GROUP BY та HAVING.","Групувати пов'язані зміни в транзакцію з COMMIT і ROLLBACK.","Захищати дані обмеженнями: NOT NULL, UNIQUE, CHECK і зовнішніми ключами.","Додавати індекс і перевіряти, що база даних його використовує.","Змінювати схему лише через міграції; керувати початковими й тестовими даними.","Завжди використовувати параметризовані запити."],"sqlmid":["Читати плани виконання й оптимізувати повільні запити.","Обирати рівні ізоляції та міркувати про аномалії конкурентності.","Діагностувати блокування, очікування та взаємоблокування.","Використовувати складний SQL: віконні функції, рекурсивні CTE та upsert.","Моделювати дані: нормалізація, коли денормалізувати, еволюція схеми."],"qa":["Читати продакшн-код, щоб знаходити поведінку для тестування, межі та шляхи збоїв.","Писати детерміновану автоматизацію, а не крихкі UI-скрипти.","Генерувати тестові дані програмно, зокрема граничні та некоректні.","Перевіряти контракти API, коди стану, заголовки, JSON-схеми та поведінку при помилках.","Створювати допоміжні функції/фікстури, що зменшують дублювання, не приховуючи поведінки.","Використовувати параметризовані тести для класів еквівалентності та аналізу граничних значень.","Досліджувати асинхронну поведінку та стани гонитви в розподілених або багатокористувацьких системах.","Запускати статичний аналіз, лінтери, перевірку залежностей і сканери безпеки в CI.","Ставитися до тестового коду, згенерованого AI, як до продуктового: перевіряти, що assertions тестують поведінку, а не реалізацію."]},"sequence":["Основи: значення → змінні → типи → вирази → керування потоком","Функції та декомпозиція: вхідні дані, результати, побічні ефекти, модулі","Колекції та структури даних","Обробка помилок і захисне програмування","ООП та/або функціональні концепції, і коли кожна допомагає","Git і спільна розробка","Тестування: юніт → інтеграційне → API/компонентне → E2E","HTTP, JSON, REST API, SQL і реляційні бази даних","Керування пакетами та інструменти збирання","Налагодження, логування та спостережуваність","Конкурентне / асинхронне програмування","Безпека та керування залежностями","Продуктивність і профілювання","Архітектура та підтримуваність"],"projects":[["intern","Консольний калькулятор / трекер задач","Синтаксис, функції, колекції, валідація, тести"],["intern","Невеликий клієнт REST API","HTTP, JSON, обробка помилок, тестові дані"],["junior","CRUD API + база даних","Архітектура, збереження даних, валідація, інтеграційні тести"],["junior","Проєкт автотестів UI + API","Фікстури, page objects там, де доречно, допоміжні функції для API, CI"],["mid","Сервіс з автентифікацією та спостережуваністю","Безпека, логування, метрики, обробка збоїв (Junior → Middle)"],["mid","Кілька сервісів або система, наближена до продакшну","Контракти, стійкість, конкурентність, продуктивність, архітектура"]],"mistakes":["Вчити синтаксис, не навчившись налагоджувати.","Копіювати код фреймворку, не розуміючи мови під ним.","Використовувати бібліотеки, не розібравшись зі стандартною бібліотекою.","Зловживати наслідуванням замість простішої композиції.","Ігнорувати обробку помилок, бо «щасливий шлях» працює.","Писати тести, які лише повторюють деталі реалізації.","Вважати асинхронний код завжди послідовним.","Комітити секрети або довіряти коду на стороні клієнта.","Оптимізувати продуктивність, не вимірявши її.","Завчати документацію замість того, щоб навчитися в ній орієнтуватися.","Вставляти код, згенерований AI, не розуміючи його.","Гнатися за модними мовами, поки основи не засвоєні."],"selfCheck":[["Чи можете ви пояснити різницю між мовою, середовищем виконання, бібліотекою та фреймворком?","Мова — правила; середовище виконання — те, що виконує код; бібліотеку викликає ваш код; фреймворк викликає ваш код."],["Чи вмієте ви запускати код і з IDE, і з терміналу?","Знайте точну команду, яку IDE виконує за вас (python app.py, npm test, dotnet run)."],["Чи вмієте ви тлумачити помилку компілятора, інтерпретатора або середовища виконання?","Прочитайте тип помилки, повідомлення, потім перший кадр стека у вашому власному коді."],["Чи можете ви написати невелику функцію й протестувати звичайні, граничні та некоректні вхідні дані?","Для віку 18–65: перевірте 30, потім 17/18/65/66, потім -1, null і \"abc\"."],["Чи вмієте ви відстежувати дані крізь модулі й знаходити побічні ефекти?","Простежте одне значення від входу до результату; відзначте кожен запис у файл, БД, мережу чи спільний стан."],["Чи можете ви пояснити, звідки беруться залежності і як контролюються версії?","Реєстр (npm, PyPI, Maven Central), маніфест, lock-файл, семантичне версіонування."],["Чи відтворюєте ви дефект, перш ніж виправляти його?","Виправлення, яке не можна перевірити на відтворенні, — це здогадка."],["Чи можете ви пояснити, що доводять ваші тести, а що — ні?","Тести показують наявність дефектів, а не їх відсутність (принцип 1
