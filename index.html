 Git, pruebas, HTTP/JSON/REST y SQL","SQL de nivel prácticas: SELECT, filtrado, ordenación, JOIN sencillos, CRUD y conceptos de esquema"],"practice":["Un cliente de API REST que guarda sus resultados en SQLite","Cada cambio pasa por una rama y un pull request con pruebas"],"done":["Las pruebas se ejecutan con un solo comando y pasan en CI","Escribes un JOIN de dos tablas sin consultarlo","La mayor parte de la lista de prácticas está marcada"]},{"phase":"Construir servicios reales","lv":"junior","time":"Meses 5–9","goal":"Entregar funcionalidades pequeñas y medianas con supervisión limitada.","learn":["Pasos 09–10 de la secuencia: gestión de paquetes, herramientas de compilación, depuración, logs","SQL de nivel junior: JOIN de varias tablas, agregación, transacciones, restricciones, índices, migraciones y datos de prueba","Código idiomático en tu lenguaje principal"],"practice":["Una API CRUD sobre una base de datos real, con migraciones y datos iniciales","Pruebas de integración contra una base de datos desechable (un contenedor Docker o SQLite)"],"done":["Das comentarios concretos y útiles en las revisiones de código","Los cambios de esquema pasan por migraciones, nunca a mano","La mayor parte de la lista de junior está marcada"]},{"phase":"Mentalidad de producción","lv":"junior","time":"Meses 10–18","goal":"Mantener el software correcto bajo carga, fallos y ataques.","learn":["Pasos 11–13 de la secuencia: concurrencia y asincronía, seguridad y dependencias, rendimiento y perfilado","SQL de nivel mid: planes de ejecución, optimización de consultas, niveles de aislamiento y bloqueos","Observabilidad: logs, métricas y trazas"],"practice":["Añade autenticación, limitación de peticiones y métricas a tu servicio","Encuentra y corrige una consulta lenta usando su plan de ejecución"],"done":["Sabes explicar un fallo similar a producción a partir de sus logs y trazas","Mides antes de optimizar","Examen final aprobado (70% o más)"]},{"phase":"Ingeniería de nivel mid","lv":"mid","time":"Desde el mes 18","goal":"Ser responsable de componentes de principio a fin y ayudar a crecer a otras personas.","learn":["Paso 14 de la secuencia: arquitectura y mantenibilidad","Funcionamiento interno del entorno de ejecución: GC, JIT y modelos de memoria","Modelado de bases de datos y compromisos entre diseños","Un segundo lenguaje con un modelo distinto (Go, Rust o Java/C#)"],"practice":["Un sistema de varios servicios o similar a producción, con contratos y resiliencia","Acompaña a un desarrollador junior en una funcionalidad"],"done":["Haces explícitos los compromisos y prefieres decisiones reversibles","La mayor parte de la lista de nivel mid está marcada","Podrías enseñar cualquier sección de este hub"]}],"sqlSkills":[["SELECT, INSERT, UPDATE, DELETE","Las cuatro sentencias CRUD: leer, crear, cambiar y eliminar filas."],["WHERE, ORDER BY, LIMIT/OFFSET","Filtrar filas, ordenar resultados y paginarlos."],["JOIN","Combinar tablas: INNER conserva solo las coincidencias; LEFT conserva todas las filas de la tabla izquierda; RIGHT, FULL y CROSS JOIN cuando el dialecto los admite."],["Agregación","COUNT, SUM, AVG, MIN y MAX con GROUP BY; HAVING filtra grupos después de agregar, WHERE filtra filas antes."],["Subconsultas y CTE","Consultas dentro de consultas; WITH (expresiones de tabla comunes) da nombre a cada paso para que las consultas complejas sigan siendo legibles."],["Esquema y restricciones","Tablas, filas y columnas; las claves primarias identifican filas y las foráneas enlazan tablas; NOT NULL, UNIQUE y CHECK protegen los datos."],["Transacciones y ACID","BEGIN, COMMIT y ROLLBACK agrupan cambios para que se apliquen todos o ninguno: atomicidad, consistencia, aislamiento, durabilidad."],["Índices y planes de consulta","Los índices aceleran las búsquedas a costa de las escrituras; EXPLAIN muestra cómo ejecutará la base de datos una consulta."],["Prevención de la inyección SQL","Nunca construyas SQL concatenando entradas del usuario; usa consultas parametrizadas o prepared statements."],["Migraciones y datos de prueba","Cambios de esquema versionados (Flyway, Liquibase, Alembic, EF Core, Prisma), datos iniciales y conjuntos de prueba reproducibles."],["Diferencias entre dialectos","PostgreSQL, MySQL, SQL Server/T-SQL, Oracle y SQLite comparten un núcleo, pero difieren en sintaxis y funciones."]],"dialects":[["PostgreSQL","<code>LIMIT n OFFSET m<\/code>","<code>GENERATED … AS IDENTITY<\/code> o <code>SERIAL<\/code>","Fiel a los estándares y muy completo: JSONB, arrays, indexación potente. Una opción habitual para proyectos nuevos."],["MySQL","<code>LIMIT n OFFSET m<\/code> o <code>LIMIT m, n<\/code>","<code>AUTO_INCREMENT<\/code>","Muy extendido en stacks web. InnoDB es el motor transaccional; los identificadores se escriben entre acentos graves."],["SQL Server (T-SQL)","<code>TOP n<\/code> o <code>OFFSET m ROWS FETCH NEXT n ROWS ONLY<\/code>","<code>IDENTITY(1,1)<\/code>","Ecosistema de Microsoft y .NET. T-SQL añade extensiones procedimentales; los identificadores van entre corchetes."],["Oracle","<code>FETCH FIRST n ROWS ONLY<\/code> (12c+), antes <code>ROWNUM<\/code>","Columnas identity (12c+) o secuencias","Empresa y finanzas. PL/SQL para código procedimental; una cadena vacía se trata como NULL."],["SQLite","<code>LIMIT n OFFSET m<\/code>","<code>INTEGER PRIMARY KEY<\/code>","Base de datos embebida en un único archivo con tipado flexible. Ideal para aprender, pruebas, aplicaciones móviles y herramientas."]],"sqlExamples":[{"task":"Filtrar y ordenar","code":"SELECT name, country\nFROM customers\nWHERE country = 'DE'\nORDER BY name\nLIMIT 10;","note":"Describes el resultado (clientes alemanes, en orden alfabético, los 10 primeros); la base de datos decide cómo encontrarlos."},{"task":"JOIN + agregación","code":"SELECT c.name,\n       COUNT(o.id)             AS order_count,\n       COALESCE(SUM(o.total), 0) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) >= 2\nORDER BY revenue DESC;","note":"LEFT JOIN conserva a los clientes sin pedidos, y COUNT(o.id) cuenta solo los pedidos que coinciden. Después, HAVING conserva a los clientes con al menos dos pedidos."},{"task":"CTE + subconsulta","code":"WITH spend AS (\n    SELECT customer_id, SUM(total) AS spent\n    FROM orders\n    WHERE created_at >= '2026-01-01'\n    GROUP BY customer_id\n)\nSELECT c.name, s.spent\nFROM spend s\nJOIN customers c ON c.id = s.customer_id\nWHERE s.spent > (SELECT AVG(spent) FROM spend)\nORDER BY s.spent DESC;","note":"La CTE da nombre a un resultado intermedio para que cada paso se lea de arriba abajo. La subconsulta compara a cada cliente con la media."},{"task":"Transacción","code":"BEGIN;\n\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n\n-- If either statement fails, run ROLLBACK instead:\n-- both changes are undone together.\nCOMMIT;","note":"La atomicidad en la práctica: una transferencia nunca debe cargar una cuenta sin abonar la otra."},{"task":"Índice y plan","code":"CREATE INDEX idx_orders_customer ON orders (customer_id);\n\n-- PostgreSQL: runs the query and shows the real plan and timings\nEXPLAIN ANALYZE\nSELECT * FROM orders WHERE customer_id = 42;","note":"Antes del índice, espera un recorrido secuencial de toda la tabla; después, un recorrido por índice. Los índices aceleran las lecturas, pero encarecen cada escritura."},{"task":"Consulta segura (Python)","code":"# UNSAFE: user input becomes part of the SQL text (SQL injection)\n# cur.execute(f\"SELECT * FROM customers WHERE name = '{name}'\")\n\n# SAFE: the driver sends the value separately from the SQL\ncur.execute(\"SELECT * FROM customers WHERE name = %s\", (name,))\nrow = cur.fetchone()","note":"La sintaxis de los marcadores depende del driver (%s en psycopg y mysql-connector, ? en sqlite3 y JDBC, @name en ADO.NET), pero la regla es la misma: nunca concatenes entradas en el SQL."}],"snippets":[{"task":"Sumar los números pares","note":"Python y C# se leen casi como una frase. Go no tiene filter/map integrados a propósito, así que un bucle normal es lo idiomático. La cadena de iteradores de Rust se compila al mismo código máquina que el bucle.","code":{"Python":"nums = [1, 2, 3, 4, 5, 6]\ntotal = sum(n for n in nums if n % 2 == 0)\nprint(total)  # 12","TypeScript":"const nums: number[] = [1, 2, 3, 4, 5, 6];\nconst total = nums.filter((n) => n % 2 === 0).reduce((acc, n) => acc + n, 0);\nconsole.log(total); // 12","Java":"import java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\n        int total = nums.stream().filter(n -> n % 2 == 0).mapToInt(Integer::intValue).sum();\n        System.out.println(total); // 12\n    }\n}","C#":"int[] nums = [1, 2, 3, 4, 5, 6];\nvar total = nums.Where(n => n % 2 == 0).Sum();\nConsole.WriteLine(total); // 12","Go":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnums := []int{1, 2, 3, 4, 5, 6}\n\ttotal := 0\n\tfor _, n := range nums {\n\t\tif n%2 == 0 {\n\t\t\ttotal += n\n\t\t}\n\t}\n\tfmt.Println(total) // 12\n}","Rust":"fn main() {\n    let nums = vec![1, 2, 3, 4, 5, 6];\n    let total: i32 = nums.iter().filter(|&&n| n % 2 == 0).sum();\n    println!(\"{total}\"); // 12\n}"}},{"task":"Validar la entrada en una función","note":"Dos modelos de error: Python, TypeScript, Java y C# lanzan excepciones; Go devuelve un valor de error junto al resultado y Rust devuelve un Result que quien llama debe gestionar. Pruebas de límites para los seis: 17, 18, 65, 66 y -1.","code":{"Python":"def is_working_age(age: int) -> bool:\n    if age < 0:\n        raise ValueError(f\"age must be >= 0, got {age}\")\n    return 18 <= age <= 65\n\nprint(is_working_age(18), is_working_age(66))  # True False","TypeScript":"function isWorkingAge(age: number): boolean {\n  if (!Number.isInteger(age) || age < 0) {\n    throw new RangeError(`age must be a non-negative integer, got ${age}`);\n  }\n  return age >= 18 && age <= 65;\n}\n\nconsole.log(isWorkingAge(18), isWorkingAge(66)); // true false","Java":"public class Main {\n    static boolean isWorkingAge(int age) {\n        if (age < 0) {\n            throw new IllegalArgumentException(\"age must be >= 0, got \" + age);\n        }\n        return age >= 18 && age <= 65;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isWorkingAge(18) + \" \" + isWorkingAge(66)); // true false\n    }\n}","C#":"static bool IsWorkingAge(int age)\n{\n    ArgumentOutOfRangeException.ThrowIfNegative(age);\n    return age is >= 18 and <= 65;\n}\n\nConsole.WriteLine($\"{IsWorkingAge(18)} {IsWorkingAge(66)}\"); // True False","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc isWorkingAge(age int) (bool, error) {\n\tif age < 0 {\n\t\treturn false, errors.New(\"age must be >= 0\")\n\t}\n\treturn age >= 18 && age <= 65, nil\n}\n\nfunc main() {\n\tok, err := isWorkingAge(18)\n\tfmt.Println(ok, err) // true <nil>\n}","Rust":"fn is_working_age(age: i32) -> Result<bool, String> {\n    if age < 0 {\n        return Err(format!(\"age must be >= 0, got {age}\"));\n    }\n    Ok((18..=65).contains(&age))\n}\n\nfn main() {\n    println!(\"{:?}\", is_working_age(18)); // Ok(true)\n    println!(\"{:?}\", is_working_age(-1)); // Err(\"age must be >= 0, got -1\")\n}"}},{"task":"Leer un archivo y gestionar errores","note":"Captura el error concreto que esperas (archivo no encontrado) y deja que el resto se propague. Java te obliga a declarar las excepciones comprobadas (throws IOException); en Go y Rust el error es un valor que tienes que examinar, y el match de Rust no compila hasta que se gestionan todos los casos.","code":{"Python":"from pathlib import Path\n\ntry:\n    print(Path(\"config.txt\").read_text(encoding=\"utf-8\"))\nexcept FileNotFoundError:\n    print(\"config.txt not found\")","TypeScript":"import { readFile } from \"node:fs/promises\";\n\ntry {\n  console.log(await readFile(\"config.txt\", \"utf8\"));\n} catch (err) {\n  if ((err as NodeJS.ErrnoException).code === \"ENOENT\") {\n    console.log(\"config.txt not found\");\n  } else {\n    throw err;\n  }\n}","Java":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try {\n            System.out.println(Files.readString(Path.of(\"config.txt\")));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"config.txt not found\");\n        }\n    }\n}","C#":"try\n{\n    Console.WriteLine(File.ReadAllText(\"config.txt\"));\n}\ncatch (FileNotFoundException)\n{\n    Console.WriteLine(\"config.txt not found\");\n}","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\tdata, err := os.ReadFile(\"config.txt\")\n\tif errors.Is(err, fs.ErrNotExist) {\n\t\tfmt.Println(\"config.txt not found\")\n\t\treturn\n\t}\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tfmt.Print(string(data))\n}","Rust":"use std::fs;\nuse std::io::ErrorKind;\n\nfn main() {\n    match fs::read_to_string(\"config.txt\") {\n        Ok(text) => println!(\"{text}\"),\n        Err(e) if e.kind() == ErrorKind::NotFound => println!(\"config.txt not found\"),\n        Err(e) => panic!(\"{e}\"),\n    }\n}"}},{"task":"Ejecutar dos tareas a la vez","note":"El mismo objetivo, tres modelos: async/await sobre un bucle de eventos (Python, TypeScript, C#), hilos (hilos virtuales de Java, hilos con ámbito de Rust) y goroutines (Go). Ambas tareas esperan a la vez, así que el total es de alrededor de 1 segundo, no 2.","code":{"Python":"import asyncio\n\nasync def fetch(name: str, seconds: float) -> str:\n    await asyncio.sleep(seconds)  # stands in for a network call\n    return f\"{name} done\"\n\nasync def main() -> None:\n    results = await asyncio.gather(fetch(\"users\", 1), fetch(\"orders\", 1))\n    print(results)  # ~1 s total, not 2\n\nasyncio.run(main())","TypeScript":"const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));\n\nasync function fetchData(name: string, ms: number): Promise<string> {\n  await sleep(ms); // stands in for a network call\n  return `${name} done`;\n}\n\nconst results = await Promise.all([fetchData(\"users\", 1000), fetchData(\"orders\", 1000)]);\nconsole.log(results); // ~1 s total, not 2","Java":"import java.util.concurrent.Executors;\n\npublic class Main {\n    static String fetch(String name) throws InterruptedException {\n        Thread.sleep(1000); // stands in for a network call\n        return name + \" done\";\n    }\n\n    public static void main(String[] args) throws Exception {\n        try (var pool = Executors.newVirtualThreadPerTaskExecutor()) {\n            var users = pool.submit(() -> fetch(\"users\"));\n            var orders = pool.submit(() -> fetch(\"orders\"));\n            System.out.println(users.get() + \", \" + orders.get()); // ~1 s total\n        }\n    }\n}","C#":"static async Task<string> FetchAsync(string name)\n{\n    await Task.Delay(1000); // stands in for a network call\n    return $\"{name} done\";\n}\n\nvar results = await Task.WhenAll(FetchAsync(\"users\"), FetchAsync(\"orders\"));\nConsole.WriteLine(string.Join(\", \", results)); // ~1 s total","Go":"package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc fetch(name string) string {\n\ttime.Sleep(time.Second) // stands in for a network call\n\treturn name + \" done\"\n}\n\nfunc main() {\n\tnames := []string{\"users\", \"orders\"}\n\tresults := make([]string, len(names))\n\tvar wg sync.WaitGroup\n\tfor i, name := range names {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = fetch(name)\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(results) // ~1 s total\n}","Rust":"use std::thread;\nuse std::time::Duration;\n\nfn fetch(name: &str) -> String {\n    thread::sleep(Duration::from_secs(1)); // stands in for a network call\n    format!(\"{name} done\")\n}\n\nfn main() {\n    let (users, orders) = thread::scope(|s| {\n        let a = s.spawn(|| fetch(\"users\"));\n        let b = s.spawn(|| fetch(\"orders\"));\n        (a.join().unwrap(), b.join().unwrap())\n    });\n    println!(\"{users}, {orders}\"); // ~1 s total\n}"}}]}}};

<script>
/* ---- app shell: language, theme and view for the whole page ---- */
(() => {
  const LANGS = ['en', 'uk', 'pl', 'es'], ROLE_HASHES = ['roles', 'intern', 'junior', 'mid'], THEMES = ['auto', 'light', 'dark'];
  const read = k => { try { return JSON.parse(localStorage.getItem(k)) } catch (e) { return null } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };
  let lang = read('app-lang') ?? read('roles-lang');
  if (!LANGS.includes(lang)) { const nav = (navigator.language || 'en').slice(0, 2); lang = LANGS.includes(nav) ? nav : 'en' }
  let theme = 'auto';
  try { theme = localStorage.getItem('plhub-theme') || 'auto' } catch (e) {}
  if (!THEMES.includes(theme)) theme = 'auto';
  window.APP = {lang};
  const root = document.documentElement, $ = id => document.getElementById(id);
  const hostTheme = root.getAttribute('data-theme');
  const t = (k, v = {}) => window.I18N_HUB[lang].ui[k].replace(/\{(\w+)\}/g, (_, x) => v[x]);

  function applyTheme() {
    if (theme === 'auto') { hostTheme ? root.setAttribute('data-theme', hostTheme) : root.removeAttribute('data-theme') }
    else root.setAttribute('data-theme', theme);
    $('themeBtn').textContent = t('theme', {t: t('theme' + theme[0].toUpperCase() + theme.slice(1))});
  }
  function applyLang() {
    root.lang = lang;
    $('ab-brand').textContent = t('appName');
    $('ab-views').setAttribute('aria-label', t('viewsAria'));
    $('vb-hub').textContent = t('viewHub');
    $('vb-roles').textContent = t('viewRoles');
    $('ab-langs').setAttribute('aria-label', t('language'));
    $('ab-langs').querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === lang)));
    applyTheme();
  }
  function showView() {
    const h = location.hash.slice(1), inRoles = ROLE_HASHES.includes(h);
    $('view-hub').hidden = inRoles; $('view-roles').hidden = !inRoles;
    $('vb-hub').setAttribute('aria-current', inRoles ? 'false' : 'page');
    $('vb-roles').setAttribute('aria-current', inRoles ? 'page' : 'false');
    if (h === 'hub' || h === 'roles') scrollTo(0, 0);
  }
  $('ab-langs').addEventListener('click', e => {
    const b = e.target.closest('button[data-l]');
    if (!b || b.dataset.l === lang) return;
    lang = window.APP.lang = b.dataset.l; write('app-lang', lang); applyLang();
    document.dispatchEvent(new CustomEvent('app:lang', {detail: lang}));
  });
  $('themeBtn').addEventListener('click', () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('plhub-theme', theme) } catch (e) {}
    applyTheme();
  });
  let closed = [];
  addEventListener('beforeprint', () => { root.setAttribute('data-theme', 'light'); closed = [...document.querySelectorAll('details:not([open])')]; closed.forEach(d => d.open = true) });
  addEventListener('afterprint', () => { applyTheme(); closed.forEach(d => d.open = false) });
  addEventListener('hashchange', showView);
  applyLang(); showView();
})();
</script>
<script>
/* Study hub view. Content comes from window.I18N_HUB[lang] (built from hub/content/<lang>.json).
   The whole view re-renders when the app language changes; progress in localStorage is kept. */
(() => {
  const HUB = window.I18N_HUB, ORDER = window.HUB_ORDER;
  const root = document.getElementById('hub-root');
  const $ = s => root.querySelector(s);
  let lang = window.APP.lang, U, D;
  const t = (k, v = {}) => U[k].replace(/\{(\w+)\}/g, (_, x) => v[x]);

  /* ---- saved progress (untrusted: keep only the expected shapes) ---- */
  let st = {};
  try { st = JSON.parse(localStorage.getItem('plhub') || '{}') } catch (e) {}
  const isInt = v => Number.isInteger(v) && v >= 0;
  function clean() {
    if (!st || typeof st !== 'object' || Array.isArray(st)) st = {};
    if (!isInt(st.examBest)) delete st.examBest;
    st.qbest = Object.fromEntries(Object.entries(st.qbest && typeof st.qbest === 'object' ? st.qbest : {}).filter(([, v]) => isInt(v)));
    st.missed = Object.fromEntries(Object.entries(st.missed && typeof st.missed === 'object' ? st.missed : {}).filter(([k]) => /^[a-z0-9]+-\d+$/.test(k)).map(([k]) => [k, 1]));
    if (typeof st.codeLang !== 'string') delete st.codeLang;
  }
  clean();
  const save = () => { try { localStorage.setItem('plhub', JSON.stringify(st)) } catch (e) {} };

  const rows = (sel, data) => { $(sel).innerHTML = data.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') };
  const lvName = lv => U['lv' + lv[0].toUpperCase() + lv.slice(1)];
  const lvlName = lv => U['lvl' + lv[0].toUpperCase() + lv.slice(1)];

  /* ---- multiple-choice cards ---- */
  function mcq(el, list) {
    el.innerHTML = list.map((q, i) => '<div class="card" data-i="' + i + '"><div class="label">' + t('question', {i: i + 1, n: list.length}) + '</div><p>' + q[0] + '</p><div class="opts" role="group" aria-label="' + t('answers') + '">' +
      q[1].map((o, j) => [Math.random(), j]).sort((x, y) => x[0] - y[0]).map(([, j]) => '<button type="button" class="opt" data-j="' + j + '" aria-pressed="false">' + q[1][j] + '</button>').join('') +
      '</div><p class="a" hidden></p></div>').join('');
  }
  function reveal(card, q, pick) {
    card.querySelectorAll('.opt').forEach(b => {
      const j = +b.dataset.j; b.disabled = true;
      if (j === q[2]) { b.classList.add('ok'); b.insertAdjacentText('afterbegin', '✓ ') }
      else if (j === pick) { b.classList.add('bad'); b.insertAdjacentText('afterbegin', '✗ ') }
    });
    const a = card.querySelector('.a'); a.hidden = false;
    a.innerHTML = '<strong>' + (pick === q[2] ? t('correct') : t('wrong')) + '</strong> ' + q[3];
  }

  /* ---- missed questions, review list, summary ---- */
  const lookup = key => { const [k, i] = key.split('-'); return k === 'ex' ? D.exam[+i] : (D.quizzes[k] || [])[+i] };
  function track(key, ok) { if (ok) delete st.missed[key]; else st.missed[key] = 1; save() }
  let reviewKeys = [];
  function drawReview() {
    reviewKeys = Object.keys(st.missed).filter(lookup);
    mcq($('#reviewQ'), reviewKeys.map(lookup));
    $('#reviewEmpty').hidden = reviewKeys.length > 0;
    $('#reviewCount').textContent = t('toReview', {n: reviewKeys.length});
  }
  const passMark = () => Math.ceil(D.exam.length * 0.7);
  function summary() {
    const parts = Object.keys(D.quizzes), qb = st.qbest, done = parts.filter(k => qb[k] != null);
    const pct = done.length ? Math.round(done.reduce((a, k) => a + Math.min(qb[k], D.quizzes[k].length) / D.quizzes[k].length, 0) / done.length * 100) : null;
    const miss = Object.keys(st.missed).filter(lookup).length, n = D.exam.length, pm = passMark();
    const tile = (l, v, w) => '<div class="stat"><span class="label">' + l + '</span><span class="v">' + v + '</span><span class="w">' + w + '</span></div>';
    $('#summary').innerHTML =
      tile(t('tileQuizzes'), done.length + ' / ' + parts.length, pct == null ? t('tileNone') : t('tileAvg', {p: pct})) +
      tile(t('tileExam'), st.examBest != null ? Math.min(st.examBest, n) + ' / ' + n : '–', st.examBest == null ? t('notAttempted') : (st.examBest >= pm ? t('tilePassed') : t('tilePassMark', {p: pm}))) +
      tile(t('tileReview'), miss, miss ? '<a href="#review">' + t('tileReviewLink') + '</a>' : t('tileNothing'));
  }
  const refreshStudy = () => { drawReview(); summary() };

  /* ---- checklists and progress bars ---- */
  function prog() {
    let h = '';
    for (const lv of ['intern', 'junior', 'mid']) {
      const list = D.checklists[lv], n = list.length, d = list.filter((_, i) => st[lv + '-' + i]).length;
      h += '<div class="pbox lv-' + lv + '"><div class="row"><span class="pill">' + lvName(lv) + '</span><span>' + d + ' / ' + n + '</span></div><div class="bar"><i style="width:' + Math.round(d / n * 100) + '%"></i></div></div>';
      const c = $('[data-c="' + lv + '"]'); if (c) c.textContent = t('ready', {d, n});
    }
    $('#progress').innerHTML = h;
  }
  const checkbox = (id, text, prefix = '') => '<li><label for="' + id + '">' + prefix + '<input type="checkbox" id="' + id + '"' + (st[id] === true ? ' checked' : '') + '><span>' + text + '</span></label></li>';

  /* ---- language filter ---- */
  let goal = null;
  function drawLangs() {
    const g = D.goals.find(x => x[0] === goal);
    rows('#t-langs', D.languages.filter(l => !g || g[1].includes(l[0])));
    $('#goalWhy').innerHTML = g ? '<strong>' + g[0] + ':</strong> ' + g[2] : t('allLangs', {n: D.languages.length});
    root.querySelectorAll('#goalTabs button').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.g || null) === goal)));
  }

  /* ---- code viewers ---- */
  let task = 0, sqlI = 0;
  function drawCode() {
    const SN = D.snippets, LANGS = Object.keys(SN[0].code);
    const lg = LANGS.includes(st.codeLang) ? st.codeLang : LANGS[0], x = SN[task];
    $('#taskTabs').innerHTML = SN.map((s, i) => '<button type="button" data-t="' + i + '" aria-pressed="' + (i === task) + '">' + s.task + '</button>').join('');
    $('#langTabs').innerHTML = LANGS.map(l => '<button type="button" data-l="' + l + '" aria-pressed="' + (l === lg) + '">' + l + '</button>').join('');
    $('#snipCap').textContent = x.task + ' · ' + lg; $('#snippet').textContent = x.code[lg]; $('#snipNote').textContent = x.note;
    $('#copyBtn').textContent = t('copy');
  }
  function drawSql() {
    const SQ = D.sqlExamples;
    $('#sqlTabs').innerHTML = SQ.map((x, i) => '<button type="button" data-i="' + i + '" aria-pressed="' + (i === sqlI) + '">' + x.task + '</button>').join('');
    $('#sqlCode').textContent = SQ[sqlI].code; $('#sqlNote').textContent = SQ[sqlI].note; $('#sqlCopy').textContent = t('copy');
  }
  function copy(btn, text) {
    try { navigator.clipboard.writeText(text).then(() => btn.textContent = t('copied'), () => btn.textContent = t('copyFailed')) }
    catch (e) { btn.textContent = t('copyFailed') }
  }

  /* ---- part quizzes and final exam ---- */
  const partState = {};
  function drawPart(box) {
    const k = box.dataset.quiz, list = D.quizzes[k];
    partState[k] = {got: 0, done: 0};
    mcq(box.querySelector('.quiz'), list);
    box.querySelector('.score').textContent = t('answered', {d: 0, n: list.length});
  }
  let picks = {};
  function drawExam() {
    picks = {};
    mcq($('#examQ'), D.exam);
    $('#examResult').hidden = true;
    const b = $('#examSubmit'); b.textContent = t('submit'); b.dataset.m = 'submit';
    $('#examMsg').textContent = t('answered', {d: 0, n: D.exam.length});
    $('#examBest').textContent = st.examBest != null ? t('best', {s: Math.min(st.examBest, D.exam.length), n: D.exam.length}) : t('notAttempted');
  }

  /* ---- table of contents and search ---- */
  let secs = [];
  function runSearch() {
    const q = document.getElementById('search').value.trim().toLowerCase(), items = [...document.getElementById('toc').children];
    let n = 0;
    secs.forEach((s, i) => { const hit = !q || s.textContent.toLowerCase().includes(q); items[i].hidden = !hit; if (hit) n++ });
    document.getElementById('searchMsg').textContent = q ? (n ? t('searchHits', {n, m: secs.length}) : t('searchNone')) : '';
    return secs.filter((s, i) => !items[i].hidden);
  }

  /* ---- render everything for the current language ---- */
  function render() {
    const L = HUB[lang]; U = L.ui; D = L.data;
    $('#hub-hero').innerHTML = L.hero;
    $('#hub-sections').innerHTML = ORDER.map(s => '<section ' + s.attrs + '>' + L.sections[s.id] + '</section>').join('');

    rows('#t-tools', D.tools); rows('#t-concepts', D.concepts); rows('#t-types', D.types); rows('#t-mem', D.memory);
    rows('#t-goals', D.goals.map(g => [g[0], g[1].join(' / '), g[2]]));
    rows('#t-sql', D.sqlSkills); rows('#t-dialects', D.dialects);
    rows('#t-proj', D.projects.map(r => ['<span class="pill lv-' + r[0] + '">' + lvName(r[0]) + '</span>', r[1], r[2]]));
    $('#profiles').innerHTML = D.profiles.map(p => '<details class="pr"><summary>' + p[0] + '</summary><p>' + p[1] + '</p></details>').join('');
    $('#goalTabs').setAttribute('aria-label', t('goalAria'));
    $('#goalTabs').innerHTML = '<button type="button">' + t('all') + '</button>' + D.goals.map(g => '<button type="button" data-g="' + g[0] + '">' + g[0] + '</button>').join('');
    if (!D.goals.some(g => g[0] === goal)) goal = null;
    drawLangs();
    const X = v => (v - 100) / 110 * 100;
    $('#sal').innerHTML = D.salaries.map(r => '<div class="srow"><span class="nm">' + r[0] + '</span><div class="track"><i class="' + (r[4] ? 'alt' : '') + '" style="left:' + X(r[1]) + '%;width:' + Math.max(X(r[2]) - X(r[1]), 0) + '%"></i></div><span class="amt">' + r[3] + '</span></div>').join('');

    root.querySelectorAll('.checks[data-lv]').forEach(ul => { const lv = ul.dataset.lv; ul.innerHTML = D.checklists[lv].map((x, i) => checkbox(lv + '-' + i, x)).join('') });
    $('#seq').innerHTML = D.sequence.map((x, i) => checkbox('seq-' + i, x, '<span class="k">' + String(i + 1).padStart(2, '0') + '</span>')).join('');
    prog();
    $('#mistakes').innerHTML = D.mistakes.map(x => '<li>' + x + '</li>').join('');
    $('#phases').innerHTML = D.path.map((ph, i) => '<article class="phase lv-' + ph.lv + '"><div class="phase-head"><span class="k">' + t('phase', {i: i + 1}) + '</span><h3>' + ph.phase + '</h3><span class="pill">' + lvlName(ph.lv) + '</span><span class="t">' + ph.time + '</span></div><p class="goal">' + ph.goal + '</p><div class="pcols">' +
      [[t('learn'), ph.learn], [t('build'), ph.practice], [t('doneWhen'), ph.done]].map(([h, l]) => '<div><div class="label">' + h + '</div><ul>' + l.map(x => '<li>' + x + '</li>').join('') + '</ul></div>').join('') + '</div></article>').join('');

    $('#quiz').innerHTML = D.selfCheck.map((q, i) => '<div class="card"><div class="label">' + t('check', {i: i + 1, n: D.selfCheck.length}) + '</div><p>' + q[0] + '</p><button type="button" aria-expanded="false">' + t('showHint') + '</button><p class="a" hidden>' + q[1] + '</p></div>').join('');
    root.querySelectorAll('[data-quiz]').forEach(drawPart);
    $('#examIntro').textContent = t('examIntro', {n: D.exam.length, p: passMark()});
    drawExam(); refreshStudy();
    $('#taskTabs').setAttribute('aria-label', t('taskAria')); $('#langTabs').setAttribute('aria-label', t('langAria')); $('#sqlTabs').setAttribute('aria-label', t('sqlAria'));
    drawCode(); drawSql();

    const link = r => '<li><a href="' + r[2] + '" target="_blank" rel="noopener"><span>' + r[0] + '</span><small>' + r[1] + '</small></a></li>';
    $('#refs').innerHTML = D.docs.map(link).join('');
    $('#practice').innerHTML = D.practice.map(link).join('');

    secs = [...root.querySelectorAll('#hub-sections section')];
    secs.forEach((s, i) => s.querySelector('h2').insertAdjacentHTML('afterbegin', '<span class="n">' + String(i + 1).padStart(2, '0') + '</span>'));
    document.getElementById('tocLabel').textContent = t('contents');
    const search = document.getElementById('search');
    search.placeholder = t('searchPh'); search.setAttribute('aria-label', t('searchAria'));
    document.getElementById('toc').innerHTML = secs.map((s, i) => '<li><a href="#' + s.id + '"><span>' + String(i + 1).padStart(2, '0') + '</span>' + s.querySelector('h2').lastChild.textContent.trim() + '</a></li>').join('');
    runSearch();
  }

  /* ---- one set of event handlers for the whole view ---- */
  root.addEventListener('click', e => {
    const el = e.target;
    let b;
    if ((b = el.closest('#goalTabs button'))) { goal = b.dataset.g || null; drawLangs(); return }
    if ((b = el.closest('#quiz .card button'))) {
      const a = b.nextElementSibling; a.hidden = !a.hidden;
      b.textContent = a.hidden ? t('showHint') : t('hideHint'); b.setAttribute('aria-expanded', String(!a.hidden)); return;
    }
    if ((b = el.closest('[data-quiz] .retry'))) { drawPart(b.closest('[data-quiz]')); return }
    if ((b = el.closest('[data-quiz] .opt')) && !b.disabled) {
      const box = b.closest('[data-quiz]'), k = box.dataset.quiz, list = D.quizzes[k], c = b.closest('.card'), q = list[+c.dataset.i], j = +b.dataset.j, ps = partState[k];
      reveal(c, q, j); track(k + '-' + c.dataset.i, j === q[2]); ps.done++; if (j === q[2]) ps.got++;
      if (ps.done === list.length) { st.qbest[k] = Math.max(st.qbest[k] || 0, ps.got); save() }
      box.querySelector('.score').textContent = ps.done < list.length ? t('answered', {d: ps.done, n: list.length}) : t('score', {s: ps.got, n: list.length});
      refreshStudy(); return;
    }
    if ((b = el.closest('#examQ .opt')) && !b.disabled) {
      const c = b.closest('.card');
      c.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', String(o === b)));
      picks[c.dataset.i] = +b.dataset.j; $('#examMsg').textContent = t('answered', {d: Object.keys(picks).length, n: D.exam.length}); return;
    }
    if (el.closest('#examSubmit')) {
      const btn = $('#examSubmit'), EX = D.exam;
      if (btn.dataset.m === 'retake') { drawExam(); $('#exam').scrollIntoView(); return }
      const n = Object.keys(picks).length;
      if (n < EX.length) { $('#examMsg').textContent = t('answerAll', {n: EX.length, d: n}); return }
      let s = 0;
      $('#examQ').querySelectorAll('.card').forEach(c => { const i = +c.dataset.i, ok = picks[i] === EX[i][2]; if (ok) s++; reveal(c, EX[i], picks[i]); track('ex-' + i, ok) });
      const pass = s >= passMark();
      st.examBest = Math.max(st.examBest || 0, s); save();
      $('#examBest').textContent = t('best', {s: st.examBest, n: EX.length});
      const r = $('#examResult'); r.hidden = false;
      r.innerHTML = '<strong>' + t('examResult', {s, n: EX.length, p: Math.round(s / EX.length * 100), v: pass ? t('passed') : t('notPassed')}) + '</strong> ' + (pass ? t('passedMsg') : t('failedMsg'));
      $('#examMsg').textContent = ''; btn.textContent = t('retakeExam'); btn.dataset.m = 'retake';
      refreshStudy(); return;
    }
    if ((b = el.closest('#reviewQ .opt')) && !b.disabled) {
      const c = b.closest('.card'), key = reviewKeys[+c.dataset.i], q = lookup(key), j = +b.dataset.j;
      reveal(c, q, j);
      if (j === q[2]) { track(key, true); summary(); $('#reviewCount').textContent = t('toReview', {n: Object.keys(st.missed).filter(lookup).length}) }
      return;
    }
    if (el.closest('#reviewRefresh')) { drawReview(); return }
    if ((b = el.closest('#taskTabs button'))) { task = +b.dataset.t; drawCode(); return }
    if ((b = el.closest('#langTabs button'))) { st.codeLang = b.dataset.l; save(); drawCode(); return }
    if ((b = el.closest('#copyBtn'))) { const SN = D.snippets, LANGS = Object.keys(SN[0].code); copy(b, SN[task].code[LANGS.includes(st.codeLang) ? st.codeLang : LANGS[0]]); return }
    if ((b = el.closest('#sqlTabs button'))) { sqlI = +b.dataset.i; drawSql(); return }
    if ((b = el.closest('#sqlCopy'))) { copy(b, D.sqlExamples[sqlI].code); return }
    if (el.closest('#reset')) {
      st = {}; clean(); save();
      root.querySelectorAll('input[type=checkbox]').forEach(x => x.checked = false);
      prog(); root.querySelectorAll('[data-quiz]').forEach(drawPart); drawExam(); refreshStudy();
    }
  });
  root.addEventListener('change', e => {
    const x = e.target;
    if (x.type !== 'checkbox') return;
    st[x.id] = x.checked; save(); prog();
  });
  const search = document.getElementById('search');
  search.addEventListener('input', runSearch);
  search.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const hit = runSearch();
    if (hit.length && search.value.trim()) hit[0].scrollIntoView();
  });

  document.addEventListener('app:lang', e => { lang = e.detail; render() });
  render();
  // Sections are rendered by script, so jump to a section link (e.g. #sql) once they exist
  const target = location.hash.slice(1) && document.getElementById(location.hash.slice(1));
  if (target && root.contains(target)) target.scrollIntoView();
})();
</script>
<script>
(() => {
const I18N = {"en":{"ui":{"htmlLang":"en","eyebrow":"Career track · Internship → Junior → Mid-level","title":"Role Modules","lede":"Three role modules with lessons, programming-language context, code examples, a module quiz and a role exam for each level. Your scores are saved in this browser.","backToHub":"Programming Languages Hub","language":"Language","roles":"Role","overview":"Overview","expect":"What employers expect","tasks":"Typical first tasks","lessons":"Lessons","lesson":"Lesson","inLanguages":"In your language","langContext":"Which languages matter at this level","langCol":"Language","whyCol":"Why it matters here","quiz":"Module quiz","quizIntro":"Pick an answer to see immediately whether it is right and why.","exam":"Role exam","examIntro":"{n} questions. Answer them all, then submit. The pass mark is 70% ({p} of {n}).","question":"Question {i} of {n}","answered":"{d} / {n} answered","score":"Score: {s} / {n}","correct":"Correct.","wrong":"Not quite.","submit":"Submit answers","retakeQuiz":"Retake quiz","retakeExam":"Retake exam","answerAll":"Answer all {n} questions first ({d} answered)","passed":"passed","notPassed":"not passed yet","passedMsg":"Review any ✗ answers above.","failedMsg":"Read the explanation under each ✗, revisit those lessons, then retake the exam.","best":"Best: {s} / {n}","notAttempted":"Not attempted yet","quizBest":"Quiz","examBest":"Exam","copy":"Copy code","copied":"Copied","copyFailed":"Copy failed","reset":"Clear my scores on this device","codeNote":"Code and code comments stay in English, as in real codebases."},"roles":[{"id":"intern","name":"Internship","summary":"Learn fast, work safely in a real codebase, and ship small, tested changes.","overview":"An internship is where you prove that you can learn quickly and work safely inside a real codebase. Nobody expects you to design systems. Your team expects small, correct, tested changes, good questions, and clear explanations of what you did and why. Pick one main language and learn it properly; the concepts carry over to every language you learn later.","expect":["Solve small, well-defined tasks in one language","Read existing code and follow data through functions and modules","Use Git, branches and pull requests confidently","Write basic automated tests and read error messages","Ask specific questions after trying things yourself first"],"tasks":["Fix a small bug, starting from a reliable reproduction","Add a field or a validation rule to a form or an API","Write tests for a function that has none","Improve documentation or a developer script","Write a simple SQL query for a report"],"lessons":[{"title":"Programming fundamentals in one language","body":"Values, variables, types, conditions, loops, functions and collections are the same ideas in every language; only the syntax changes. Learn them deeply in one language before adding a second. Practise by writing small programs from a blank file, not by copying tutorials: read input, transform it, print a result, and handle bad input.","langs":[["Python","Dynamic typing and indentation as syntax. Lists, dicts and comprehensions cover most everyday work; start with the standard library."],["JavaScript / TypeScript","Use let/const and === (never ==). Arrays and objects are everywhere; add TypeScript types early to catch mistakes before running."],["Java / C#","Static types and classes from day one. The compiler rejects many mistakes before the program runs."],["Go","A deliberately small language: slices, maps, structs and explicit error values. Easy to read, fast to learn."]],"code":"intern-fundamentals"},{"title":"Reading errors and debugging","body":"An error message is information, not a failure. Read the error type, the message, then the first stack frame that points to your own code. Reproduce the problem reliably before trying to fix it, then shrink it to a minimal reproducible example. Use a debugger with breakpoints to inspect values instead of guessing; print statements are fine for quick checks.","langs":[["Python","Tracebacks list the most recent call last: read the bottom line first, then the frames above it."],["JavaScript / TypeScript","Use browser DevTools or the Node inspector. Source maps map compiled JavaScript back to your TypeScript lines."],["Java","In exception stack traces, the \"Caused by\" section usually shows the root cause."],["C#","The Visual Studio and Rider debuggers break on exceptions; \"Just My Code\" hides framework frames."]],"code":"intern-traceback"},{"title":"Git and pull requests","body":"Make one branch per change, keep commits small, and write messages that say what changed and why. Open a pull request with a short description and how you tested it. Treat review comments as teaching, answer each one, and push fixes. Never commit secrets such as passwords or API keys; if it happens, tell your team so the secret can be rotated.","langs":[["Python","Ignore __pycache__/ and .venv/ in .gitignore."],["Node.js","Ignore node_modules/ and build output such as dist/."],["Java","Ignore target/ (Maven) or build/ (Gradle)."],[".NET","Ignore bin/ and obj/."]],"code":"intern-git"},{"title":"Your first automated tests","body":"A test follows Arrange, Act, Assert: prepare data, call the code, check the result. Test the normal case, the boundaries and invalid input. Each test should have one clear reason to fail and run without depending on other tests. Tests that run automatically in CI protect you and your team from regressions.","langs":[["Python","pytest: plain assert statements and parametrize for many cases."],["JavaScript / TypeScript","Vitest or Jest: describe/it blocks with expect()."],["Java","JUnit 5 with assertEquals and @ParameterizedTest."],["C#","xUnit or NUnit with [Fact] and [Theory]."],["Go","The built-in testing package; no framework needed."]],"code":"intern-test"},{"title":"HTTP, JSON and your first SQL","body":"Most software talks over HTTP: a client sends a request, a server returns a status code and a body, usually JSON. 2xx means success, 4xx a client mistake, 5xx a server failure. Data usually lives in a relational database: learn SELECT, WHERE, ORDER BY, a simple JOIN, and INSERT/UPDATE/DELETE.","langs":[["Python","httpx or requests for HTTP; the json module or response.json() for data."],["TypeScript","fetch() is built into browsers and Node; always check response.ok."],["Java / C#","java.net.http.HttpClient and .NET HttpClient; map JSON to classes or records."],["SQL","Practise on SQLite or PostgreSQL; the same basic queries work almost everywhere."]],"code":"intern-http"}],"langContext":[["Python","The fastest start. Common in automation, data, QA and back-end internships."],["TypeScript / JavaScript","The web: front end and Node.js. The largest number of job postings."],["Java / C#","Frequent in enterprise internships. Static typing teaches structure early."],["SQL","Needed in almost every role, because every application stores data."]],"quiz":[{"q":"Where should you start reading a Python traceback?","a":["The first line","The last line: the exception type and message","The middle frames","The file names only"],"c":1,"e":"Python prints the most recent call last, so the bottom line tells you what went wrong."},{"q":"A field accepts 1–100. Which values test the boundaries?","a":["50 only","1 and 100 only","0, 1, 100 and 101","-100 and 1000"],"c":2,"e":"Test just below, on, and just above each boundary."},{"q":"You found a bug. What is the first step?","a":["Rewrite the function","Reproduce it reliably","Ask someone else to fix it","Add more logging everywhere"],"c":1,"e":"Without a reproduction you cannot confirm that your fix works."},{"q":"What does HTTP status 404 mean?","a":["Server crashed","Resource not found","Success","Too many requests"],"c":1,"e":"4xx codes are client errors; 404 means the requested resource does not exist."},{"q":"Where do secrets such as API keys belong?","a":["In the source code","In a commit message","In environment variables or a secret manager","In the README"],"c":2,"e":"Secrets must never be committed; configuration comes from the environment or a secret store."},{"q":"Which query returns customers from Poland sorted by name?","a":["SELECT * FROM customers ORDER BY country","SELECT name FROM customers WHERE country = 'PL' ORDER BY name","UPDATE customers SET country = 'PL'","SELECT name FROM customers GROUP BY name"],"c":1,"e":"WHERE filters the rows; ORDER BY sorts them."}],"exam":[{"q":"Which language is compiled to bytecode and run on a virtual machine?","a":["C","Java","Bash","HTML"],"c":1,"e":"Java compiles to JVM bytecode, which the JVM executes."},{"q":"In JavaScript, 1 == \"1\" is true but 1 === \"1\" is false. Why?","a":["=== is faster","=== compares without type coercion","== only works for strings","It is a browser bug"],"c":1,"e":"== converts types before comparing; === requires the same type."},{"q":"What belongs in .gitignore for a Node.js project?","a":["package.json","node_modules/","src/","README.md"],"c":1,"e":"Dependencies are reinstalled from package.json and the lock file, so node_modules/ is never committed."},{"q":"Which is the best commit message?","a":["fix","changes","Fix off-by-one error in page count","asdf"],"c":2,"e":"A good message says what changed and why, in a few words."},{"q":"In Arrange-Act-Assert, what is the Act step?","a":["Creating test data","Calling the code under test","Checking the result","Deleting the test"],"c":1,"e":"Arrange prepares, Act runs the code, Assert checks the outcome."},{"q":"What does HTTP status 500 indicate?","a":["A client error","A redirect","A server error","Success"],"c":2,"e":"5xx codes mean the server failed while handling a valid request."},{"q":"What is JSON?","a":["A database","A text format for objects, arrays, strings, numbers, booleans and null","A programming language","A web server"],"c":1,"e":"JSON is the most common data format for web APIs."},{"q":"What does an INNER JOIN return?","a":["All rows from both tables","Only rows that match in both tables","Only rows from the left table","Rows with no match"],"c":1,"e":"INNER JOIN keeps only rows with a match on the join condition."},{"q":"What is a minimal reproducible example?","a":["The whole project zipped","The smallest code that still shows the problem","A screenshot of the error","A list of everything you tried"],"c":1,"e":"Shrinking the problem often reveals the cause, and makes it easy for others to help."},{"q":"You have been stuck for 45 minutes. What should you do?","a":["Keep trying silently all day","Write down what you tried and ask a specific question","Start a different task without telling anyone","Copy a random answer from the internet"],"c":1,"e":"Teams value interns who try first, then ask precise questions."},{"q":"In Python, which structure is best for looking up values by key?","a":["list","tuple","dict","string"],"c":2,"e":"A dict gives fast lookups by key; searching a list checks every item."},{"q":"Which file configures a Maven project in Java?","a":["package.json","pom.xml","Cargo.toml","go.mod"],"c":1,"e":"Maven reads pom.xml; Gradle uses build.gradle(.kts)."}]},{"id":"junior","name":"Junior","summary":"Own features end to end, write idiomatic code, and start reviewing others' work.","overview":"A junior developer delivers small-to-medium features with limited supervision. The step up from an internship is ownership: you take a ticket from an unclear requirement to merged, tested and deployed code, and you begin reviewing other people's work. You write code the way your language community writes it, and you understand the database, the CI pipeline and the most common security risks.","expect":["Deliver features end to end with limited supervision","Write idiomatic code in the team's main language","Write integration tests and use mocks with judgement","Review pull requests and explain trade-offs","Work with databases: joins, transactions and migrations","Fix a broken CI build and recognise common security issues"],"tasks":["Implement an API endpoint with validation, persistence and tests","Add a database migration and seed data","Find and fix a flaky test","Review a teammate's pull request","Investigate a bug from logs and error reports"],"lessons":[{"title":"Idiomatic code","body":"Idiomatic code looks the way experienced developers of that language expect, which makes it easier to read, review and maintain. Use the official formatter and linter, follow naming conventions, and reach for the standard library before adding dependencies. Translating another language line by line is the most common junior mistake.","langs":[["Python","PEP 8, comprehensions, context managers (with), dataclasses and type hints; ruff for linting and formatting."],["TypeScript","strict mode, union types, async/await and narrowing; ESLint and Prettier."],["Java","Records for data, streams where they are clearer than loops, Optional for return values that may be absent."],["C#","LINQ, async all the way down, nullable reference types and records."],["Go","gofmt, errors as values, small interfaces; accept interfaces, return structs."],["Rust","clippy, Result with the ? operator, borrowing instead of cloning."]],"code":"junior-idiomatic"},{"title":"Modules, dependencies and configuration","body":"A package manager installs dependencies; a lock file pins exact versions so every machine and CI run gets the same build. Semantic versioning (MAJOR.MINOR.PATCH) tells you whether an upgrade can break you. Keep configuration such as URLs and credentials out of code: read it from the environment so the same build runs in every environment.","langs":[["Python","pyproject.toml with uv or pip; always work in a virtual environment."],["Node.js","package.json with package-lock.json or pnpm-lock.yaml."],["Java","Maven (pom.xml) or Gradle (build.gradle.kts)."],[".NET","NuGet packages declared in the .csproj file."],["Go","go.mod and go.sum."],["Rust","Cargo.toml and Cargo.lock."]],"code":"junior-config"},{"title":"Testing beyond unit tests","body":"The test pyramid: many fast unit tests, fewer integration tests, a few end-to-end tests. Integration tests talk to real dependencies, such as a database in a container. Mock what you do not own (third-party APIs, email), but not your own database queries. Flaky tests usually come from timing, test order or shared state; fix them instead of re-running.","langs":[["Python","pytest fixtures and Testcontainers for a real PostgreSQL."],["TypeScript","Vitest with MSW to mock HTTP at the network level."],["Java","JUnit 5, Mockito and Testcontainers."],["C#","xUnit with Moq or NSubstitute; WebApplicationFactory for API tests."],["Go","Table-driven tests: one test, many cases in a slice."]],"code":"junior-table-test"},{"title":"Databases in application code","body":"Junior work touches the database daily: multi-table joins, GROUP BY aggregation, transactions, constraints and indexes. Change schemas only through versioned migrations. ORMs save time but can hide an N+1 query problem: one query for a list plus one more per item. Always pass values as parameters, never by building SQL strings.","langs":[["Python","SQLAlchemy for queries, Alembic for migrations."],["TypeScript","Prisma or Drizzle, each with its own migrations."],["Java","JPA/Hibernate with Flyway or Liquibase."],["C#","Entity Framework Core and its migrations."],["Go","database/sql with sqlc, or pgx for PostgreSQL."]],"code":"junior-nplus1"},{"title":"Async and concurrency basics","body":"Separate I/O-bound work (waiting on network or disk) from CPU-bound work (calculating). Async code lets one thread wait on many I/O operations at once; threads or processes are needed for real parallel computation. Shared mutable state between concurrent tasks causes race conditions, and blocking an event loop stalls every request.","langs":[["Python","asyncio for I/O. In standard builds the GIL limits CPU parallelism in threads, so use multiprocessing for CPU-heavy work."],["JavaScript","A single-threaded event loop: await I/O, run independent calls with Promise.all, never block with long CPU loops."],["Java","Threads, ExecutorService and virtual threads (Java 21) for many concurrent I/O tasks."],["C#","Task and async/await; avoid .Result and .Wait(), which can deadlock."],["Go","Goroutines and channels; sync.WaitGroup to wait for a group of goroutines."]],"code":"junior-async"},{"title":"Code review, CI/CD and security basics","body":"In review, check correctness first, then tests, then readability; keep your own pull requests small and focused. A CI pipeline runs lint, tests and build on every push, and a red build is fixed before anything else. Know the OWASP Top 10 basics: injection, broken access control, leaked secrets and vulnerable dependencies.","langs":[["Python","pip-audit for vulnerable packages."],["Node.js","npm audit; Dependabot or Renovate for updates."],["Java","OWASP Dependency-Check or the Gradle/Maven equivalents."],[".NET","dotnet list package --vulnerable."],["Go / Rust","govulncheck and cargo audit."]],"code":"junior-ci"}],"langContext":[["Python","Django or FastAPI, PostgreSQL and pytest: back-end, data and automation teams."],["TypeScript","React or Next.js on the front end, Node.js or NestJS on the back end."],["Java / Kotlin","Spring Boot, JPA and JUnit: large enterprise and banking systems."],["C#","ASP.NET Core, Entity Framework Core and xUnit: enterprise, cloud and Azure."],["Go","net/http or chi, sqlc and the testing package: cloud services and tooling."],["SQL","Joins, aggregation, transactions and migrations become everyday work."]],"quiz":[{"q":"What is a lock file for?","a":["Encrypting the code","Reproducible installs with exact dependency versions","Preventing other developers from editing","Speeding up the compiler"],"c":1,"e":"The lock file pins every dependency version so all machines install the same thing."},{"q":"What is the N+1 query problem?","a":["A missing index","One query for a list plus one extra query per item","A syntax error in SQL","Too many database connections"],"c":1,"e":"Fix it with a JOIN or the ORM's eager loading."},{"q":"A Node.js server runs a 5-second CPU loop inside a request handler. What happens?","a":["Only that request slows down","All requests stall until the loop finishes","Node automatically moves it to another thread","Nothing"],"c":1,"e":"The event loop is single-threaded; blocking it blocks everyone."},{"q":"When is a mock the right choice?","a":["For your own database queries","For third-party services you do not control","For every dependency","Never"],"c":1,"e":"Mock what you do not own; test your own database code against a real database."},{"q":"An upgrade goes from 2.3.1 to 3.0.0. What does semantic versioning tell you?","a":["Only bug fixes","New features, fully compatible","Breaking changes are possible","Nothing"],"c":2,"e":"A MAJOR version change signals incompatible API changes."},{"q":"Why wrap two related UPDATE statements in a transaction?","a":["To make them faster","So they apply together or not at all","To skip constraints","To avoid needing an index"],"c":1,"e":"Atomicity prevents half-finished changes."}],"exam":[{"q":"What is the idiomatic way in Python to make sure a file gets closed?","a":["Call close() at the end","with open(...) as f:","Let the garbage collector handle it","try/except without finally"],"c":1,"e":"A context manager closes the file even if an exception is raised."},{"q":"In C#, what is the risk of calling .Result on an unfinished Task?","a":["None","It can block the thread and cause deadlocks","It makes the code faster","It turns the task into a thread"],"c":1,"e":"Use async/await all the way instead of blocking."},{"q":"What is the Go convention for errors?","a":["Throw exceptions","Return the error as the last value and check it","Log and ignore it","Use global error variables only"],"c":1,"e":"if err != nil { ... } is idiomatic Go."},{"q":"What is Java's Optional intended for?","a":["Class fields","Method parameters","Return values that may be absent","Collections"],"c":2,"e":"Optional signals \"there may be no result\"; it is not meant for fields or parameters."},{"q":"What is a common cause of flaky tests?","a":["Too many assertions","Timing, test order or shared state","Descriptive test names","Using a test framework"],"c":1,"e":"Make tests independent and deterministic."},{"q":"What makes a good pull request?","a":["As large as possible","Small, focused on one purpose, with a clear description","No description needed","Many unrelated changes together"],"c":1,"e":"Small PRs get faster, better reviews."},{"q":"Where should a production database password live?","a":["In the code","In an environment variable or secret manager","In the Git history","In a comment"],"c":1,"e":"Configuration comes from the environment; secrets never enter the repository."},{"q":"What is the trade-off of adding an index?","a":["Faster reads, slower writes and more storage","Faster writes, slower reads","No trade-off","It deletes duplicate rows"],"c":0,"e":"Index the columns you filter and join on, not everything."},{"q":"Which is an example of broken access control?","a":["A slow page","A user sees another user's order by changing the ID in the URL","A typo in a label","A missing favicon"],"c":1,"e":"Every request must check that the user may access that specific resource."},{"q":"When should a CI pipeline fail?","a":["Never","When linting or tests fail","Only on Fridays","When the build is too fast"],"c":1,"e":"A failing gate stops broken code from being merged."},{"q":"What is a database migration?","a":["Moving to a new database vendor","A versioned, reviewed schema change applied the same way in every environment","A backup","A manual SQL edit in production"],"c":1,"e":"Migrations make schema changes repeatable and reviewable."},{"q":"What does the test pyramid recommend?","a":["Mostly end-to-end tests","Many unit tests, fewer integration tests, few end-to-end tests","Only manual tests","An equal number of each"],"c":1,"e":"Fast, focused tests at the bottom; a few slow, broad tests at the top."}]},{"id":"mid","name":"Mid-level","summary":"Own components, make trade-offs explicit, run reliable systems, and grow others.","overview":"A mid-level developer owns components, not just tickets. You design interfaces and data models, make trade-offs explicit, keep systems observable and reliable in production, and raise the level of the people around you. You understand how your language's runtime behaves under load, and you can choose the right tool, or the right second language, for a problem.","expect":["Design components with clear responsibilities and boundaries","Reason about performance, memory and concurrency","Lead the debugging of production incidents","Design test strategies, not only individual tests","Model data and optimise queries","Mentor juniors and evaluate tools, including AI assistants"],"tasks":["Design a new module or service and record the decision in an ADR","Lead an incident investigation and a blameless postmortem","Reduce the p95 latency of a slow endpoint","Plan a backward-compatible schema migration","Mentor a junior developer through a feature"],"lessons":[{"title":"Design and architecture","body":"Good design keeps related code together (high cohesion) and dependencies few and pointing inward (low coupling). Put interfaces at boundaries such as storage, messaging and external APIs, so details can change without rewriting the core. Record significant decisions in Architecture Decision Records, prefer reversible choices, and start with a modular monolith before splitting into services.","langs":[["Java / C#","Explicit interfaces with dependency injection (Spring, ASP.NET Core DI)."],["Go","Small interfaces defined by the consumer; implementations satisfy them implicitly."],["Rust","Traits for behaviour; ownership forces a clear data flow through the design."],["TypeScript","Structural types and clear module boundaries; avoid circular imports."],["Python","typing.Protocol describes duck-typed interfaces that type checkers verify."]],"code":"mid-interface"},{"title":"Runtime behaviour and memory","body":"At mid level you explain why a service slows down or runs out of memory. In garbage-collected languages, leaks are objects that are still referenced: unbounded caches, forgotten event listeners, static collections. High allocation rates cause GC pressure. JIT compilers need warm-up, so benchmark realistically. Use profilers and heap dumps instead of guessing.","langs":[["Java","G1 is the default GC and ZGC targets low latency; heap dumps and JDK Flight Recorder."],["C#",".NET GC modes; dotnet-counters and dotnet-trace."],["Go","A concurrent GC tuned with GOGC and GOMEMLIMIT; pprof for CPU and memory."],["Python","Reference counting plus a cycle collector; tracemalloc and py-spy."],["JavaScript","V8 heap snapshots in DevTools; closures can keep large objects alive."],["Rust","No GC; memory is freed by ownership. Watch for Rc reference cycles."]],"code":"mid-leak"},{"title":"Concurrency and consistency","body":"Distributed systems fail partially, so design for it: set timeouts on every call, retry with exponential backoff and jitter, and make operations idempotent so a retry cannot charge a customer twice. Understand race conditions and deadlocks, database isolation levels, and optimistic versus pessimistic locking.","langs":[["Java","java.util.concurrent and virtual threads; CompletableFuture for composition."],["C#","async with SemaphoreSlim and Channels; CancellationToken everywhere."],["Go","context for cancellation and deadlines; run tests with -race to detect data races."],["Rust","The Send and Sync traits reject data races at compile time."],["Python","asyncio for I/O; multiprocessing or native extensions for CPU work."],["SQL","Isolation levels, SELECT … FOR UPDATE, and version columns for optimistic locking."]],"code":"mid-optimistic"},{"title":"Performance and observability","body":"Measure before optimising. Track latency as percentiles (p50, p95, p99), not averages. Profile to find where time really goes, then fix the biggest cost, which is often a query or a network call rather than the code itself. Instrument services with logs, metrics and traces, ideally through OpenTelemetry, and define SLOs so you know when users are affected.","langs":[["Java","JDK Flight Recorder and async-profiler."],[".NET","dotnet-trace, dotnet-counters and PerfView."],["Go","pprof and the built-in execution tracer."],["Python","py-spy and cProfile."],["Node.js","The --cpu-prof flag and Chrome DevTools."],["SQL","EXPLAIN ANALYZE to read real execution plans."]],"code":"mid-explain"},{"title":"Test strategy and quality","body":"A test strategy decides what to test, at which level, and how much, based on risk. Use contract tests between services so that one team cannot silently break another, property-based tests to explore many inputs automatically, and realistic, versioned test data. In production, feature flags and canary releases limit the damage of a bad change.","langs":[["Python","Hypothesis for property-based testing."],["TypeScript","fast-check."],["Java","jqwik; Pact for contract tests."],[".NET","FsCheck; PactNet."],["Go","Built-in fuzzing with go test -fuzz."],["Rust","proptest and cargo-fuzz."]],"code":"mid-property"},{"title":"Leadership, mentoring and AI tooling","body":"Mid-level engineers multiply the team. Review code in a way that teaches, write short design documents before large changes, estimate with ranges and state your assumptions, and run blameless postmortems that fix systems rather than blame people. Evaluate AI assistants critically: they speed up boilerplate and tests, but add review burden, and security and licensing decisions stay with you.","langs":[["Go","A good second language for services, infrastructure and CLI tools."],["Rust","For performance-critical or safety-critical components."],["Kotlin","For JVM services and Android, with full Java interoperability."],["TypeScript","For full-stack product work with one language across client and server."]],"code":"mid-adr"}],"langContext":[["Java / Kotlin","Large, domain-heavy services; JVM tuning and concurrency at scale."],["C#","Enterprise and cloud systems on .NET; high-performance APIs."],["Go","Cloud infrastructure, network services and CLI tools."],["Rust","Performance- and safety-critical components; systems programming."],["Python","Data and ML platforms, automation and internal tooling."],["TypeScript","Full-stack product development across web and server."],["SQL","Data modelling, query optimisation and consistency in every stack."]],"quiz":[{"q":"What does p99 latency of 800 ms mean?","a":["The average is 800 ms","99% of requests finish within 800 ms","The fastest request took 800 ms","99 requests took 800 ms"],"c":1,"e":"Percentiles show the tail that averages hide."},{"q":"What makes an operation idempotent?","a":["It runs quickly","Repeating it has the same effect as doing it once","It never fails","It uses a transaction"],"c":1,"e":"Idempotency makes retries safe."},{"q":"What is a typical memory leak in Java, C# or JavaScript?","a":["Forgetting to call free()","Objects still referenced, for example an unbounded cache","Using too many threads","A stack overflow"],"c":1,"e":"The garbage collector cannot free objects that are still reachable."},{"q":"How do you detect data races in Go?","a":["go vet only","go test -race","gofmt","It is not possible"],"c":1,"e":"The race detector instruments memory access at runtime."},{"q":"What is an ADR?","a":["An automated deployment tool","A record of a decision, its context and its consequences","A type of database","A test report"],"c":1,"e":"Architecture Decision Records explain why a system looks the way it does."},{"q":"An endpoint is slow. What should you do first?","a":["Rewrite it in Rust","Measure and profile to find the real cost","Add a cache everywhere","Increase the server size"],"c":1,"e":"Optimise what the data shows, not what you guess."}],"exam":[{"q":"What can happen when many clients retry immediately without backoff or jitter?","a":["Nothing","A retry storm that overloads the struggling service","Faster recovery","Automatic scaling"],"c":1,"e":"Exponential backoff with jitter spreads retries out over time."},{"q":"How does optimistic locking work?","a":["Lock every row on read","A version column; the update fails if the version changed","Disable transactions","Use a global mutex"],"c":1,"e":"Conflicts are detected at write time, which suits low-contention data."},{"q":"What does a contract test verify?","a":["UI layout","That a provider and a consumer agree on an API","Database performance","Code style"],"c":1,"e":"Contract tests catch breaking API changes before deployment."},{"q":"How does Rust prevent data races?","a":["With a garbage collector","With the Send and Sync traits and the borrow checker at compile time","With runtime locks on every variable","It does not"],"c":1,"e":"Unsafe sharing between threads does not compile."},{"q":"What does a blameless postmortem focus on?","a":["Who made the mistake","System causes and concrete improvements","Punishment","Only the timeline"],"c":1,"e":"People act reasonably with the information they have; fix the system."},{"q":"What is property-based testing?","a":["Testing object properties only","Generating many inputs to check invariants that must always hold","Manual exploratory testing","Testing CSS"],"c":1,"e":"The framework searches for inputs that break your stated property."},{"q":"Which JVM garbage collector is designed for very low pause times?","a":["Serial","ZGC","Parallel","None"],"c":1,"e":"ZGC targets pause times of around a millisecond, even on large heaps."},{"q":"What is a safe way to rename a column in a live system?","a":["Rename it and deploy at once","Expand and contract: add the new column, write to both, migrate, then remove the old one","Drop the table","Rename it at night"],"c":1,"e":"Backward-compatible steps let old and new code run side by side."},{"q":"What is structured logging?","a":["Logging to multiple files","Logs as key-value or JSON fields that tools can search and filter","Logging only errors","Printing stack traces"],"c":1,"e":"Structured logs make it possible to query by user, request ID or latency."},{"q":"What does distributed tracing show?","a":["CPU temperature","The path and timing of one request across services","The Git history","The number of tests"],"c":1,"e":"Traces reveal which hop is slow or failing."},{"q":"Why does Go favour small interfaces defined by the consumer?","a":["Faster compilation only","They decouple packages and make testing easier","Go has no interfaces","It is required by the compiler"],"c":1,"e":"The consumer asks only for the behaviour it needs."},{"q":"Which is a good mid-level use of an AI coding assistant?","a":["Merging its output without review","Drafting tests and boilerplate, then reviewing them carefully","Letting it decide the security design","Pasting production secrets for context"],"c":1,"e":"Assistants speed up routine work; you keep ownership of correctness and security."}]}]},"uk":{"ui":{"htmlLang":"uk","eyebrow":"Кар'єрний трек · Стажування → Junior → Middle","title":"Рольові модулі","lede":"Три рольові модулі: уроки, контекст мов програмування, приклади коду, тест модуля та іспит для кожного рівня. Ваші результати зберігаються в цьому браузері.","backToHub":"Programming Languages Hub","language":"Мова","roles":"Роль","overview":"Огляд","expect":"Чого очікують роботодавці","tasks":"Типові перші завдання","lessons":"Уроки","lesson":"Урок","inLanguages":"У вашій мові програмування","langContext":"Які мови важливі на цьому рівні","langCol":"Мова","whyCol":"Чому це важливо тут","quiz":"Тест модуля","quizIntro":"Оберіть відповідь, і ви одразу побачите, чи вона правильна і чому.","exam":"Іспит за роллю","examIntro":"{n} запитань. Дайте відповідь на всі, потім надішліть. Прохідний бал — 70% ({p} з {n}).","question":"Запитання {i} з {n}","answered":"Відповіді: {d} / {n}","score":"Результат: {s} / {n}","correct":"Правильно.","wrong":"Не зовсім.","submit":"Надіслати відповіді","retakeQuiz":"Пройти тест ще раз","retakeExam":"Скласти іспит ще раз","answerAll":"Спочатку дайте відповідь на всі {n} запитань (відповідей: {d})","passed":"складено","notPassed":"поки не складено","passedMsg":"Перегляньте відповіді з позначкою ✗ вище.","failedMsg":"Прочитайте пояснення під кожною ✗, поверніться до цих уроків і складіть іспит ще раз.","best":"Найкраще: {s} / {n}","notAttempted":"Ще не складали","quizBest":"Тест","examBest":"Іспит","copy":"Копіювати код","copied":"Скопійовано","copyFailed":"Не вдалося скопіювати","reset":"Очистити мої результати на цьому пристрої","codeNote":"Код і коментарі в коді залишаються англійською, як у реальних проєктах."},"roles":[{"id":"intern","name":"Стажування","summary":"Швидко вчіться, безпечно працюйте в реальному коді та робіть невеликі протестовані зміни.","overview":"Стажування — це місце, де ви доводите, що швидко вчитеся й безпечно працюєте в реальній кодовій базі. Ніхто не чекає, що ви проєктуватимете системи. Команда чекає невеликих, правильних, протестованих змін, добрих запитань і чітких пояснень, що ви зробили і чому. Оберіть одну основну мову та вивчіть її як слід: ці концепції переходять у кожну мову, яку ви вивчатимете потім.","expect":["Розв'язувати невеликі, чітко визначені задачі однією мовою","Читати наявний код і відстежувати дані крізь функції та модулі","Впевнено користуватися Git, гілками та pull request","Писати базові автотести й читати повідомлення про помилки","Ставити конкретні запитання після власних спроб"],"tasks":["Виправити невеликий баг, почавши з надійного відтворення","Додати поле або правило валідації у форму чи API","Написати тести для функції, у якої їх немає","Покращити документацію або скрипт для розробників","Написати простий SQL-запит для звіту"],"lessons":[{"title":"Основи програмування однією мовою","body":"Значення, змінні, типи, умови, цикли, функції та колекції — це ті самі ідеї в кожній мові; змінюється лише синтаксис. Вивчіть їх глибоко в одній мові, перш ніж братися за другу. Практикуйтеся, пишучи невеликі програми з чистого файлу, а не копіюючи туторіали: прочитайте вхідні дані, перетворіть їх, виведіть результат і обробіть некоректний ввід.","langs":[["Python","Динамічна типізація та відступи як частина синтаксису. Списки, словники та comprehensions покривають більшість щоденної роботи; починайте зі стандартної бібліотеки."],["JavaScript / TypeScript","Використовуйте let/const і === (ніколи ==). Масиви й об'єкти всюди; додайте типи TypeScript якомога раніше, щоб ловити помилки ще до запуску."],["Java / C#","Статичні типи та класи з першого дня. Компілятор відхиляє багато помилок ще до запуску програми."],["Go","Навмисно невелика мова: slices, maps, structs і явні значення помилок. Легко читати, швидко вивчити."]],"code":"intern-fundamentals"},{"title":"Читання помилок і налагодження","body":"Повідомлення про помилку — це інформація, а не провал. Прочитайте тип помилки, повідомлення, а потім перший кадр стека, що вказує на ваш власний код. Спочатку надійно відтворіть проблему, а вже потім виправляйте, і зменште її до мінімального відтворюваного прикладу. Використовуйте дебагер із точками зупину, щоб бачити значення, а не вгадувати; print підходить для швидких перевірок.","langs":[["Python","Traceback показує найновіший виклик останнім: спочатку читайте нижній рядок, потім кадри над ним."],["JavaScript / TypeScript","Використовуйте DevTools браузера або інспектор Node. Source maps зіставляють скомпільований JavaScript із рядками вашого TypeScript."],["Java","У стеку винятку розділ \"Caused by\" зазвичай показує першопричину."],["C#","Дебагери Visual Studio та Rider зупиняються на винятках; \"Just My Code\" приховує кадри фреймворку."]],"code":"intern-traceback"},{"title":"Git і pull request","body":"Створюйте одну гілку на одну зміну, робіть невеликі коміти й пишіть повідомлення, що пояснюють, що змінилося і чому. Відкривайте pull request з коротким описом і тим, як ви тестували. Сприймайте коментарі рев'ю як навчання: відповідайте на кожен і надсилайте виправлення. Ніколи не комітьте секрети, як-от паролі чи API-ключі; якщо це сталося, повідомте команду, щоб секрет замінили.","langs":[["Python","Додайте __pycache__/ і .venv/ до .gitignore."],["Node.js","Ігноруйте node_modules/ і результати збірки, як-от dist/."],["Java","Ігноруйте target/ (Maven) або build/ (Gradle)."],[".NET","Ігноруйте bin/ і obj/."]],"code":"intern-git"},{"title":"Ваші перші автотести","body":"Тест дотримується схеми Arrange, Act, Assert: підготуйте дані, викличте код, перевірте результат. Тестуйте звичайний випадок, межі та некоректний ввід. Кожен тест має мати одну чітку причину впасти й не залежати від інших тестів. Тести, які автоматично запускаються в CI, захищають вас і команду від регресій.","langs":[["Python","pytest: звичайні assert і parametrize для багатьох випадків."],["JavaScript / TypeScript","Vitest або Jest: блоки describe/it з expect()."],["Java","JUnit 5 з assertEquals і @ParameterizedTest."],["C#","xUnit або NUnit з [Fact] і [Theory]."],["Go","Вбудований пакет testing; фреймворк не потрібен."]],"code":"intern-test"},{"title":"HTTP, JSON і ваш перший SQL","body":"Більшість програм спілкується через HTTP: клієнт надсилає запит, сервер повертає код стану й тіло, зазвичай JSON. 2xx означає успіх, 4xx — помилку клієнта, 5xx — збій сервера. Дані зазвичай живуть у реляційній базі даних: вивчіть SELECT, WHERE, ORDER BY, простий JOIN, а також INSERT/UPDATE/DELETE.","langs":[["Python","httpx або requests для HTTP; модуль json або response.json() для даних."],["TypeScript","fetch() вбудований у браузери та Node; завжди перевіряйте response.ok."],["Java / C#","java.net.http.HttpClient і .NET HttpClient; відображайте JSON у класи чи records."],["SQL","Практикуйтеся на SQLite або PostgreSQL; ті самі базові запити працюють майже всюди."]],"code":"intern-http"}],"langContext":[["Python","Найшвидший старт. Поширений на стажуваннях з автоматизації, даних, QA та бекенду."],["TypeScript / JavaScript","Веб: фронтенд і Node.js. Найбільша кількість вакансій."],["Java / C#","Часто трапляються на корпоративних стажуваннях. Статична типізація рано привчає до структури."],["SQL","Потрібен майже в кожній ролі, бо кожен застосунок зберігає дані."]],"quiz":[{"q":"З чого почати читати traceback у Python?","a":["З першого рядка","З останнього рядка: тип винятку та повідомлення","Із середніх кадрів","Лише з назв файлів"],"c":1,"e":"Python друкує найновіший виклик останнім, тож нижній рядок каже, що пішло не так."},{"q":"Поле приймає значення 1–100. Які значення перевіряють межі?","a":["Лише 50","Лише 1 і 100","0, 1, 100 і 101","-100 і 1000"],"c":2,"e":"Перевіряйте значення трохи нижче межі, на межі та трохи вище неї."},{"q":"Ви знайшли баг. Який перший крок?","a":["Переписати функцію","Надійно його відтворити","Попросити когось іншого виправити","Додати логування всюди"],"c":1,"e":"Без відтворення ви не зможете підтвердити, що виправлення працює."},{"q":"Що означає HTTP-статус 404?","a":["Сервер упав","Ресурс не знайдено","Успіх","Забагато запитів"],"c":1,"e":"Коди 4xx — помилки клієнта; 404 означає, що запитаного ресурсу не існує."},{"q":"Де мають зберігатися секрети, як-от API-ключі?","a":["У вихідному коді","У повідомленні коміту","У змінних середовища або менеджері секретів","У README"],"c":2,"e":"Секрети ніколи не комітять; конфігурація надходить із середовища або сховища секретів."},{"q":"Який запит повертає клієнтів із Польщі, відсортованих за іменем?","a":["SELECT * FROM customers ORDER BY country","SELECT name FROM customers WHERE country = 'PL' ORDER BY name","UPDATE customers SET country = 'PL'","SELECT name FROM customers GROUP BY name"],"c":1,"e":"WHERE фільтрує рядки, ORDER BY сортує їх."}],"exam":[{"q":"Яка мова компілюється в байт-код і виконується на вір
