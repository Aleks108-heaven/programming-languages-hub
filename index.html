ior-async"},{"title":"Revisión de código, CI/CD y seguridad básica","body":"Al revisar, comprueba primero la corrección, luego las pruebas y después la legibilidad; mantén tus propios pull requests pequeños y centrados. Un pipeline de CI ejecuta el linter, las pruebas y la build en cada push, y una build en rojo se arregla antes que cualquier otra cosa. Conoce lo básico del OWASP Top 10: inyección, control de acceso roto, filtración de secretos y dependencias vulnerables.","langs":[["Python","pip-audit para paquetes vulnerables."],["Node.js","npm audit; Dependabot o Renovate para las actualizaciones."],["Java","OWASP Dependency-Check o sus equivalentes para Gradle/Maven."],[".NET","dotnet list package --vulnerable."],["Go / Rust","govulncheck y cargo audit."]],"code":"junior-ci"}],"langContext":[["Python","Django o FastAPI, PostgreSQL y pytest: equipos de backend, datos y automatización."],["TypeScript","React o Next.js en el frontend, Node.js o NestJS en el backend."],["Java / Kotlin","Spring Boot, JPA y JUnit: grandes sistemas empresariales y bancarios."],["C#","ASP.NET Core, Entity Framework Core y xUnit: empresa, nube y Azure."],["Go","net/http o chi, sqlc y el paquete testing: servicios en la nube y herramientas."],["SQL","JOIN, agregaciones, transacciones y migraciones pasan a ser trabajo diario."]],"quiz":[{"q":"¿Para qué sirve un archivo lock?","a":["Para cifrar el código","Para instalaciones reproducibles con versiones exactas de las dependencias","Para impedir que otros desarrolladores editen","Para acelerar el compilador"],"c":1,"e":"El archivo lock fija la versión de cada dependencia para que todas las máquinas instalen lo mismo."},{"q":"¿Qué es el problema de las consultas N+1?","a":["Un índice que falta","Una consulta para la lista más una consulta extra por cada elemento","Un error de sintaxis en SQL","Demasiadas conexiones a la base de datos"],"c":1,"e":"Corrígelo con un JOIN o con la carga anticipada (eager loading) del ORM."},{"q":"Un servidor Node.js ejecuta un bucle de CPU de 5 segundos dentro de un manejador de peticiones. ¿Qué ocurre?","a":["Solo se ralentiza esa petición","Todas las peticiones se detienen hasta que termina el bucle","Node lo mueve automáticamente a otro hilo","Nada"],"c":1,"e":"El bucle de eventos es de un solo hilo; bloquearlo bloquea a todos."},{"q":"¿Cuándo es un mock la opción correcta?","a":["Para tus propias consultas a la base de datos","Para servicios de terceros que no controlas","Para todas las dependencias","Nunca"],"c":1,"e":"Simula lo que no es tuyo; prueba tu código de base de datos contra una base de datos real."},{"q":"Una actualización pasa de 2.3.1 a 3.0.0. ¿Qué te dice el versionado semántico?","a":["Solo correcciones de errores","Nuevas funciones, totalmente compatibles","Puede haber cambios incompatibles","Nada"],"c":2,"e":"Un cambio de versión MAJOR indica cambios incompatibles en la API."},{"q":"¿Por qué envolver dos UPDATE relacionados en una transacción?","a":["Para que sean más rápidos","Para que se apliquen juntos o no se aplique ninguno","Para saltarse las restricciones","Para no necesitar un índice"],"c":1,"e":"La atomicidad evita cambios a medias."}],"exam":[{"q":"¿Cuál es la forma idiomática en Python de asegurarse de que un archivo se cierra?","a":["Llamar a close() al final","with open(...) as f:","Dejar que lo gestione el recolector de basura","try/except sin finally"],"c":1,"e":"Un gestor de contexto cierra el archivo incluso si se lanza una excepción."},{"q":"En C#, ¿qué riesgo tiene llamar a .Result en una Task sin terminar?","a":["Ninguno","Puede bloquear el hilo y provocar interbloqueos","Hace el código más rápido","Convierte la tarea en un hilo"],"c":1,"e":"Usa async/await en todos los niveles en lugar de bloquear."},{"q":"¿Cuál es la convención de Go para los errores?","a":["Lanzar excepciones","Devolver el error como último valor y comprobarlo","Registrarlo e ignorarlo","Usar solo variables de error globales"],"c":1,"e":"if err != nil { ... } es Go idiomático."},{"q":"¿Para qué está pensado Optional en Java?","a":["Campos de clase","Parámetros de métodos","Valores de retorno que pueden faltar","Colecciones"],"c":2,"e":"Optional indica «puede que no haya resultado»; no está pensado para campos ni parámetros."},{"q":"¿Cuál es una causa habitual de las pruebas inestables?","a":["Demasiadas aserciones","Tiempos, orden de las pruebas o estado compartido","Nombres de prueba descriptivos","Usar un framework de pruebas"],"c":1,"e":"Haz que las pruebas sean independientes y deterministas."},{"q":"¿Qué hace bueno a un pull request?","a":["Que sea lo más grande posible","Que sea pequeño, con un único propósito y una descripción clara","Que no necesite descripción","Que junte muchos cambios sin relación"],"c":1,"e":"Los PR pequeños reciben revisiones más rápidas y mejores."},{"q":"¿Dónde debe estar la contraseña de la base de datos de producción?","a":["En el código","En una variable de entorno o un gestor de secretos","En el historial de Git","En un comentario"],"c":1,"e":"La configuración viene del entorno; los secretos nunca entran en el repositorio."},{"q":"¿Cuál es el coste de añadir un índice?","a":["Lecturas más rápidas, escrituras más lentas y más almacenamiento","Escrituras más rápidas, lecturas más lentas","No tiene coste","Elimina filas duplicadas"],"c":0,"e":"Indexa las columnas por las que filtras y unes, no todas."},{"q":"¿Cuál es un ejemplo de control de acceso roto?","a":["Una página lenta","Un usuario ve el pedido de otro cambiando el ID en la URL","Una errata en una etiqueta","Falta el favicon"],"c":1,"e":"Cada petición debe comprobar que el usuario puede acceder a ese recurso concreto."},{"q":"¿Cuándo debe fallar un pipeline de CI?","a":["Nunca","Cuando fallan el linter o las pruebas","Solo los viernes","Cuando la build es demasiado rápida"],"c":1,"e":"Un control fallido impide que el código roto se fusione."},{"q":"¿Qué es una migración de base de datos?","a":["Cambiarse a otro proveedor de base de datos","Un cambio de esquema versionado y revisado que se aplica igual en todos los entornos","Una copia de seguridad","Una edición manual de SQL en producción"],"c":1,"e":"Las migraciones hacen que los cambios de esquema sean repetibles y revisables."},{"q":"¿Qué recomienda la pirámide de pruebas?","a":["Sobre todo pruebas end-to-end","Muchas pruebas unitarias, menos de integración y pocas end-to-end","Solo pruebas manuales","La misma cantidad de cada tipo"],"c":1,"e":"Pruebas rápidas y concretas en la base; unas pocas lentas y amplias en la cima."}]},{"id":"mid","name":"Mid","summary":"Responsabilízate de componentes, haz explícitas las decisiones, mantén sistemas fiables y ayuda a crecer a otros.","overview":"Un desarrollador de nivel mid es responsable de componentes, no solo de tareas. Diseñas interfaces y modelos de datos, haces explícitas las ventajas y desventajas de cada decisión, mantienes los sistemas observables y fiables en producción y elevas el nivel de las personas que te rodean. Entiendes cómo se comporta el entorno de ejecución de tu lenguaje bajo carga y sabes elegir la herramienta adecuada, o el segundo lenguaje adecuado, para cada problema.","expect":["Diseñar componentes con responsabilidades y límites claros","Razonar sobre rendimiento, memoria y concurrencia","Liderar la depuración de incidentes en producción","Diseñar estrategias de pruebas, no solo pruebas individuales","Modelar datos y optimizar consultas","Mentorizar a juniors y evaluar herramientas, incluidos los asistentes de IA"],"tasks":["Diseñar un módulo o servicio nuevo y registrar la decisión en un ADR","Liderar la investigación de un incidente y un postmortem sin culpables","Reducir la latencia p95 de un endpoint lento","Planificar una migración de esquema compatible con versiones anteriores","Acompañar a un desarrollador junior durante una funcionalidad"],"lessons":[{"title":"Diseño y arquitectura","body":"Un buen diseño mantiene junto el código relacionado (alta cohesión) y tiene pocas dependencias, apuntando hacia dentro (bajo acoplamiento). Coloca interfaces en los límites, como el almacenamiento, la mensajería y las API externas, para que los detalles puedan cambiar sin reescribir el núcleo. Registra las decisiones importantes en Architecture Decision Records, prefiere decisiones reversibles y empieza con un monolito modular antes de dividirlo en servicios.","langs":[["Java / C#","Interfaces explícitas con inyección de dependencias (Spring, DI de ASP.NET Core)."],["Go","Interfaces pequeñas definidas por el consumidor; las implementaciones las cumplen de forma implícita."],["Rust","Traits para el comportamiento; el sistema de propiedad obliga a un flujo de datos claro en el diseño."],["TypeScript","Tipos estructurales y límites de módulo claros; evita las importaciones circulares."],["Python","typing.Protocol describe interfaces con tipado de pato que los verificadores de tipos comprueban."]],"code":"mid-interface"},{"title":"Comportamiento en tiempo de ejecución y memoria","body":"En el nivel mid explicas por qué un servicio se ralentiza o se queda sin memoria. En los lenguajes con recolector de basura, las fugas son objetos que siguen referenciados: cachés sin límite, listeners de eventos olvidados, colecciones estáticas. Una tasa alta de asignaciones presiona al GC. Los compiladores JIT necesitan calentamiento, así que haz benchmarks realistas. Usa perfiladores y volcados de heap en lugar de adivinar.","langs":[["Java","G1 es el GC por defecto y ZGC busca baja latencia; volcados de heap y JDK Flight Recorder."],["C#","Modos de GC de .NET; dotnet-counters y dotnet-trace."],["Go","Un GC concurrente ajustable con GOGC y GOMEMLIMIT; pprof para CPU y memoria."],["Python","Conteo de referencias más un recolector de ciclos; tracemalloc y py-spy."],["JavaScript","Instantáneas del heap de V8 en DevTools; los closures pueden mantener vivos objetos grandes."],["Rust","Sin GC; la memoria se libera mediante la propiedad. Vigila los ciclos de referencias con Rc."]],"code":"mid-leak"},{"title":"Concurrencia y consistencia","body":"Los sistemas distribuidos fallan de forma parcial, así que diseña para ello: pon timeouts a cada llamada, reintenta con espera exponencial y jitter, y haz que las operaciones sean idempotentes para que un reintento no cobre dos veces a un cliente. Entiende las condiciones de carrera y los interbloqueos, los niveles de aislamiento de la base de datos y el bloqueo optimista frente al pesimista.","langs":[["Java","java.util.concurrent e hilos virtuales; CompletableFuture para componer."],["C#","async con SemaphoreSlim y Channels; CancellationToken en todas partes."],["Go","context para cancelaciones y plazos; ejecuta las pruebas con -race para detectar carreras de datos."],["Rust","Los traits Send y Sync rechazan las carreras de datos en tiempo de compilación."],["Python","asyncio para E/S; multiprocessing o extensiones nativas para el trabajo de CPU."],["SQL","Niveles de aislamiento, SELECT … FOR UPDATE y columnas de versión para el bloqueo optimista."]],"code":"mid-optimistic"},{"title":"Rendimiento y observabilidad","body":"Mide antes de optimizar. Sigue la latencia en percentiles (p50, p95, p99), no en medias. Perfila para saber dónde se va realmente el tiempo y corrige el coste mayor, que a menudo es una consulta o una llamada de red y no el propio código. Instrumenta los servicios con logs, métricas y trazas, idealmente con OpenTelemetry, y define SLO para saber cuándo se ven afectados los usuarios.","langs":[["Java","JDK Flight Recorder y async-profiler."],[".NET","dotnet-trace, dotnet-counters y PerfView."],["Go","pprof y el trazador de ejecución integrado."],["Python","py-spy y cProfile."],["Node.js","La opción --cpu-prof y Chrome DevTools."],["SQL","EXPLAIN ANALYZE para leer los planes de ejecución reales."]],"code":"mid-explain"},{"title":"Estrategia de pruebas y calidad","body":"Una estrategia de pruebas decide qué probar, a qué nivel y cuánto, según el riesgo. Usa pruebas de contrato entre servicios para que un equipo no pueda romper a otro sin darse cuenta, pruebas basadas en propiedades para explorar muchas entradas automáticamente, y datos de prueba realistas y versionados. En producción, los feature flags y los despliegues canary limitan el daño de un cambio defectuoso.","langs":[["Python","Hypothesis para pruebas basadas en propiedades."],["TypeScript","fast-check."],["Java","jqwik; Pact para pruebas de contrato."],[".NET","FsCheck; PactNet."],["Go","Fuzzing integrado con go test -fuzz."],["Rust","proptest y cargo-fuzz."]],"code":"mid-property"},{"title":"Liderazgo, mentoría y herramientas de IA","body":"Los ingenieros de nivel mid multiplican la capacidad del equipo. Revisa el código de forma que enseñe, escribe documentos de diseño breves antes de los cambios grandes, estima con rangos y explica tus suposiciones, y dirige postmortems sin culpables que arreglen sistemas en lugar de señalar a personas. Evalúa los asistentes de IA con espíritu crítico: aceleran el código repetitivo y las pruebas, pero añaden carga de revisión, y las decisiones de seguridad y licencias siguen siendo tuyas.","langs":[["Go","Un buen segundo lenguaje para servicios, infraestructura y herramientas de línea de comandos."],["Rust","Para componentes críticos en rendimiento o seguridad."],["Kotlin","Para servicios en la JVM y Android, con interoperabilidad total con Java."],["TypeScript","Para trabajo full-stack de producto con un solo lenguaje en cliente y servidor."]],"code":"mid-adr"}],"langContext":[["Java / Kotlin","Servicios grandes con mucha lógica de dominio; ajuste de la JVM y concurrencia a escala."],["C#","Sistemas empresariales y en la nube sobre .NET; API de alto rendimiento."],["Go","Infraestructura en la nube, servicios de red y herramientas de línea de comandos."],["Rust","Componentes críticos en rendimiento y seguridad; programación de sistemas."],["Python","Plataformas de datos y ML, automatización y herramientas internas."],["TypeScript","Desarrollo de producto full-stack en web y servidor."],["SQL","Modelado de datos, optimización de consultas y consistencia en cualquier stack."]],"quiz":[{"q":"¿Qué significa una latencia p99 de 800 ms?","a":["La media es de 800 ms","El 99% de las peticiones termina en 800 ms o menos","La petición más rápida tardó 800 ms","99 peticiones tardaron 800 ms"],"c":1,"e":"Los percentiles muestran la cola que las medias ocultan."},{"q":"¿Qué hace que una operación sea idempotente?","a":["Que se ejecute rápido","Que repetirla tenga el mismo efecto que hacerla una vez","Que nunca falle","Que use una transacción"],"c":1,"e":"La idempotencia hace que los reintentos sean seguros."},{"q":"¿Cuál es una fuga de memoria típica en Java, C# o JavaScript?","a":["Olvidar llamar a free()","Objetos que siguen referenciados, por ejemplo una caché sin límite","Usar demasiados hilos","Un desbordamiento de pila"],"c":1,"e":"El recolector de basura no puede liberar objetos que siguen siendo alcanzables."},{"q":"¿Cómo se detectan carreras de datos en Go?","a":["Solo con go vet","go test -race","gofmt","No es posible"],"c":1,"e":"El detector de carreras instrumenta los accesos a memoria en tiempo de ejecución."},{"q":"¿Qué es un ADR?","a":["Una herramienta de despliegue automático","Un registro de una decisión, su contexto y sus consecuencias","Un tipo de base de datos","Un informe de pruebas"],"c":1,"e":"Los Architecture Decision Records explican por qué un sistema es como es."},{"q":"Un endpoint es lento. ¿Qué haces primero?","a":["Reescribirlo en Rust","Medir y perfilar para encontrar el coste real","Añadir caché en todas partes","Aumentar el tamaño del servidor"],"c":1,"e":"Optimiza lo que muestran los datos, no lo que supones."}],"exam":[{"q":"¿Qué puede pasar si muchos clientes reintentan de inmediato, sin espera exponencial ni jitter?","a":["Nada","Una tormenta de reintentos que sobrecarga al servicio que ya tiene problemas","Una recuperación más rápida","Escalado automático"],"c":1,"e":"La espera exponencial con jitter reparte los reintentos en el tiempo."},{"q":"¿Cómo funciona el bloqueo optimista?","a":["Bloqueando cada fila al leerla","Con una columna de versión; la actualización falla si la versión cambió","Desactivando las transacciones","Con un mutex global"],"c":1,"e":"Los conflictos se detectan al escribir, lo que encaja con datos con poca contención."},{"q":"¿Qué verifica una prueba de contrato?","a":["La disposición de la interfaz","Que un proveedor y un consumidor coinciden en la API","El rendimiento de la base de datos","El estilo del código"],"c":1,"e":"Las pruebas de contrato detectan cambios incompatibles en la API antes del despliegue."},{"q":"¿Cómo evita Rust las carreras de datos?","a":["Con un recolector de basura","Con los traits Send y Sync y el borrow checker en tiempo de compilación","Con bloqueos en tiempo de ejecución en cada variable","No las evita"],"c":1,"e":"Compartir datos de forma insegura entre hilos no compila."},{"q":"¿En qué se centra un postmortem sin culpables?","a":["En quién cometió el error","En las causas del sistema y en mejoras concretas","En los castigos","Solo en la cronología"],"c":1,"e":"Las personas actúan de forma razonable con la información que tienen; arregla el sistema."},{"q":"¿Qué son las pruebas basadas en propiedades?","a":["Probar solo las propiedades de los objetos","Generar muchas entradas para comprobar invariantes que siempre deben cumplirse","Pruebas exploratorias manuales","Probar el CSS"],"c":1,"e":"El framework busca entradas que rompan la propiedad que has definido."},{"q":"¿Qué recolector de basura de la JVM está diseñado para pausas muy cortas?","a":["Serial","ZGC","Parallel","Ninguno"],"c":1,"e":"ZGC busca pausas de alrededor de un milisegundo, incluso con heaps grandes."},{"q":"¿Cuál es una forma segura de renombrar una columna en un sistema en producción?","a":["Renombrarla y desplegar de golpe","Expandir y contraer: añadir la nueva columna, escribir en ambas, migrar y después eliminar la antigua","Borrar la tabla","Renombrarla de noche"],"c":1,"e":"Los pasos compatibles con versiones anteriores permiten que el código antiguo y el nuevo convivan."},{"q":"¿Qué es el logging estructurado?","a":["Registrar en varios archivos","Logs como campos clave-valor o JSON que las herramientas pueden buscar y filtrar","Registrar solo errores","Imprimir trazas de pila"],"c":1,"e":"Los logs estructurados permiten consultar por usuario, ID de petición o latencia."},{"q":"¿Qué muestra el trazado distribuido?","a":["La temperatura de la CPU","El recorrido y los tiempos de una petición a través de los servicios","El historial de Git","El número de pruebas"],"c":1,"e":"Las trazas revelan qué salto es lento o falla."},{"q":"¿Por qué Go prefiere interfaces pequeñas definidas por el consumidor?","a":["Solo para compilar más rápido","Desacoplan los paquetes y facilitan las pruebas","Go no tiene interfaces","Lo exige el compilador"],"c":1,"e":"El consumidor pide solo el comportamiento que necesita."},{"q":"¿Cuál es un buen uso de un asistente de IA en el nivel mid?","a":["Fusionar su resultado sin revisarlo","Redactar borradores de pruebas y código repetitivo y luego revisarlos con cuidado","Dejar que decida el diseño de seguridad","Pegar secretos de producción como contexto"],"c":1,"e":"Los asistentes aceleran el trabajo rutinario; la responsabilidad sobre la corrección y la seguridad sigue siendo tuya."}]}]}};
const LANGS = ['en', 'uk', 'pl', 'es'];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } };
const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} };

// Saved scores are untrusted input: keep only whole numbers before they reach the page
const cleanScores = v => {
  const pick = m => Object.fromEntries(Object.entries(m && typeof m === 'object' ? m : {}).filter(([, n]) => Number.isInteger(n) && n >= 0));
  return {quiz: pick(v && v.quiz), exam: pick(v && v.exam)};
};
let scores = cleanScores(load('roles-scores', null));
let lang = window.APP.lang;   // the app bar owns the language; see the 'app:lang' listener below
const roleIds = I18N.en.roles.map(r => r.id);
let role = roleIds.includes(location.hash.slice(1)) ? location.hash.slice(1) : load('roles-role', 'intern');
if (!roleIds.includes(role)) role = 'intern';

const T = () => I18N[lang];
const t = (key, vars = {}) => T().ui[key].replace(/\{(\w+)\}/g, (_, k) => vars[k]);
const R = () => T().roles.find(r => r.id === role);
const passMark = n => Math.ceil(n * 0.7);

function renderHeader() {
  document.documentElement.lang = T().ui.htmlLang;
  $('#rm-eyebrow').textContent = t('eyebrow');
  $('#rm-title').textContent = t('title');
  $('#rm-lede').textContent = t('lede');
  $('#rm-codeNote').textContent = t('codeNote');
  $('#rm-reset').textContent = t('reset');
  $('#rm-roles').setAttribute('aria-label', t('roles'));
  $('#rm-roles').innerHTML = T().roles.map(r => {
    const q = scores.quiz[r.id], e = scores.exam[r.id];
    return '<button type="button" class="role lvl-' + r.id + '" data-r="' + r.id + '" aria-pressed="' + (r.id === role) + '"><strong>' + esc(r.name) + '</strong><span class="sum">' + esc(r.summary) + '</span><span class="scores"><span>' + t('quizBest') + ': ' + (q == null ? '–' : q + '/' + r.quiz.length) + '</span><span>' + t('examBest') + ': ' + (e == null ? '–' : e + '/' + r.exam.length) + '</span></span></button>';
  }).join('');
}

function codeBlock(id) {
  const el = document.getElementById('code-' + id);
  if (!el) return '';
  return '<div class="codehead"><span class="label">' + esc(el.dataset.lang) + '</span><button type="button" class="linkbtn copy" data-code="' + id + '">' + t('copy') + '</button></div><pre class="code"><code>' + esc(el.textContent.replace(/^\n/, '').replace(/\s+$/, '')) + '</code></pre>';
}

function mcqHTML(list) {
  return list.map((q, i) => '<div class="card" data-i="' + i + '"><div class="label">' + t('question', {i: i + 1, n: list.length}) + '</div><p>' + esc(q.q) + '</p><div class="opts" role="group">' +
    q.a.map((o, j) => [Math.random(), j]).sort((x, y) => x[0] - y[0]).map(([, j]) => '<button type="button" class="opt" data-j="' + j + '" aria-pressed="false">' + esc(q.a[j]) + '</button>').join('') +
    '</div><p class="a" hidden></p></div>').join('');
}
function reveal(card, q, pick) {
  card.querySelectorAll('.opt').forEach(b => {
    const j = +b.dataset.j; b.disabled = true;
    if (j === q.c) { b.classList.add('ok'); b.insertAdjacentText('afterbegin', '✓ ') }
    else if (j === pick) { b.classList.add('bad'); b.insertAdjacentText('afterbegin', '✗ ') }
  });
  const a = card.querySelector('.a'); a.hidden = false;
  a.innerHTML = '<strong>' + (pick === q.c ? t('correct') : t('wrong')) + '</strong> ' + esc(q.e);
}

function renderRole() {
  const r = R();
  const lessons = r.lessons.map((l, i) => '<article class="lesson lvl-' + r.id + '"><span class="n">' + t('lesson') + ' ' + (i + 1) + '</span><h3>' + esc(l.title) + '</h3><p>' + esc(l.body) + '</p>' +
    '<h4>' + t('inLanguages') + '</h4><dl class="notes">' + l.langs.map(([n, d]) => '<div><dt>' + esc(n) + '</dt><dd>' + esc(d) + '</dd></div>').join('') + '</dl>' + codeBlock(l.code) + '</article>').join('');
  $('#rm-main').innerHTML =
    '<section id="rm-overview"><div class="sechead"><h2>' + esc(r.name) + '</h2><span class="pill lvl-' + r.id + '">' + t('overview') + '</span></div><p>' + esc(r.overview) + '</p>' +
    '<div class="two"><div class="box"><h4>' + t('expect') + '</h4><ul>' + r.expect.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' +
    '<div class="box"><h4>' + t('tasks') + '</h4><ul>' + r.tasks.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div></div></section>' +
    '<section id="rm-lessons"><h2>' + t('lessons') + '</h2><div class="lessons">' + lessons + '</div></section>' +
    '<section id="rm-languages"><h2>' + t('langContext') + '</h2><div class="tw"><table><thead><tr><th>' + t('langCol') + '</th><th>' + t('whyCol') + '</th></tr></thead><tbody>' +
    r.langContext.map(([n, d]) => '<tr><td>' + esc(n) + '</td><td>' + esc(d) + '</td></tr>').join('') + '</tbody></table></div></section>' +
    '<section id="rm-quiz"><div class="sechead"><h2>' + t('quiz') + ' · ' + esc(r.name) + '</h2><span class="count" id="rm-quizScore"></span></div><p>' + t('quizIntro') + '</p><div class="quiz" id="rm-quizQ"></div><button type="button" class="linkbtn" id="rm-quizRetry">' + t('retakeQuiz') + '</button></section>' +
    '<section id="rm-exam"><div class="sechead"><h2>' + t('exam') + ' · ' + esc(r.name) + '</h2><span class="count" id="rm-examBest"></span></div><p>' + t('examIntro', {n: r.exam.length, p: passMark(r.exam.length)}) + '</p><div class="quiz" id="rm-examQ"></div>' +
    '<div class="foot"><button type="button" class="act" id="rm-examSubmit"></button><span class="count" id="rm-examMsg" aria-live="polite"></span></div><p class="note" id="rm-examResult" aria-live="polite" hidden></p></section>';
  drawQuiz(); drawExam();
}

let qDone = 0, qGot = 0;
function drawQuiz() {
  const list = R().quiz; qDone = qGot = 0;
  $('#rm-quizQ').innerHTML = mcqHTML(list);
  $('#rm-quizScore').textContent = t('answered', {d: 0, n: list.length});
}
let picks = {};
function drawExam() {
  const list = R().exam; picks = {};
  $('#rm-examQ').innerHTML = mcqHTML(list);
  $('#rm-examResult').hidden = true;
  $('#rm-examSubmit').textContent = t('submit'); $('#rm-examSubmit').dataset.m = 'submit';
  $('#rm-examMsg').textContent = t('answered', {d: 0, n: list.length});
  const b = scores.exam[role];
  $('#rm-examBest').textContent = b == null ? t('notAttempted') : t('best', {s: b, n: list.length});
}

function render() { renderHeader(); renderRole() }

document.querySelector('.rm-root').addEventListener('click', e => {
  const rb = e.target.closest('#rm-roles button');
  if (rb) { role = rb.dataset.r; store('roles-role', role); history.replaceState(null, '', '#' + role); render(); $('#rm-main').scrollIntoView(); return }
  const cp = e.target.closest('.copy');
  if (cp) {
    const text = document.getElementById('code-' + cp.dataset.code).textContent.replace(/^\n/, '').replace(/\s+$/, '');
    try { navigator.clipboard.writeText(text).then(() => cp.textContent = t('copied'), () => cp.textContent = t('copyFailed')) } catch (err) { cp.textContent = t('copyFailed') }
    return;
  }
  if (e.target.closest('#rm-quizRetry')) { drawQuiz(); return }
  const opt = e.target.closest('.opt');
  if (opt && !opt.disabled) {
    const card = opt.closest('.card'), i = +card.dataset.i, j = +opt.dataset.j;
    if (card.closest('#rm-quizQ')) {
      const list = R().quiz, q = list[i];
      reveal(card, q, j); qDone++; if (j === q.c) qGot++;
      if (qDone === list.length) {
        scores.quiz[role] = Math.max(scores.quiz[role] ?? 0, qGot); store('roles-scores', scores); renderHeader();
        $('#rm-quizScore').textContent = t('score', {s: qGot, n: list.length});
      } else $('#rm-quizScore').textContent = t('answered', {d: qDone, n: list.length});
    } else if (card.closest('#rm-examQ')) {
      card.querySelectorAll('.opt').forEach(o => o.setAttribute('aria-pressed', String(o === opt)));
      picks[i] = j; $('#rm-examMsg').textContent = t('answered', {d: Object.keys(picks).length, n: R().exam.length});
    }
    return;
  }
  if (e.target.closest('#rm-examSubmit')) {
    const list = R().exam, btn = $('#rm-examSubmit');
    if (btn.dataset.m === 'retake') { drawExam(); $('#rm-exam').scrollIntoView(); return }
    const n = Object.keys(picks).length;
    if (n < list.length) { $('#rm-examMsg').textContent = t('answerAll', {n: list.length, d: n}); return }
    let s = 0;
    $('#rm-examQ').querySelectorAll('.card').forEach(c => { const i = +c.dataset.i; if (picks[i] === list[i].c) s++; reveal(c, list[i], picks[i]) });
    const pass = s >= passMark(list.length);
    scores.exam[role] = Math.max(scores.exam[role] ?? 0, s); store('roles-scores', scores); renderHeader();
    $('#rm-examBest').textContent = t('best', {s: scores.exam[role], n: list.length});
    const res = $('#rm-examResult'); res.hidden = false;
    res.innerHTML = '<strong>' + s + ' / ' + list.length + ' (' + Math.round(s / list.length * 100) + '%): ' + (pass ? t('passed') : t('notPassed')) + '.</strong> ' + (pass ? t('passedMsg') : t('failedMsg'));
    $('#rm-examMsg').textContent = ''; btn.textContent = t('retakeExam'); btn.dataset.m = 'retake';
    return;
  }
  if (e.target.closest('#rm-reset')) { scores = {quiz: {}, exam: {}}; store('roles-scores', scores); render() }
});
document.addEventListener('app:lang', e => { lang = e.detail; render() });
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (roleIds.includes(h) && h !== role) { role = h; render() } });
render();
})();
</script>
</html>
