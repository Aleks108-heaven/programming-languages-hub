:["Клієнт REST API, що зберігає результати в SQLite","Кожна зміна проходить через гілку та pull request із тестами"],"done":["Тести запускаються однією командою й проходять у CI","Ви пишете JOIN двох таблиць, не підглядаючи","Більшість пунктів чеклісту стажування позначено"]},{"phase":"Створення справжніх сервісів","lv":"junior","time":"Місяці 5–9","goal":"Випускати невеликі та середні функції з обмеженим наглядом.","learn":["Кроки послідовності 09–10: керування пакетами, інструменти збирання, налагодження, логування","SQL на рівні Junior: JOIN кількох таблиць, агрегація, транзакції, обмеження, індекси, міграції та тестові дані","Ідіоматичний код основною мовою"],"practice":["CRUD API на справжній базі даних із міграціями та початковими даними","Інтеграційні тести з одноразовою базою даних (контейнер Docker або SQLite)"],"done":["Ви даєте конкретні корисні відгуки під час рев'ю коду","Зміни схеми проходять через міграції, ніколи вручну","Більшість пунктів чеклісту Junior позначено"]},{"phase":"Продакшн-мислення","lv":"junior","time":"Місяці 10–18","goal":"Зберігати коректність програм під навантаженням, під час збоїв і атак.","learn":["Кроки послідовності 11–13: конкурентність і асинхронність, безпека й залежності, продуктивність і профілювання","SQL на рівні Middle: плани виконання, оптимізація запитів, рівні ізоляції та блокування","Спостережуваність: логи, метрики та трасування"],"practice":["Додати до сервісу автентифікацію, обмеження частоти запитів і метрики","Знайти й виправити один повільний запит за його планом виконання"],"done":["Ви можете пояснити збій, наближений до продакшну, за логами й трасуванням","Ви вимірюєте, перш ніж оптимізувати","Підсумковий іспит складено (від 70%)"]},{"phase":"Інженерія рівня Middle","lv":"mid","time":"Від 18-го місяця","goal":"Відповідати за компоненти від початку до кінця й допомагати іншим рости.","learn":["Крок послідовності 14: архітектура та підтримуваність","Внутрішня будова середовища виконання: GC, JIT і моделі пам'яті","Моделювання баз даних і компроміси між варіантами дизайну","Друга мова з іншою моделлю (Go, Rust або Java/C#)"],"practice":["Система з кількох сервісів або наближена до продакшну, з контрактами та стійкістю","Супроводжувати junior-розробника під час роботи над функцією"],"done":["Ви робите компроміси явними й віддаєте перевагу оборотним рішенням","Більшість пунктів чеклісту Middle позначено","Ви могли б викладати будь-який розділ цього хабу"]}],"sqlSkills":[["SELECT, INSERT, UPDATE, DELETE","Чотири оператори CRUD: читати, створювати, змінювати й видаляти рядки."],["WHERE, ORDER BY, LIMIT/OFFSET","Фільтрувати рядки, сортувати результати й гортати їх сторінками."],["JOIN","Поєднання таблиць: INNER залишає лише збіги; LEFT залишає кожен рядок лівої таблиці; RIGHT, FULL і CROSS JOIN — там, де їх підтримує діалект."],["Агрегація","COUNT, SUM, AVG, MIN і MAX з GROUP BY; HAVING фільтрує групи після агрегації, WHERE фільтрує рядки до неї."],["Підзапити та CTE","Запити всередині запитів; WITH (узагальнені табличні вирази) дає ім'я кожному кроку, тож складні запити лишаються читабельними."],["Схема та обмеження","Таблиці, рядки й стовпці; первинні ключі ідентифікують рядки, зовнішні ключі пов'язують таблиці; NOT NULL, UNIQUE і CHECK захищають дані."],["Транзакції та ACID","BEGIN, COMMIT і ROLLBACK групують зміни, щоб усі вони застосувалися або жодна: атомарність, узгодженість, ізольованість, довговічність."],["Індекси та плани запитів","Індекси пришвидшують пошук ціною повільнішого запису; EXPLAIN показує, як база даних виконуватиме запит."],["Захист від SQL-ін'єкцій","Ніколи не збирайте SQL із вводу користувача конкатенацією рядків; використовуйте параметризовані запити або prepared statements."],["Міграції та тестові дані","Версіоновані зміни схеми (Flyway, Liquibase, Alembic, EF Core, Prisma), початкові дані та відтворювані тестові набори."],["Відмінності діалектів","PostgreSQL, MySQL, SQL Server/T-SQL, Oracle і SQLite мають спільне ядро, але різняться синтаксисом і можливостями."]],"dialects":[["PostgreSQL","<code>LIMIT n OFFSET m<\/code>","<code>GENERATED … AS IDENTITY<\/code> або <code>SERIAL<\/code>","Орієнтована на стандарти й багата на можливості: JSONB, масиви, потужна індексація. Поширений вибір для нових проєктів."],["MySQL","<code>LIMIT n OFFSET m<\/code> або <code>LIMIT m, n<\/code>","<code>AUTO_INCREMENT<\/code>","Дуже поширена у вебстеках. InnoDB — транзакційний рушій; ідентифікатори беруться у зворотні апострофи."],["SQL Server (T-SQL)","<code>TOP n<\/code> або <code>OFFSET m ROWS FETCH NEXT n ROWS ONLY<\/code>","<code>IDENTITY(1,1)<\/code>","Екосистема Microsoft і .NET. T-SQL додає процедурні розширення; ідентифікатори беруться у квадратні дужки."],["Oracle","<code>FETCH FIRST n ROWS ONLY<\/code> (12c+), раніше <code>ROWNUM<\/code>","Identity-стовпці (12c+) або послідовності","Корпоративний сектор і фінанси. PL/SQL для процедурного коду; порожній рядок вважається NULL."],["SQLite","<code>LIMIT n OFFSET m<\/code>","<code>INTEGER PRIMARY KEY<\/code>","Вбудована база даних в одному файлі з гнучкою типізацією. Ідеальна для навчання, тестів, мобільних застосунків та інструментів."]],"sqlExamples":[{"task":"Фільтр і сортування","code":"SELECT name, country\nFROM customers\nWHERE country = 'DE'\nORDER BY name\nLIMIT 10;","note":"Ви описуєте результат (німецькі клієнти за абеткою, перші 10); база даних вирішує, як їх знайти."},{"task":"JOIN + агрегація","code":"SELECT c.name,\n       COUNT(o.id)             AS order_count,\n       COALESCE(SUM(o.total), 0) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) >= 2\nORDER BY revenue DESC;","note":"LEFT JOIN залишає клієнтів без замовлень, а COUNT(o.id) рахує лише знайдені замовлення. Потім HAVING залишає клієнтів щонайменше з двома замовленнями."},{"task":"CTE + підзапит","code":"WITH spend AS (\n    SELECT customer_id, SUM(total) AS spent\n    FROM orders\n    WHERE created_at >= '2026-01-01'\n    GROUP BY customer_id\n)\nSELECT c.name, s.spent\nFROM spend s\nJOIN customers c ON c.id = s.customer_id\nWHERE s.spent > (SELECT AVG(spent) FROM spend)\nORDER BY s.spent DESC;","note":"CTE дає ім'я проміжному результату, тож кожен крок читається згори донизу. Підзапит порівнює кожного клієнта із середнім."},{"task":"Транзакція","code":"BEGIN;\n\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n\n-- If either statement fails, run ROLLBACK instead:\n-- both changes are undone together.\nCOMMIT;","note":"Атомарність на практиці: переказ ніколи не має списати гроші з одного рахунку, не зарахувавши їх на інший."},{"task":"Індекс і план","code":"CREATE INDEX idx_orders_customer ON orders (customer_id);\n\n-- PostgreSQL: runs the query and shows the real plan and timings\nEXPLAIN ANALYZE\nSELECT * FROM orders WHERE customer_id = 42;","note":"До індексу очікуйте послідовного сканування всієї таблиці; після нього — сканування за індексом. Індекси пришвидшують читання, але додають витрат на кожен запис."},{"task":"Безпечний запит (Python)","code":"# UNSAFE: user input becomes part of the SQL text (SQL injection)\n# cur.execute(f\"SELECT * FROM customers WHERE name = '{name}'\")\n\n# SAFE: the driver sends the value separately from the SQL\ncur.execute(\"SELECT * FROM customers WHERE name = %s\", (name,))\nrow = cur.fetchone()","note":"Синтаксис заповнювачів залежить від драйвера (%s у psycopg і mysql-connector, ? у sqlite3 і JDBC, @name в ADO.NET), але правило одне: ніколи не вклеюйте ввід у SQL."}],"snippets":[{"task":"Сума парних чисел","note":"Python і C# читаються майже як речення. У Go навмисно немає вбудованих filter/map, тож звичайний цикл — ідіоматичний. Ланцюжок ітераторів у Rust компілюється в той самий машинний код, що й цикл.","code":{"Python":"nums = [1, 2, 3, 4, 5, 6]\ntotal = sum(n for n in nums if n % 2 == 0)\nprint(total)  # 12","TypeScript":"const nums: number[] = [1, 2, 3, 4, 5, 6];\nconst total = nums.filter((n) => n % 2 === 0).reduce((acc, n) => acc + n, 0);\nconsole.log(total); // 12","Java":"import java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\n        int total = nums.stream().filter(n -> n % 2 == 0).mapToInt(Integer::intValue).sum();\n        System.out.println(total); // 12\n    }\n}","C#":"int[] nums = [1, 2, 3, 4, 5, 6];\nvar total = nums.Where(n => n % 2 == 0).Sum();\nConsole.WriteLine(total); // 12","Go":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnums := []int{1, 2, 3, 4, 5, 6}\n\ttotal := 0\n\tfor _, n := range nums {\n\t\tif n%2 == 0 {\n\t\t\ttotal += n\n\t\t}\n\t}\n\tfmt.Println(total) // 12\n}","Rust":"fn main() {\n    let nums = vec![1, 2, 3, 4, 5, 6];\n    let total: i32 = nums.iter().filter(|&&n| n % 2 == 0).sum();\n    println!(\"{total}\"); // 12\n}"}},{"task":"Валідація вводу у функції","note":"Дві моделі помилок: Python, TypeScript, Java і C# кидають винятки; Go повертає значення помилки поруч із результатом, а Rust — Result, який має обробити викликач. Граничні тести для всіх шести: 17, 18, 65, 66 і -1.","code":{"Python":"def is_working_age(age: int) -> bool:\n    if age < 0:\n        raise ValueError(f\"age must be >= 0, got {age}\")\n    return 18 <= age <= 65\n\nprint(is_working_age(18), is_working_age(66))  # True False","TypeScript":"function isWorkingAge(age: number): boolean {\n  if (!Number.isInteger(age) || age < 0) {\n    throw new RangeError(`age must be a non-negative integer, got ${age}`);\n  }\n  return age >= 18 && age <= 65;\n}\n\nconsole.log(isWorkingAge(18), isWorkingAge(66)); // true false","Java":"public class Main {\n    static boolean isWorkingAge(int age) {\n        if (age < 0) {\n            throw new IllegalArgumentException(\"age must be >= 0, got \" + age);\n        }\n        return age >= 18 && age <= 65;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isWorkingAge(18) + \" \" + isWorkingAge(66)); // true false\n    }\n}","C#":"static bool IsWorkingAge(int age)\n{\n    ArgumentOutOfRangeException.ThrowIfNegative(age);\n    return age is >= 18 and <= 65;\n}\n\nConsole.WriteLine($\"{IsWorkingAge(18)} {IsWorkingAge(66)}\"); // True False","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc isWorkingAge(age int) (bool, error) {\n\tif age < 0 {\n\t\treturn false, errors.New(\"age must be >= 0\")\n\t}\n\treturn age >= 18 && age <= 65, nil\n}\n\nfunc main() {\n\tok, err := isWorkingAge(18)\n\tfmt.Println(ok, err) // true <nil>\n}","Rust":"fn is_working_age(age: i32) -> Result<bool, String> {\n    if age < 0 {\n        return Err(format!(\"age must be >= 0, got {age}\"));\n    }\n    Ok((18..=65).contains(&age))\n}\n\nfn main() {\n    println!(\"{:?}\", is_working_age(18)); // Ok(true)\n    println!(\"{:?}\", is_working_age(-1)); // Err(\"age must be >= 0, got -1\")\n}"}},{"task":"Читання файлу й обробка помилок","note":"Перехоплюйте саме ту помилку, на яку очікуєте (файл не знайдено), а все інше нехай виходить назовні. Java змушує оголошувати перевірювані винятки (throws IOException); у Go і Rust помилка — це значення, яке треба розглянути, а match у Rust не скомпілюється, доки не оброблено кожен випадок.","code":{"Python":"from pathlib import Path\n\ntry:\n    print(Path(\"config.txt\").read_text(encoding=\"utf-8\"))\nexcept FileNotFoundError:\n    print(\"config.txt not found\")","TypeScript":"import { readFile } from \"node:fs/promises\";\n\ntry {\n  console.log(await readFile(\"config.txt\", \"utf8\"));\n} catch (err) {\n  if ((err as NodeJS.ErrnoException).code === \"ENOENT\") {\n    console.log(\"config.txt not found\");\n  } else {\n    throw err;\n  }\n}","Java":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try {\n            System.out.println(Files.readString(Path.of(\"config.txt\")));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"config.txt not found\");\n        }\n    }\n}","C#":"try\n{\n    Console.WriteLine(File.ReadAllText(\"config.txt\"));\n}\ncatch (FileNotFoundException)\n{\n    Console.WriteLine(\"config.txt not found\");\n}","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\tdata, err := os.ReadFile(\"config.txt\")\n\tif errors.Is(err, fs.ErrNotExist) {\n\t\tfmt.Println(\"config.txt not found\")\n\t\treturn\n\t}\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tfmt.Print(string(data))\n}","Rust":"use std::fs;\nuse std::io::ErrorKind;\n\nfn main() {\n    match fs::read_to_string(\"config.txt\") {\n        Ok(text) => println!(\"{text}\"),\n        Err(e) if e.kind() == ErrorKind::NotFound => println!(\"config.txt not found\"),\n        Err(e) => panic!(\"{e}\"),\n    }\n}"}},{"task":"Дві задачі одночасно","note":"Одна мета — три моделі: async/await на циклі подій (Python, TypeScript, C#), потоки (віртуальні потоки Java, scoped-потоки Rust) і горутини (Go). Обидві задачі чекають одночасно, тож загальний час близько 1 секунди, а не 2.","code":{"Python":"import asyncio\n\nasync def fetch(name: str, seconds: float) -> str:\n    await asyncio.sleep(seconds)  # stands in for a network call\n    return f\"{name} done\"\n\nasync def main() -> None:\n    results = await asyncio.gather(fetch(\"users\", 1), fetch(\"orders\", 1))\n    print(results)  # ~1 s total, not 2\n\nasyncio.run(main())","TypeScript":"const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));\n\nasync function fetchData(name: string, ms: number): Promise<string> {\n  await sleep(ms); // stands in for a network call\n  return `${name} done`;\n}\n\nconst results = await Promise.all([fetchData(\"users\", 1000), fetchData(\"orders\", 1000)]);\nconsole.log(results); // ~1 s total, not 2","Java":"import java.util.concurrent.Executors;\n\npublic class Main {\n    static String fetch(String name) throws InterruptedException {\n        Thread.sleep(1000); // stands in for a network call\n        return name + \" done\";\n    }\n\n    public static void main(String[] args) throws Exception {\n        try (var pool = Executors.newVirtualThreadPerTaskExecutor()) {\n            var users = pool.submit(() -> fetch(\"users\"));\n            var orders = pool.submit(() -> fetch(\"orders\"));\n            System.out.println(users.get() + \", \" + orders.get()); // ~1 s total\n        }\n    }\n}","C#":"static async Task<string> FetchAsync(string name)\n{\n    await Task.Delay(1000); // stands in for a network call\n    return $\"{name} done\";\n}\n\nvar results = await Task.WhenAll(FetchAsync(\"users\"), FetchAsync(\"orders\"));\nConsole.WriteLine(string.Join(\", \", results)); // ~1 s total","Go":"package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc fetch(name string) string {\n\ttime.Sleep(time.Second) // stands in for a network call\n\treturn name + \" done\"\n}\n\nfunc main() {\n\tnames := []string{\"users\", \"orders\"}\n\tresults := make([]string, len(names))\n\tvar wg sync.WaitGroup\n\tfor i, name := range names {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = fetch(name)\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(results) // ~1 s total\n}","Rust":"use std::thread;\nuse std::time::Duration;\n\nfn fetch(name: &str) -> String {\n    thread::sleep(Duration::from_secs(1)); // stands in for a network call\n    format!(\"{name} done\")\n}\n\nfn main() {\n    let (users, orders) = thread::scope(|s| {\n        let a = s.spawn(|| fetch(\"users\"));\n        let b = s.spawn(|| fetch(\"orders\"));\n        (a.join().unwrap(), b.join().unwrap())\n    });\n    println!(\"{users}, {orders}\"); // ~1 s total\n}"}}]}},"pl":{"ui":{"appName":"Programming Languages Hub","viewsAria":"Widoki","viewHub":"Centrum nauki","viewRoles":"Moduły ról","language":"Język","theme":"Motyw: {t}","themeAuto":"auto","themeLight":"jasny","themeDark":"ciemny","contents":"Spis treści","searchPh":"Szukaj w hubie…","searchAria":"Szukaj w hubie","searchHits":"Pasujące sekcje: {n} z {m} · Enter, aby przejść","searchNone":"Brak wyników","lvIntern":"Stażysta","lvJunior":"Junior","lvMid":"Mid","lvlIntern":"Staż","lvlJunior":"Junior","lvlMid":"Mid","ready":"Gotowe: {d} z {n}","all":"Wszystkie","allLangs":"<strong>Wszystkie języki ({n}).<\/strong> Wybierz cel, aby zawęzić listę.","goalAria":"Filtruj według celu","check":"Pytanie kontrolne {i} z {n}","showHint":"Pokaż podpowiedź","hideHint":"Ukryj podpowiedź","question":"Pytanie {i} z {n}","answers":"Odpowiedzi","answered":"Odpowiedzi: {d} / {n}","score":"Wynik: {s} / {n}","correct":"Dobrze.","wrong":"Nie do końca.","submit":"Wyślij odpowiedzi","retakeExam":"Podejdź do egzaminu ponownie","answerAll":"Najpierw odpowiedz na wszystkie {n} pytań (odpowiedzi: {d})","examResult":"{s} / {n} ({p}%): {v}.","passed":"zaliczony","notPassed":"jeszcze niezaliczony","passedMsg":"Przejrzyj odpowiedzi oznaczone ✗ powyżej.","failedMsg":"Przeczytaj wyjaśnienie pod każdym ✗, wróć do tych sekcji i podejdź do egzaminu ponownie.","best":"Najlepszy: {s} / {n}","notAttempted":"Jeszcze nie podchodzono","examIntro":"{n} pytań z całego huba. Odpowiedz na każde, a potem wyślij, aby zobaczyć wynik. Próg zaliczenia to 70% ({p} z {n}). Najlepszy wynik zapisuje się na tym urządzeniu.","toReview":"Do powtórki: {n}","tileQuizzes":"Quizy sekcji","tileNone":"Żaden jeszcze nieukończony","tileAvg":"Średni najlepszy wynik {p}%","tileExam":"Egzamin końcowy","tilePassed":"Zaliczony","tilePassMark":"Próg zaliczenia {p}","tileReview":"Pytania do powtórki","tileReviewLink":"Powtórz moje błędy →","tileNothing":"Na razie żadnych błędów","copy":"Kopiuj kod","copied":"Skopiowano","copyFailed":"Nie udało się skopiować","taskAria":"Zadanie","langAria":"Język","sqlAria":"Przykład SQL","phase":"Etap {i}","learn":"Naucz się","build":"Zbuduj","doneWhen":"Gotowe, gdy"},"hero":"<div class=\"label\">Centrum nauki · Stażysta → Junior → Mid · Wydanie rozszerzone, wrzesień 2026<\/div>\n<h1>Programming Languages Hub<\/h1>\n<p class=\"lede\">Czym są języki programowania, jak kod źródłowy zamienia się w działanie programu, które ekosystemy liczą się w 2026 roku, gdzie obok nich mieści się SQL i co trzeba umieć na każdym etapie kariery. Fundamenty, które przenoszą się między językami, a nie jeden wykuty na pamięć język. Przejdź ustrukturyzowaną ścieżkę od pierwszego programu do inżyniera na poziomie mid i sprawdzaj się quizem po każdej części.<\/p>\n<div class=\"pipe\" aria-label=\"Model myślowy\"><b>zamiar człowieka<\/b><i>→<\/i><b>kod źródłowy<\/b><i>→<\/i><b>parser / kompilator / środowisko uruchomieniowe<\/b><i>→<\/i><b>instrukcje maszynowe + biblioteki<\/b><i>→<\/i><b>system operacyjny / sprzęt<\/b><i>→<\/i><b>obserwowalne zachowanie<\/b><\/div>\n<div class=\"progress\" id=\"progress\"><\/div>\n<div class=\"stats\" id=\"summary\"><\/div>","sections":{"what":"<h2>Czym jest język programowania?<\/h2>\n<p>Formalnym systemem do zapisywania algorytmów, przetwarzania danych, reguł i interakcji z komputerem. Kod stosuje się do <strong>składni<\/strong> języka (jak pisze się poprawny kod) i jego <strong>semantyki<\/strong> (co ten kod znaczy). Następnie kompilator, interpreter, maszyna wirtualna, środowisko uruchomieniowe albo ich połączenie wykonuje go lub tłumaczy na operacje, które komputer potrafi wykonać.<\/p>\n<p class=\"tip\"><b>Z perspektywy kariery<\/b>Języki to najbardziej widoczna umiejętność w CV, ale pracodawcy zatrudniają za fundamenty, które język niesie: dekompozycję problemów, dyscyplinę debugowania, testowanie i myślenie systemowe. Traktuj język jako nośnik fundamentów.<\/p>","tools":"<h2>Język, narzędzia i framework<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Element<\/th><th>Czym jest<\/th><th>Przykłady<\/th><\/tr><\/thead><tbody id=\"t-tools\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Pytanie z rozmowy kwalifikacyjnej<\/b>Biblioteka a framework to kwestia „kto kogo wywołuje”: Twój kod wywołuje bibliotekę, a framework wywołuje Twój kod. Bądź też gotów odróżnić język od jego środowiska uruchomieniowego.<\/p>","exec":"<h2>Jak wykonywany jest kod<\/h2>\n<div class=\"models\">\n<div class=\"model\"><h3>Kompilacja z wyprzedzeniem (AOT)<\/h3><p>Kompilowany do natywnego kodu maszynowego przed uruchomieniem.<\/p><code>C · C++ · Go · Rust<\/code><\/div>\n<div class=\"model\"><h3>Kod bajtowy + maszyna wirtualna<\/h3><p>Kompilowany do postaci pośredniej, którą wykonuje środowisko uruchomieniowe.<\/p><code>Java → kod bajtowy JVM · C# → .NET IL<\/code><\/div>\n<div class=\"model\"><h3>Interpretacja / środowisko uruchomieniowe<\/h3><p>Wykonywany przez środowisko uruchomieniowe języka; nowoczesne używają też kompilacji JIT.<\/p><code>Python · JavaScript<\/code><\/div>\n<div class=\"model\"><h3>Transpilacja<\/h3><p>Jeden język źródłowy przekształcany w inny przed wykonaniem.<\/p><code>TypeScript → JavaScript<\/code><\/div>\n<\/div>\n<p class=\"note\"><strong>Pamiętaj:<\/strong> „kompilowany” i „interpretowany” to uproszczone etykiety. Nowoczesne środowiska uruchomieniowe łączą parsowanie, kod bajtowy, kompilację JIT, cache, optymalizację i natywne wykonanie.<\/p>\n<h3>Głębiej: co się dzieje, gdy „uruchamiasz” Pythona lub JavaScript <span class=\"pill lv-mid\">Mid<\/span><\/h3>\n<ol class=\"steps\">\n<li><span><strong>Analiza leksykalna i parsowanie:<\/strong> tekst źródłowy jest dzielony na tokeny i parsowany do abstrakcyjnego drzewa składni (AST).<\/span><\/li>\n<li><span><strong>Obniżanie:<\/strong> AST staje się kodem bajtowym (CPython <code>.pyc<\/code>; kod bajtowy V8 Ignition).<\/span><\/li>\n<li><span><strong>Wykonanie + profilowanie:<\/strong> interpreter wykonuje kod bajtowy i zbiera profile typów oraz rozgałęzień dla gorących ścieżek.<\/span><\/li>\n<li><span><strong>Optymalizacja JIT:<\/strong> gorące funkcje są ponownie kompilowane do kodu maszynowego (V8 TurboFan, śledzący JIT w PyPy). Złamane założenia powodują <em>deoptymalizację<\/em> z powrotem do interpretera.<\/span><\/li>\n<li><span><strong>Usługi środowiska:<\/strong> odśmiecanie pamięci, funkcje wbudowane i granice FFI działają obok Twojego kodu.<\/span><\/li>\n<\/ol>\n<p class=\"note\"><strong>Konsekwencje:<\/strong> pierwsze uruchomienie kodu Pythona jest wolniejsze niż drugie (cache kodu bajtowego); mikrobenchmarki mogą kłamać (rozgrzewka JIT); deoptymalizacja wyjaśnia, dlaczego funkcja nagle zwalnia po zmianie typu.<\/p>","quiz-1":"<div class=\"lvhead\"><h2>Quiz: Podstawy<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cztery pytania o to, czym jest język, o narzędziach i frameworkach oraz o tym, jak wykonywany jest kod. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","concepts":"<h2>Kluczowe pojęcia, które się przenoszą<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Pojęcie<\/th><th>Dlaczego to ważne<\/th><\/tr><\/thead><tbody id=\"t-concepts\"><\/tbody><\/table><\/div>\n<h3>Głębiej: systemy typów — najbardziej uniwersalne pojęcie<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Oś<\/th><th>Znaczenie<\/th><th>Przykłady<\/th><\/tr><\/thead><tbody id=\"t-types\"><\/tbody><\/table><\/div>\n<ul class=\"checks\" style=\"list-style:disc;padding-left:20px;display:grid;gap:8px\">\n<li><strong>Typowanie stopniowe<\/strong> to kompromis branży: Python <code>typing<\/code> (mypy/pyright) i TypeScript dodają statyczne gwarancje bez utraty dynamicznej elastyczności.<\/li>\n<li><strong>Typy generyczne<\/strong> pozwalają bezpiecznie pisać kod dla wielu typów; zrozumienie wariancji (in/out, kowariancja/kontrawariancja) to prawdziwy wyróżnik poziomu mid.<\/li>\n<li><strong>Typy sumy i dopasowanie wzorców<\/strong> (enum + match w Ruście, klasy sealed w Javie/Kotlinie, unie z dyskryminatorem w TS) sprawiają, że niepoprawnych stanów nie da się zapisać.<\/li>\n<li><strong>Typy a testy:<\/strong> w językach statycznych kompilator to darmowy, szybki zestaw testów; języki dynamiczne potrzebują więcej testów, aby pokryć to, co wyłapałby kompilator.<\/li>\n<\/ul>","code":"<h2>To samo zadanie w sześciu językach<\/h2>\n<p>Cztery codzienne zadania napisane idiomatycznie w każdym języku. Wybierz zadanie, potem język, i porównaj, jak każdy radzi sobie z kolekcjami, błędami i współbieżnością.<\/p>\n<div class=\"tabs\" id=\"taskTabs\" role=\"group\" aria-label=\"Zadanie\"><\/div>\n<div class=\"codehead\"><div class=\"tabs\" id=\"langTabs\" role=\"group\" aria-label=\"Język\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"copyBtn\">Kopiuj kod<\/button><\/div>\n<div class=\"label\" id=\"snipCap\"><\/div>\n<pre class=\"code\"><code id=\"snippet\"><\/code><\/pre>\n<p class=\"note\" id=\"snipNote\"><\/p>","langs":"<h2>Najważniejsze języki i ich zastosowania<\/h2>\n<div class=\"tabs\" id=\"goalTabs\" role=\"group\" aria-label=\"Filtruj według celu\"><\/div>\n<div class=\"tw\"><table><thead><tr><th>Język<\/th><th>Mocne strony / ekosystem<\/th><th>Na czym się skupić<\/th><th>Typowe zastosowanie<\/th><\/tr><\/thead><tbody id=\"t-langs\"><\/tbody><\/table><\/div>\n<p class=\"note\" id=\"goalWhy\"><\/p>\n<h3>Profile języków w 2026 roku<\/h3>\n<div class=\"profiles\" id=\"profiles\"><\/div>","memory":"<h2>Porównanie modeli pamięci<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Model<\/th><th>Języki<\/th><th>Kompromis<\/th><\/tr><\/thead><tbody id=\"t-mem\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Poprzeczka na poziomie mid:<\/strong> wyjaśnij, po co istnieje GC, jak wygląda wyciek w języku z GC (niechcący utrzymywane referencje) i kiedy warto zapłacić za model własności lub ręczne zarządzanie pamięcią.<\/p>","quiz-2":"<div class=\"lvhead\"><h2>Quiz: Pojęcia, języki i pamięć<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cztery pytania o systemy typów, najważniejsze języki i modele pamięci. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","sql":"<h2>SQL i programowanie baz danych<\/h2>\n<p>SQL (Structured Query Language) jest zwykle uznawany za język programowania, a dokładniej za <strong>język dziedzinowy (DSL)<\/strong> do odpytywania relacyjnych baz danych i zarządzania nimi. Jest <strong>deklaratywny<\/strong>: programista opisuje pożądaną operację lub wynik, a system zarządzania bazą danych decyduje, jak go wykonać. SQL uzupełnia języki ogólnego przeznaczenia, takie jak Python, Java, C#, JavaScript, Go i Rust.<\/p>\n<p class=\"tip\"><b>Deklaratywnie czy imperatywnie<\/b>W Pythonie piszesz pętlę, która przechodzi przez klientów i zostawia tych z Niemiec. W SQL piszesz <code>SELECT name FROM customers WHERE country = 'DE'<\/code>, a planista zapytań bazy danych sam wybiera, czy przeskanować tabelę, czy użyć indeksu. Większość aplikacji używa obu: języka ogólnego przeznaczenia do logiki, SQL do danych.<\/p>\n<h3>Kluczowe umiejętności SQL<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Umiejętność<\/th><th>Co trzeba wiedzieć<\/th><\/tr><\/thead><tbody id=\"t-sql\"><\/tbody><\/table><\/div>\n<h3>Postępy w nauce SQL<\/h3>\n<p>Zaznacz to, co już potrafisz. Te poziomy odpowiadają etapom ustrukturyzowanej ścieżki nauki.<\/p>\n<div class=\"sqllv\">\n<div class=\"lv-intern\"><span class=\"pill\">Staż<\/span><ul class=\"checks\" data-lv=\"sqlintern\"><\/ul><\/div>\n<div class=\"lv-junior\"><span class=\"pill\">Junior<\/span><ul class=\"checks\" data-lv=\"sqljunior\"><\/ul><\/div>\n<div class=\"lv-mid\"><span class=\"pill\">Mid<\/span><ul class=\"checks\" data-lv=\"sqlmid\"><\/ul><\/div>\n<\/div>\n<h3>SQL w praktyce<\/h3>\n<p>Przykłady korzystają z małego schematu sklepu: <code>customers(id, name, country)<\/code>, <code>orders(id, customer_id, total, created_at)<\/code> i <code>accounts(id, balance)<\/code>. Składnia PostgreSQL.<\/p>\n<div class=\"codehead\"><div class=\"tabs\" id=\"sqlTabs\" role=\"group\" aria-label=\"Przykład SQL\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"sqlCopy\">Kopiuj kod<\/button><\/div>\n<pre class=\"code\"><code id=\"sqlCode\"><\/code><\/pre>\n<p class=\"note\" id=\"sqlNote\"><\/p>\n<h3>Różnice między dialektami<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Baza danych<\/th><th>Ograniczenie liczby wierszy<\/th><th>Klucz autoinkrementowany<\/th><th>Uwagi<\/th><\/tr><\/thead><tbody id=\"t-dialects\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Przenośny nawyk:<\/strong> najpierw naucz się standardowego SQL (PostgreSQL lub SQLite to dobre miejsca do ćwiczeń), a szczegóły dialektów sprawdzaj, gdy wymaga tego praca. JOIN-y, agregacja i transakcje działają w każdej bazie danych.<\/p>","quiz-sql":"<div class=\"lvhead\"><h2>Quiz: SQL i bazy danych<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Pięć pytań o naturę SQL, JOIN-y, agregację, wstrzykiwanie i transakcje. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","landscape":"<h2>Popularność i zarobki w 2026 roku<\/h2>\n<p>Popularność zależy od tego, jak się ją mierzy. Każdy ranking wskazuje innego zwycięzcę.<\/p>\n<div class=\"stats\">\n<div class=\"stat\"><span class=\"label\">Ankiety · użycie<\/span><span class=\"v\">JavaScript<\/span><span class=\"w\">~66–69% zawodowych programistów (Stack Overflow 2025, ponad 49 000 respondentów)<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">GitHub · kontrybutorzy<\/span><span class=\"v\">TypeScript<\/span><span class=\"w\">Nr 1 od sierpnia 2025, ~67% wzrostu rok do roku<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Wyszukiwania · TIOBE<\/span><span class=\"v\">Python 21,81%<\/span><span class=\"w\">Luty 2026, ponad 10 punktów przed C — największa przewaga od 25 lat<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Sympatia programistów<\/span><span class=\"v\">Rust ~72%<\/span><span class=\"w\">Najbardziej podziwiany od ~10 lat z rzędu<\/span><\/div>\n<\/div>\n<p class=\"tip\"><b>Dla uczących się<\/b>JS/TS dominują w ogólnym tworzeniu oprogramowania; Python dominuje w danych i AI i rośnie najszybciej spośród popularnych języków; SQL (używany przez ~59–61% programistów) warto znać bez względu na główny język.<\/p>\n<h3>Sygnały płacowe · przybliżone mediany w USA, zestawienia z 2026 roku<\/h3>\n<div class=\"sal\" role=\"img\" aria-label=\"Przedziały wynagrodzeń według języka, od 100 do 210 tysięcy dolarów amerykańskich\">\n<div class=\"axis\"><span><\/span><div><span>$100K<\/span><span>$155K<\/span><span>$210K<\/span><\/div><span><\/span><\/div>\n<div id=\"sal\"><\/div>\n<\/div>\n<p class=\"note\"><strong>Wynagrodzenia zależą od niedoboru specjalistów i wagi ryzyka, a nie od popularności.<\/strong> JS i Python mają najwięcej ofert i najwięcej kandydatów; trudne języki w dziedzinach o wysokiej stawce (Rust w infrastrukturze, C++ w HFT i grach, Scala w finansach) dają premię. Premia Pythona w ML (bursztynowy pasek) wynika ze specjalizacji, nie z języka. Liczby są orientacyjne i mocno zależą od regionu.<\/p>","quiz-3":"<div class=\"lvhead\"><h2>Quiz: Rynek w 2026 roku<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cztery pytania o rankingi popularności i sygnały płacowe. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","ai":"<h2>Programowanie z asystentami AI<\/h2>\n<p>Asystenci AI do programowania to standard: 82% programistów w ankiecie Stack Overflow 2025 używało modeli GPT od OpenAI do pracy programistycznej w ciągu ostatniego roku. To zmienia to, czego warto się uczyć.<\/p>\n<div class=\"models\">\n<div class=\"model\"><h3>Fundamenty ważą jeszcze więcej<\/h3><p>Asystenci przyspieszają osoby, które potrafią przeglądać, poprawiać i weryfikować kod, a u pozostałych pogłębiają luki.<\/p><\/div>\n<div class=\"model\"><h3>Weryfikacja to zawód<\/h3><p>Precyzyjnie opisuj wymagania (wejścia, wyjścia, przypadki brzegowe, ograniczenia), a potem testuj wynik jak kod, którego nie napisałeś.<\/p><\/div>\n<div class=\"model\"><h3>Wiedz, co dostarczasz<\/h3><p>Licencja, bezpieczeństwo i poprawność są po Twojej stronie. Nigdy nie wklejaj sekretów do asystentów; sprawdzaj wygenerowane zależności.<\/p><\/div>\n<div class=\"model\"><h3>Synergia z językiem<\/h3><p>Pomoc jest najlepsza w popularnych językach (Python, TypeScript, Java) i słabsza w niszowych językach oraz wewnętrznych frameworkach.<\/p><\/div>\n<\/div>\n<p class=\"note\"><strong>Nadal wyróżnia:<\/strong> dekompozycja problemów, architektura, debugowanie systemów produkcyjnych i umiejętność ważenia kompromisów.<\/p>","quiz-4":"<div class=\"lvhead\"><h2>Quiz: Programowanie z asystentami AI<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cztery pytania o pracę z asystentami AI do programowania. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","intern":"<div class=\"lvhead\"><h2>Oczekiwania na stażu<\/h2><span class=\"count\" data-c=\"intern\"><\/span><\/div>\n<p>Celem nie jest znajomość każdej funkcji języka. Zrozum problem, pisz małe programy, uruchamiaj je, debuguj i testuj oraz wyjaśniaj wynik. Zaznacz to, co już potrafisz.<\/p>\n<p class=\"tip\"><b>Głębiej: Moduły ról<\/b>Osobne moduły dla stażu, poziomu junior i mid ze szczegółowymi lekcjami, uwagami dla poszczególnych języków, przykładami kodu, quizem i egzaminem dla każdej roli. <a href=\"#roles\">Otwórz moduły ról →<\/a><\/p><ul class=\"checks\" data-lv=\"intern\"><\/ul>\n<p class=\"tip\"><b>Realistyczny plan na 3 miesiące<\/b>Tygodnie 1–4: podstawy + jeden język. Tygodnie 5–8: małe projekty z testami i Gitem. Tygodnie 9–12: małe API lub projekt automatyzacji z CI i code review od mentora.<\/p>","junior":"<div class=\"lvhead\"><h2>Oczekiwania wobec juniora<\/h2><span class=\"count\" data-c=\"junior\"><\/span><\/div><ul class=\"checks\" data-lv=\"junior\"><\/ul>","mid":"<div class=\"lvhead\"><h2>Oczekiwania na poziomie mid<\/h2><span class=\"count\" data-c=\"mid\"><\/span><\/div><ul class=\"checks\" data-lv=\"mid\"><\/ul>","depth":"<h2>Jak głęboko uczyć się na każdym etapie<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Etap<\/th><th>Ucz się dogłębnie<\/th><th>Może poczekać<\/th><\/tr><\/thead><tbody>\n<tr class=\"lv-intern\"><td><span class=\"pill\">Stażysta<\/span><\/td><td>Składnia, typy, przepływ sterowania, funkcje, kolekcje, podstawy OOP, błędy, testy, Git, debugowanie.<\/td><td>Zaawansowane metaprogramowanie, wnętrze kompilatora, zaawansowana współbieżność, mikrooptymalizacje.<\/td><\/tr>\n<tr class=\"lv-junior\"><td><span class=\"pill\">Junior<\/span><\/td><td>Idiomy, moduły, zarządzanie zależnościami, testowanie, podstawy asynchroniczności i współbieżności, API, bazy danych, CI/CD.<\/td><td>Niuanse specyfikacji języka i wyspecjalizowane szczegóły środowiska uruchomieniowego, o ile nie są potrzebne w pracy.<\/td><\/tr>\n<tr class=\"lv-mid\"><td><span class=\"pill\">Mid<\/span><\/td><td>Zachowanie środowiska uruchomieniowego, architektura, wydajność, obserwowalność, bezpieczeństwo, współbieżność, kompromisy projektowe.<\/td><td>Znajomość na pamięć każdej funkcji biblioteki; zamiast tego sprawnie korzystaj z dokumentacji.<\/td><\/tr>\n<\/tbody><\/table><\/div>","choose":"<h2>Jak wybrać pierwszy lub kolejny język<\/h2>\n<p>Wybieraj według docelowej pracy, a nie tylko popularności. Filtr celów w sekcji „Najważniejsze języki” korzysta z tej tabeli.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Cel<\/th><th>Rozważ<\/th><th>Dlaczego<\/th><\/tr><\/thead><tbody id=\"t-goals\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Popularne połączenie dwóch języków<\/b>Python (dane, automatyzacja, testowanie) + TypeScript (praca produktowa i webowa) obejmuje dużą część ofert pracy w 2026 roku. Dodaj później Go lub Rusta, jeśli zmierzasz w stronę infrastruktury albo programowania systemowego.<\/p>","qa":"<h2>Z perspektywy QA<\/h2>\n<p>Inżynier QA nie musi zostać pełnoetatowym programistą. Umiejętność programowania poprawia projektowanie testów, automatyzację, testowanie API, debugowanie, analizę logów, pracę z CI/CD i komunikację z programistami.<\/p>\n<ul class=\"checks\" data-lv=\"qa\"><\/ul>\n<p class=\"tip\"><b>ISTQB a języki programowania<\/b>Certyfikaty ISTQB są niezależne od narzędzi i języków: nie uczą ani nie wymagają biegłości w żadnym konkretnym języku programowania. ISTQB skupia się wyłącznie na metodykach, zasadach, terminologii i ramach testowania oprogramowania. Umiejętności programistyczne z tej strony uzupełniają certyfikat, ale nie są jego częścią.<\/p>","path":"<h2>Ustrukturyzowana ścieżka nauki<\/h2>\n<p>Pięć etapów od pierwszego programu do inżyniera na poziomie mid. Każdy etap ma cel, to, czego się nauczyć, co zbudować, oraz kryteria „gotowe, gdy”. Przechodź dalej, gdy spełnisz kryteria, a nie wtedy, gdy każe kalendarz.<\/p>\n<p class=\"tip\"><b>Jak korzystać z tej ścieżki<\/b>Terminy zakładają około 10–15 godzin tygodniowo; osoby uczące się na pełen etat często mogą je skrócić o połowę. Trzymaj się jednego głównego języka do etapu 3. Większość czasu poświęcaj na budowanie i debugowanie, a nie oglądanie tutoriali. Po każdym etapie rozwiąż ponownie odpowiednie quizy i wyczyść listę do powtórki.<\/p>\n<div class=\"phases\" id=\"phases\"><\/div>\n<p class=\"note\"><strong>Jak reszta huba łączy się ze ścieżką:<\/strong> ponumerowane kroki są w sekwencji nauki poniżej, listy kontrolne etapów (staż, junior, mid) mierzą gotowość, tabela projektów podpowiada projekt na każdy poziom, a postępy w SQL biegną równolegle z etapami 2–5.<\/p>","sequence":"<h2>Zalecana kolejność nauki<\/h2>\n<p>Prawdziwa kolejność: każdy krok opiera się na poprzednim, a etapy ustrukturyzowanej ścieżki grupują te kroki. Zaznaczaj kroki, gdy je ukończysz.<\/p><ol class=\"seq\" id=\"seq\"><\/ol>","projects":"<h2>Projekty praktyczne na kolejnych poziomach<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Poziom<\/th><th>Projekt<\/th><th>Pokazywane umiejętności<\/th><\/tr><\/thead><tbody id=\"t-proj\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Wskazówka do portfolio<\/b>Jeden ukończony, przetestowany i udokumentowany projekt z README, odznaką CI i działającym demo jest lepszy niż pięć porzuconych w połowie repozytoriów. Pisz README dla inżyniera rekrutującego: problem, decyzje projektowe, jak uruchomić, znane ograniczenia.<\/p>","mistakes-s":"<h2>Typowe błędy początkujących<\/h2><ul class=\"mistakes\" id=\"mistakes\"><\/ul>","quiz-5":"<div class=\"lvhead\"><h2>Quiz: Etapy kariery i QA<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Pięć pytań o oczekiwania na kolejnych etapach, wybór języka, perspektywę QA i projekty. Wybierz odpowiedź, aby zobaczyć, czy jest poprawna i dlaczego.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Rozwiąż quiz ponownie<\/button>","selfcheck":"<h2>Samosprawdzenie<\/h2>\n<p>Lista kontrolna w stylu QA w formie pytań. Najpierw odpowiedz na głos, potem odsłoń podpowiedź.<\/p><div class=\"quiz\" id=\"quiz\"><\/div>","exam":"<div class=\"lvhead\"><h2>Egzamin końcowy<\/h2><span class=\"count\" id=\"examBest\"><\/span><\/div>\n<p id=\"examIntro\"><\/p>\n<div class=\"quiz\" id=\"examQ\"><\/div>\n<div class=\"examfoot\"><button type=\"button\" class=\"act\" id=\"examSubmit\">Wyślij odpowiedzi<\/button><span class=\"count\" id=\"examMsg\" aria-live=\"polite\"><\/span><\/div>\n<p class=\"note\" id=\"examResult\" aria-live=\"polite\" hidden><\/p>","review":"<div class=\"lvhead\"><h2>Powtórz moje błędy<\/h2><span class=\"count\" id=\"reviewCount\"><\/span><\/div>\n<p>Każde pytanie, na które źle odpowiesz w quizie sekcji lub na egzaminie końcowym, trafia tutaj. Odpowiedz poprawnie, aby usunąć je z listy.<\/p>\n<div class=\"quiz\" id=\"reviewQ\"><\/div><p class=\"note\" id=\"reviewEmpty\" hidden>Nie ma nic do powtórki. Tutaj pojawią się pytania, na które źle odpowiesz w quizach i na egzaminie.<\/p>\n<button type=\"button\" class=\"reset\" id=\"reviewRefresh\">Odśwież listę<\/button>","refs-s":"<h2>Mapa źródeł<\/h2>\n<h3>Oficjalna dokumentacja<\/h3><ul class=\"refs\" id=\"refs\"><\/ul>\n<h3>Praktyka<\/h3><ul class=\"refs\" id=\"practice\"><\/ul>\n<h3>Moduły ról<\/h3>\n<p class=\"tip\"><b>Moduły ról<\/b>Moduły dla stażu, poziomu junior i mid ze szczegółowymi lekcjami, uwagami dla poszczególnych języków, przykładami kodu, quizem i egzaminem dla każdej roli. <a href=\"#roles\">Otwórz moduły ról →<\/a><\/p>\n<p class=\"note\"><strong>Źródła.<\/strong> Oficjalna dokumentacja (Python, MDN, TypeScript, Dev.java, Microsoft Learn, Go, Kotlin) sprawdzona we wrześniu 2026. Dane rynkowe: Stack Overflow Developer Survey 2025, GitHub Octoverse 2025, TIOBE (luty 2026), PYPL oraz zestawienia płac z 2026 roku (Stack Overflow, DICE, amerykańskie statystyki pracy). Traktuj każdy pojedynczy ranking jako jeden sygnał, a nie prawdę objawioną.<\/p>\n<p class=\"bottom\"><strong>Podsumowanie.<\/strong> Naucz się jednego języka na tyle dobrze, by zrozumieć fundamenty, a potem poznawaj kolejne, porównując systemy typów, modele wykonania, modele pamięci, modele współbieżności, narzędzia i ekosystemy. Na ścieżce QA dobrym startem są TypeScript/JavaScript i Python; Java, C#, Go, Rust i C++ pokazują inne modele inżynierskie. W 2026 roku dodaj dwa nawyki: weryfikuj kod wygenerowany przez AI jak kod, którego nie napisałeś, i wybieraj języki na podstawie danych (ankiet, aktywności commitów, lokalnych ofert pracy), a nie mody.<\/p>\n<button class=\"reset\" id=\"reset\" type=\"button\">Wyczyść mój postęp na tym urządzeniu<\/button>"},"data":{"tools":[["Język programowania","Reguły zapisu obliczeń.","Python, JavaScript, Java, C#, C++, Go, Rust, Kotlin"],["Kompilator / interpreter / środowisko uruchomieniowe","Zamienia kod źródłowy w wykonywalne działanie albo go wykonuje.","JVM, środowisko .NET, interpreter Pythona, kompilator Go, kompilator Rusta"],["Biblioteka standardowa","Wbudowane API dostarczane z językiem lub platformą.","Biblioteka standardowa Pythona, Java Collections, .NET BCL"],["Menedżer pakietów","Instaluje zależności i nimi zarządza.","npm, pip, Maven/Gradle, NuGet, Cargo, moduły Go"],["Framework","Struktura wyższego poziomu do budowania aplikacji.","React, Spring, ASP.NET Core, Django, Angular"],["IDE / edytor","Pisanie, nawigacja, debugowanie i refaktoryzacja kodu.","VS Code, IntelliJ IDEA, Visual Studio, PyCharm"],["Narzędzie do budowania","Automatyzuje kompilację, pakowanie, testowanie i budowanie.","Maven, Gradle, MSBuild, Vite, CMake"],["System kontroli wersji","Śledzi zmiany w kodzie i współpracę.","Git, GitHub, GitLab"]],"concepts":[["Składnia","Jak pisze się poprawny kod."],["Semantyka","Co poprawny kod znaczy i co robi."],["Zmienne i wartości","Nazwy/referencje i dane, które przechowują."],["Typy","Jakie wartości można przechowywać i jakie operacje są dozwolone."],["Przepływ sterowania","if/else, pętle, rozgałęzienia, wyjątki, wczesne powroty."],["Funkcje","Wielokrotnego użytku jednostki działania z wejściem i wyjściem."],["Struktury danych","Listy, mapy, zbiory, kolejki, drzewa, grafy."],["Moduły / pakiety","Sposoby porządkowania i ponownego użycia kodu."],["Obsługa błędów","Wyjątki, wartości błędów, typy Result, walidacja, odzyskiwanie."],["Współbieżność","Wątki, zadania asynchroniczne, aktorzy, gorutyny."],["Pamięć","Stos/sterta, alokacja, referencje, własność, GC lub ręczne zarządzanie."],["Wejście/wyjście i sieć","Pliki, procesy, HTTP, gniazda, bazy danych, usługi zewnętrzne."],["Testowanie","Jednostkowe, integracyjne, API, komponentowe, E2E, wydajnościowe, bezpieczeństwa."],["Debugowanie","Logi, breakpointy, ślady i minimalne reprodukcje."]],"types":[["Statyczne czy dynamiczne","Typy sprawdzane podczas kompilacji czy w czasie działania.","Java, C#, Rust, TS (statyczne) kontra Python, JS, Ruby (dynamiczne)"],["Silne czy słabe","Na ile dozwolona jest niejawna konwersja typów.","Python (silne) kontra konwersja typów w JavaScripcie przez <code>==<\/code> (słabe)"],["Nominalne czy strukturalne","Typy dopasowywane po zadeklarowanej nazwie czy po kształcie.","Java/C# (nominalne) kontra interfejsy TypeScriptu/Go (strukturalne)"],["Jawne czy wnioskowane","Typy zapisywane ręcznie czy wywnioskowane przez kompilator.","Haskell/Rust (intensywne wnioskowanie), Java przed wersją 10 (jawne)"],["Nullability","Czy null/None jest częścią każdego typu.","Kotlin, Swift, Rust i TS ze strictNullChecks rozdzielają typy dopuszczające null; Optional w Javie i typing.Optional w Pythonie tylko to przybliżają"]],"memory":[["Odśmiecanie (śledzące)","Java, C#, Go, JavaScript","Najłatwiejsze w użyciu; pauzy i narzut. GC w Go jest dostrojony pod niskie opóźnienia."],["Zliczanie referencji + kolektor cykli","Python, Swift, Rust (Rc/Arc)","Przewidywalne, ale cykle wymagają uwagi (zastrzeżenia dotyczące <code>__del__<\/code> w Pythonie)."],["Własność / borrow checker","Rust","Bez GC, bezpieczeństwo pamięci w czasie kompilacji; trudniejszy start."],["Ręczne zarządzanie","C, C++","Maksymalna kontrola; use-after-free i wycieki to Twoja odpowiedzialność."]],"languages":[["Python","Czytelna składnia, bogata biblioteka standardowa, duży ekosystem.","Funkcje, struktury danych, OOP, typowanie, testowanie, pakowanie.","Automatyzacja, backend, dane, AI/ML, skrypty, QA"],["JavaScript","Natywny język sieci, dojrzałe ekosystemy przeglądarki i serwera.","Asynchroniczność, DOM, moduły, promisy, API.","Frontend, backend w Node.js, narzędzia, automatyzacja"],["TypeScript","JavaScript ze statycznym sprawdzaniem typów.","Typy, zawężanie, typy generyczne, moduły, opcje kompilatora.","Aplikacje webowe, Node.js, duże bazy kodu JS, automatyzacja testów"],["Java","Dojrzały ekosystem JVM, silne typowanie, narzędzia korporacyjne.","OOP, kolekcje, typy generyczne, wyjątki, współbieżność, JVM.","Backend, systemy korporacyjne, ekosystem Androida, usługi"],["C#","Nowoczesny, silnie typowany język dla .NET.","OOP, LINQ, async/await, typy generyczne, środowisko .NET.","Backend, systemy korporacyjne, desktop, chmura, gry w Unity"],["C++","Wydajność, niskopoziomowa kontrola, dojrzały ekosystem systemowy.","Pamięć, RAII, szablony, STL, systemy budowania.","Systemy, urządzenia wbudowane, gry, zadania krytyczne wydajnościowo"],["Go","Prosta składnia, szybka kompilacja, wbudowana współbieżność.","Pakiety, interfejsy, błędy, gorutyny, kanały, testowanie.","Usługi chmurowe, sieci, infrastruktura, narzędzia"],["Rust","Bezpieczeństwo pamięci bez tradycyjnego GC.","Własność, pożyczanie, traity, czasy życia, Result/Option.","Systemy, infrastruktura, oprogramowanie krytyczne dla bezpieczeństwa"],["Kotlin","Zwięzły język na JVM, dobra współpraca z Javą.","Null safety, klasy, kolekcje, korutyny.","Android, backend na JVM, multiplatform"],["Swift","Ekosystem Apple, silne typy i bezpieczeństwo.","Optionale, struktury/klasy, protokoły, współbieżność.","iOS / macOS / watchOS / tvOS"],["PHP","Nastawiony na web, bardzo duża liczba wdrożeń.","Nowoczesny PHP, OOP, Composer, HTTP, testowanie.","Backendy webowe i ekosystemy CMS"],["Ruby","Ekspresyjna składnia, produktywny ekosystem webowy.","Obiekty, bloki, podstawy metaprogramowania, testowanie.","Tworzenie stron, automatyzacja, skrypty"]],"goals":[["Frontend webowy",["JavaScript","TypeScript"],"Ekosystem przeglądarki i nowoczesne narzędzia webowe."],["Automatyzacja QA",["TypeScript","JavaScript","Python","Java","C#"],"Silne ekosystemy automatyzacji i dobra integracja z narzędziami testowymi."],["Usługi backendowe",["Java","C#","Go","Python","TypeScript","Kotlin"],"Dojrzałe frameworki i ekosystemy usług."],["Systemy / wydajność",["C++","Rust","Go"],"Kontrola, przewidywalna wydajność, efektywne programowanie systemowe."],["Dane / AI / automatyzacja",["Python"],"Silne biblioteki i produktywna praca ze skryptami i danymi."],["Android",["Kotlin"],"Nowoczesny ekosystem Androida."],["Platformy Apple",["Swift"],"Natywne programowanie dla Apple."]],"profiles":[["Python","Domyślny język ery AI/ML. Jego użycie według Stack Overflow wzrosło o ~7 punktów w latach 2024→2025 — najbardziej ze wszystkich języków. Nowoczesny Python (3.12+): podpowiedzi typów, narzędzia uv/ruff, asynchroniczność. Nadal najlepszy wybór do automatyzacji QA i pracy z danymi."],["TypeScript","Język dużych projektów webowych: nr 1 pod względem liczby kontrybutorów na GitHubie w 2025 roku. Kluczowe umiejętności zawodowe: typy generyczne, unie z dyskryminatorem i strict mode."],["JavaScript","Nadal najczęściej używany język (~66–69% zawodowych programistów), bo bez przeglądarki się nie obejdzie. Poznaj środowisko uruchomieniowe (pętla zdarzeń, promisy) równie dobrze jak składnię."],["Rust","Najbardziej podziwiany od ~10 lat (~72% chce dalej go używać); liczba użytkowników ponad podwoiła się od 2022 roku. Zacznij od własności; powolny start, ale duża nagroda w systemach i wydajnych backendach."],["Go","Pragmatyczny język chmury (Kubernetes, Docker, większość projektów CNCF). Szybko się go uczy po Pythonie/Javie; wysokie pensje, szeroki popyt, mały język."],["Java / C#","Korporacyjne konie pociągowe z ogromnymi, stabilnymi rynkami pracy. Aktywnie unowocześniane: rekordy, dopasowanie wzorców, wątki wirtualne (Java); top-level statements, Span, minimal APIs (C#)."],["C++","Jego użycie nie rośnie, ale skupia się w cennych dziedzinach (gry, HFT, systemy wbudowane, przeglądarki). Ucz się go, jeśli celujesz właśnie w te obszary."],["Kotlin","Standard na Androidzie i coraz popularniejszy po stronie serwera (Ktor, Spring). Korutyny to kluczowa, wyróżniająca umiejętność."],["Swift","Tylko platformy Apple, ale to dochodowa i stabilna nisza. SwiftUI + async/await to nowoczesna podstawa."]],"salaries":[["Solidity",200,200,"~$200K"],["Rust",155,185,"$155–185K"],["Go",132,155,"$132–155K"],["Scala",150,150,"~$150K"],["Kotlin / Swift",130,135,"$130–135K"],["TypeScript",128,132,"$128–132K"],["Python",125,125,"~$125K"],["Python · ML",150,175,"$150–175K+",1],["Java / C# / JS",110,130,"$110–130K"]],"checklists":{"intern":["Rozumiesz zmienne, podstawowe typy, operatory, warunki, pętle i funkcje.","Używasz podstawowych kolekcji i dobierasz odpowiednią strukturę do prostego problemu.","Czytasz istniejący kod i śledzisz przepływ danych przez funkcje i moduły.","Używasz Gita: clone, branch, status, diff, commit, pull, push, rozwiązujesz proste konflikty.","Korzystasz z IDE/edytora, terminala, formatera i debuggera.","Instalujesz zależności i rozumiesz podstawową konfigurację pakietu lub budowania.","Piszesz podstawowe testy automatyczne; rozumiesz asercje, fikstury/przygotowanie i izolację.","Czytasz komunikaty o błędach i tworzysz minimalny odtwarzalny przykład.","Rozumiesz podstawy HTTP, JSON, REST i terminologię klient/serwer.","Higiena bezpieczeństwa: żadnych sekretów w commitach, walidacja danych wejściowych, różnica między uwierzytelnianiem a autoryzacją."],"junior":["Budujesz małe i średnie funkcje przy ograniczonym nadzorze.","Piszesz idiomatyczny kod zamiast dosłownie tłumaczyć z innego języka.","Poprawnie używasz modułów, interfejsów/abstrakcji, zarządzania zależnościami i konfiguracji.","Piszesz sensowne testy jednostkowe i integracyjne; rozumiesz mocki/stuby i ich kompromisy.","Debugujesz systematycznie za pomocą logów, stosów wywołań, breakpointów, śladów i kontroli wersji.","Przeglądasz pull requesty i wyjaśniasz kompromisy dotyczące czytelności, niezawodności, wydajności i utrzymania.","Rozumiesz podstawy baz danych, transakcje, indeksy i typowe awarie API.","Rozumiesz wykonanie asynchroniczne i współbieżne tam, gdzie ma to znaczenie w danym ekosystemie.","Używasz pipeline'ów CI i bramek jakości: lintowanie, formatowanie, testy, buildy, artefakty.","Rozpoznajesz wstrzykiwanie, złamaną kontrolę dostępu, niezabezpieczone sekrety i niebezpieczne zależności.","Odpowiedzialnie korzystasz z asystentów AI: generujesz, potem weryfikujesz i potrafisz wyjaśnić każdą linię, którą mergujesz."],"mid":["Projektujesz komponenty i interfejsy z jasnymi odpowiedzialnościami i granicami zależności.","Dobierasz struktury danych i algorytmy według złożoności i ograniczeń operacyjnych.","Rozumujesz o wydajności, pamięci, współbieżności, odzyskiwaniu po awariach i obserwowalności.","Rozumiesz zachowanie środowiska uruchomieniowego: GC, maszyny wirtualne/JIT, kompilację, sieć, interakcje z systemem operacyjnym.","Prowadzisz debugowanie awarii zbliżonych do produkcyjnych; oddzielasz objawy od przyczyn źródłowych.","Projektujesz strategie testów, a nie tylko pojedyncze testy.","Zarządzasz zależnościami, zgodnością wersji, migracjami i kompatybilnością wsteczną.","Nazywasz kompromisy architektoniczne wprost; oceniasz odwracalność decyzji i ryzyko operacyjne.","Mentorujesz juniorów przez code review, programowanie w parach i wyjaśnienia techniczne.","Współtworzysz standardy i automatyzację, nie dodając zbędnej złożoności.","Krytycznie oceniasz narzędzia AI: gdzie przyspieszają zespół, a gdzie dokładają pracy przy review lub ryzyka."],"sqlintern":["Piszesz zapytania SELECT z filtrowaniem WHERE i sortowaniem ORDER BY.","Łączysz dwie tabele prostym INNER lub LEFT JOIN.","Wstawiasz, aktualizujesz i usuwasz wiersze (CRUD).","Wyjaśniasz, czym są tabele, wiersze, kolumny, klucze główne i obce."],"sqljunior":["Łączysz kilka tabel i agregujesz dane z GROUP BY i HAVING.","Grupujesz powiązane zmiany w transakcji z COMMIT i ROLLBACK.","Chronisz dane ograniczeniami: NOT NULL, UNIQUE, CHECK i kluczami obcymi.","Dodajesz indeks i sprawdzasz, czy baza danych go używa.","Zmieniasz schemat wyłącznie przez migracje; zarządzasz danymi początkowymi i testowymi.","Zawsze używasz zapytań parametryzowanych."],"sqlmid":["Czytasz plany wykonania i optymalizujesz wolne zapytania.","Dobierasz poziomy izolacji i rozumujesz o anomaliach współbieżności.","Diagnozujesz blokady, oczekiwania i zakleszczenia.","Używasz zaawansowanego SQL: funkcji okna, rekurencyjnych CTE i upsertów.","Modelujesz dane: normalizacja, kiedy denormalizować, ewolucja schematu."],"qa":["Czytasz kod produkcyjny, aby znaleźć zachowania do przetestowania, granice i ścieżki awarii.","Piszesz deterministyczną automatyzację zamiast kruchych skryptów UI.","Generujesz dane testowe programowo, w tym wartości graniczne i niepoprawne.","Weryfikujesz kontrakty API, kody statusu, nagłówki, schematy JSON i zachowanie przy błędach.","Tworzysz funkcje pomocnicze/fikstury, które ograniczają powielanie, nie ukrywając zachowania.","Używasz testów parametryzowanych do klas równoważności i analizy wartości brzegowych.","Badasz zachowanie asynchroniczne i wyścigi w systemach rozproszonych lub wieloużytkownikowych.","Uruchamiasz analizę statyczną, lintery, kontrolę zależności i skanery bezpieczeństwa w CI.","Traktujesz kod testów wygenerowany przez AI jak kod produkcyjny: sprawdzasz, czy asercje testują zachowanie, a nie implementację."]},"sequence":["Podstawy: wartości → zmienne → typy → wyrażenia → przepływ sterowania","Funkcje i dekompozycja: wejścia, wyjścia, efekty uboczne, moduły","Kolekcje i struktury danych","Obsługa błędów i programowanie defensywne","OOP i/lub pojęcia funkcyjne oraz kiedy każde pomaga","Git i praca zespołowa","Testowanie: jednostkowe → integracyjne → API/komponentowe → E2E","HTTP, JSON, REST API, SQL i relacyjne bazy danych","Zarządzanie pakietami i narzędzia do budowania","Debugowanie, logowanie i obserwowalność","Programowanie współbieżne / asynchroniczne","Bezpieczeństwo i zarządzanie zależnościami","Wydajność i profilowanie","Architektura i utrzymywalność"],"projects":[["intern","Kalkulator w konsoli / menedżer zadań","Składnia, funkcje, kolekcje, walidacja, testy"],["intern","Mały klient REST API","HTTP, JSON, obsługa błędów, dane testowe"],["junior","CRUD API + baza danych","Architektura, trwałość danych, walidacja, testy integracyjne"],["junior","Projekt testów automatycznych UI + API","Fikstury, page objects tam, gdzie się przydają, funkcje pomocnicze do API, CI"],["mid","Usługa z uwierzytelnianiem i obserwowalnością","Bezpieczeństwo, logowanie, metryki, obsługa awarii (Junior → Mid)"],["mid","Wiele usług lub system zbliżony do produkcyjnego","Kontrakty, odporność, współbieżność, wydajność, architektura"]],"mistakes":["Uczenie się składni bez nauki debugowania.","Kopiowanie kodu frameworka bez zrozumienia języka pod spodem.","Używanie bibliotek przed zrozumieniem biblioteki standardowej.","Nadużywanie dziedziczenia zamiast prostszej kompozycji.","Ignorowanie obsługi błędów, bo „szczęśliwa ścieżka” działa.","Pisanie testów, które tylko powtarzają szczegóły implementacji.","Traktowanie kodu asynchronicznego tak, jakby zawsze był sekwencyjny.","Commitowanie sekretów lub ufanie kodowi po stronie klienta.","Optymalizowanie wydajności przed jej zmierzeniem.","Uczenie się dokumentacji na pamięć zamiast nauki poruszania się po niej.","Wklejanie kodu wygenerowanego przez AI bez jego zrozumienia.","Gonienie za modnymi językami, zanim fundamenty są solidne."],"selfCheck":[["Czy potrafisz wyjaśnić różnicę między językiem, środowiskiem uruchomieniowym, biblioteką i frameworkiem?","Język = reguły; środowisko uruchomieniowe = to, co wykonuje kod; bibliotekę wywołuje Twój kod; framework wywołuje Twój kod."],["Czy potrafisz uruchomić kod zarówno z IDE, jak i z terminala?","Znaj dokładne polecenie, które IDE wykonuje za Ciebie (python app.py, npm test, dotnet run)."],["Czy potrafisz zinterpretować błąd kompilatora, interpretera lub środowiska uruchomieniowego?","Przeczytaj typ błędu, komunikat, a potem pierwszą ramkę stosu w Twoim własnym kodzie."],["Czy potrafisz napisać małą funkcję i przetestować dane typowe, graniczne i niepoprawne?","Dla wieku 18–65: przetestuj 30, potem 17/18/65/66, potem -1, null i \"abc\"."],["Czy potrafisz śledzić dane przez moduły i wskazać efekty uboczne?","Prześledź jedną wartość od wejścia do wyjścia; zanotuj każdy zapis do pliku, bazy, sieci lub współdzielonego stanu."],["Czy potrafisz wyjaśnić, skąd pochodzą zależności i jak kontroluje się ich wersje?","Rejestr (npm, PyPI, Maven Central), manifest, plik lock, wersjonowanie semantyczne."],["Czy odtwarzasz defekt, zanim spróbujesz go naprawić?","Poprawka, której nie da się sprawdzić na reprodukcji, to zgadywanie."],["Czy potrafisz wyjaśnić, czego dowodzą Twoje testy, a czego nie?","Testy pokazują obecność defektów, a nie ich brak (zasada 1 ISTQB)."],["Czy potrafisz wskazać ryzyko wydajności, niezawodności i bezpieczeństwa w małej aplikacji?","Na przykład zapytania N+1, brak ponowień/timeoutów przy wywołaniach HTTP, niezwalidowane dane trafiające do SQL."],["Czy potrafisz przejrzeć kod wygenerowany przez AI i wyjaśnić, dlaczego jest (lub nie jest) poprawny i bezpieczny?","Sprawdź przypadki brzegowe, ścieżki błędów, wymyślone API, licencję i nowe zależności, a potem uruchom testy."]],"quizzes":{"p1":[["Według zasady „kto kogo wywołuje”, co wywołuje <em>Twój<\/em> kod?",["Biblioteka","Framework","Menedżer pakietów","Kompilator"],1,"Twój kod wywołuje bibliotekę; framework wywołuje Twój kod."],["Zamiana TypeScriptu na JavaScript przed uruchomieniem to przykład…",["Kompilacji z wyprzedzeniem do kodu natywnego","Kodu bajtowego + maszyny wirtualnej","Transpilacji","Czystej interpretacji"],2,"Transpilacja zamienia jeden język źródłowy w inny przed wykonaniem."],["Co tworzy kompilator Javy?",["Natywny kod maszynowy","Kod bajtowy JVM","JavaScript","Nic; Java jest interpretowana ze źródeł"],1,"Java kompiluje się do kodu bajtowego JVM, który JVM wykonuje (i kompiluje JIT-em, gdy kod jest gorący)."],["Gorąca funkcja JavaScriptu nagle zwalnia po otrzymaniu innego typu. Najbardziej prawdopodobna przyczyna?",["Odśmiecanie się zatrzymało","Deoptymalizacja JIT z powrotem do interpretera","Parser uruchomił się ponownie","Wyłączono cache kodu bajtowego"],1,"JIT zoptymalizował kod pod stary typ; złamane założenia powodują deoptymalizację."]],"p2":[["Interfejsy TypeScriptu i Go dopasowują typy po kształcie. To tak zwane…",["Typowanie nominalne","Typowanie strukturalne","Typowanie słabe","Typowanie jawne"],1,"Typowanie strukturalne dopasowuje po kształcie; nominalne (Java, C#) po zadeklarowanej nazwie."],["Konwersja typów przez <code>==<\/code> w JavaScripcie (np. <code>\"1\" == 1<\/code> daje true) to przykład…",["Typowania słabego","Typowania statycznego","Wnioskowania typów","Nullability"],0,"Typowanie słabe dopuszcza wiele niejawnych konwersji; silnie typowany Python nie konwertowałby tu typów."],["Który język napędza Kubernetesa, Dockera i większość projektów CNCF?",["Rust","Go","Kotlin","Ruby"],1,"Go to pragmatyczny język chmury: mały, szybko się kompiluje, ma wbudowaną współbieżność."],["Jak zwykle wygląda wyciek pamięci w języku z odśmiecaniem?",["Zapomniane wywołanie free()","Use-after-free","Niechcący utrzymywane referencje","Przepełnienie stosu"],2,"GC nie zwolni obiektów, do których (przypadkiem) nadal się odwołujesz, np. stale rosnącego cache."]],"p3":[["Co według sygnałów płacowych najbardziej wpływa na premie?",["Popularność","Niedobór specjalistów i waga ryzyka","Wiek języka","Prostota składni"],1,"Rust w infrastrukturze, C++ w HFT i Scala w finansach płacą więcej, bo umiejętności są rzadkie, a stawka wysoka."],["Który język jest nr 1 pod względem kontrybutorów na GitHubie od sierpnia 2025?",["Python","JavaScript","TypeScript","Java"],2,"TypeScript zajął pierwsze miejsce na GitHubie z ~67% wzrostem rok do roku."],["Premia płacowa Pythona w ML wynika z…",["Samego języka","Specjalizacji w AI/ML","Tego, że Python to najnowszy język","Małej konkurencji o oferty z Pythonem"],1,"Premia idzie za specjalizacją, nie za językiem."],["Jaki mniej więcej odsetek programistów używa SQL?",["~10–15%","~30%","~59–61%","~90%"],2,"SQL jest cicho niezbędny: warto go znać bez względu na główny język."]],"p4":[["Jak właściwie traktować kod wygenerowany przez AI?",["Ufać mu, jeśli się kompiluje","Weryfikować go jak kod, którego nie napisałeś","Używać go tylko do testów","Nigdy go nie używać"],1,"Weryfikacja to zawód: testuj go i przeglądaj jak każdy zewnętrzny wkład."],["Gdzie asystenci AI do programowania pomagają najbardziej?",["W niszowych językach","W wewnętrznych frameworkach","W popularnych językach, takich jak Python, TypeScript i Java","W asemblerze"],2,"Duże korpusy treningowe sprawiają, że pomoc jest lepsza w popularnych językach."],["Czy można wkleić klucz API do asystenta, aby zdebugować nieudane żądanie?",["Tak, jeśli czat jest prywatny","Tak, jeśli potem usuniesz czat","Nie, nigdy nie wklejaj sekretów do asystentów","Tylko klucze testowe"],2,"Nigdy nie udostępniaj sekretów asystentom; używaj wartości zastępczych."],["Kto odpowiada za licencję, bezpieczeństwo i poprawność kodu AI, który mergujesz?",["Dostawca AI","Ty","Tylko osoba robiąca review","Nikt"],1,"Wiedz, co dostarczasz: odpowiadasz za wszystko, co mergujesz."]],"p5":[["Który temat stażysta może spokojnie odłożyć na później?",["Debugowanie","Git","Wnętrze kompilatora","Pisanie testów"],2,"Wnętrze kompilatora, zaawansowane metaprogramowanie i mikrooptymalizacje mogą poczekać."],["Które połączenie dwóch języków obejmuje dużą część ofert pracy w 2026 roku?",["C + Perl","Python + TypeScript","Swift + PHP","Rust + Ruby"],1,"Python do danych, automatyzacji i testowania oraz TypeScript do pracy produktowej i webowej."],["Jakiego języka programowania wymaga certyfikat ISTQB?",["Javy","Pythona","JavaScriptu","Żadnego; ISTQB jest niezależny od narzędzi i języków"],3,"ISTQB skupia się na metodykach, zasadach, terminologii i ramach testowania, a nie na języku."],["Pole przyjmuje wiek 18–65. Które wartości testują granice?",["0 i 100","17, 18, 65 i 66","Tylko 18 i 65","30, 40 i 50"],1,"Testuj tuż za i tuż wewnątrz każdej granicy."],["Co tworzy najmocniejsze portfolio?",["Pięć porzuconych w połowie repozytoriów","Jeden ukończony, przetestowany i udokumentowany projekt","Lista języków w CV","Forki tutoriali"],1,"README, odznaka CI i działające demo w jednym ukończonym projekcie wygrywają z ilością."]],"sql":[["SQL najlepiej opisać jako…",["Imperatywny język ogólnego przeznaczenia","Deklaratywny język dziedzinowy dla danych relacyjnych","Język znaczników","Język skryptowy dla przeglądarek"],1,"Opisujesz wynik, którego chcesz; system zarządzania bazą danych decyduje, jak go uzyskać."],["Która klauzula filtruje grupy <em>po<\/em> agregacji?",["WHERE","ORDER BY","HAVING","LIMIT"],2,"WHERE filtruje wiersze przed grupowaniem; HAVING filtruje grupy utworzone przez GROUP BY."],["customers LEFT JOIN orders: co się stanie z klientem bez zamówień?",["Zostanie pominięty","Pojawi się raz, z NULL w kolumnach zamówienia","Zapytanie się nie powiedzie","Pojawi się raz dla każdej tabeli"],1,"LEFT JOIN zachowuje każdy wiersz lewej tabeli i uzupełnia niedopasowane kolumny wartością NULL."],["Jaka jest właściwa obrona przed SQL injection?",["Ręczne escapowanie cudzysłowów","Ukrywanie komunikatów o błędach","Zapytania parametryzowane / prepared statements","Używanie wyłącznie procedur składowanych"],2,"Parametry są przesyłane osobno od tekstu SQL, więc dane wejściowe nigdy nie zmienią struktury zapytania."],["Podczas przelewu drugi UPDATE się nie powiódł. Co powinno się stać?",["COMMIT pierwszej aktualizacji","ROLLBACK, aby żadna zmiana nie została zastosowana","Ponowienie tylko pierwszej aktualizacji","Nic; SQL naprawi to automatycznie"],1,"Atomowość: zmiany transakcji są stosowane razem albo wcale."]]},"exam":[["Co opisuje <em>semantyka<\/em> języka?",["Jak pisze się poprawny kod","Co poprawny kod znaczy i co robi","Jak formatuje się kod","Którego IDE używać"],1,"Składnia to sposób pisania kodu; semantyka to jego znaczenie."],["Które z poniższych to menedżer pakietów?",["React","JVM","Cargo","Git"],2,"Cargo zarządza zależnościami Rusta. React to framework, JVM to środowisko uruchomieniowe, Git to kontrola wersji."],["Dlaczego pierwsze uruchomienie skryptu Pythona jest wolniejsze niż drugie?",["JIT jeszcze się nie rozgrzał","Cache kodu bajtowego (.pyc)","Najpierw działa GC","System operacyjny cache'uje terminal"],1,"CPython zapisuje skompilowany kod bajtowy w plikach .pyc na kolejne uruchomienia."],["Który język domyślnie rozdziela typy dopuszczające i niedopuszczające null?",["Java","Kotlin","JavaScript","C"],1,"Kotlin, Swift i Rust je rozdzielają; Optional w Javie tylko to przybliża."],["Python z mypy lub pyright to przykład…",["Typowania stopniowego","Typowania słabego","Ręcznego zarządzania pamięcią","Transpilacji"],0,"Typowanie stopniowe dodaje statyczne sprawdzanie bez utraty dynamicznej elastyczności."],["Który model pamięci używa zliczania referencji i kolektora cykli?",["Własność w Ruście","Python","Ręczne zarządzanie w C","Śledzący GC w Go"],1,"Python (i Swift) zliczają referencje; cykle wymagają osobnego kolektora."],["Który język jest najbardziej podziwiany od około 10 lat?",["Python","Go","Rust","TypeScript"],2,"Rust: ~72% jego użytkowników chce dalej go używać."],["Do natywnego programowania na Androida hub poleca…",["Swift","Kotlin","PHP","Ruby"],1,"Kotlin to nowoczesny język Androida."],["Na czym skupia się certyfikat ISTQB Foundation Level?",["Biegłość w Javie lub Pythonie","Konkretne narzędzie do automatyzacji","Metodyki, zasady, terminologia i ramy testowania","Pisanie kodu produkcyjnego"],2,"Certyfikaty ISTQB są niezależne od narzędzi i języków."],["„Testy pokazują obecność defektów, a nie ich brak” to…",["Reguła TDD","Zasada testowania nr 1 według ISTQB","Idiom Pythona","Dobra praktyka CI/CD"],1,"Dlatego zielony przebieg testów nigdy nie dowodzi, że oprogramowanie jest wolne od błędów."],["Co zrobić, zanim spróbujesz naprawić defekt?",["Przepisać moduł","Odtworzyć go","Dodać logowanie wszędzie","Poprosić AI o poprawkę"],1,"Poprawka, której nie da się sprawdzić na reprodukcji, to zgadywanie."],["Czego programista na poziomie mid nie musi znać na pamięć?",["Zachowania środowiska uruchomieniowego","Obserwowalności","Każdej funkcji biblioteki","Kompromisów projektowych"],2,"Sprawnie korzystaj z dokumentacji zamiast
