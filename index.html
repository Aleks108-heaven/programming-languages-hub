"https://go.dev/tour/"],["Kotlin","Podstawy składni Kotlina","https://kotlinlang.org/docs/basic-syntax.html"],["Rust","Książka o Ruście","https://doc.rust-lang.org/book/"],["Rust","Rust w przykładach","https://doc.rust-lang.org/rust-by-example/"],["C++","cppreference","https://en.cppreference.com/"],["Swift","Język programowania Swift","https://www.swift.org/documentation/"],["PHP","Podręcznik PHP","https://www.php.net/manual/"],["SQL","Tutorial PostgreSQL","https://www.postgresql.org/docs/current/tutorial.html"]],"practice":[["freeCodeCamp","Darmowe interaktywne kursy i certyfikaty","https://www.freecodecamp.org/learn/"],["The Odin Project","Darmowy program full-stack z projektami","https://www.theodinproject.com/"],["Codewars","Ćwiczenia programistyczne w ponad 50 językach","https://www.codewars.com/"],["Advent of Code","Coroczne łamigłówki, pełne archiwum od 2015 roku","https://adventofcode.com/"],["Go by Example","Programy w Go z objaśnieniami, gotowe do uruchomienia","https://gobyexample.com/"],["Rust by Example","Przykłady w Ruście gotowe do uruchomienia","https://doc.rust-lang.org/rust-by-example/"],["Learn Git Branching","Interaktywna nauka Gita w przeglądarce","https://learngitbranching.js.org/"],["SQLBolt","Interaktywne lekcje SQL","https://sqlbolt.com/"],["PostgreSQL Exercises","Ćwiczenia z SQL na prawdziwym schemacie","https://pgexercises.com/"],["Use The Index, Luke","Indeksy i wydajność SQL","https://use-the-index-luke.com/"],["roadmap.sh","Mapy nauki dla różnych ról","https://roadmap.sh/"]],"path":[{"phase":"Podstawy","lv":"intern","time":"Tygodnie 1–8","goal":"Pisać, uruchamiać i debugować małe programy w jednym języku, zaczynając od pustego pliku.","learn":["Kroki sekwencji 01–04: wartości, typy, przepływ sterowania, funkcje, kolekcje i obsługa błędów","Czytanie komunikatów o błędach i stosów wywołań","Podstawy terminala, edytora, formatera i debuggera"],"practice":["Krótkie codzienne ćwiczenia (Codewars, archiwum Advent of Code)","Kalkulator w konsoli lub menedżer zadań z walidacją danych i kilkoma testami"],"done":["Rozwiązujesz mały problem bez kopiowania rozwiązania","Potrafisz wyjaśnić każdą napisaną linię","Wyniki quizów 1 i 2 na poziomie co najmniej 75%"]},{"phase":"Praca jak programista","lv":"intern","time":"Tygodnie 9–16","goal":"Pracować tak, jak pracuje zespół: kontrola wersji, testy automatyczne, API i baza danych.","learn":["Kroki sekwencji 05–08: podstawy OOP i programowania funkcyjnego, Git, testowanie, HTTP/JSON/REST i SQL","SQL na poziomie stażu: SELECT, filtrowanie, sortowanie, proste JOIN-y, CRUD i pojęcia schematu"],"practice":["Klient REST API zapisujący wyniki w SQLite","Każda zmiana przechodzi przez gałąź i pull request z testami"],"done":["Testy uruchamiają się jednym poleceniem i przechodzą w CI","Piszesz JOIN dwóch tabel bez zaglądania do ściągi","Większość listy kontrolnej stażu jest zaznaczona"]},{"phase":"Budowanie prawdziwych usług","lv":"junior","time":"Miesiące 5–9","goal":"Dostarczać małe i średnie funkcje przy ograniczonym nadzorze.","learn":["Kroki sekwencji 09–10: zarządzanie pakietami, narzędzia do budowania, debugowanie, logowanie","SQL na poziomie juniora: JOIN-y wielu tabel, agregacja, transakcje, ograniczenia, indeksy, migracje i dane testowe","Idiomatyczny kod w głównym języku"],"practice":["CRUD API na prawdziwej bazie danych z migracjami i danymi początkowymi","Testy integracyjne na jednorazowej bazie danych (kontener Dockera lub SQLite)"],"done":["Dajesz konkretne, pomocne uwagi w code review","Zmiany schematu przechodzą przez migracje, nigdy ręcznie","Większość listy kontrolnej juniora jest zaznaczona"]},{"phase":"Myślenie produkcyjne","lv":"junior","time":"Miesiące 10–18","goal":"Utrzymać poprawność oprogramowania pod obciążeniem, podczas awarii i ataków.","learn":["Kroki sekwencji 11–13: współbieżność i asynchroniczność, bezpieczeństwo i zależności, wydajność i profilowanie","SQL na poziomie mid: plany wykonania, optymalizacja zapytań, poziomy izolacji i blokady","Obserwowalność: logi, metryki i ślady"],"practice":["Dodaj do swojej usługi uwierzytelnianie, ograniczanie liczby żądań i metryki","Znajdź i napraw jedno wolne zapytanie na podstawie jego planu wykonania"],"done":["Potrafisz wyjaśnić awarię zbliżoną do produkcyjnej na podstawie logów i śladów","Mierzysz, zanim optymalizujesz","Egzamin końcowy zaliczony (co najmniej 70%)"]},{"phase":"Inżynieria na poziomie mid","lv":"mid","time":"Od 18. miesiąca","goal":"Odpowiadać za komponenty od początku do końca i pomagać innym się rozwijać.","learn":["Krok sekwencji 14: architektura i utrzymywalność","Wnętrze środowiska uruchomieniowego: GC, JIT i modele pamięci","Modelowanie baz danych i kompromisy między projektami","Drugi język o innym modelu (Go, Rust lub Java/C#)"],"practice":["System wielu usług lub zbliżony do produkcyjnego, z kontraktami i odpornością","Poprowadź juniora przez realizację funkcji"],"done":["Nazywasz kompromisy wprost i wybierasz decyzje odwracalne","Większość listy kontrolnej poziomu mid jest zaznaczona","Mógłbyś poprowadzić zajęcia z dowolnej sekcji tego huba"]}],"sqlSkills":[["SELECT, INSERT, UPDATE, DELETE","Cztery instrukcje CRUD: odczyt, tworzenie, zmiana i usuwanie wierszy."],["WHERE, ORDER BY, LIMIT/OFFSET","Filtrowanie wierszy, sortowanie wyników i stronicowanie."],["JOIN-y","Łączenie tabel: INNER zostawia tylko dopasowania; LEFT zachowuje każdy wiersz lewej tabeli; RIGHT, FULL i CROSS JOIN tam, gdzie obsługuje je dialekt."],["Agregacja","COUNT, SUM, AVG, MIN i MAX z GROUP BY; HAVING filtruje grupy po agregacji, WHERE filtruje wiersze przed nią."],["Podzapytania i CTE","Zapytania w zapytaniach; WITH (wyrażenia CTE) nazywa każdy krok, dzięki czemu złożone zapytania pozostają czytelne."],["Schemat i ograniczenia","Tabele, wiersze i kolumny; klucze główne identyfikują wiersze, klucze obce łączą tabele; NOT NULL, UNIQUE i CHECK chronią dane."],["Transakcje i ACID","BEGIN, COMMIT i ROLLBACK grupują zmiany, tak aby zastosować wszystkie albo żadną: atomowość, spójność, izolacja, trwałość."],["Indeksy i plany zapytań","Indeksy przyspieszają wyszukiwanie kosztem zapisów; EXPLAIN pokazuje, jak baza wykona zapytanie."],["Ochrona przed SQL injection","Nigdy nie składaj SQL z danych użytkownika przez konkatenację napisów; używaj zapytań parametryzowanych lub prepared statements."],["Migracje i dane testowe","Wersjonowane zmiany schematu (Flyway, Liquibase, Alembic, EF Core, Prisma), dane początkowe i powtarzalne zestawy testowe."],["Różnice między dialektami","PostgreSQL, MySQL, SQL Server/T-SQL, Oracle i SQLite mają wspólny rdzeń, ale różnią się składnią i możliwościami."]],"dialects":[["PostgreSQL","<code>LIMIT n OFFSET m<\/code>","<code>GENERATED … AS IDENTITY<\/code> lub <code>SERIAL<\/code>","Zgodny ze standardami i bogaty w funkcje: JSONB, tablice, rozbudowane indeksowanie. Częsty wybór dla nowych projektów."],["MySQL","<code>LIMIT n OFFSET m<\/code> lub <code>LIMIT m, n<\/code>","<code>AUTO_INCREMENT<\/code>","Bardzo szeroko stosowany w stosach webowych. InnoDB to silnik transakcyjny; identyfikatory ujmuje się w odwrotne apostrofy."],["SQL Server (T-SQL)","<code>TOP n<\/code> lub <code>OFFSET m ROWS FETCH NEXT n ROWS ONLY<\/code>","<code>IDENTITY(1,1)<\/code>","Ekosystem Microsoftu i .NET. T-SQL dodaje rozszerzenia proceduralne; identyfikatory ujmuje się w nawiasy kwadratowe."],["Oracle","<code>FETCH FIRST n ROWS ONLY<\/code> (12c+), dawniej <code>ROWNUM<\/code>","Kolumny identity (12c+) lub sekwencje","Korporacje i finanse. PL/SQL do kodu proceduralnego; pusty napis jest traktowany jak NULL."],["SQLite","<code>LIMIT n OFFSET m<\/code>","<code>INTEGER PRIMARY KEY<\/code>","Wbudowana baza danych w jednym pliku z elastycznym typowaniem. Idealna do nauki, testów, aplikacji mobilnych i narzędzi."]],"sqlExamples":[{"task":"Filtrowanie i sortowanie","code":"SELECT name, country\nFROM customers\nWHERE country = 'DE'\nORDER BY name\nLIMIT 10;","note":"Opisujesz wynik (klienci z Niemiec, alfabetycznie, pierwszych 10); baza danych decyduje, jak ich znaleźć."},{"task":"JOIN + agregacja","code":"SELECT c.name,\n       COUNT(o.id)             AS order_count,\n       COALESCE(SUM(o.total), 0) AS revenue\nFROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nGROUP BY c.id, c.name\nHAVING COUNT(o.id) >= 2\nORDER BY revenue DESC;","note":"LEFT JOIN zachowuje klientów bez zamówień, a COUNT(o.id) liczy tylko dopasowane zamówienia. Następnie HAVING zostawia klientów z co najmniej dwoma zamówieniami."},{"task":"CTE + podzapytanie","code":"WITH spend AS (\n    SELECT customer_id, SUM(total) AS spent\n    FROM orders\n    WHERE created_at >= '2026-01-01'\n    GROUP BY customer_id\n)\nSELECT c.name, s.spent\nFROM spend s\nJOIN customers c ON c.id = s.customer_id\nWHERE s.spent > (SELECT AVG(spent) FROM spend)\nORDER BY s.spent DESC;","note":"CTE nadaje nazwę wynikowi pośredniemu, dzięki czemu każdy krok czyta się z góry na dół. Podzapytanie porównuje każdego klienta ze średnią."},{"task":"Transakcja","code":"BEGIN;\n\nUPDATE accounts SET balance = balance - 100 WHERE id = 1;\nUPDATE accounts SET balance = balance + 100 WHERE id = 2;\n\n-- If either statement fails, run ROLLBACK instead:\n-- both changes are undone together.\nCOMMIT;","note":"Atomowość w praktyce: przelew nigdy nie może obciążyć jednego konta bez uznania drugiego."},{"task":"Indeks i plan","code":"CREATE INDEX idx_orders_customer ON orders (customer_id);\n\n-- PostgreSQL: runs the query and shows the real plan and timings\nEXPLAIN ANALYZE\nSELECT * FROM orders WHERE customer_id = 42;","note":"Przed dodaniem indeksu spodziewaj się sekwencyjnego skanowania całej tabeli; po nim — skanowania indeksu. Indeksy przyspieszają odczyty, ale zwiększają koszt każdego zapisu."},{"task":"Bezpieczne zapytanie (Python)","code":"# UNSAFE: user input becomes part of the SQL text (SQL injection)\n# cur.execute(f\"SELECT * FROM customers WHERE name = '{name}'\")\n\n# SAFE: the driver sends the value separately from the SQL\ncur.execute(\"SELECT * FROM customers WHERE name = %s\", (name,))\nrow = cur.fetchone()","note":"Składnia symboli zastępczych zależy od sterownika (%s w psycopg i mysql-connector, ? w sqlite3 i JDBC, @name w ADO.NET), ale zasada jest jedna: nigdy nie wklejaj danych wejściowych do SQL."}],"snippets":[{"task":"Suma liczb parzystych","note":"Python i C# czyta się prawie jak zdanie. Go celowo nie ma wbudowanych filter/map, więc zwykła pętla jest idiomatyczna. Łańcuch iteratorów w Ruście kompiluje się do tego samego kodu maszynowego co pętla.","code":{"Python":"nums = [1, 2, 3, 4, 5, 6]\ntotal = sum(n for n in nums if n % 2 == 0)\nprint(total)  # 12","TypeScript":"const nums: number[] = [1, 2, 3, 4, 5, 6];\nconst total = nums.filter((n) => n % 2 === 0).reduce((acc, n) => acc + n, 0);\nconsole.log(total); // 12","Java":"import java.util.List;\n\npublic class Main {\n    public static void main(String[] args) {\n        List<Integer> nums = List.of(1, 2, 3, 4, 5, 6);\n        int total = nums.stream().filter(n -> n % 2 == 0).mapToInt(Integer::intValue).sum();\n        System.out.println(total); // 12\n    }\n}","C#":"int[] nums = [1, 2, 3, 4, 5, 6];\nvar total = nums.Where(n => n % 2 == 0).Sum();\nConsole.WriteLine(total); // 12","Go":"package main\n\nimport \"fmt\"\n\nfunc main() {\n\tnums := []int{1, 2, 3, 4, 5, 6}\n\ttotal := 0\n\tfor _, n := range nums {\n\t\tif n%2 == 0 {\n\t\t\ttotal += n\n\t\t}\n\t}\n\tfmt.Println(total) // 12\n}","Rust":"fn main() {\n    let nums = vec![1, 2, 3, 4, 5, 6];\n    let total: i32 = nums.iter().filter(|&&n| n % 2 == 0).sum();\n    println!(\"{total}\"); // 12\n}"}},{"task":"Walidacja danych w funkcji","note":"Dwa modele błędów: Python, TypeScript, Java i C# rzucają wyjątki; Go zwraca wartość błędu obok wyniku, a Rust zwraca Result, który wywołujący musi obsłużyć. Testy graniczne dla wszystkich sześciu: 17, 18, 65, 66 i -1.","code":{"Python":"def is_working_age(age: int) -> bool:\n    if age < 0:\n        raise ValueError(f\"age must be >= 0, got {age}\")\n    return 18 <= age <= 65\n\nprint(is_working_age(18), is_working_age(66))  # True False","TypeScript":"function isWorkingAge(age: number): boolean {\n  if (!Number.isInteger(age) || age < 0) {\n    throw new RangeError(`age must be a non-negative integer, got ${age}`);\n  }\n  return age >= 18 && age <= 65;\n}\n\nconsole.log(isWorkingAge(18), isWorkingAge(66)); // true false","Java":"public class Main {\n    static boolean isWorkingAge(int age) {\n        if (age < 0) {\n            throw new IllegalArgumentException(\"age must be >= 0, got \" + age);\n        }\n        return age >= 18 && age <= 65;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(isWorkingAge(18) + \" \" + isWorkingAge(66)); // true false\n    }\n}","C#":"static bool IsWorkingAge(int age)\n{\n    ArgumentOutOfRangeException.ThrowIfNegative(age);\n    return age is >= 18 and <= 65;\n}\n\nConsole.WriteLine($\"{IsWorkingAge(18)} {IsWorkingAge(66)}\"); // True False","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n)\n\nfunc isWorkingAge(age int) (bool, error) {\n\tif age < 0 {\n\t\treturn false, errors.New(\"age must be >= 0\")\n\t}\n\treturn age >= 18 && age <= 65, nil\n}\n\nfunc main() {\n\tok, err := isWorkingAge(18)\n\tfmt.Println(ok, err) // true <nil>\n}","Rust":"fn is_working_age(age: i32) -> Result<bool, String> {\n    if age < 0 {\n        return Err(format!(\"age must be >= 0, got {age}\"));\n    }\n    Ok((18..=65).contains(&age))\n}\n\nfn main() {\n    println!(\"{:?}\", is_working_age(18)); // Ok(true)\n    println!(\"{:?}\", is_working_age(-1)); // Err(\"age must be >= 0, got -1\")\n}"}},{"task":"Odczyt pliku i obsługa błędów","note":"Przechwytuj konkretny błąd, którego się spodziewasz (brak pliku), a resztę przepuszczaj dalej. Java wymusza deklarowanie wyjątków sprawdzanych (throws IOException); w Go i Ruście błąd to wartość, którą trzeba obejrzeć, a match w Ruście nie skompiluje się, dopóki nie obsłużysz każdego przypadku.","code":{"Python":"from pathlib import Path\n\ntry:\n    print(Path(\"config.txt\").read_text(encoding=\"utf-8\"))\nexcept FileNotFoundError:\n    print(\"config.txt not found\")","TypeScript":"import { readFile } from \"node:fs/promises\";\n\ntry {\n  console.log(await readFile(\"config.txt\", \"utf8\"));\n} catch (err) {\n  if ((err as NodeJS.ErrnoException).code === \"ENOENT\") {\n    console.log(\"config.txt not found\");\n  } else {\n    throw err;\n  }\n}","Java":"import java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.NoSuchFileException;\nimport java.nio.file.Path;\n\npublic class Main {\n    public static void main(String[] args) throws IOException {\n        try {\n            System.out.println(Files.readString(Path.of(\"config.txt\")));\n        } catch (NoSuchFileException e) {\n            System.out.println(\"config.txt not found\");\n        }\n    }\n}","C#":"try\n{\n    Console.WriteLine(File.ReadAllText(\"config.txt\"));\n}\ncatch (FileNotFoundException)\n{\n    Console.WriteLine(\"config.txt not found\");\n}","Go":"package main\n\nimport (\n\t\"errors\"\n\t\"fmt\"\n\t\"io/fs\"\n\t\"os\"\n)\n\nfunc main() {\n\tdata, err := os.ReadFile(\"config.txt\")\n\tif errors.Is(err, fs.ErrNotExist) {\n\t\tfmt.Println(\"config.txt not found\")\n\t\treturn\n\t}\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\tfmt.Print(string(data))\n}","Rust":"use std::fs;\nuse std::io::ErrorKind;\n\nfn main() {\n    match fs::read_to_string(\"config.txt\") {\n        Ok(text) => println!(\"{text}\"),\n        Err(e) if e.kind() == ErrorKind::NotFound => println!(\"config.txt not found\"),\n        Err(e) => panic!(\"{e}\"),\n    }\n}"}},{"task":"Dwa zadania jednocześnie","note":"Ten sam cel, trzy modele: async/await na pętli zdarzeń (Python, TypeScript, C#), wątki (wątki wirtualne Javy, wątki scoped w Ruście) i gorutyny (Go). Oba zadania czekają jednocześnie, więc całość trwa około 1 sekundy, a nie 2.","code":{"Python":"import asyncio\n\nasync def fetch(name: str, seconds: float) -> str:\n    await asyncio.sleep(seconds)  # stands in for a network call\n    return f\"{name} done\"\n\nasync def main() -> None:\n    results = await asyncio.gather(fetch(\"users\", 1), fetch(\"orders\", 1))\n    print(results)  # ~1 s total, not 2\n\nasyncio.run(main())","TypeScript":"const sleep = (ms: number) => new Promise((resolve) => setTimeout(resolve, ms));\n\nasync function fetchData(name: string, ms: number): Promise<string> {\n  await sleep(ms); // stands in for a network call\n  return `${name} done`;\n}\n\nconst results = await Promise.all([fetchData(\"users\", 1000), fetchData(\"orders\", 1000)]);\nconsole.log(results); // ~1 s total, not 2","Java":"import java.util.concurrent.Executors;\n\npublic class Main {\n    static String fetch(String name) throws InterruptedException {\n        Thread.sleep(1000); // stands in for a network call\n        return name + \" done\";\n    }\n\n    public static void main(String[] args) throws Exception {\n        try (var pool = Executors.newVirtualThreadPerTaskExecutor()) {\n            var users = pool.submit(() -> fetch(\"users\"));\n            var orders = pool.submit(() -> fetch(\"orders\"));\n            System.out.println(users.get() + \", \" + orders.get()); // ~1 s total\n        }\n    }\n}","C#":"static async Task<string> FetchAsync(string name)\n{\n    await Task.Delay(1000); // stands in for a network call\n    return $\"{name} done\";\n}\n\nvar results = await Task.WhenAll(FetchAsync(\"users\"), FetchAsync(\"orders\"));\nConsole.WriteLine(string.Join(\", \", results)); // ~1 s total","Go":"package main\n\nimport (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n\nfunc fetch(name string) string {\n\ttime.Sleep(time.Second) // stands in for a network call\n\treturn name + \" done\"\n}\n\nfunc main() {\n\tnames := []string{\"users\", \"orders\"}\n\tresults := make([]string, len(names))\n\tvar wg sync.WaitGroup\n\tfor i, name := range names {\n\t\twg.Add(1)\n\t\tgo func() {\n\t\t\tdefer wg.Done()\n\t\t\tresults[i] = fetch(name)\n\t\t}()\n\t}\n\twg.Wait()\n\tfmt.Println(results) // ~1 s total\n}","Rust":"use std::thread;\nuse std::time::Duration;\n\nfn fetch(name: &str) -> String {\n    thread::sleep(Duration::from_secs(1)); // stands in for a network call\n    format!(\"{name} done\")\n}\n\nfn main() {\n    let (users, orders) = thread::scope(|s| {\n        let a = s.spawn(|| fetch(\"users\"));\n        let b = s.spawn(|| fetch(\"orders\"));\n        (a.join().unwrap(), b.join().unwrap())\n    });\n    println!(\"{users}, {orders}\"); // ~1 s total\n}"}}]}},"es":{"ui":{"appName":"Programming Languages Hub","viewsAria":"Vistas","viewHub":"Centro de estudio","viewRoles":"Módulos por rol","language":"Idioma","theme":"Tema: {t}","themeAuto":"auto","themeLight":"claro","themeDark":"oscuro","contents":"Contenido","searchPh":"Buscar en el hub…","searchAria":"Buscar en el hub","searchHits":"{n} de {m} secciones coinciden · Enter para ir","searchNone":"Sin resultados","lvIntern":"Prácticas","lvJunior":"Junior","lvMid":"Mid","lvlIntern":"Prácticas","lvlJunior":"Junior","lvlMid":"Mid","ready":"Listo: {d} de {n}","all":"Todos","allLangs":"<strong>Todos los lenguajes ({n}).<\/strong> Elige un objetivo para acotar la lista.","goalAria":"Filtrar por objetivo","check":"Comprobación {i} de {n}","showHint":"Mostrar pista","hideHint":"Ocultar pista","question":"Pregunta {i} de {n}","answers":"Respuestas","answered":"{d} / {n} respondidas","score":"Resultado: {s} / {n}","correct":"Correcto.","wrong":"No exactamente.","submit":"Enviar respuestas","retakeExam":"Repetir examen","answerAll":"Responde primero las {n} preguntas ({d} respondidas)","examResult":"{s} / {n} ({p}%): {v}.","passed":"aprobado","notPassed":"aún no aprobado","passedMsg":"Revisa las respuestas marcadas con ✗ arriba.","failedMsg":"Lee la explicación bajo cada ✗, repasa esas secciones y vuelve a hacer el examen.","best":"Mejor: {s} / {n}","notAttempted":"Sin intentos todavía","examIntro":"{n} preguntas sobre todo el hub. Responde todas y luego envía para ver tu resultado. Para aprobar necesitas un 70% ({p} de {n}). Tu mejor resultado se guarda en este dispositivo.","toReview":"Por repasar: {n}","tileQuizzes":"Cuestionarios por sección","tileNone":"Ninguno completado todavía","tileAvg":"Mejor resultado medio {p}%","tileExam":"Examen final","tilePassed":"Aprobado","tilePassMark":"Nota para aprobar {p}","tileReview":"Preguntas por repasar","tileReviewLink":"Repasar mis errores →","tileNothing":"Ningún fallo por ahora","copy":"Copiar código","copied":"Copiado","copyFailed":"No se pudo copiar","taskAria":"Tarea","langAria":"Lenguaje","sqlAria":"Ejemplo de SQL","phase":"Fase {i}","learn":"Aprender","build":"Construir","doneWhen":"Terminado cuando"},"hero":"<div class=\"label\">Centro de estudio · Prácticas → Junior → Mid · Edición ampliada, septiembre de 2026<\/div>\n<h1>Programming Languages Hub<\/h1>\n<p class=\"lede\">Qué son los lenguajes de programación, cómo el código fuente se convierte en comportamiento, qué ecosistemas importan en 2026, qué lugar ocupa SQL junto a ellos y qué necesitas saber en cada etapa de tu carrera. Fundamentos que se trasladan de un lenguaje a otro, no un único lenguaje memorizado. Sigue el camino estructurado desde tu primer programa hasta ingeniero de nivel mid y ponte a prueba con un cuestionario después de cada parte.<\/p>\n<div class=\"pipe\" aria-label=\"Modelo mental\"><b>intención humana<\/b><i>→<\/i><b>código fuente<\/b><i>→<\/i><b>parser / compilador / entorno de ejecución<\/b><i>→<\/i><b>instrucciones máquina + bibliotecas<\/b><i>→<\/i><b>SO / hardware<\/b><i>→<\/i><b>comportamiento observable<\/b><\/div>\n<div class=\"progress\" id=\"progress\"><\/div>\n<div class=\"stats\" id=\"summary\"><\/div>","sections":{"what":"<h2>¿Qué es un lenguaje de programación?<\/h2>\n<p>Un sistema formal para expresar algoritmos, manipulación de datos, reglas e interacciones con ordenadores. El código sigue la <strong>sintaxis<\/strong> del lenguaje (cómo se escribe código válido) y su <strong>semántica<\/strong> (qué significa). Después, un compilador, un intérprete, una máquina virtual, un entorno de ejecución o una combinación de ellos lo ejecuta o lo traduce a operaciones que el ordenador puede realizar.<\/p>\n<p class=\"tip\"><b>Visión de carrera<\/b>Los lenguajes son la habilidad más visible de un CV, pero las empresas contratan por los fundamentos que un lenguaje transmite: descomponer problemas, disciplina de depuración, pruebas y pensamiento sistémico. Trata el lenguaje como un vehículo para los fundamentos.<\/p>","tools":"<h2>Lenguaje, herramientas y framework<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Elemento<\/th><th>Qué es<\/th><th>Ejemplos<\/th><\/tr><\/thead><tbody id=\"t-tools\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Pregunta de entrevista<\/b>Biblioteca frente a framework es cuestión de «quién llama a quién»: tu código llama a una biblioteca; un framework llama a tu código. Prepárate también para distinguir un lenguaje de su entorno de ejecución.<\/p>","exec":"<h2>Cómo se ejecuta el código<\/h2>\n<div class=\"models\">\n<div class=\"model\"><h3>Compilación anticipada (AOT)<\/h3><p>Se compila a código máquina nativo antes de ejecutarse.<\/p><code>C · C++ · Go · Rust<\/code><\/div>\n<div class=\"model\"><h3>Bytecode + máquina virtual<\/h3><p>Se compila a una forma intermedia que ejecuta un entorno de ejecución.<\/p><code>Java → bytecode de la JVM · C# → .NET IL<\/code><\/div>\n<div class=\"model\"><h3>Interpretado / entorno de ejecución<\/h3><p>Lo ejecuta el entorno de ejecución del lenguaje; los modernos también usan compilación JIT.<\/p><code>Python · JavaScript<\/code><\/div>\n<div class=\"model\"><h3>Transpilación<\/h3><p>Un lenguaje fuente se transforma en otro antes de ejecutarse.<\/p><code>TypeScript → JavaScript<\/code><\/div>\n<\/div>\n<p class=\"note\"><strong>Ten en cuenta:<\/strong> «compilado» e «interpretado» son etiquetas simplificadas. Los entornos de ejecución modernos combinan análisis sintáctico, bytecode, compilación JIT, caché, optimización y ejecución nativa.<\/p>\n<h3>A fondo: qué pasa cuando «ejecutas» Python o JavaScript <span class=\"pill lv-mid\">Mid<\/span><\/h3>\n<ol class=\"steps\">\n<li><span><strong>Análisis léxico y sintáctico:<\/strong> el texto fuente se divide en tokens y se convierte en un árbol de sintaxis abstracta (AST).<\/span><\/li>\n<li><span><strong>Reducción:<\/strong> el AST se convierte en bytecode (CPython <code>.pyc<\/code>; bytecode de V8 Ignition).<\/span><\/li>\n<li><span><strong>Ejecución + perfilado:<\/strong> el intérprete ejecuta el bytecode y registra perfiles de tipos y ramas de los caminos más usados.<\/span><\/li>\n<li><span><strong>Optimización JIT:<\/strong> las funciones más usadas se recompilan a código máquina (V8 TurboFan, JIT de trazas de PyPy). Si se rompen las suposiciones, se produce una <em>desoptimización<\/em> de vuelta al intérprete.<\/span><\/li>\n<li><span><strong>Servicios del entorno:<\/strong> la recolección de basura, las funciones integradas y los límites FFI funcionan junto a tu código.<\/span><\/li>\n<\/ol>\n<p class=\"note\"><strong>Consecuencias:<\/strong> la primera ejecución de código Python es más lenta que la segunda (caché de bytecode); los microbenchmarks pueden engañar (calentamiento del JIT); una desoptimización explica por qué una función se ralentiza de repente tras un cambio de tipo.<\/p>","quiz-1":"<div class=\"lvhead\"><h2>Cuestionario: Fundamentos<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cuatro preguntas sobre qué es un lenguaje, herramientas y frameworks, y cómo se ejecuta el código. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","concepts":"<h2>Conceptos clave que se trasladan<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Concepto<\/th><th>Por qué importa<\/th><\/tr><\/thead><tbody id=\"t-concepts\"><\/tbody><\/table><\/div>\n<h3>A fondo: sistemas de tipos, el concepto más transferible<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Eje<\/th><th>Significado<\/th><th>Ejemplos<\/th><\/tr><\/thead><tbody id=\"t-types\"><\/tbody><\/table><\/div>\n<ul class=\"checks\" style=\"list-style:disc;padding-left:20px;display:grid;gap:8px\">\n<li><strong>El tipado gradual<\/strong> es el compromiso de la industria: <code>typing<\/code> de Python (mypy/pyright) y TypeScript añaden garantías estáticas sin perder la flexibilidad dinámica.<\/li>\n<li><strong>Los genéricos<\/strong> permiten que el código funcione con muchos tipos de forma segura; entender la varianza (in/out, covarianza/contravarianza) es un verdadero diferenciador del nivel mid.<\/li>\n<li><strong>Tipos suma / coincidencia de patrones<\/strong> (enum + match en Rust, clases sealed en Java/Kotlin, uniones discriminadas en TS) hacen que los estados no válidos sean imposibles de representar.<\/li>\n<li><strong>Tipos y pruebas:<\/strong> en los lenguajes estáticos el compilador es una batería de pruebas gratuita y rápida; los lenguajes dinámicos necesitan más pruebas para cubrir lo que detectaría un compilador.<\/li>\n<\/ul>","code":"<h2>La misma tarea en seis lenguajes<\/h2>\n<p>Cuatro tareas cotidianas escritas de forma idiomática en cada lenguaje. Cambia de tarea y luego de lenguaje, y compara cómo cada uno maneja colecciones, errores y concurrencia.<\/p>\n<div class=\"tabs\" id=\"taskTabs\" role=\"group\" aria-label=\"Tarea\"><\/div>\n<div class=\"codehead\"><div class=\"tabs\" id=\"langTabs\" role=\"group\" aria-label=\"Lenguaje\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"copyBtn\">Copiar código<\/button><\/div>\n<div class=\"label\" id=\"snipCap\"><\/div>\n<pre class=\"code\"><code id=\"snippet\"><\/code><\/pre>\n<p class=\"note\" id=\"snipNote\"><\/p>","langs":"<h2>Principales lenguajes y dónde encajan<\/h2>\n<div class=\"tabs\" id=\"goalTabs\" role=\"group\" aria-label=\"Filtrar por objetivo\"><\/div>\n<div class=\"tw\"><table><thead><tr><th>Lenguaje<\/th><th>Puntos fuertes / ecosistema<\/th><th>En qué centrarse<\/th><th>Uso habitual<\/th><\/tr><\/thead><tbody id=\"t-langs\"><\/tbody><\/table><\/div>\n<p class=\"note\" id=\"goalWhy\"><\/p>\n<h3>Perfiles de lenguajes, visión de 2026<\/h3>\n<div class=\"profiles\" id=\"profiles\"><\/div>","memory":"<h2>Modelos de memoria comparados<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Modelo<\/th><th>Lenguajes<\/th><th>Compromiso<\/th><\/tr><\/thead><tbody id=\"t-mem\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Listón del nivel mid:<\/strong> explicar por qué existe el GC, cómo es una fuga en un lenguaje con GC (referencias retenidas sin querer) y cuándo merece la pena la gestión basada en propiedad o la manual.<\/p>","quiz-2":"<div class=\"lvhead\"><h2>Cuestionario: Conceptos, lenguajes y memoria<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cuatro preguntas sobre sistemas de tipos, los principales lenguajes y modelos de memoria. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","sql":"<h2>SQL y programación de bases de datos<\/h2>\n<p>SQL (Structured Query Language) se considera en general un lenguaje de programación, más concretamente un <strong>lenguaje específico de dominio (DSL)<\/strong> para consultar y gestionar bases de datos relacionales. Es <strong>declarativo<\/strong>: los desarrolladores describen la operación o el resultado que desean, y el sistema gestor de bases de datos decide cómo ejecutarlo. SQL complementa a lenguajes de propósito general como Python, Java, C#, JavaScript, Go y Rust.<\/p>\n<p class=\"tip\"><b>Declarativo frente a imperativo<\/b>En Python escribes el bucle que recorre los clientes y se queda con los alemanes. En SQL escribes <code>SELECT name FROM customers WHERE country = 'DE'<\/code>, y el planificador de consultas de la base de datos decide si recorre la tabla o usa un índice. La mayoría de las aplicaciones usan ambos: un lenguaje de propósito general para la lógica y SQL para los datos.<\/p>\n<h3>Habilidades clave de SQL<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Habilidad<\/th><th>Qué saber<\/th><\/tr><\/thead><tbody id=\"t-sql\"><\/tbody><\/table><\/div>\n<h3>Progresión en SQL<\/h3>\n<p>Marca lo que ya sabes hacer. Estos niveles coinciden con las fases del camino de aprendizaje estructurado.<\/p>\n<div class=\"sqllv\">\n<div class=\"lv-intern\"><span class=\"pill\">Prácticas<\/span><ul class=\"checks\" data-lv=\"sqlintern\"><\/ul><\/div>\n<div class=\"lv-junior\"><span class=\"pill\">Junior<\/span><ul class=\"checks\" data-lv=\"sqljunior\"><\/ul><\/div>\n<div class=\"lv-mid\"><span class=\"pill\">Mid<\/span><ul class=\"checks\" data-lv=\"sqlmid\"><\/ul><\/div>\n<\/div>\n<h3>SQL en la práctica<\/h3>\n<p>Los ejemplos usan un pequeño esquema de tienda: <code>customers(id, name, country)<\/code>, <code>orders(id, customer_id, total, created_at)<\/code> y <code>accounts(id, balance)<\/code>. Sintaxis de PostgreSQL.<\/p>\n<div class=\"codehead\"><div class=\"tabs\" id=\"sqlTabs\" role=\"group\" aria-label=\"Ejemplo de SQL\"><\/div><button type=\"button\" class=\"reset noprint\" id=\"sqlCopy\">Copiar código<\/button><\/div>\n<pre class=\"code\"><code id=\"sqlCode\"><\/code><\/pre>\n<p class=\"note\" id=\"sqlNote\"><\/p>\n<h3>Diferencias entre dialectos<\/h3>\n<div class=\"tw\"><table><thead><tr><th>Base de datos<\/th><th>Limitar filas<\/th><th>Clave autoincremental<\/th><th>Notas<\/th><\/tr><\/thead><tbody id=\"t-dialects\"><\/tbody><\/table><\/div>\n<p class=\"note\"><strong>Hábito portable:<\/strong> aprende primero SQL estándar (PostgreSQL o SQLite son buenos sitios para practicar) y consulta los detalles de cada dialecto cuando el trabajo lo requiera. Los JOIN, la agregación y las transacciones funcionan en cualquier base de datos.<\/p>","quiz-sql":"<div class=\"lvhead\"><h2>Cuestionario: SQL y bases de datos<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cinco preguntas sobre la naturaleza de SQL, los JOIN, la agregación, la inyección y las transacciones. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","landscape":"<h2>Popularidad y salarios en 2026<\/h2>\n<p>La popularidad depende de cómo se mida. Cada ranking corona a un ganador distinto.<\/p>\n<div class=\"stats\">\n<div class=\"stat\"><span class=\"label\">Encuestas · uso<\/span><span class=\"v\">JavaScript<\/span><span class=\"w\">~66–69% de los desarrolladores profesionales (Stack Overflow 2025, más de 49 000 encuestados)<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">GitHub · contribuidores<\/span><span class=\"v\">TypeScript<\/span><span class=\"w\">N.º 1 desde agosto de 2025, ~67% de crecimiento interanual<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Búsquedas · TIOBE<\/span><span class=\"v\">Python 21,81%<\/span><span class=\"w\">Febrero de 2026, más de 10 puntos por delante de C, la mayor distancia en 25 años<\/span><\/div>\n<div class=\"stat\"><span class=\"label\">Admiración<\/span><span class=\"v\">Rust ~72%<\/span><span class=\"w\">El más admirado durante ~10 años seguidos<\/span><\/div>\n<\/div>\n<p class=\"tip\"><b>Para quien aprende<\/b>JS/TS dominan el desarrollo de software general; Python domina en datos e IA y es el lenguaje popular que más crece; SQL (lo usa ~59–61% de los desarrolladores) merece la pena aprenderlo sea cual sea tu lenguaje principal.<\/p>\n<h3>Señales salariales · medianas aproximadas en EE. UU., resúmenes de 2026<\/h3>\n<div class=\"sal\" role=\"img\" aria-label=\"Rangos salariales por lenguaje, de 100 000 a 210 000 dólares estadounidenses\">\n<div class=\"axis\"><span><\/span><div><span>$100K<\/span><span>$155K<\/span><span>$210K<\/span><\/div><span><\/span><\/div>\n<div id=\"sal\"><\/div>\n<\/div>\n<p class=\"note\"><strong>El salario depende de la escasez y de lo crítico del riesgo, no de la popularidad.<\/strong> JS y Python tienen más ofertas y también más candidatos; los lenguajes difíciles en ámbitos de alto riesgo (Rust en infraestructura, C++ en HFT y videojuegos, Scala en finanzas) pagan una prima. La prima de Python en ML (barra ámbar) viene de la especialización, no del lenguaje. Las cifras son orientativas y varían mucho según la región.<\/p>","quiz-3":"<div class=\"lvhead\"><h2>Cuestionario: El panorama de 2026<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cuatro preguntas sobre rankings de popularidad y señales salariales. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","ai":"<h2>Desarrollo asistido por IA<\/h2>\n<p>Los asistentes de IA para programar son ya lo habitual: el 82% de los desarrolladores de la encuesta de Stack Overflow de 2025 usó modelos GPT de OpenAI para desarrollar durante el último año. Eso cambia qué conviene aprender.<\/p>\n<div class=\"models\">\n<div class=\"model\"><h3>Los fundamentos importan más<\/h3><p>Los asistentes aceleran a quienes saben revisar, corregir y verificar código, y amplían las carencias de quienes no.<\/p><\/div>\n<div class=\"model\"><h3>Verificar es el oficio<\/h3><p>Describe los requisitos con precisión (entradas, salidas, casos límite, restricciones) y luego prueba el resultado como si fuera código que no escribiste tú.<\/p><\/div>\n<div class=\"model\"><h3>Conoce lo que entregas<\/h3><p>La licencia, la seguridad y la corrección son responsabilidad tuya. Nunca pegues secretos en los asistentes; revisa las dependencias generadas.<\/p><\/div>\n<div class=\"model\"><h3>Sinergia con el lenguaje<\/h3><p>La ayuda es mejor en lenguajes populares (Python, TypeScript, Java) y más floja en lenguajes de nicho y frameworks internos.<\/p><\/div>\n<\/div>\n<p class=\"note\"><strong>Lo que sigue marcando la diferencia:<\/strong> descomponer problemas, la arquitectura, depurar sistemas en producción y el criterio para valorar compromisos.<\/p>","quiz-4":"<div class=\"lvhead\"><h2>Cuestionario: Desarrollo asistido por IA<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cuatro preguntas sobre cómo trabajar con asistentes de IA para programar. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","intern":"<div class=\"lvhead\"><h2>Qué se espera en unas prácticas<\/h2><span class=\"count\" data-c=\"intern\"><\/span><\/div>\n<p>El objetivo no es conocer todas las funciones del lenguaje. Entiende el problema, escribe programas pequeños, ejecútalos, depúralos y pruébalos, y explica el resultado. Marca lo que ya sabes hacer.<\/p>\n<p class=\"tip\"><b>Profundiza: Módulos por rol<\/b>Módulos separados para prácticas, junior y mid con lecciones detalladas, notas por lenguaje, ejemplos de código, un cuestionario y un examen para cada rol. <a href=\"#roles\">Abrir los módulos por rol →<\/a><\/p><ul class=\"checks\" data-lv=\"intern\"><\/ul>\n<p class=\"tip\"><b>Plan realista de 3 meses<\/b>Semanas 1–4: fundamentos + un lenguaje. Semanas 5–8: proyectos pequeños con pruebas y Git. Semanas 9–12: una pequeña API o un proyecto de automatización con CI y revisión de código de un mentor.<\/p>","junior":"<div class=\"lvhead\"><h2>Qué se espera de un junior<\/h2><span class=\"count\" data-c=\"junior\"><\/span><\/div><ul class=\"checks\" data-lv=\"junior\"><\/ul>","mid":"<div class=\"lvhead\"><h2>Qué se espera en el nivel mid<\/h2><span class=\"count\" data-c=\"mid\"><\/span><\/div><ul class=\"checks\" data-lv=\"mid\"><\/ul>","depth":"<h2>Cuánto profundizar en cada etapa<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Etapa<\/th><th>Aprender a fondo<\/th><th>Puede esperar<\/th><\/tr><\/thead><tbody>\n<tr class=\"lv-intern\"><td><span class=\"pill\">Prácticas<\/span><\/td><td>Sintaxis, tipos, control de flujo, funciones, colecciones, POO básica, errores, pruebas, Git, depuración.<\/td><td>Metaprogramación avanzada, funcionamiento interno del compilador, concurrencia avanzada, microoptimizaciones.<\/td><\/tr>\n<tr class=\"lv-junior\"><td><span class=\"pill\">Junior<\/span><\/td><td>Modismos del lenguaje, módulos, gestión de dependencias, pruebas, fundamentos de asincronía y concurrencia, API, bases de datos, CI/CD.<\/td><td>Casos rebuscados de la especificación y detalles internos especializados del entorno de ejecución, salvo que el trabajo los requiera.<\/td><\/tr>\n<tr class=\"lv-mid\"><td><span class=\"pill\">Mid<\/span><\/td><td>Comportamiento del entorno de ejecución, arquitectura, rendimiento, observabilidad, seguridad, concurrencia, compromisos de diseño.<\/td><td>Saberse de memoria cada función de las bibliotecas; mejor aprende a usar bien la documentación.<\/td><\/tr>\n<\/tbody><\/table><\/div>","choose":"<h2>Cómo elegir tu primer o siguiente lenguaje<\/h2>\n<p>Elige según el trabajo al que aspiras, no solo por popularidad. El filtro por objetivo de «Principales lenguajes» usa esta tabla.<\/p>\n<div class=\"tw\"><table><thead><tr><th>Objetivo<\/th><th>Considera<\/th><th>Por qué<\/th><\/tr><\/thead><tbody id=\"t-goals\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Una combinación habitual de dos lenguajes<\/b>Python (datos, automatización, pruebas) + TypeScript (producto y web) cubren una gran parte de las ofertas de empleo de 2026. Añade Go o Rust más adelante si te orientas hacia infraestructura o sistemas.<\/p>","qa":"<h2>Desde la perspectiva de QA<\/h2>\n<p>Un ingeniero de QA no necesita convertirse en desarrollador a tiempo completo. Saber programar mejora el diseño de pruebas, la automatización, las pruebas de API, la depuración, el análisis de logs, el trabajo con CI/CD y la comunicación con los desarrolladores.<\/p>\n<ul class=\"checks\" data-lv=\"qa\"><\/ul>\n<p class=\"tip\"><b>ISTQB y los lenguajes de programación<\/b>Las certificaciones ISTQB son independientes de herramientas y lenguajes: no enseñan ni exigen dominio de ningún lenguaje de programación concreto. ISTQB se centra estrictamente en las metodologías, principios, terminología y marcos de trabajo de las pruebas de software. Las habilidades de programación de esta página complementan una certificación; no forman parte de ella.<\/p>","path":"<h2>Camino de aprendizaje estructurado<\/h2>\n<p>Cinco fases desde tu primer programa hasta ingeniero de nivel mid. Cada fase tiene un objetivo, qué aprender, qué construir y criterios de «terminado cuando». Avanza cuando cumplas los criterios, no cuando lo diga el calendario.<\/p>\n<p class=\"tip\"><b>Cómo usar este camino<\/b>Los plazos suponen unas 10–15 horas por semana; quien estudia a tiempo completo a menudo puede reducirlos a la mitad. Quédate con un único lenguaje principal hasta la fase 3. Dedica la mayor parte del tiempo a construir y depurar, no a ver tutoriales. Después de cada fase, repite los cuestionarios relacionados y vacía tu lista de repaso.<\/p>\n<div class=\"phases\" id=\"phases\"><\/div>\n<p class=\"note\"><strong>Cómo encaja el resto del hub:<\/strong> los pasos numerados están en la secuencia de aprendizaje de abajo, las listas de comprobación por etapa (prácticas, junior, mid) miden tu preparación, la tabla de proyectos propone un proyecto para cada nivel y la progresión en SQL avanza en paralelo a las fases 2–5.<\/p>","sequence":"<h2>Secuencia de aprendizaje recomendada<\/h2>\n<p>Un orden real: cada paso se apoya en el anterior, y las fases del camino estructurado agrupan estos pasos. Marca los pasos a medida que los termines.<\/p><ol class=\"seq\" id=\"seq\"><\/ol>","projects":"<h2>Proyectos prácticos por nivel<\/h2>\n<div class=\"tw\"><table><thead><tr><th>Nivel<\/th><th>Proyecto<\/th><th>Habilidades que demuestra<\/th><\/tr><\/thead><tbody id=\"t-proj\"><\/tbody><\/table><\/div>\n<p class=\"tip\"><b>Consejo para el portfolio<\/b>Un proyecto terminado, probado y documentado, con README, insignia de CI y demo en vivo, vale más que cinco repositorios a medias. Escribe el README pensando en quien contrata: el problema, las decisiones de diseño, cómo ejecutarlo y las limitaciones conocidas.<\/p>","mistakes-s":"<h2>Errores habituales de principiante<\/h2><ul class=\"mistakes\" id=\"mistakes\"><\/ul>","quiz-5":"<div class=\"lvhead\"><h2>Cuestionario: Etapas profesionales y QA<\/h2><span class=\"count score\"><\/span><\/div>\n<p>Cinco preguntas sobre lo que se espera en cada etapa, cómo elegir lenguaje, la visión de QA y los proyectos. Elige una respuesta para ver si es correcta y por qué.<\/p><div class=\"quiz\"><\/div><button type=\"button\" class=\"reset retry\">Repetir cuestionario<\/button>","selfcheck":"<h2>Autoevaluación<\/h2>\n<p>La lista de verificación de estilo QA en forma de preguntas. Responde primero en voz alta y luego muestra la pista.<\/p><div class=\"quiz\" id=\"quiz\"><\/div>","exam":"<div class=\"lvhead\"><h2>Examen final<\/h2><span class=\"count\" id=\"examBest\"><\/span><\/div>\n<p id=\"examIntro\"><\/p>\n<div class=\"quiz\" id=\"examQ\"><\/div>\n<div class=\"examfoot\"><button type=\"button\" class=\"act\" id=\"examSubmit\">Enviar respuestas<\/button><span class=\"count\" id=\"examMsg\" aria-live=\"polite\"><\/span><\/div>\n<p class=\"note\" id=\"examResult\" aria-live=\"polite\" hidden><\/p>","review":"<div class=\"lvhead\"><h2>Repasar mis errores<\/h2><span class=\"count\" id=\"reviewCount\"><\/span><\/div>\n<p>Cada pregunta que falles en un cuestionario de sección o en el examen final aparece aquí. Respóndela bien para quitarla de la lista.<\/p>\n<div class=\"quiz\" id=\"reviewQ\"><\/div><p class=\"note\" id=\"reviewEmpty\" hidden>No hay nada que repasar. Aquí aparecerán las preguntas que falles en los cuestionarios y en el examen.<\/p>\n<button type=\"button\" class=\"reset\" id=\"reviewRefresh\">Actualizar lista<\/button>","refs-s":"<h2>Mapa de referencias<\/h2>\n<h3>Documentación oficial<\/h3><ul class=\"refs\" id=\"refs\"><\/ul>\n<h3>Práctica<\/h3><ul class=\"refs\" id=\"practice\"><\/ul>\n<h3>Módulos por rol<\/h3>\n<p class=\"tip\"><b>Módulos por rol<\/b>Módulos para prácticas, junior y mid con lecciones detalladas, notas por lenguaje, ejemplos de código, un cuestionario y un examen para cada rol. <a href=\"#roles\">Abrir los módulos por rol →<\/a><\/p>\n<p class=\"note\"><strong>Fuentes.<\/strong> Documentación oficial (Python, MDN, TypeScript, Dev.java, Microsoft Learn, Go, Kotlin) consultada en septiembre de 2026. Datos del mercado: Stack Overflow Developer Survey 2025, GitHub Octoverse 2025, TIOBE (febrero de 2026), PYPL y resúmenes salariales de 2026 (Stack Overflow, DICE, estadísticas laborales de EE. UU.). Considera cada ranking como una señal más, no como la verdad absoluta.<\/p>\n<p class=\"bottom\"><strong>En resumen.<\/strong> Aprende un lenguaje lo bastante a fondo como para entender los fundamentos y luego aprende otros comparando sistemas de tipos, modelos de ejecución, modelos de memoria, modelos de concurrencia, herramientas y ecosistemas. Para un camino orientado a QA, TypeScript/JavaScript y Python son buenos puntos de partida; Java, C#, Go, Rust y C++ te muestran otros modelos de ingeniería. En 2026, suma dos hábitos: verifica el código generado por IA como si no lo hubieras escrito tú y deja que los datos (encuestas, actividad de commits, ofertas de empleo locales), y no las modas, guíen tu elección de lenguajes.<\/p>\n<button class=\"reset\" id=\"reset\" type=\"button\">Borrar mi progreso en este dispositivo<\/button>"},"data":{"tools":[["Lenguaje de programación","Reglas para expresar cálculos.","Python, JavaScript, Java, C#, C++, Go, Rust, Kotlin"],["Compilador / intérprete / entorno de ejecución","Convierte el código fuente en comportamiento ejecutable o lo ejecuta.","JVM, entorno de .NET, intérprete de Python, compilador de Go, compilador de Rust"],["Biblioteca estándar","API integradas que vienen con el lenguaje o la plataforma.","Biblioteca estándar de Python, Java Collections, .NET BCL"],["Gestor de paquetes","Instala y gestiona las dependencias.","npm, pip, Maven/Gradle, NuGet, Cargo, módulos de Go"],["Framework","Estructura de alto nivel para crear aplicaciones.","React, Spring, ASP.NET Core, Django, Angular"],["IDE / editor","Escribir, navegar, depurar y refactorizar código.","VS Code, IntelliJ IDEA, Visual Studio, PyCharm"],["Herramienta de compilación","Automatiza la compilación, el empaquetado, las pruebas y la generación de builds.","Maven, Gradle, MSBuild, Vite, CMake"],["Control de versiones","Registra los cambios del código y la colaboración.","Git, GitHub, GitLab"]],"concepts":[["Sintaxis","Cómo se escribe código válido."],["Semántica","Qué significa y qué hace el código válido."],["Variables y valores","Nombres/referencias y los datos que contienen."],["Tipos","Qué valores se pueden guardar y qué operaciones son válidas."],["Control de flujo","if/else, bucles, ramificaciones, excepciones, retornos anticipados."],["Funciones","Unidades reutilizables de comportamiento con entradas y salidas."],["Estructuras de datos","Listas, mapas, conjuntos, colas, árboles, grafos."],["Módulos / paquetes","Formas de organizar y reutilizar el código."],["Gestión de errores","Excepciones, valores de error, tipos Result, validación, recuperación."],["Concurrencia","Hilos, tareas asíncronas, actores, goroutines."],["Memoria","Pila/heap, asignación, referencias, propiedad, GC o gestión manual."],["E/S y redes","Archivos, procesos, HTTP, sockets, bases de datos, servicios externos."],["Pruebas","Unitarias, de integración, de API, de componentes, E2E, de rendimiento, de seguridad."],["Depuración","Logs, puntos de interrupción, trazas y reproducciones mínimas."]],"types":[["Estático frente a dinámico","Tipos comprobados al compilar o durante la ejecución.","Java, C#, Rust, TS (estático) frente a Python, JS, Ruby (dinámico)"],["Fuerte frente a débil","Cuánta conversión implícita de tipos se permite.","Python (fuerte) frente a la conversión de <code>==<\/code> en JavaScript (débil)"],["Nominal frente a estructural","Tipos que coinciden por el nombre declarado o por su forma.","Java/C# (nominal) frente a interfaces de TypeScript/Go (estructural)"],["Explícito frente a inferido","Tipos escritos a mano o deducidos por el compilador.","Haskell/Rust (mucha inferencia), Java antes de la versión 10 (explícito)"],["Nulabilidad","Si null/None forma parte de todos los tipos.","Kotlin, Swift, Rust y TS con strictNullChecks separan los tipos anulables; Optional en Java y typing.Optional en Python solo se aproximan"]],"memory":[["Recolección de basura (por trazado)","Java, C#, Go, JavaScript","El más fácil de usar; pausas y sobrecarga. El GC de Go está ajustado para baja latencia."],["Conteo de referencias + recolector de ciclos","Python, Swift, Rust (Rc/Arc)","Predecible, pero los ciclos requieren cuidado (salvedades de <code>__del__<\/code> en Python)."],["Propiedad / borrow checker","Rust","Sin GC, seguridad de memoria en tiempo de compilación; curva de aprendizaje más pronunciada."],["Gestión manual","C, C++","Máximo control; el use-after-free y las fugas son tu responsabilidad."]],"languages":[["Python","Sintaxis legible, amplia biblioteca estándar, gran ecosistema.","Funciones, estructuras de datos, POO, tipado, pruebas, empaquetado.","Automatización, backend, datos, IA/ML, scripts, QA"],["JavaScript","Nativo de la web, ecosistemas maduros en navegador y servidor.","Asincronía, DOM, módulos, promesas, API.","Frontend, backend con Node.js, herramientas, automatización"],["TypeScript","JavaScript con comprobación estática de tipos.","Tipos, estrechamiento, genéricos, módulos, opciones del compilador.","Aplicaciones web, Node.js, grandes bases de código JS, automatización de pruebas"],["Java","Ecosistema maduro de la JVM, tipado fuerte, herramientas empresariales.","POO, colecciones, genéricos, excepciones, concurrencia, JVM.","Backend, empresa, ecosistema Android, servicios"],["C#","Lenguaje moderno con tipado fuerte para .NET.","POO, LINQ, async/await, genéricos, entorno de .NET.","Backend, empresa, escritorio, nube, juegos con Unity"],["C++","Rendimiento, control de bajo nivel, ecosistema de sistemas maduro.","Memoria, RAII, plantillas, STL, sistemas de compilación.","Sistemas, embebidos, videojuegos, software crítico en rendimiento"],["Go","Sintaxis sencilla, compilación rápida, concurrencia integrada.","Paquetes, interfaces, errores, goroutines, canales, pruebas.","Servicios en la nube, redes, infraestructura, herramientas"],["Rust","Seguridad de memoria sin GC tradicional.","Propiedad, préstamos, traits, tiempos de vida, Result/Option.","Sistemas, infraestructura, software sensible a la seguridad"],["Kotlin","Lenguaje conciso para la JVM, gran interoperabilidad con Java.","Seguridad frente a null, clases, colecciones, corrutinas.","Android, backend en la JVM, multiplataforma"],["Swift","Ecosistema de Apple, tipos y seguridad sólidos.","Optionals, structs/clases, protocolos, concurrencia.","iOS / macOS / watchOS / tvOS"],["PHP","Orientado a la web, enorme base instalada.","PHP moderno, POO, Composer, HTTP, pruebas.","Backends web y ecosistemas de CMS"],["Ruby","Sintaxis expresiva, ecosistema web productivo.","Objetos, bloques, fundamentos de metaprogramación, pruebas.","Desarrollo web, automatización, scripts"]],"goals":[["Frontend web",["JavaScript","TypeScript"],"Ecosistema del navegador y herramientas web modernas."],["Automatización de QA",["TypeScript","JavaScript","Python","Java","C#"],"Ecosistemas de automatización sólidos y buena integración con herramientas de pruebas."],["Servicios backend",["Java","C#","Go","Python","TypeScript","Kotlin"],"Frameworks maduros y ecosistemas de servicios."],["Sistemas / rendimiento",["C++","Rust","Go"],"Control, rendimiento predecible, desarrollo de sistemas eficiente."],["Datos / IA / automatización",["Python"],"Bibliotecas potentes y trabajo productivo con scripts y datos."],["Android",["Kotlin"],"Ecosistema Android moderno."],["Plataformas de Apple",["Swift"],"Desarrollo nativo para Apple."]],"profiles":[["Python","El lenguaje por defecto de la era de la IA y el ML. Su uso en Stack Overflow creció ~7 puntos entre 2024 y 2025, el mayor salto de todos los lenguajes. Python moderno (3.12+): anotaciones de tipo, herramientas uv/ruff, asincronía. Sigue siendo la mejor opción para automatización de QA y trabajo con datos."],["TypeScript","El lenguaje del desarrollo web a gran escala: n.º 1 en contribuidores de GitHub en 2025. Habilidades profesionales clave: genéricos, uniones discriminadas y strict mode."],["JavaScript","Sigue siendo el lenguaje más usado (~66–69% de los desarrolladores profesionales) porque el navegador es innegociable. Aprende el entorno de ejecución (bucle de eventos, promesas) tan a fondo como la sintaxis."],["Rust","El más admirado durante ~10 años (~72% quiere seguir usándolo); su base de usuarios se ha más que duplicado desde 2022. Empieza por la propiedad; arranque lento, gran recompensa en sistemas y backends de alto rendimiento."],["Go","El lenguaje pragmático de la nube (Kubernetes, Docker, la mayoría de los proyectos de la CNCF). Rápido de aprender viniendo de Python/Java; buenos salarios, demanda amplia, lenguaje pequeño."],["Java / C#","Caballos de batalla empresariales con mercados laborales enormes y estables. En constante modernización: records, coincidencia de patrones, hilos virtuales (Java); top-level statements, Span, minimal APIs (C#)."],["C++","Su uso no crece, pero se concentra en ámbitos de alto valor (videojuegos, HFT, embebidos, navegadores). Apréndelo si apuntas a esos ámbitos."],["Kotlin","El estándar en Android y cada vez más presente en el servidor (Ktor, Spring). Las corrutinas son la habilidad clave que marca la diferencia."],["Swift","Solo plataformas de Apple, pero es un nicho rentable y estable. SwiftUI + async/await es el núcleo moderno."]],"salaries":[["Solidity",200,200,"~$200K"],["Rust",155,185,"$155–185K"],["Go",132,155,"$132–155K"],["Scala",150,150,"~$150K"],["Kotlin / Swift",130,135,"$130–135K"],["TypeScript",128,132,"$128–132K"],["Python",125,125,"~$125K"],["Python · ML",150,175,"$150–175K+",1],["Java / C# / JS",110,130,"$110–130K"]],"checklists":{"intern":["Entiendes variables, tipos habituales, operadores, condiciones, bucles y funciones.","Usas colecciones básicas y eliges una estructura adecuada para un problema sencillo.","Lees código existente y sigues el flujo de datos a través de funciones y módulos.","Usas Git: clone, branch, status, diff, commit, pull, push y resuelves conflictos sencillos.","Usas un IDE/editor, el terminal, un formateador y un depurador.","Instalas dependencias y entiendes una configuración básica de paquete o compilación.","Escribes pruebas automatizadas básicas; entiendes aserciones, fixtures/preparación y aislamiento.","Lees mensajes de error y creas un ejemplo mínimo reproducible.","Entiendes los fundamentos de HTTP, JSON y REST y la terminología cliente/servidor.","Higiene de seguridad: ningún secreto en los commits, validación de entradas, diferencia entre autenticación y autorización."],"junior":["Desarrollas funcionalidades pequeñas y medianas con supervisión limitada.","Escribes código idiomático en lugar de traducir literalmente desde otro lenguaje.","Usas correctamente módulos, interfaces/abstracciones, la gestión de dependencias y la configuración.","Escribes pruebas unitarias y de integración con sentido; entiendes los mocks/stubs y sus compromisos.","Depuras de forma sistemática con logs, trazas de pila, puntos de interrupción, trazas y control de versiones.","Revisas pull requests y explicas los compromisos de legibilidad, fiabilidad, rendimiento y mantenibilidad.","Entiendes los fundamentos de bases de datos, las transacciones, los índices y los fallos habituales de las API.","Entiendes la ejecución asíncrona y concurrente allí donde importa en tu ecosistema.","Usas pipelines de CI y controles de calidad: lint, formato, pruebas, builds, artefactos.","Reconoces la inyección, el control de acceso roto, los secretos inseguros y las dependencias peligrosas.","Usas los asistentes de IA con responsabilidad: generas, luego verificas y sabes explicar cada línea que fusionas."],"mid":["Diseñas componentes e interfaces con responsabilidades y límites de dependencias claros.","Eliges estructuras de datos y algoritmos según su complejidad y las restricciones operativas.","Razonas sobre rendimiento, memoria, concurrencia, recuperación ante fallos y observabilidad.","Entiendes el comportamiento en tiempo de ejecución: GC, máquinas virtuales/JIT, compilación, redes, interacción con el sistema operativo.","Lideras la depuración de fallos similares a los de producción; separas los síntomas de las causas raíz.","Diseñas estrategias de pruebas, no solo pruebas individuales.","Gestionas dependencias, compatibilidad de versiones, migraciones y compatibilidad con versiones anteriores.","Haces explícitos los compromisos de arquitectura; evalúas la reversibilidad y el riesgo operativo.","Mentorizas a juniors mediante revisiones de código, programación en pareja y explicaciones técnicas.","Contribuyes a estándares y automatización sin añadir complejidad innecesaria.","Evalúas las herramientas de IA con espíritu crítico: dónde aceleran al equipo y dónde añaden carga de revisión o riesgo."],"sqlintern":["Escribes consultas SELECT con filtrado WHERE y ordenación ORDER BY.","Unes dos tablas con un INNER o LEFT JOIN sencillo.","Insertas, actualizas y eliminas filas (CRUD).","Explicas qué son las tablas, filas, columnas, claves primarias y claves foráneas."],"sqljunior":["Unes varias tablas y agregas con GROUP BY y HAVING.","Agrupas cambios relacionados en una transacción con COMMIT y ROLLBACK.","Proteges los datos con restricciones: NOT NULL, UNIQUE, CHECK y claves foráneas.","Añades un índice y confirmas que la base de datos lo usa.","Cambias el esquema solo mediante migraciones; gestionas los datos iniciales y de prueba.","Usas consultas parametrizadas siempre."],"sqlmid":["Lees planes de ejecución y optimizas consultas lentas.","Eliges niveles de aislamiento y razonas sobre las anomalías de concurrencia.","Diagnosticas bloqueos, esperas e interbloqueos.","Usas SQL avanzado: funciones de ventana, CTE recursivas y upserts.","Modelas datos: normalización, cuándo desnormalizar y evolución del esquema."],"qa":["Lees el código de producción para encontrar comportamientos que probar, límites y caminos de fallo.","Escribes automatización determinista en lugar de scripts de UI frágiles.","Generas datos de prueba por programa, incluidos valores límite y no válidos.","Validas contratos de API, códigos de estado, cabeceras, esquemas JSON y el comportamiento ante errores.","Creas utilidades/fixtures que reducen la duplicación sin ocultar el comportamiento.","Usas pruebas parametrizadas para clases de equivalencia y análisis de valores límite.","Investigas el comportamiento asíncrono y las condiciones de carrera en sistemas distribuidos o multiusuario.","Ejecutas análisis estático, linters, comprobación de dependencias y escáneres de seguridad en CI.","Tratas el código de pruebas generado por IA como código de producto: compruebas que las aserciones verifican el comportamiento, no la implementación."]},"sequence":["Fundamentos: valores → variables → tipos → expresiones → control de flujo","Funciones y descomposición: entradas, salidas, efectos secundarios, módulos","Colecciones y estructuras de datos","Gestión de errores y programación defensiva","POO y/o conceptos funcionales, y cuándo ayuda cada uno","Git y desarrollo colaborativo","Pruebas: unitarias → de integración → de API/componentes → E2E","HTTP, JSON, API REST, SQL y bases de datos relacionales","Gestión de paquetes y herramientas de compilación","Depuración, logs y observabilidad","Programación concurrente / asíncrona","Seguridad y gestión de dependencias","Rendimiento y perfilado","Arquitectura y mantenibilidad"],"projects":[["intern","Calculadora de consola / gestor de tareas","Sintaxis, funciones, colecciones, validación, pruebas"],["intern","Pequeño cliente de API REST","HTTP, JSON, gestión de errores, datos de prueba"],["junior","API CRUD + base de datos","Arquitectura, persistencia, validación, pruebas de integración"],["junior","Proyecto de pruebas automatizadas de UI + API","Fixtures, page objects donde sean útiles, utilidades para la API, CI"],["mid","Servicio con autenticación y observabilidad","Seguridad, logs, métricas, gestión de fallos (Junior → Mid)"],["mid","Varios servicios o sistema similar a producción","Contratos, resiliencia, concurrencia, rendimiento, arquitectura"]],"mistakes":["Aprender sintaxis sin aprender a depurar.","Copiar código de un framework sin entender el lenguaje que hay debajo.","Usar bibliotecas antes de entender la biblioteca estándar.","Abusar de la herencia en lugar de una composición más sencilla.","Ignorar la gestión de errores porque el camino feliz funciona.","Escribir pruebas que solo repiten detalles de la implementación.","Tratar el código asíncrono como si siempre fuera secuencial.","Subir secretos al repositorio o confiar en el código del lado del cliente.","Optimizar el rendimiento antes de medirlo.","Memorizar la documentación en lugar de aprender a moverse por ella.","Pegar código generado por IA sin entenderlo.","Perseguir lenguajes de moda antes de tener sólidos los fundamentos."],"selfCheck":[["¿Sabes explicar la diferencia entre un lenguaje, un entorno de ejecución, una biblioteca y un framework?","Lenguaje = reglas; entorno de ejecución = lo que ejecuta el código; a la biblioteca la llama tu código; el framework llama a tu código."],["¿Sabes ejecutar código tanto desde un IDE como desde el terminal?","Conoce el comando exacto que el IDE ejecuta por ti (python app.py, npm test, dotnet run)."],["¿Sabes interpretar un error del compilador, el intérprete o el entorno de ejecución?","Lee el tipo de error, el mensaje y luego el primer marco de la pila que apunta a tu propio código."],["¿Sabes escribir una función pequeña y probar entradas normales, límite y no válidas?","Para una edad de 18–65: prueba 30, luego 17/18/65/66 y después -1, null y \"abc\"."],["¿Sabes seguir los datos a través de los módulos e identificar efectos secundarios?","Sigue un valor desde la entrada hasta la salida; anota cada escritura en un archivo, una BD, la red o un estado compartido."],["¿Sabes explicar de dónde vienen las dependencias y cómo se controlan las versiones?","Registro (npm, PyPI, Maven Central), manifiesto, archivo lock, versionado semántico."],["¿Reproduces un defecto antes de intentar corregirlo?","Una corrección que no puedes verificar contra una reproducción es una suposición."],["¿Sabes explicar qué demuestran tus pruebas y qué no?","Las pruebas muestran la presencia de defectos, no su ausencia (principio 1 de ISTQB)."],["¿Sabes nombrar un riesgo de rendimiento, de fiabilidad y de seguridad en una aplicación pequeña?","Por ejemplo, consultas N+1, ausencia de reintentos/timeouts en las llamadas HTTP, entradas sin validar que llegan a SQL."],["¿Sabes revisar código generado por IA y explicar por qué es (o no es) correcto y seguro?","Comprueba los casos límite, los caminos de error, las API inventadas, la licencia y las nuevas dependencias; después ejecuta las pruebas."]],"quizzes":{"p1":[["Según la regla de «quién llama a quién», ¿qué llama a <em>tu<\/em> código?",["Una biblioteca","Un framework","Un gestor de paquetes","Un compilador"],1,"Tu código llama a una biblioteca; un framework llama a tu código."],["Que TypeScript se convierta en JavaScript antes de ejecutarse es un ejemplo de…",["Compilación anticipada a código nativo","Bytecode + máquina virtual","Transpilación","Interpretación pura"],2,"La transpilación convierte un lenguaje fuente en otro antes de la ejecución."],["¿Qué produce el compilador de Java?",["Código máquina nativo","Bytecode de la JVM","JavaScript","Nada; Java se interpreta desde el código fuente"],1,"Java se compila a bytecode de la JVM, que la JVM ejecuta (y compila con JIT cuando el código se usa mucho)."],["Una función de JavaScript muy usada se ralentiza de repente tras recibir un tipo distinto. ¿La causa más probable?",["Se detuvo la recolección de basura","Una desoptimización del JIT de vuelta al intérprete","El parser se volvió a ejecutar","Se desactivó la caché de bytecode"],1,"El JIT optimizó para el tipo anterior; las suposiciones rotas provocan una desoptimización."]],"p2":[["Las interfaces de TypeScript y Go hacen coincidir los tipos por su forma. Esto se llama…",["Tipado nominal","Tipado estructural","Tipado débil","Tipado explícito"],1,"El tipado estructural compara la forma; el nominal (Java, C#) compara el nombre declarado."],["La conversión de tipos de <code>==<\/code> en JavaScript (por ejemplo, <code>\"1\" == 1<\/code> es true) es un ejemplo de…",["Tipado débil","Tipado estático","Inferencia de tipos","Nulabilidad"],0,"El tipado débil permite mucha conversión implícita; Python, con tipado fuerte, no convertiría aquí."],["¿Qué lenguaje impulsa Kubernetes, Docker y la mayoría de los proyectos de la CNCF?",["Rust","Go","Kotlin","Ruby"],1,"Go es el lenguaje pragmático de la nube: pequeño, compila rápido y trae concurrencia integrada."],["¿Cómo suele ser una fuga de memoria en un lenguaje con recolector de basura?",["Olvidar llamar a free()","Use-after-free","Referencias retenidas sin querer","Desbordamiento de pila"],2,"El GC no puede liberar objetos a los que todavía haces referencia (sin querer), como una caché que no deja de crecer."]],"p3":[["Según las señales salariales, ¿qué impulsa principalmente las primas?",["La popularidad","La escasez y lo crítico del riesgo","La antigüedad del lenguaje","La sencillez de la sintaxis"],1,"Rust en infraestructura, C++ en HFT y Scala en finanzas pagan más porque las habilidades escasean y hay mucho en juego."],["¿Qué lenguaje es el n.º 1 en contribuidores de GitHub desde agosto de 2025?",["Python","JavaScript","TypeScript","Java"],2,"TypeScript alcanzó el primer puesto en GitHub con ~67% de crecimiento interanual."],["La prima salarial de Python en ML se debe a…",["El propio lenguaje","La especialización en IA/ML","Que Python es el lenguaje más nuevo","La poca competencia por los empleos de Python"],1,"La prima sigue a la especialización, no al lenguaje."],["¿Qué proporción aproximada de desarrolladores usa SQL?",["~10–15%","~30%","~59–61%","~90%"],2,"SQL es discretamente imprescindible: merece la pena aprenderlo sea cual sea tu lenguaje principal."]],"p4":[["¿Cuál es la forma correcta de tratar el código generado por IA?",["Confiar en él si compila","Verificarlo como código que no escribiste tú","Usarlo solo para pruebas","No usarlo nunca"],1,"Verificar es el oficio: pruébalo y revísalo como cualquier contribución externa."],["¿Dónde ayudan más los asistentes de IA para programar?",["En lenguajes de nicho","En frameworks internos","En lenguajes populares como Python, TypeScript y Java","En ensamblador"],2,"Los grandes corpus de entrenamiento hacen que la ayuda sea mejor en los lenguajes populares."],["¿Se puede pegar una clave de API en un asistente para depurar una petición que falla?",["Sí, si el chat es privado","Sí, si luego borras el chat","No, nunca pegues secretos en los asistentes","Solo claves de prueba"],2,"Nunca compartas secretos con los asistentes; usa valores ficticios."],["¿Quién es responsable de la licencia, la seguridad y la corrección del código de IA que fusionas?",["El proveedor de IA","Tú","Solo quien revisa el código","Nadie"],1,"Conoce lo que entregas: eres responsable de todo lo que fusionas."]],"p5":[["¿Qué tema puede dejar para más adelante alguien en prácticas?",["La depuración","Git","El funcionamiento interno del compilador","Escribir pruebas"],2,"El funcionamiento interno del compilador, la metaprogramación avanzada y las microoptimizaciones pueden esperar."],["¿Qué combinación de dos lenguajes cubre una gran parte de las ofertas de empleo de 2026?",["C + Perl","Python + TypeScript","Swift + PHP","Rust + Ruby"],1,"Python para datos, automatización y pruebas, y TypeScript para producto y web."],["¿Qué lenguaje de programación exige una certificación ISTQB?",["Java","Python","JavaScript","Ninguno; ISTQB es independiente de herramientas y lenguajes"],3,"ISTQB se centra en metodologías, principios, terminología y marcos de trabajo de pruebas, no en un lenguaje."],["Un campo acepta edades de 18 a 65. ¿Qué valores prueban los límites?",["0 y 100","17, 18, 65 y 66","Solo 18 y 65","30, 40 y 50"],1,"Prueba justo por fuera y justo por dentro de cada límite."],["¿Qué hace más sólido un portfolio?",["Cinco repositorios a medias","Un proyecto terminado, probado y documentado","Una lista de lenguajes en el CV","Forks de tutoriales"],1,"Un README, una insignia de CI y una demo en vivo en un proyecto completo valen más que la cantidad."]],"sql":[["SQL se describe mejor como…",["Un lenguaje imperativo de propósito general","Un lenguaje declarativo específico de dominio para datos relacionales","Un lenguaje de marcado","Un lenguaje de scripts para navegadores"],1,"Describes el resultado que quieres; el sistema gestor de bases de datos decide cómo obtenerlo."],["¿Qué cláusula filtra grupos <em>después<\/em> de la agregación?",["WHERE","ORDER BY","HAVING","LIMIT"],2,"WHERE filtra filas antes de agrupar; HAVING filtra los grupos que produce GROUP BY."],["customers LEFT JOIN orders: ¿qué pasa con un cliente sin pedidos?",["Se descarta","Aparece una vez, con NULL en las columnas del pedido","La consulta falla","Aparece una vez por cada tabla"],1,"LEFT JOIN conserva todas las filas de la tabla izquierda y rellena con NULL las columnas sin coincidencia."],["¿Cuál es la defensa correcta contra la inyección SQL?",["Escapar las comillas a mano","Ocultar los mensajes de error","Consultas parametrizadas / prepared statements","Usar solo procedimientos almacenados"],2,"Los parámetros se envían por separado del texto SQL, así que la l desarrollo nativo en Android, el hub recomienda…",["Swift","Kotlin","PHP","Ruby"],1,"Kotlin es el lenguaje moderno de Android."],["¿En qué se centra la certificación ISTQB Foundation Level?",["Dominio de Java o Python","Una herramienta de automatización concreta","Metodologías, principios, terminología y marcos de trabajo de pruebas","Escribir código de producción"],2,"Las certificaciones ISTQB son independientes de herramientas y lenguajes."],["«Las pruebas muestran la presencia de defectos, no su ausencia» es…",["Una regla de TDD","El principio de pruebas 1 de ISTQB","Un modismo de Python","Una buena práctica de CI/CD"],1,"Por eso una ejecución de pruebas en verde nunca demuestra que el software esté libre de errores."],["¿Qué debes hacer antes de intentar corregir un defecto?",["Reescribir el módulo","Reproducirlo","Añadir logs por todas partes","Pedir a una IA que lo corrija"],1,"Una corrección que no puedes verificar contra una reproducción es una suposición."],["¿Qué puede ahorrarse memorizar un desarrollador de nivel mid?",["El comportamiento en tiempo de ejecución","La observabilidad","Cada función de las bibliotecas","Los compromisos de diseño"],2,"Usa bien la documentación en lugar de memorizar API."],["En el plan de 3 meses para prácticas, ¿qué ocurre en las semanas 9–12?",["Aprender un segundo lenguaje","Una pequeña API o proyecto de automatización con CI y revisión de un mentor","Estudiar el funcionamiento interno del compilador","Preparar una entrevista para nivel mid"],1,"Semanas 1–4: fundamentos; 5–8: proyectos pequeños; 9–12: una API o un proyecto de automatización."],["¿Cuál es un riesgo de fiabilidad en una aplicación pequeña?",["Usar un bucle for","No tener reintentos ni timeouts en las llamadas HTTP","Usar anotaciones de tipo","Escribir un README"],1,"Sin timeouts ni reintentos, una dependencia lenta se convierte en una caída del servicio."],["¿Qué dos hábitos añade el resumen final para 2026?",["Aprender más frameworks; saltarse las pruebas","Verificar el código generado por IA; elegir lenguajes según los datos y no según las modas","Memorizar la sintaxis; evitar la IA","Seguir el índice TIOBE; empezar por C"],1,"Trata el código de IA como código que no escribiste tú y elige lenguajes según encuestas, actividad de commits y ofertas de empleo."],["¿Qué hace una clave foránea?",["Acelera todas las consultas","Enlaza una fila con una fila de otra tabla y garantiza que esta exista","Cifra una columna","Hace que una columna sea única en toda la base de datos"],1,"Las claves foráneas garantizan la integridad referencial entre tablas."],["¿Qué te muestra EXPLAIN?",["El resultado de la consulta","Cómo planea la base de datos ejecutar la consulta","El esquema de la tabla","Quién ejecutó la consulta"],1,"Los planes de ejecución muestran recorridos, uniones y uso de índices: el punto de partida para optimizar consultas."]],"docs":[["Python","Tutorial oficial de Python","https://docs.python.org/3/tutorial/index.html"],["JavaScript","Guía de JavaScript de MDN","https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide"],["TypeScript","Manual de TypeScript","https://www.typescriptlang.org/docs/handbook/intro"],["Java","Dev.java: aprende Java","https://dev.java/learn/"],["C#","Microsoft Learn: un recorrido por C#","https://learn.microsoft.com/en-us/dotnet/csharp/tour-of-csharp/overview"],["Go","Documentación de Go","https://go.dev/doc/"],["Go","Un tour de Go","https://go.dev/tour/"],["Kotlin","Sintaxis básica de Kotlin","https://kotlinlang.org/docs/basic-syntax.html"],["Rust","El libro de Rust","https://doc.rust-lang.org/book/"],["Rust","Rust con ejemplos","https://doc.rust-lang.org/rust-by-example/"],["C++","cppreference","https://en.cppreference.com/"],["Swift","El lenguaje de programación Swift","https://www.swift.org/documentation/"],["PHP","Manual de PHP","https://www.php.net/manual/"],["SQL","Tutorial de PostgreSQL","https://www.postgresql.org/docs/current/tutorial.html"]],"practice":[["freeCodeCamp","Cursos
