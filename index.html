туальній машині?","a":["C","Java","Bash","HTML"],"c":1,"e":"Java компілюється в байт-код JVM, який виконує JVM."},{"q":"У JavaScript 1 == \"1\" дає true, а 1 === \"1\" — false. Чому?","a":["=== швидший","=== порівнює без приведення типів","== працює лише для рядків","Це баг браузера"],"c":1,"e":"== перетворює типи перед порівнянням; === вимагає однакового типу."},{"q":"Що має бути в .gitignore для проєкту Node.js?","a":["package.json","node_modules/","src/","README.md"],"c":1,"e":"Залежності встановлюються заново з package.json і lock-файлу, тож node_modules/ ніколи не комітять."},{"q":"Яке повідомлення коміту найкраще?","a":["fix","changes","Fix off-by-one error in page count","asdf"],"c":2,"e":"Добре повідомлення кількома словами пояснює, що змінилося і чому."},{"q":"Що таке крок Act у схемі Arrange-Act-Assert?","a":["Створення тестових даних","Виклик коду, що тестується","Перевірка результату","Видалення тесту"],"c":1,"e":"Arrange готує, Act виконує код, Assert перевіряє результат."},{"q":"Що означає HTTP-статус 500?","a":["Помилку клієнта","Переадресацію","Помилку сервера","Успіх"],"c":2,"e":"Коди 5xx означають, що сервер зазнав збою під час обробки коректного запиту."},{"q":"Що таке JSON?","a":["База даних","Текстовий формат для об'єктів, масивів, рядків, чисел, булевих значень і null","Мова програмування","Веб-сервер"],"c":1,"e":"JSON — найпоширеніший формат даних для веб-API."},{"q":"Що повертає INNER JOIN?","a":["Усі рядки з обох таблиць","Лише рядки, що мають відповідність в обох таблицях","Лише рядки з лівої таблиці","Рядки без відповідності"],"c":1,"e":"INNER JOIN залишає лише рядки, для яких виконується умова з'єднання."},{"q":"Що таке мінімальний відтворюваний приклад?","a":["Увесь проєкт в архіві","Найменший код, який досі показує проблему","Скриншот помилки","Список усього, що ви пробували"],"c":1,"e":"Зменшення проблеми часто розкриває причину й полегшує допомогу іншим."},{"q":"Ви застрягли вже на 45 хвилин. Що робити?","a":["Мовчки пробувати весь день","Записати, що ви пробували, і поставити конкретне запитання","Взятися за інше завдання, нікому не сказавши","Скопіювати випадкову відповідь з інтернету"],"c":1,"e":"Команди цінують стажистів, які спочатку пробують самі, а потім ставлять точні запитання."},{"q":"Яка структура в Python найкраща для пошуку значень за ключем?","a":["list","tuple","dict","string"],"c":2,"e":"dict дає швидкий пошук за ключем; пошук у списку перевіряє кожен елемент."},{"q":"Який файл налаштовує Maven-проєкт у Java?","a":["package.json","pom.xml","Cargo.toml","go.mod"],"c":1,"e":"Maven читає pom.xml; Gradle використовує build.gradle(.kts)."}]},{"id":"junior","name":"Junior","summary":"Відповідайте за функції від початку до кінця, пишіть ідіоматичний код і почніть робити рев'ю.","overview":"Junior-розробник реалізує невеликі та середні функції з обмеженим наглядом. Крок уперед порівняно зі стажуванням — відповідальність: ви ведете задачу від нечіткої вимоги до змерженого, протестованого й розгорнутого коду та починаєте переглядати роботу інших. Ви пишете код так, як це заведено у спільноті вашої мови, і розумієте базу даних, CI-конвеєр і найпоширеніші ризики безпеки.","expect":["Реалізовувати функції від початку до кінця з обмеженим наглядом","Писати ідіоматичний код основною мовою команди","Писати інтеграційні тести й розважливо використовувати моки","Переглядати pull request і пояснювати компроміси","Працювати з базами даних: JOIN, транзакції та міграції","Лагодити зламану CI-збірку й розпізнавати типові проблеми безпеки"],"tasks":["Реалізувати API-ендпоінт із валідацією, збереженням даних і тестами","Додати міграцію бази даних і початкові дані","Знайти й виправити нестабільний (flaky) тест","Зробити рев'ю pull request колеги","Дослідити баг за логами та звітами про помилки"],"lessons":[{"title":"Ідіоматичний код","body":"Ідіоматичний код виглядає так, як очікують досвідчені розробники цієї мови, тому його легше читати, переглядати й підтримувати. Використовуйте офіційний форматер і лінтер, дотримуйтеся угод про іменування й звертайтеся до стандартної бібліотеки, перш ніж додавати залежності. Переклад з іншої мови рядок за рядком — найпоширеніша помилка junior-розробників.","langs":[["Python","PEP 8, comprehensions, менеджери контексту (with), dataclasses і підказки типів; ruff для лінтингу й форматування."],["TypeScript","strict mode, union-типи, async/await і звуження типів; ESLint і Prettier."],["Java","Records для даних, streams там, де вони зрозуміліші за цикли, Optional для значень, яких може не бути."],["C#","LINQ, async на всіх рівнях, nullable reference types і records."],["Go","gofmt, помилки як значення, малі інтерфейси; приймайте інтерфейси, повертайте структури."],["Rust","clippy, Result з оператором ?, запозичення замість клонування."]],"code":"junior-idiomatic"},{"title":"Модулі, залежності та конфігурація","body":"Менеджер пакетів встановлює залежності; lock-файл фіксує точні версії, щоб кожна машина й кожен запуск CI отримували однакову збірку. Семантичне версіонування (MAJOR.MINOR.PATCH) підказує, чи може оновлення щось зламати. Тримайте конфігурацію, як-от URL і облікові дані, поза кодом: читайте її із середовища, щоб та сама збірка працювала в будь-якому середовищі.","langs":[["Python","pyproject.toml з uv або pip; завжди працюйте у віртуальному середовищі."],["Node.js","package.json разом із package-lock.json або pnpm-lock.yaml."],["Java","Maven (pom.xml) або Gradle (build.gradle.kts)."],[".NET","Пакети NuGet, оголошені у файлі .csproj."],["Go","go.mod і go.sum."],["Rust","Cargo.toml і Cargo.lock."]],"code":"junior-config"},{"title":"Тестування поза юніт-тестами","body":"Піраміда тестування: багато швидких юніт-тестів, менше інтеграційних, кілька наскрізних (end-to-end). Інтеграційні тести працюють зі справжніми залежностями, наприклад базою даних у контейнері. Мокайте те, що вам не належить (сторонні API, email), але не власні запити до бази. Нестабільні тести зазвичай виникають через таймінги, порядок тестів або спільний стан; виправляйте їх, а не перезапускайте.","langs":[["Python","Фікстури pytest і Testcontainers для справжнього PostgreSQL."],["TypeScript","Vitest із MSW для мокання HTTP на мережевому рівні."],["Java","JUnit 5, Mockito і Testcontainers."],["C#","xUnit з Moq або NSubstitute; WebApplicationFactory для тестів API."],["Go","Табличні тести: один тест, багато випадків у slice."]],"code":"junior-table-test"},{"title":"Бази даних у коді застосунку","body":"Робота junior-розробника щодня торкається бази даних: JOIN кількох таблиць, агрегація з GROUP BY, транзакції, обмеження та індекси. Змінюйте схему лише через версіоновані міграції. ORM економлять час, але можуть приховати проблему N+1: один запит для списку плюс ще один на кожен елемент. Завжди передавайте значення як параметри, ніколи не складайте SQL-рядки.","langs":[["Python","SQLAlchemy для запитів, Alembic для міграцій."],["TypeScript","Prisma або Drizzle, кожен із власними міграціями."],["Java","JPA/Hibernate з Flyway або Liquibase."],["C#","Entity Framework Core та його міграції."],["Go","database/sql з sqlc або pgx для PostgreSQL."]],"code":"junior-nplus1"},{"title":"Основи асинхронності та конкурентності","body":"Розрізняйте роботу, обмежену введенням-виведенням (очікування мережі чи диска), і роботу, обмежену процесором (обчислення). Асинхронний код дає змогу одному потоку чекати на багато операцій вводу-виводу одночасно; для справжніх паралельних обчислень потрібні потоки або процеси. Спільний змінний стан між конкурентними задачами спричиняє стани гонитви, а блокування циклу подій зупиняє всі запити.","langs":[["Python","asyncio для вводу-виводу. У стандартних збірках GIL обмежує паралелізм CPU в потоках, тож для важких обчислень використовуйте multiprocessing."],["JavaScript","Однопотоковий цикл подій: використовуйте await для вводу-виводу, запускайте незалежні виклики через Promise.all і ніколи не блокуйте довгими циклами CPU."],["Java","Потоки, ExecutorService і віртуальні потоки (Java 21) для багатьох конкурентних задач вводу-виводу."],["C#","Task і async/await; уникайте .Result і .Wait(), які можуть спричинити взаємоблокування."],["Go","Горутини й канали; sync.WaitGroup, щоб дочекатися групи горутин."]],"code":"junior-async"},{"title":"Рев'ю коду, CI/CD та основи безпеки","body":"Під час рев'ю спочатку перевіряйте правильність, потім тести, потім читабельність; власні pull request робіть невеликими й сфокусованими. CI-конвеєр запускає лінтер, тести й збірку на кожен push, а червону збірку лагодять раніше за все інше. Знайте основи OWASP Top 10: ін'єкції, порушений контроль доступу, витік секретів і вразливі залежності.","langs":[["Python","pip-audit для вразливих пакетів."],["Node.js","npm audit; Dependabot або Renovate для оновлень."],["Java","OWASP Dependency-Check або аналоги для Gradle/Maven."],[".NET","dotnet list package --vulnerable."],["Go / Rust","govulncheck і cargo audit."]],"code":"junior-ci"}],"langContext":[["Python","Django або FastAPI, PostgreSQL і pytest: бекенд, дані та автоматизація."],["TypeScript","React або Next.js на фронтенді, Node.js або NestJS на бекенді."],["Java / Kotlin","Spring Boot, JPA і JUnit: великі корпоративні та банківські системи."],["C#","ASP.NET Core, Entity Framework Core і xUnit: корпоративні рішення, хмара та Azure."],["Go","net/http або chi, sqlc і пакет testing: хмарні сервіси та інструменти."],["SQL","JOIN, агрегація, транзакції та міграції стають щоденною роботою."]],"quiz":[{"q":"Для чого потрібен lock-файл?","a":["Щоб шифрувати код","Для відтворюваних встановлень із точними версіями залежностей","Щоб заборонити іншим розробникам редагування","Щоб пришвидшити компілятор"],"c":1,"e":"Lock-файл фіксує версію кожної залежності, тож усі машини встановлюють те саме."},{"q":"Що таке проблема N+1 запитів?","a":["Відсутній індекс","Один запит для списку плюс по одному додатковому запиту на кожен елемент","Синтаксична помилка в SQL","Забагато з'єднань із базою"],"c":1,"e":"Виправляйте її через JOIN або жадібне завантаження (eager loading) в ORM."},{"q":"Сервер Node.js виконує 5-секундний цикл CPU в обробнику запиту. Що станеться?","a":["Сповільниться лише цей запит","Усі запити зупиняться, доки цикл не завершиться","Node автоматично перенесе його в інший потік","Нічого"],"c":1,"e":"Цикл подій однопотоковий; якщо його заблокувати, чекають усі."},{"q":"Коли мок — правильний вибір?","a":["Для власних запитів до бази даних","Для сторонніх сервісів, які ви не контролюєте","Для кожної залежності","Ніколи"],"c":1,"e":"Мокайте те, що вам не належить; власний код роботи з базою тестуйте на справжній базі."},{"q":"Оновлення з 2.3.1 до 3.0.0. Що каже семантичне версіонування?","a":["Лише виправлення багів","Нові можливості, повна сумісність","Можливі несумісні зміни","Нічого"],"c":2,"e":"Зміна MAJOR-версії сигналізує про несумісні зміни API."},{"q":"Навіщо обгортати два пов'язані UPDATE у транзакцію?","a":["Щоб пришвидшити їх","Щоб вони застосувалися разом або не застосувалися зовсім","Щоб оминути обмеження","Щоб не знадобився індекс"],"c":1,"e":"Атомарність запобігає напівзавершеним змінам."}],"exam":[{"q":"Як ідіоматично в Python гарантувати, що файл буде закрито?","a":["Викликати close() наприкінці","with open(...) as f:","Покластися на збирач сміття","try/except без finally"],"c":1,"e":"Менеджер контексту закриває файл навіть у разі винятку."},{"q":"Чим ризиковано викликати .Result на незавершеному Task у C#?","a":["Нічим","Це може заблокувати потік і спричинити взаємоблокування","Це пришвидшує код","Це перетворює задачу на потік"],"c":1,"e":"Використовуйте async/await на всіх рівнях замість блокування."},{"q":"Яка в Go угода щодо помилок?","a":["Кидати винятки","Повертати помилку останнім значенням і перевіряти її","Залогувати й проігнорувати","Використовувати лише глобальні змінні помилок"],"c":1,"e":"if err != nil { ... } — ідіоматичний Go."},{"q":"Для чого призначений Optional у Java?","a":["Для полів класу","Для параметрів методів","Для значень, що повертаються й можуть бути відсутні","Для колекцій"],"c":2,"e":"Optional сигналізує «результату може не бути»; він не призначений для полів чи параметрів."},{"q":"Яка поширена причина нестабільних тестів?","a":["Забагато перевірок","Таймінги, порядок тестів або спільний стан","Описові назви тестів","Використання тестового фреймворку"],"c":1,"e":"Робіть тести незалежними й детермінованими."},{"q":"Який pull request добрий?","a":["Якомога більший","Невеликий, з однією метою та чітким описом","Опис не потрібен","Багато непов'язаних змін разом"],"c":1,"e":"Невеликі PR отримують швидше й якісніше рев'ю."},{"q":"Де має зберігатися пароль до продакшн-бази даних?","a":["У коді","У змінній середовища або менеджері секретів","В історії Git","У коментарі"],"c":1,"e":"Конфігурація надходить із середовища; секрети ніколи не потрапляють у репозиторій."},{"q":"Який компроміс додавання індексу?","a":["Швидше читання, повільніший запис і більше місця","Швидший запис, повільніше читання","Жодного компромісу","Він видаляє дублікати рядків"],"c":0,"e":"Індексуйте стовпці, за якими фільтруєте та з'єднуєте, а не все підряд."},{"q":"Що є прикладом порушеного контролю доступу?","a":["Повільна сторінка","Користувач бачить чуже замовлення, змінивши ID в URL","Одрук у підписі","Відсутній favicon"],"c":1,"e":"Кожен запит має перевіряти, чи може користувач отримати доступ саме до цього ресурсу."},{"q":"Коли CI-конвеєр має падати?","a":["Ніколи","Коли не проходять лінтер або тести","Лише по п'ятницях","Коли збірка надто швидка"],"c":1,"e":"Непройдена перевірка не дає зламаному коду потрапити в основну гілку."},{"q":"Що таке міграція бази даних?","a":["Перехід до іншого постачальника СУБД","Версіонована, переглянута зміна схеми, що однаково застосовується в кожному середовищі","Резервна копія","Ручне редагування SQL у продакшні"],"c":1,"e":"Міграції роблять зміни схеми повторюваними й придатними до рев'ю."},{"q":"Що рекомендує піраміда тестування?","a":["Переважно наскрізні тести","Багато юніт-тестів, менше інтеграційних, кілька наскрізних","Лише ручні тести","Порівну кожного виду"],"c":1,"e":"Швидкі, сфокусовані тести внизу; кілька повільних і широких угорі."}]},{"id":"mid","name":"Middle","summary":"Відповідайте за компоненти, робіть компроміси явними, підтримуйте надійні системи та розвивайте інших.","overview":"Middle-розробник відповідає за компоненти, а не лише за задачі. Ви проєктуєте інтерфейси та моделі даних, робите компроміси явними, підтримуєте системи спостережуваними й надійними в продакшні та підтягуєте рівень людей навколо. Ви розумієте, як середовище виконання вашої мови поводиться під навантаженням, і можете обрати правильний інструмент або правильну другу мову для задачі.","expect":["Проєктувати компоненти з чіткими обов'язками та межами","Міркувати про продуктивність, пам'ять і конкурентність","Керувати налагодженням інцидентів у продакшні","Проєктувати стратегії тестування, а не лише окремі тести","Моделювати дані й оптимізувати запити","Менторити junior-розробників і оцінювати інструменти, зокрема AI-асистентів"],"tasks":["Спроєктувати новий модуль чи сервіс і зафіксувати рішення в ADR","Керувати розслідуванням інциденту та blameless-постмортемом","Зменшити затримку p95 повільного ендпоінта","Спланувати зворотно сумісну міграцію схеми","Супроводжувати junior-розробника під час роботи над функцією"],"lessons":[{"title":"Проєктування та архітектура","body":"Добрий дизайн тримає пов'язаний код разом (висока зв'язність) і має мало залежностей, спрямованих усередину (слабке зчеплення). Розміщуйте інтерфейси на межах — сховище, обмін повідомленнями, зовнішні API, — щоб деталі можна було змінювати без переписування ядра. Фіксуйте важливі рішення в Architecture Decision Records, віддавайте перевагу оборотним рішенням і починайте з модульного моноліту, перш ніж ділити систему на сервіси.","langs":[["Java / C#","Явні інтерфейси з впровадженням залежностей (Spring, ASP.NET Core DI)."],["Go","Малі інтерфейси, які визначає споживач; реалізації задовольняють їх неявно."],["Rust","Трейти для поведінки; володіння змушує мати чіткий потік даних у дизайні."],["TypeScript","Структурні типи й чіткі межі модулів; уникайте циклічних імпортів."],["Python","typing.Protocol описує інтерфейси з качиною типізацією, які перевіряють тайп-чекери."]],"code":"mid-interface"},{"title":"Поведінка середовища виконання та пам'ять","body":"На рівні Middle ви пояснюєте, чому сервіс сповільнюється або вичерпує пам'ять. У мовах зі збирачем сміття витоки — це об'єкти, на які досі є посилання: необмежені кеші, забуті обробники подій, статичні колекції. Висока частота виділення пам'яті створює тиск на GC. JIT-компіляторам потрібен прогрів, тож проводьте бенчмарки реалістично. Використовуйте профілювальники та дампи купи замість здогадок.","langs":[["Java","G1 — GC за замовчуванням, ZGC орієнтований на низькі затримки; дампи купи та JDK Flight Recorder."],["C#","Режими GC у .NET; dotnet-counters і dotnet-trace."],["Go","Конкурентний GC, що налаштовується через GOGC і GOMEMLIMIT; pprof для CPU та пам'яті."],["Python","Підрахунок посилань плюс збирач циклів; tracemalloc і py-spy."],["JavaScript","Знімки купи V8 у DevTools; замикання можуть утримувати великі об'єкти."],["Rust","Без GC; пам'ять звільняється через володіння. Стежте за циклами посилань Rc."]],"code":"mid-leak"},{"title":"Конкурентність і узгодженість","body":"Розподілені системи відмовляють частково, тож проєктуйте з урахуванням цього: задавайте тайм-аути для кожного виклику, повторюйте спроби з експоненційною затримкою та джитером і робіть операції ідемпотентними, щоб повторна спроба не списала з клієнта гроші двічі. Розумійте стани гонитви та взаємоблокування, рівні ізоляції в базі даних, а також оптимістичне й песимістичне блокування.","langs":[["Java","java.util.concurrent і віртуальні потоки; CompletableFuture для композиції."],["C#","async із SemaphoreSlim і Channels; CancellationToken усюди."],["Go","context для скасування та дедлайнів; запускайте тести з -race, щоб виявити гонитви даних."],["Rust","Трейти Send і Sync відхиляють гонитви даних на етапі компіляції."],["Python","asyncio для вводу-виводу; multiprocessing або нативні розширення для обчислень."],["SQL","Рівні ізоляції, SELECT … FOR UPDATE і стовпці версій для оптимістичного блокування."]],"code":"mid-optimistic"},{"title":"Продуктивність і спостережуваність","body":"Вимірюйте, перш ніж оптимізувати. Відстежуйте затримку в перцентилях (p50, p95, p99), а не в середніх значеннях. Профілюйте, щоб знайти, куди справді йде час, і виправляйте найбільшу витрату — часто це запит або мережевий виклик, а не сам код. Оснащуйте сервіси логами, метриками та трасуванням, бажано через OpenTelemetry, і визначайте SLO, щоб знати, коли це зачіпає користувачів.","langs":[["Java","JDK Flight Recorder і async-profiler."],[".NET","dotnet-trace, dotnet-counters і PerfView."],["Go","pprof і вбудований трасувальник виконання."],["Python","py-spy і cProfile."],["Node.js","Прапорець --cpu-prof і Chrome DevTools."],["SQL","EXPLAIN ANALYZE для читання реальних планів виконання."]],"code":"mid-explain"},{"title":"Стратегія тестування та якість","body":"Стратегія тестування визначає, що тестувати, на якому рівні й наскільки, виходячи з ризиків. Використовуйте контрактні тести між сервісами, щоб одна команда не могла непомітно зламати іншу, тести на основі властивостей, щоб автоматично перебирати багато вхідних даних, і реалістичні версіоновані тестові дані. У продакшні feature flags і canary-релізи обмежують шкоду від невдалої зміни.","langs":[["Python","Hypothesis для тестування на основі властивостей."],["TypeScript","fast-check."],["Java","jqwik; Pact для контрактних тестів."],[".NET","FsCheck; PactNet."],["Go","Вбудований фазинг через go test -fuzz."],["Rust","proptest і cargo-fuzz."]],"code":"mid-property"},{"title":"Лідерство, менторство та AI-інструменти","body":"Middle-інженери примножують силу команди. Робіть рев'ю так, щоб воно навчало, пишіть короткі дизайн-документи перед великими змінами, оцінюйте задачі діапазонами й проговорюйте припущення, проводьте blameless-постмортеми, які виправляють системи, а не звинувачують людей. Критично оцінюйте AI-асистентів: вони пришвидшують шаблонний код і тести, але додають навантаження на рев'ю, а рішення щодо безпеки й ліцензій залишаються за вами.","langs":[["Go","Добра друга мова для сервісів, інфраструктури та CLI-інструментів."],["Rust","Для компонентів, критичних до продуктивності чи безпеки."],["Kotlin","Для сервісів на JVM і Android з повною сумісністю з Java."],["TypeScript","Для full-stack розробки продукту однією мовою на клієнті й сервері."]],"code":"mid-adr"}],"langContext":[["Java / Kotlin","Великі сервіси зі складною предметною областю; налаштування JVM і конкурентність у масштабі."],["C#","Корпоративні та хмарні системи на .NET; високопродуктивні API."],["Go","Хмарна інфраструктура, мережеві сервіси та CLI-інструменти."],["Rust","Компоненти, критичні до продуктивності й безпеки; системне програмування."],["Python","Платформи даних і ML, автоматизація та внутрішні інструменти."],["TypeScript","Full-stack розробка продукту для вебу та сервера."],["SQL","Моделювання даних, оптимізація запитів і узгодженість у будь-якому стеку."]],"quiz":[{"q":"Що означає затримка p99 = 800 мс?","a":["Середнє значення — 800 мс","99% запитів завершуються за 800 мс або швидше","Найшвидший запит тривав 800 мс","99 запитів тривали 800 мс"],"c":1,"e":"Перцентилі показують «хвіст», який приховують середні значення."},{"q":"Що робить операцію ідемпотентною?","a":["Вона швидко виконується","Повторне виконання має той самий ефект, що й одноразове","Вона ніколи не падає","Вона використовує транзакцію"],"c":1,"e":"Ідемпотентність робить повторні спроби безпечними."},{"q":"Який типовий витік пам'яті в Java, C# або JavaScript?","a":["Забутий виклик free()","Об'єкти, на які досі є посилання, наприклад необмежений кеш","Забагато потоків","Переповнення стека"],"c":1,"e":"Збирач сміття не може звільнити об'єкти, які досі досяжні."},{"q":"Як виявити гонитви даних у Go?","a":["Лише go vet","go test -race","gofmt","Це неможливо"],"c":1,"e":"Детектор гонитв відстежує доступ до пам'яті під час виконання."},{"q":"Що таке ADR?","a":["Інструмент автоматичного розгортання","Запис рішення, його контексту та наслідків","Тип бази даних","Звіт про тестування"],"c":1,"e":"Architecture Decision Records пояснюють, чому система має саме такий вигляд."},{"q":"Ендпоінт працює повільно. Що зробити спочатку?","a":["Переписати його на Rust","Виміряти й профілювати, щоб знайти справжні витрати","Додати кеш усюди","Збільшити сервер"],"c":1,"e":"Оптимізуйте те, що показують дані, а не те, що ви припускаєте."}],"exam":[{"q":"Що може статися, якщо багато клієнтів повторюють запити одразу, без затримки й джитера?","a":["Нічого","Шторм повторних запитів, який перевантажує сервіс, що й так має проблеми","Швидше відновлення","Автоматичне масштабування"],"c":1,"e":"Експоненційна затримка з джитером розподіляє повторні спроби в часі."},{"q":"Як працює оптимістичне блокування?","a":["Блокувати кожен рядок під час читання","Стовпець версії; оновлення не відбувається, якщо версія змінилася","Вимкнути транзакції","Використати глобальний м'ютекс"],"c":1,"e":"Конфлікти виявляються під час запису, що підходить для даних із низькою конкуренцією."},{"q":"Що перевіряє контрактний тест?","a":["Розкладку UI","Що постачальник і споживач узгоджено розуміють API","Продуктивність бази даних","Стиль коду"],"c":1,"e":"Контрактні тести ловлять несумісні зміни API до розгортання."},{"q":"Як Rust запобігає гонитвам даних?","a":["За допомогою збирача сміття","За допомогою трейтів Send і Sync та borrow checker на етапі компіляції","Блокуваннями кожної змінної під час виконання","Ніяк"],"c":1,"e":"Небезпечне спільне використання даних між потоками просто не компілюється."},{"q":"На чому зосереджується blameless-постмортем?","a":["Хто помилився","Системні причини та конкретні покращення","Покарання","Лише хронологія"],"c":1,"e":"Люди діють розумно з тією інформацією, яку мають; виправляйте систему."},{"q":"Що таке тестування на основі властивостей?","a":["Тестування лише властивостей об'єктів","Генерування багатьох вхідних даних для перевірки інваріантів, які мають виконуватися завжди","Ручне дослідницьке тестування","Тестування CSS"],"c":1,"e":"Фреймворк шукає вхідні дані, що порушують задану вами властивість."},{"q":"Який збирач сміття JVM розроблено для дуже коротких пауз?","a":["Serial","ZGC","Parallel","Жоден"],"c":1,"e":"ZGC розрахований на паузи близько мілісекунди навіть на великих купах."},{"q":"Як безпечно перейменувати стовпець у робочій системі?","a":["Перейменувати й одразу розгорнути","Expand and contract: додати новий стовпець, писати в обидва, мігрувати дані, потім видалити старий","Видалити таблицю","Перейменувати вночі"],"c":1,"e":"Зворотно сумісні кроки дають старому й новому коду працювати пліч-о-пліч."},{"q":"Що таке структуроване логування?","a":["Логування в кілька файлів","Логи як поля ключ-значення або JSON, за якими інструменти можуть шукати й фільтрувати","Логування лише помилок","Друк стеків викликів"],"c":1,"e":"Структуровані логи дають змогу шукати за користувачем, ID запиту чи затримкою."},{"q":"Що показує розподілене трасування?","a":["Температуру процесора","Шлях і час виконання одного запиту через різні сервіси","Історію Git","Кількість тестів"],"c":1,"e":"Трасування показує, який крок повільний або дає збій."},{"q":"Чому Go віддає перевагу малим інтерфейсам, які визначає споживач?","a":["Лише для швидшої компіляції","Вони роз'єднують пакети й полегшують тестування","У Go немає інтерфейсів","Цього вимагає компілятор"],"c":1,"e":"Споживач просить лише ту поведінку, яка йому потрібна."},{"q":"Яке використання AI-асистента для програмування доречне на рівні Middle?","a":["Мержити його результат без рев'ю","Складати чернетки тестів і шаблонного коду, а потім ретельно їх перевіряти","Дозволити йому вирішувати архітектуру безпеки","Вставляти продакшн-секрети для контексту"],"c":1,"e":"Асистенти пришвидшують рутинну роботу; відповідальність за правильність і безпеку лишається за вами."}]}]},"pl":{"ui":{"htmlLang":"pl","eyebrow":"Ścieżka kariery · Staż → Junior → Mid","title":"Moduły ról","lede":"Trzy moduły ról: lekcje, kontekst języków programowania, przykłady kodu, quiz modułowy i egzamin dla każdego poziomu. Twoje wyniki zapisują się w tej przeglądarce.","backToHub":"Programming Languages Hub","language":"Język","roles":"Rola","overview":"Przegląd","expect":"Czego oczekują pracodawcy","tasks":"Typowe pierwsze zadania","lessons":"Lekcje","lesson":"Lekcja","inLanguages":"W Twoim języku programowania","langContext":"Które języki liczą się na tym poziomie","langCol":"Język","whyCol":"Dlaczego to ważne","quiz":"Quiz modułowy","quizIntro":"Wybierz odpowiedź, a od razu zobaczysz, czy jest poprawna i dlaczego.","exam":"Egzamin z roli","examIntro":"{n} pytań. Odpowiedz na wszystkie, a potem wyślij. Próg zaliczenia to 70% ({p} z {n}).","question":"Pytanie {i} z {n}","answered":"Odpowiedzi: {d} / {n}","score":"Wynik: {s} / {n}","correct":"Dobrze.","wrong":"Nie do końca.","submit":"Wyślij odpowiedzi","retakeQuiz":"Rozwiąż quiz ponownie","retakeExam":"Podejdź do egzaminu ponownie","answerAll":"Najpierw odpowiedz na wszystkie {n} pytań (odpowiedzi: {d})","passed":"zaliczony","notPassed":"jeszcze niezaliczony","passedMsg":"Przejrzyj odpowiedzi oznaczone ✗ powyżej.","failedMsg":"Przeczytaj wyjaśnienie pod każdym ✗, wróć do tych lekcji i podejdź do egzaminu ponownie.","best":"Najlepszy: {s} / {n}","notAttempted":"Jeszcze nie podchodzono","quizBest":"Quiz","examBest":"Egzamin","copy":"Kopiuj kod","copied":"Skopiowano","copyFailed":"Nie udało się skopiować","reset":"Wyczyść moje wyniki na tym urządzeniu","codeNote":"Kod i komentarze w kodzie pozostają po angielsku, tak jak w prawdziwych projektach."},"roles":[{"id":"intern","name":"Staż","summary":"Ucz się szybko, pracuj bezpiecznie w prawdziwym kodzie i dostarczaj małe, przetestowane zmiany.","overview":"Staż to miejsce, w którym udowadniasz, że szybko się uczysz i bezpiecznie pracujesz w prawdziwej bazie kodu. Nikt nie oczekuje, że będziesz projektować systemy. Zespół oczekuje małych, poprawnych, przetestowanych zmian, dobrych pytań i jasnych wyjaśnień, co zrobiłeś i dlaczego. Wybierz jeden główny język i naucz się go porządnie; te koncepcje przeniesiesz do każdego kolejnego języka.","expect":["Rozwiązywać małe, jasno określone zadania w jednym języku","Czytać istniejący kod i śledzić przepływ danych przez funkcje i moduły","Swobodnie korzystać z Gita, gałęzi i pull requestów","Pisać podstawowe testy automatyczne i czytać komunikaty o błędach","Zadawać konkretne pytania po samodzielnych próbach"],"tasks":["Naprawić mały błąd, zaczynając od niezawodnej reprodukcji","Dodać pole lub regułę walidacji do formularza albo API","Napisać testy dla funkcji, która ich nie ma","Poprawić dokumentację lub skrypt dla programistów","Napisać proste zapytanie SQL do raportu"],"lessons":[{"title":"Podstawy programowania w jednym języku","body":"Wartości, zmienne, typy, warunki, pętle, funkcje i kolekcje to te same idee w każdym języku; zmienia się tylko składnia. Opanuj je dogłębnie w jednym języku, zanim dodasz drugi. Ćwicz, pisząc małe programy od pustego pliku, a nie kopiując tutoriale: wczytaj dane, przekształć je, wypisz wynik i obsłuż błędne dane wejściowe.","langs":[["Python","Dynamiczne typowanie i wcięcia jako część składni. Listy, słowniki i comprehensions pokrywają większość codziennej pracy; zacznij od biblioteki standardowej."],["JavaScript / TypeScript","Używaj let/const i === (nigdy ==). Tablice i obiekty są wszędzie; dodaj typy TypeScript wcześnie, aby wyłapywać błędy przed uruchomieniem."],["Java / C#","Statyczne typy i klasy od pierwszego dnia. Kompilator odrzuca wiele błędów, zanim program się uruchomi."],["Go","Celowo mały język: slices, maps, structs i jawne wartości błędów. Łatwy do czytania, szybki do nauczenia."]],"code":"intern-fundamentals"},{"title":"Czytanie błędów i debugowanie","body":"Komunikat o błędzie to informacja, a nie porażka. Przeczytaj typ błędu, komunikat, a potem pierwszą ramkę stosu wskazującą na Twój własny kod. Najpierw niezawodnie odtwórz problem, dopiero potem go naprawiaj, i zmniejsz go do minimalnego odtwarzalnego przykładu. Używaj debuggera z breakpointami, aby sprawdzać wartości zamiast zgadywać; print wystarczy do szybkich kontroli.","langs":[["Python","Traceback pokazuje najnowsze wywołanie na końcu: najpierw czytaj dolną linię, potem ramki nad nią."],["JavaScript / TypeScript","Używaj DevTools przeglądarki lub inspektora Node. Source maps mapują skompilowany JavaScript na linie Twojego TypeScriptu."],["Java","W stosie wyjątku sekcja \"Caused by\" zwykle pokazuje pierwotną przyczynę."],["C#","Debuggery Visual Studio i Rider zatrzymują się na wyjątkach; \"Just My Code\" ukrywa ramki frameworka."]],"code":"intern-traceback"},{"title":"Git i pull requesty","body":"Twórz jedną gałąź na zmianę, rób małe commity i pisz komunikaty, które mówią, co się zmieniło i dlaczego. Otwieraj pull request z krótkim opisem i informacją, jak testowałeś. Traktuj komentarze z code review jako naukę: odpowiadaj na każdy i wypychaj poprawki. Nigdy nie commituj sekretów, takich jak hasła czy klucze API; jeśli to się stanie, powiedz zespołowi, aby sekret został wymieniony.","langs":[["Python","Dodaj __pycache__/ i .venv/ do .gitignore."],["Node.js","Ignoruj node_modules/ oraz wyniki budowania, np. dist/."],["Java","Ignoruj target/ (Maven) lub build/ (Gradle)."],[".NET","Ignoruj bin/ i obj/."]],"code":"intern-git"},{"title":"Twoje pierwsze testy automatyczne","body":"Test stosuje schemat Arrange, Act, Assert: przygotuj dane, wywołaj kod, sprawdź wynik. Testuj przypadek typowy, wartości graniczne i niepoprawne dane. Każdy test powinien mieć jeden jasny powód do niepowodzenia i działać niezależnie od innych testów. Testy uruchamiane automatycznie w CI chronią Ciebie i zespół przed regresjami.","langs":[["Python","pytest: zwykłe asercje assert i parametrize dla wielu przypadków."],["JavaScript / TypeScript","Vitest lub Jest: bloki describe/it z expect()."],["Java","JUnit 5 z assertEquals i @ParameterizedTest."],["C#","xUnit lub NUnit z [Fact] i [Theory]."],["Go","Wbudowany pakiet testing; framework nie jest potrzebny."]],"code":"intern-test"},{"title":"HTTP, JSON i Twój pierwszy SQL","body":"Większość oprogramowania komunikuje się przez HTTP: klient wysyła żądanie, serwer zwraca kod statusu i treść, zwykle JSON. 2xx oznacza sukces, 4xx błąd klienta, 5xx awarię serwera. Dane zwykle są w relacyjnej bazie danych: naucz się SELECT, WHERE, ORDER BY, prostego JOIN-a oraz INSERT/UPDATE/DELETE.","langs":[["Python","httpx lub requests do HTTP; moduł json lub response.json() do danych."],["TypeScript","fetch() jest wbudowany w przeglądarki i Node; zawsze sprawdzaj response.ok."],["Java / C#","java.net.http.HttpClient i .NET HttpClient; mapuj JSON na klasy lub rekordy."],["SQL","Ćwicz na SQLite lub PostgreSQL; te same podstawowe zapytania działają niemal wszędzie."]],"code":"intern-http"}],"langContext":[["Python","Najszybszy start. Popularny na stażach z automatyzacji, danych, QA i backendu."],["TypeScript / JavaScript","Web: frontend i Node.js. Najwięcej ofert pracy."],["Java / C#","Częste na stażach w dużych firmach. Statyczne typowanie wcześnie uczy struktury."],["SQL","Potrzebny niemal w każdej roli, bo każda aplikacja przechowuje dane."]],"quiz":[{"q":"Od czego zacząć czytanie tracebacku w Pythonie?","a":["Od pierwszej linii","Od ostatniej linii: typu wyjątku i komunikatu","Od środkowych ramek","Tylko od nazw plików"],"c":1,"e":"Python wypisuje najnowsze wywołanie na końcu, więc dolna linia mówi, co poszło nie tak."},{"q":"Pole przyjmuje wartości 1–100. Które wartości testują granice?","a":["Tylko 50","Tylko 1 i 100","0, 1, 100 i 101","-100 i 1000"],"c":2,"e":"Testuj tuż poniżej, dokładnie na i tuż powyżej każdej granicy."},{"q":"Znalazłeś błąd. Jaki jest pierwszy krok?","a":["Przepisać funkcję","Niezawodnie go odtworzyć","Poprosić kogoś innego o poprawkę","Dodać logowanie wszędzie"],"c":1,"e":"Bez reprodukcji nie potwierdzisz, że poprawka działa."},{"q":"Co oznacza status HTTP 404?","a":["Serwer uległ awarii","Nie znaleziono zasobu","Sukces","Zbyt wiele żądań"],"c":1,"e":"Kody 4xx to błędy klienta; 404 oznacza, że żądany zasób nie istnieje."},{"q":"Gdzie powinny znajdować się sekrety, takie jak klucze API?","a":["W kodzie źródłowym","W komunikacie commita","W zmiennych środowiskowych lub menedżerze sekretów","W README"],"c":2,"e":"Sekretów nigdy się nie commituje; konfiguracja pochodzi ze środowiska lub magazynu sekretów."},{"q":"Które zapytanie zwraca klientów z Polski posortowanych po nazwie?","a":["SELECT * FROM customers ORDER BY country","SELECT name FROM customers WHERE country = 'PL' ORDER BY name","UPDATE customers SET country = 'PL'","SELECT name FROM customers GROUP BY name"],"c":1,"e":"WHERE filtruje wiersze, ORDER BY je sortuje."}],"exam":[{"q":"Który język jest kompilowany do kodu bajtowego i uruchamiany na maszynie wirtualnej?","a":["C","Java","Bash","HTML"],"c":1,"e":"Java kompiluje się do kodu bajtowego JVM, który wykonuje JVM."},{"q":"W JavaScripcie 1 == \"1\" daje true, a 1 === \"1\" daje false. Dlaczego?","a":["=== jest szybszy","=== porównuje bez konwersji typów","== działa tylko dla napisów","To błąd przeglądarki"],"c":1,"e":"== konwertuje typy przed porównaniem; === wymaga tego samego typu."},{"q":"Co powinno trafić do .gitignore w projekcie Node.js?","a":["package.json","node_modules/","src/","README.md"],"c":1,"e":"Zależności instaluje się ponownie z package.json i pliku lock, więc node_modules/ nigdy nie trafia do repozytorium."},{"q":"Który komunikat commita jest najlepszy?","a":["fix","changes","Fix off-by-one error in page count","asdf"],"c":2,"e":"Dobry komunikat w kilku słowach mówi, co się zmieniło i dlaczego."},{"q":"Czym jest krok Act w schemacie Arrange-Act-Assert?","a":["Tworzeniem danych testowych","Wywołaniem testowanego kodu","Sprawdzeniem wyniku","Usunięciem testu"],"c":1,"e":"Arrange przygotowuje, Act uruchamia kod, Assert sprawdza wynik."},{"q":"Co oznacza status HTTP 500?","a":["Błąd klienta","Przekierowanie","Błąd serwera","Sukces"],"c":2,"e":"Kody 5xx oznaczają, że serwer zawiódł podczas obsługi poprawnego żądania."},{"q":"Czym jest JSON?","a":["Bazą danych","Tekstowym formatem dla obiektów, tablic, napisów, liczb, wartości logicznych i null","Językiem programowania","Serwerem WWW"],"c":1,"e":"JSON to najpopularniejszy format danych w webowych API."},{"q":"Co zwraca INNER JOIN?","a":["Wszystkie wiersze z obu tabel","Tylko wiersze mające dopasowanie w obu tabelach","Tylko wiersze z lewej tabeli","Wiersze bez dopasowania"],"c":1,"e":"INNER JOIN zostawia tylko wiersze spełniające warunek złączenia."},{"q":"Czym jest minimalny odtwarzalny przykład?","a":["Całym projektem w archiwum ZIP","Najmniejszym kodem, który wciąż pokazuje problem","Zrzutem ekranu błędu","Listą wszystkiego, czego próbowałeś"],"c":1,"e":"Zmniejszenie problemu często ujawnia przyczynę i ułatwia innym pomoc."},{"q":"Utknąłeś od 45 minut. Co robisz?","a":["Próbujesz dalej w ciszy przez cały dzień","Zapisujesz, czego próbowałeś, i zadajesz konkretne pytanie","Zaczynasz inne zadanie, nikomu nie mówiąc","Kopiujesz przypadkową odpowiedź z internetu"],"c":1,"e":"Zespoły cenią stażystów, którzy najpierw próbują sami, a potem zadają precyzyjne pytania."},{"q":"Która struktura w Pythonie najlepiej nadaje się do wyszukiwania wartości po kluczu?","a":["list","tuple","dict","string"],"c":2,"e":"dict zapewnia szybkie wyszukiwanie po kluczu; szukanie w liście sprawdza każdy element."},{"q":"Który plik konfiguruje projekt Maven w Javie?","a":["package.json","pom.xml","Cargo.toml","go.mod"],"c":1,"e":"Maven czyta pom.xml; Gradle używa build.gradle(.kts)."}]},{"id":"junior","name":"Junior","summary":"Odpowiadaj za funkcje od początku do końca, pisz idiomatyczny kod i zacznij robić code review.","overview":"Junior developer dostarcza małe i średnie funkcje przy ograniczonym nadzorze. Krok naprzód względem stażu to odpowiedzialność: prowadzisz zadanie od niejasnego wymagania do zmergowanego, przetestowanego i wdrożonego kodu oraz zaczynasz przeglądać pracę innych. Piszesz kod tak, jak robi to społeczność Twojego języka, i rozumiesz bazę danych, pipeline CI oraz najczęstsze zagrożenia bezpieczeństwa.","expect":["Dostarczać funkcje od początku do końca przy ograniczonym nadzorze","Pisać idiomatyczny kod w głównym języku zespołu","Pisać testy integracyjne i rozsądnie używać mocków","Przeglądać pull requesty i wyjaśniać kompromisy","Pracować z bazami danych: JOIN-y, transakcje i migracje","Naprawiać zepsuty build CI i rozpoznawać typowe problemy bezpieczeństwa"],"tasks":["Zaimplementować endpoint API z walidacją, zapisem danych i testami","Dodać migrację bazy danych i dane początkowe","Znaleźć i naprawić niestabilny (flaky) test","Zrobić code review pull requesta kolegi","Zbadać błąd na podstawie logów i raportów o błędach"],"lessons":[{"title":"Kod idiomatyczny","body":"Kod idiomatyczny wygląda tak, jak oczekują doświadczeni programiści danego języka, dlatego łatwiej go czytać, przeglądać i utrzymywać. Używaj oficjalnego formatera i lintera, trzymaj się konwencji nazewnictwa i sięgaj po bibliotekę standardową, zanim dodasz zależności. Tłumaczenie innego języka linijka po linijce to najczęstszy błąd juniorów.","langs":[["Python","PEP 8, comprehensions, menedżery kontekstu (with), dataclasses i podpowiedzi typów; ruff do lintowania i formatowania."],["TypeScript","strict mode, typy unii, async/await i zawężanie typów; ESLint i Prettier."],["Java","Rekordy dla danych, strumienie tam, gdzie są czytelniejsze niż pętle, Optional dla zwracanych wartości, których może nie być."],["C#","LINQ, async na każdym poziomie, nullable reference types i rekordy."],["Go","gofmt, błędy jako wartości, małe interfejsy; przyjmuj interfejsy, zwracaj struktury."],["Rust","clippy, Result z operatorem ?, pożyczanie zamiast klonowania."]],"code":"junior-idiomatic"},{"title":"Moduły, zależności i konfiguracja","body":"Menedżer pakietów instaluje zależności; plik lock przypina dokładne wersje, dzięki czemu każda maszyna i każde uruchomienie CI dostaje ten sam build. Wersjonowanie semantyczne (MAJOR.MINOR.PATCH) mówi, czy aktualizacja może coś zepsuć. Trzymaj konfigurację, np. adresy URL i dane logowania, poza kodem: czytaj ją ze środowiska, aby ten sam build działał w każdym środowisku.","langs":[["Python","pyproject.toml z uv lub pip; zawsze pracuj w środowisku wirtualnym."],["Node.js","package.json z package-lock.json lub pnpm-lock.yaml."],["Java","Maven (pom.xml) lub Gradle (build.gradle.kts)."],[".NET","Pakiety NuGet zadeklarowane w pliku .csproj."],["Go","go.mod i go.sum."],["Rust","Cargo.toml i Cargo.lock."]],"code":"junior-config"},{"title":"Testowanie poza testami jednostkowymi","body":"Piramida testów: dużo szybkich testów jednostkowych, mniej integracyjnych, kilka end-to-end. Testy integracyjne rozmawiają z prawdziwymi zależnościami, np. bazą danych w kontenerze. Mockuj to, co nie należy do Ciebie (zewnętrzne API, e-mail), ale nie własne zapytania do bazy. Niestabilne testy zwykle wynikają z zależności czasowych, kolejności testów lub współdzielonego stanu; naprawiaj je zamiast uruchamiać ponownie.","langs":[["Python","Fikstury pytest i Testcontainers dla prawdziwego PostgreSQL."],["TypeScript","Vitest z MSW do mockowania HTTP na poziomie sieci."],["Java","JUnit 5, Mockito i Testcontainers."],["C#","xUnit z Moq lub NSubstitute; WebApplicationFactory do testów API."],["Go","Testy tabelaryczne: jeden test, wiele przypadków w slice."]],"code":"junior-table-test"},{"title":"Bazy danych w kodzie aplikacji","body":"Praca juniora codziennie dotyka bazy danych: JOIN-y wielu tabel, agregacja z GROUP BY, transakcje, ograniczenia i indeksy. Zmieniaj schemat wyłącznie przez wersjonowane migracje. ORM-y oszczędzają czas, ale mogą ukryć problem N+1: jedno zapytanie o listę i kolejne dla każdego elementu. Zawsze przekazuj wartości jako parametry, nigdy nie składaj napisów SQL.","langs":[["Python","SQLAlchemy do zapytań, Alembic do migracji."],["TypeScript","Prisma lub Drizzle, każdy z własnymi migracjami."],["Java","JPA/Hibernate z Flyway lub Liquibase."],["C#","Entity Framework Core i jego migracje."],["Go","database/sql z sqlc lub pgx dla PostgreSQL."]],"code":"junior-nplus1"},{"title":"Podstawy asynchroniczności i współbieżności","body":"Odróżniaj pracę ograniczoną przez I/O (czekanie na sieć lub dysk) od pracy ograniczonej przez CPU (obliczenia). Kod asynchroniczny pozwala jednemu wątkowi czekać na wiele operacji I/O jednocześnie; do prawdziwych obliczeń równoległych potrzebne są wątki lub procesy. Współdzielony, modyfikowalny stan między współbieżnymi zadaniami powoduje wyścigi, a zablokowanie pętli zdarzeń wstrzymuje każde żądanie.","langs":[["Python","asyncio do I/O. W standardowych buildach GIL ogranicza równoległość CPU w wątkach, więc do ciężkich obliczeń używaj multiprocessing."],["JavaScript","Jednowątkowa pętla zdarzeń: używaj await dla I/O, uruchamiaj niezależne wywołania przez Promise.all i nigdy nie blokuj długimi pętlami CPU."],["Java","Wątki, ExecutorService i wątki wirtualne (Java 21) dla wielu współbieżnych zadań I/O."],["C#","Task i async/await; unikaj .Result i .Wait(), które mogą powodować zakleszczenia."],["Go","Gorutyny i kanały; sync.WaitGroup do czekania na grupę gorutyn."]],"code":"junior-async"},{"title":"Code review, CI/CD i podstawy bezpieczeństwa","body":"Podczas code review najpierw sprawdzaj poprawność, potem testy, potem czytelność; własne pull requesty rób małe i skupione na jednym celu. Pipeline CI uruchamia linter, testy i build przy każdym pushu, a czerwony build naprawia się przed wszystkim innym. Znaj podstawy OWASP Top 10: wstrzykiwanie, złamaną kontrolę dostępu, wycieki sekretów i podatne zależności.","langs":[["Python","pip-audit do wykrywania podatnych pakietów."],["Node.js","npm audit; Dependabot lub Renovate do aktualizacji."],["Java","OWASP Dependency-Check lub odpowiedniki dla Gradle/Maven."],[".NET","dotnet list package --vulnerable."],["Go / Rust","govulncheck i cargo audit."]],"code":"junior-ci"}],"langContext":[["Python","Django lub FastAPI, PostgreSQL i pytest: zespoły backendowe, danych i automatyzacji."],["TypeScript","React lub Next.js na frontendzie, Node.js lub NestJS na backendzie."],["Java / Kotlin","Spring Boot, JPA i JUnit: duże systemy korporacyjne i bankowe."],["C#","ASP.NET Core, Entity Framework Core i xUnit: rozwiązania korporacyjne, chmura i Azure."],["Go","net/http lub chi, sqlc i pakiet testing: usługi chmurowe i narzędzia."],["SQL","JOIN-y, agregacja, transakcje i migracje stają się codzienną pracą."]],"quiz":[{"q":"Do czego służy plik lock?","a":["Do szyfrowania kodu","Do powtarzalnych instalacji z dokładnymi wersjami zależności","Do blokowania edycji innym programistom","Do przyspieszania kompilatora"],"c":1,"e":"Plik lock przypina wersję każdej zależności, więc wszystkie maszyny instalują to samo."},{"q":"Czym jest problem N+1 zapytań?","a":["Brakującym indeksem","Jednym zapytaniem o listę plus jednym dodatkowym dla każdego elementu","Błędem składni SQL","Zbyt wieloma połączeniami z bazą"],"c":1,"e":"Napraw go JOIN-em lub eager loadingiem w ORM-ie."},{"q":"Serwer Node.js wykonuje 5-sekundową pętlę CPU w obsłudze żądania. Co się stanie?","a":["Zwolni tylko to żądanie","Wszystkie żądania staną, dopóki pętla się nie skończy","Node automatycznie przeniesie ją do innego wątku","Nic"],"c":1,"e":"Pętla zdarzeń jest jednowątkowa; jej zablokowanie blokuje wszystkich."},{"q":"Kiedy mock jest właściwym wyborem?","a":["Dla własnych zapytań do bazy danych","Dla zewnętrznych usług, których nie kontrolujesz","Dla każdej zależności","Nigdy"],"c":1,"e":"Mockuj to, co nie należy do Ciebie; własny kod bazodanowy testuj na prawdziwej bazie."},{"q":"Aktualizacja z 2.3.1 do 3.0.0. Co mówi wersjonowanie semantyczne?","a":["Tylko poprawki błędów","Nowe funkcje, pełna zgodność","Możliwe niekompatybilne zmiany","Nic"],"c":2,"e":"Zmiana wersji MAJOR sygnalizuje niekompatybilne zmiany API."},{"q":"Po co opakowywać dwa powiązane UPDATE-y w transakcję?","a":["Aby były szybsze","Aby zostały zastosowane razem albo wcale","Aby pominąć ograniczenia","Aby nie był potrzebny indeks"],"c":1,"e":"Atomowość zapobiega niedokończonym zmianom."}],"exam":[{"q":"Jak idiomatycznie w Pythonie upewnić się, że plik zostanie zamknięty?","a":["Wywołać close() na końcu","with open(...) as f:","Zostawić to garbage collectorowi","try/except bez finally"],"c":1,"e":"Menedżer kontekstu zamyka plik nawet w przypadku wyjątku."},{"q":"Jakie jest ryzyko wywołania .Result na niezakończonym Tasku w C#?","a":["Żadne","Może zablokować wątek i spowodować zakleszczenie","Przyspiesza kod","Zamienia zadanie w wątek"],"c":1,"e":"Używaj async/await na każdym poziomie zamiast blokowania."},{"q":"Jaka jest konwencja obsługi błędów w Go?","a":["Rzucać wyjątki","Zwracać błąd jako ostatnią wartość i go sprawdzać","Zalogować i zignorować","Używać tylko globalnych zmiennych błędów"],"c":1,"e":"if err != nil { ... } to idiomatyczne Go."},{"q":"Do czego służy Optional w Javie?","a":["Do pól klasy","Do parametrów metod","Do zwracanych wartości, których może nie być","Do kolekcji"],"c":2,"e":"Optional sygnalizuje „wyniku może nie być”; nie jest przeznaczony do pól ani parametrów."},{"q":"Jaka jest częsta przyczyna niestabilnych testów?","a":["Zbyt wiele asercji","Zależności czasowe, kolejność testów lub współdzielony stan","Opisowe nazwy testów","Używanie frameworka testowego"],"c":1,"e":"Pisz testy niezależne i deterministyczne."},{"q":"Co cechuje dobry pull request?","a":["Jest jak największy","Jest mały, ma jeden cel i jasny opis","Nie potrzebuje opisu","Zawiera wiele niepowiązanych zmian"],"c":1,"e":"Małe PR-y dostają szybsze i lepsze review."},{"q":"Gdzie powinno być hasło do produkcyjnej bazy danych?","a":["W kodzie","W zmiennej środowiskowej lub menedżerze sekretów","W historii Gita","W komentarzu"],"c":1,"e":"Konfiguracja pochodzi ze środowiska; sekrety nigdy nie trafiają do repozytorium."},{"q":"Jaki jest kompromis dodania indeksu?","a":["Szybsze odczyty, wolniejsze zapisy i więcej miejsca","Szybsze zapisy, wolniejsze odczyty","Brak kompromisu","Usuwa zduplikowane wiersze"],"c":0,"e":"Indeksuj kolumny, po których filtrujesz i łączysz, a nie wszystko."},{"q":"Co jest przykładem złamanej kontroli dostępu?","a":["Wolna strona","Użytkownik widzi cudze zamówienie po zmianie ID w adresie URL","Literówka w etykiecie","Brak favicony"],"c":1,"e":"Każde żądanie musi sprawdzać, czy użytkownik może uzyskać dostęp do tego konkretnego zasobu."},{"q":"Kiedy pipeline CI powinien kończyć się błędem?","a":["Nigdy","Gdy linter lub testy nie przechodzą","Tylko w piątki","Gdy build jest zbyt szybki"],"c":1,"e":"Niezaliczona bramka jakości zatrzymuje zepsuty kod przed mergem."},{"q":"Czym jest migracja bazy danych?","a":["Przejściem do innego dostawcy bazy","Wersjonowaną, przejrzaną zmianą schematu stosowaną tak samo w każdym środowisku","Kopią zapasową","Ręczną edycją SQL na produkcji"],"c":1,"e":"Migracje sprawiają, że zmiany schematu są powtarzalne i podlegają review."},{"q":"Co zaleca piramida testów?","a":["Głównie testy end-to-end","Dużo testów jednostkowych, mniej integracyjnych, kilka end-to-end","Tylko testy manualne","Po równo każdego rodzaju"],"c":1,"e":"Szybkie, skupione testy na dole; kilka wolnych, szerokich na górze."}]},{"id":"mid","name":"Mid","summary":"Odpowiadaj za komponenty, nazywaj kompromisy wprost, utrzymuj niezawodne systemy i rozwijaj innych.","overview":"Mid developer odpowiada za komponenty, a nie tylko za zadania. Projektujesz interfejsy i modele danych, nazywasz kompromisy wprost, dbasz o obserwowalność i niezawodność systemów na produkcji oraz podnosisz poziom ludzi wokół siebie. Rozumiesz, jak środowisko uruchomieniowe Twojego języka zachowuje się pod obciążeniem, i potrafisz dobrać właściwe narzędzie lub właściwy drugi język do problemu.","expect":["Projektować komponenty z jasno określonymi odpowiedzialnościami i granicami","Rozumować o wydajności, pamięci i współbieżności","Prowadzić debugowanie incydentów produkcyjnych","Projektować strategie testów, a nie tylko pojedyncze testy","Modelować dane i optymalizować zapytania","Mentorować juniorów i oceniać narzędzia, w tym asystentów AI"],"tasks":["Zaprojektować nowy moduł lub usługę i zapisać decyzję w ADR","Poprowadzić analizę incydentu i postmortem bez szukania winnych","Zmniejszyć opóźnienie p95 wolnego endpointu","Zaplanować wstecznie zgodną migrację schematu","Poprowadzić juniora przez realizację funkcji"],"lessons":[{"title":"Projektowanie i architektura","body":"Dobry projekt trzyma powiązany kod razem (wysoka spójność) i ma niewiele zależności skierowanych do środka (luźne powiązania). Umieszczaj interfejsy na granicach, takich jak przechowywanie danych, komunikaty i zewnętrzne API, aby szczegóły mogły się zmieniać bez przepisywania rdzenia. Zapisuj ważne decyzje w Architecture Decision Records, wybieraj rozwiązania odwracalne i zaczynaj od modularnego monolitu, zanim podzielisz system na usługi.","langs":[["Java / C#","Jawne interfejsy z wstrzykiwaniem zależności (Spring, ASP.NET Core DI)."],["Go","Małe interfejsy definiowane przez konsumenta; implementacje spełniają je niejawnie."],["Rust","Traity dla zachowań; własność wymusza czytelny przepływ danych w projekcie."],["TypeScript","Typy strukturalne i wyraźne granice modułów; unikaj cyklicznych importów."],["Python","typing.Protocol opisuje interfejsy oparte na duck typingu, które weryfikują narzędzia do sprawdzania typów."]],"code":"mid-interface"},{"title":"Zachowanie środowiska uruchomieniowego i pamięć","body":"Na poziomie mid wyjaśniasz, dlaczego usługa zwalnia lub kończy się jej pamięć. W językach z garbage collectorem wycieki to obiekty, do których wciąż istnieją referencje: nieograniczone cache, zapomniane nasłuchiwacze zdarzeń, statyczne kolekcje. Wysokie tempo alokacji wywiera presję na GC. Kompilatory JIT potrzebują rozgrzewki, więc rób realistyczne benchmarki. Używaj profilerów i zrzutów sterty zamiast zgadywać.","langs":[["Java","G1 to domyślny GC, a ZGC celuje w niskie opóźnienia; zrzuty sterty i JDK Flight Recorder."],["C#","Tryby GC w .NET; dotnet-counters i dotnet-trace."],["Go","Współbieżny GC strojony przez GOGC i GOMEMLIMIT; pprof dla CPU i pamięci."],["Python","Zliczanie referencji plus kolektor cykli; tracemalloc i py-spy."],["JavaScript","Snapshoty sterty V8 w DevTools; domknięcia mogą utrzymywać duże obiekty przy życiu."],["Rust","Bez GC; pamięć zwalnia mechanizm własności. Uważaj na cykle referencji Rc."]],"code":"mid-leak"},{"title":"Współbieżność i spójność","body":"Systemy rozproszone zawodzą częściowo, więc projektuj z myślą o tym: ustawiaj timeouty dla każdego wywołania, ponawiaj z wykładniczym opóźnieniem i jitterem oraz rób operacje idempotentnymi, aby ponowienie nie obciążyło klienta dwa razy. Rozumiej wyścigi i zakleszczenia, poziomy izolacji w bazie danych oraz blokowanie optymistyczne i pesymistyczne.","langs":[["Java","java.util.concurrent i wątki wirtualne; CompletableFuture do kompozycji."],["C#","async z SemaphoreSlim i Channels; CancellationToken wszędzie."],["Go","context do anulowania i terminów; uruchamiaj testy z -race, aby wykryć wyścigi danych."],["Rust","Traity Send i Sync odrzucają wyścigi danych na etapie kompilacji."],["Python","asyncio do I/O; multiprocessing lub natywne rozszerzenia do obliczeń."],["SQL","Poziomy izolacji, SELECT … FOR UPDATE i kolumny wersji do blokowania optymistycznego."]],"code":"mid-optimistic"},{"title":"Wydajność i obserwowalność","body":"Mierz, zanim zaczniesz optymalizować. Śledź opóźnienia jako percentyle (p50, p95, p99), a nie średnie. Profiluj, aby znaleźć, gdzie naprawdę ucieka czas, i naprawiaj największy koszt, którym często jest zapytanie lub wywołanie sieciowe, a nie sam kod. Wyposaż usługi w logi, metryki i ślady, najlepiej przez OpenTelemetry, i zdefiniuj SLO, aby wiedzieć, kiedy problem dotyka użytkowników.","langs":[["Java","JDK Flight Recorder i async-profiler."],[".NET","dotnet-trace, dotnet-counters i PerfView."],["Go","pprof i wbudowany tracer wykonania."],["Python","py-spy i cProfile."],["Node.js","Flaga --cpu-prof i Chrome DevTools."],["SQL","EXPLAIN ANALYZE do czytania rzeczywistych planów wykonania."]],"code":"mid-explain"},{"title":"Strategia testów i jakość","body":"Strategia testów określa, co testować, na jakim poziomie i w jakim zakresie, na podstawie ryzyka. Używaj testów kontraktowych między usługami, aby jeden zespół nie mógł po cichu zepsuć pracy drugiego, testów opartych na właściwościach, aby automatycznie badać wiele danych wejściowych, oraz realistycznych, wersjonowanych danych testowych. Na produkcji feature flagi i wydania canary ograniczają szkody z nieudanej zmiany.","langs":[["Python","Hypothesis do testów opartych na właściwościach."],["TypeScript","fast-check."],["Java","jqwik; Pact do testów kontraktowych."],[".NET","FsCheck; PactNet."],["Go","Wbudowany fuzzing przez go test -fuzz."],["Rust","proptest i cargo-fuzz."]],"code":"mid-property"},{"title":"Przywództwo, mentoring i narzędzia AI","body":"Inżynierowie na poziomie mid zwielokrotniają siłę zespołu. Rób code review, które uczy, pisz krótkie dokumenty projektowe przed dużymi zmianami, szacuj w przedziałach i nazywaj swoje założenia, prowadź postmortemy bez szukania winnych, które naprawiają systemy, a nie obwiniają ludzi. Oceniaj asystentów AI krytycznie: przyspieszają pisanie szablonowego kodu i testów, ale zwiększają obciążenie review, a decyzje dotyczące bezpieczeństwa i licencji pozostają po Twojej stronie.","langs":[["Go","Dobry drugi język do usług, infrastruktury i narzędzi CLI."],["Rust","Do komponentów krytycznych pod względem wydajności lub bezpieczeństwa."],["Kotlin","Do usług na JVM i Androida, z pełną interoperacyjnością z Javą."],["TypeScript","Do pracy full-stack nad produktem jednym językiem po stronie klienta i serwera."]],"code":"mid-adr"}],"langContext":[["Java / Kotlin","Duże usługi o bogatej logice domenowej; strojenie JVM i współbieżność na dużą skalę."],["C#","Systemy korporacyjne i chmurowe na .NET; wydajne API."],["Go","Infrastruktura chmurowa, usługi sieciowe i narzędzia CLI."],["Rust","Komponenty krytyczne dla wydajności i bezpieczeństwa; programowanie systemowe."],["Python","Platformy danych i ML, automatyzacja i narzędzia wewnętrzne."],["TypeScript","Rozwój produktu full-stack w przeglądarce i na serwerze."],["SQL","Modelowanie danych, optymalizacja zapytań i spójność w każdym stosie."]],"quiz":[{"q":"Co oznacza opóźnienie p99 równe 800 ms?","a":["Średnia wynosi 800 ms","99% żądań kończy się w ciągu 800 ms","Najszybsze żądanie trwało 800 ms","99 żądań trwało 800 ms"],"c":1,"e":"Percentyle pokazują „ogon”, który ukrywają średnie."},{"q":"Co sprawia, że operacja jest idempotentna?","a":["Działa szybko","Powtórzenie jej ma taki sam efekt jak jednokrotne wykonanie","Nigdy nie zawodzi","Używa transakcji"],"c":1,"e":"Idempotentność sprawia, że ponowienia są bezpieczne."},{"q":"Jaki jest typowy wyciek pamięci w Javie, C# lub JavaScripcie?","a":["Zapomniane wywołanie free()","Obiekty, do których wciąż są referencje, np. nieograniczony cache","Zbyt wiele wątków","Przepełnienie stosu"],"c":1,"e":"Garbage collector nie zwolni obiektów, które wciąż są osiągalne."},{"q":"Jak wykryć wyścigi danych w Go?","a":["Tylko go vet","go test -race","gofmt","Nie da się"],"c":1,"e":"Detektor wyścigów instrumentuje dostęp do pamięci w czasie działania."},{"q":"Czym jest ADR?","a":["Narzędziem do automatycznego wdrażania","Zapisem decyzji, jej kontekstu i konsekwencji","Rodzajem bazy danych","Raportem z testów"],"c":1,"e":"Architecture Decision Records wyjaśniają, dlaczego system wygląda tak, a nie inaczej."},{"q":"Endpoint działa wolno. Co robisz najpierw?","a":["Przepisujesz go w Ruście","Mierzysz i profilujesz, aby znaleźć rzeczywisty koszt","Dodajesz cache wszędzie","Zwiększasz serwer"],"c":1,"e":"Optymalizuj to, co pokazują dane, a nie to, co zgadujesz."}],"exam":[{"q":"Co może się stać, gdy wielu klientów ponawia żądania natychmiast, bez opóźnienia i jittera?","a":["Nic","Burza ponowień, która przeciąża i tak już mającą problemy usługę","Szybsze odzyskiwanie","Automatyczne skalowanie"],"c":1,"e":"Wykładnicze opóźnienie z jitterem rozkłada ponowienia w czasie."},{"q":"Jak działa blokowanie optymistyczne?","a":["Blokuje każdy wiersz przy odczycie","Kolumna wersji; aktualizacja się nie powiedzie, jeśli wersja się zmieniła","Wyłącza transakcje","Używa globalnego muteksu"],"c":1,"e":"Konflikty wykrywa się przy zapisie, co pasuje do danych o niskiej rywalizacji."},{"q":"Co weryfikuje test kontraktowy?","a":["Układ interfejsu użytkownika","Że dostawca i konsument zgadzają się co do API","Wydajność bazy danych","Styl kodu"],"c":1,"e":"Testy kontraktowe wyłapują niekompatybilne zmiany API przed wdrożeniem."},{"q":"Jak Rust zapobiega wyścigom danych?","a":["Za pomocą garbage collectora","Za pomocą traitów Send i Sync oraz borrow checkera na etapie kompilacji","Blokadami każdej zmiennej w czasie działania","Nie zapobiega"],"c":1,"e":"Niebezpieczne współdzielenie danych między wątkami się nie kompiluje."},{"q":"Na czym skupia się postmortem bez szukania winnych?","a":["Kto popełnił błąd","Systemowe przyczyny i konkretne usprawnienia","Kary","Tylko oś czasu"],"c":1,"e":"Ludzie działają rozsądnie na podstawie informacji, które mają; naprawiaj system."},{"q":"Czym jest testowanie oparte na właściwościach?","a":["Testowaniem tylko właściwości obiektów","Generowaniem wielu danych wejściowych w celu sprawdzenia niezmienników, które zawsze muszą być spełnione","Ręcznym testowaniem eksploracyjnym","Testowaniem CSS"],"c":1,"e":"Framework szuka danych wejściowych, które łamią zadaną przez Ciebie właściwość."},{"q":"Który garbage collector JVM zaprojektowano z myślą o bardzo krótkich pauzach?","a":["Serial","ZGC","Parallel","Żaden"],"c":1,"e":"ZGC celuje w pauzy rzędu milisekundy, nawet przy dużych stertach."},{"q":"Jak bezpiecznie zmienić nazwę kolumny w działającym systemie?","a":["Zmienić nazwę i od razu wdrożyć","Expand and contract: dodać nową kolumnę, zapisywać do obu, zmigrować dane, potem usunąć starą","Usunąć tabelę","Zmienić nazwę w nocy"],"c":1,"e":"Wstecznie zgodne kroki pozwalają staremu i nowemu kodowi działać równolegle."},{"q":"Czym jest logowanie strukturalne?","a":["Logowaniem do wielu plików","Logami w postaci pól klucz-wartość lub JSON, które narzędzia mogą przeszukiwać i filtrować","Logowaniem tylko błędów","Wypisywaniem stosów wywołań"],"c":1,"e":"Logi strukturalne pozwalają wyszukiwać po użytkowniku, ID żądania czy opóźnieniu."},{"q":"Co pokazuje rozproszone śledzenie (distributed tracing)?","a":["Temperaturę procesora","Ścieżkę i czas jednego żądania przez wiele usług","Historię Gita","Liczbę testów"],"c":1,"e":"Ślady pokazują, który etap jest wolny lub zawodzi."},{"q":"Dlaczego Go preferuje małe interfejsy definiowane przez konsumenta?","a":["Tylko dla szybszej kompilacji","Rozprzęgają pakiety i ułatwiają testowanie","Go nie ma interfejsów","Wymaga tego kompilator"],"c":1,"e":"Konsument prosi tylko o to zachowanie, którego potrzebuje."},{"q":"Które użycie asystenta AI do programowania jest dobre na poziomie mid?","a":["Mergowanie jego wyników bez review","Tworzenie szkiców testów i szablonowego kodu, a potem ich staranne sprawdzenie","Pozwolenie mu decydować o architekturze bezpieczeństwa","Wklejanie sekretów produkcyjnych jako kontekstu"],"c":1,"e":"Asystenci przyspieszają rutynową pracę; odpowiedzialność za poprawność i bezpieczeństwo pozostaje po Twojej stronie."}]}]},"es":{"ui":{"htmlLang":"es","eyebrow":"Itinerario profesional · Prácticas → Junior → Mid","title":"Módulos por rol","lede":"Tres módulos por rol con lecciones, contexto de lenguajes de programación, ejemplos de código, un cuestionario del módulo y un examen para cada nivel. Tus resultados se guardan en este navegador.","backToHub":"Programming Languages Hub","language":"Idioma","roles":"Rol","overview":"Resumen","expect":"Qué esperan las empresas","tasks":"Primeras tareas típicas","lessons":"Lecciones","lesson":"Lección","inLanguages":"En tu lenguaje de programación","langContext":"Qué lenguajes importan en este nivel","langCol":"Lenguaje","whyCol":"Por qué importa aquí","quiz":"Cuestionario del módulo","quizIntro":"Elige una respuesta y verás al instante si es correcta y por qué.","exam":"Examen del rol","examIntro":"{n} preguntas. Respóndelas todas y luego envía. Para aprobar necesitas un 70% ({p} de {n}).","question":"Pregunta {i} de {n}","answered":"{d} / {n} respondidas","score":"Resultado: {s} / {n}","correct":"Correcto.","wrong":"No exactamente.","submit":"Enviar respuestas","retakeQuiz":"Repetir cuestionario","retakeExam":"Repetir examen","answerAll":"Responde primero las {n} preguntas ({d} respondidas)","passed":"aprobado","notPassed":"aún no aprobado","passedMsg":"Revisa las respuestas marcadas con ✗ arriba.","failedMsg":"Lee la explicación bajo cada ✗, repasa esas lecciones y vuelve a hacer el examen.","best":"Mejor: {s} / {n}","notAttempted":"Sin intentos todavía","quizBest":"Cuestionario","examBest":"Examen","copy":"Copiar código","copied":"Copiado","copyFailed":"No se pudo copiar","reset":"Borrar mis resultados en este dispositivo","codeNote":"El código y sus comentarios se mantienen en inglés, como en los proyectos reales."},"roles":[{"id":"intern","name":"Prácticas","summary":"Aprende rápido, trabaja con seguridad en código real y entrega cambios pequeños y probados.","overview":"Las prácticas son el lugar donde demuestras que aprendes rápido y trabajas con seguridad dentro de una base de código real. Nadie espera que diseñes sistemas. Tu equipo espera cambios pequeños, correctos y probados, buenas preguntas y explicaciones claras de qué hiciste y por qué. Elige un lenguaje principal y apréndelo bien; los conceptos se trasladan a cada lenguaje que aprendas después.","expect":["Resolver tareas pequeñas y bien definidas en un lenguaje","Leer código existente y seguir los datos a través de funciones y módulos","Usar Git, ramas y pull requests con confianza","Escribir pruebas automatizadas básicas y leer mensajes de error","Hacer preguntas concretas después de intentarlo por tu cuenta"],"tasks":["Corregir un error pequeño a partir de una reproducción fiable","Añadir un campo o una regla de validación a un formulario o una API","Escribir pruebas para una función que no tiene ninguna","Mejorar la documentación o un script para desarrolladores","Escribir una consulta SQL sencilla para un informe"],"lessons":[{"title":"Fundamentos de programación en un lenguaje","body":"Valores, variables, tipos, condiciones, bucles, funciones y colecciones son las mismas ideas en todos los lenguajes; solo cambia la sintaxis. Domínalos a fondo en un lenguaje antes de añadir un segundo. Practica escribiendo programas pequeños desde un archivo vacío, no copiando tutoriales: lee datos de entrada, transfórmalos, muestra un resultado y gestiona las entradas incorrectas.","langs":[["Python","Tipado dinámico y la indentación como parte de la sintaxis. Listas, diccionarios y comprehensions cubren casi todo el trabajo diario; empieza por la biblioteca estándar."],["JavaScript / TypeScript","Usa let/const y === (nunca ==). Arrays y objetos están en todas partes; añade tipos de TypeScript pronto para detectar errores antes de ejecutar."],["Java / C#","Tipos estáticos y clases desde el primer día. El compilador rechaza muchos errores antes de que el programa se ejecute."],["Go","Un lenguaje deliberadamente pequeño: slices, maps, structs y valores de error explícitos. Fácil de leer y rápido de aprender."]],"code":"intern-fundamentals"},{"title":"Leer errores y depurar","body":"Un mensaje de error es información, no un fracaso. Lee el tipo de error, el mensaje y después el primer marco de la pila que apunta a tu propio código. Reproduce el problema de forma fiable antes de intentar arreglarlo y redúcelo a un ejemplo mínimo reproducible. Usa un depurador con puntos de interrupción para ver los valores en lugar de adivinar; los print sirven para comprobaciones rápidas.","langs":[["Python","El traceback muestra la llamada más reciente al final: lee primero la última línea y luego los marcos de encima."],["JavaScript / TypeScript","Usa las DevTools del navegador o el inspector de Node. Los source maps relacionan el JavaScript compilado con tus líneas de TypeScript."],["Java","En las trazas de excepciones, la sección \"Caused by\" suele mostrar la causa raíz."],["C#","Los depuradores de Visual Studio y Rider se detienen en las excepciones; \"Just My Code\" oculta los marcos del framework."]],"code":"intern-traceback"},{"title":"Git y pull requests","body":"Crea una rama por cambio, haz commits pequeños y escribe mensajes que digan qué cambió y por qué. Abre un pull request con una descripción breve y cómo lo probaste. Toma los comentarios de la revisión como aprendizaje: responde a cada uno y sube las correcciones. Nunca hagas commit de secretos como contraseñas o claves de API; si ocurre, avisa a tu equipo para que se renueve el secreto.","langs":[["Python","Añade __pycache__/ y .venv/ al .gitignore."],["Node.js","Ignora node_modules/ y los resultados de compilación como dist/."],["Java","Ignora target/ (Maven) o build/ (Gradle)."],[".NET","Ignora bin/ y obj/."]],"code":"intern-git"},{"title":"Tus primeras pruebas automatizadas","body":"Una prueba sigue el esquema Arrange, Act, Assert: prepara los datos, llama al código y comprueba el resultado. Prueba el caso normal, los límites y las entradas no válidas. Cada prueba debe tener un único motivo claro para fallar y ejecutarse sin depender de otras. Las pruebas que se ejecutan automáticamente en CI te protegen a ti y a tu equipo de las regresiones.","langs":[["Python","pytest: sentencias assert simples y parametrize para muchos casos."],["JavaScript / TypeScript","Vitest o Jest: bloques describe/it con expect()."],["Java","JUnit 5 con assertEquals y @ParameterizedTest."],["C#","xUnit o NUnit con [Fact] y [Theory]."],["Go","El paquete testing integrado; no hace falta ningún framework."]],"code":"intern-test"},{"title":"HTTP, JSON y tu primer SQL","body":"La mayoría del software se comunica por HTTP: un cliente envía una petición y el servidor devuelve un código de estado y un cuerpo, normalmente JSON. 2xx significa éxito, 4xx un error del cliente y 5xx un fallo del servidor. Los datos suelen estar en una base de datos relacional: aprende SELECT, WHERE, ORDER BY, un JOIN sencillo e INSERT/UPDATE/DELETE.","langs":[["Python","httpx o requests para HTTP; el módulo json o response.json() para los datos."],["TypeScript","fetch() viene integrado en navegadores y Node; comprueba siempre response.ok."],["Java / C#","java.net.http.HttpClient y HttpClient de .NET; convierte el JSON en clases o records."],["SQL","Practica con SQLite o PostgreSQL; las mismas consultas básicas funcionan casi en todas partes."]],"code":"intern-http"}],"langContext":[["Python","El comienzo más rápido. Habitual en prácticas de automatización, datos, QA y backend."],["TypeScript / JavaScript","La web: frontend y Node.js. El mayor número de ofertas de empleo."],["Java / C#","Frecuentes en prácticas en grandes empresas. El tipado estático enseña estructura desde el principio."],["SQL","Necesario en casi todos los roles, porque toda aplicación guarda datos."]],"quiz":[{"q":"¿Por dónde empiezas a leer un traceback de Python?","a":["Por la primera línea","Por la última línea: el tipo de excepción y el mensaje","Por los marcos intermedios","Solo por los nombres de archivo"],"c":1,"e":"Python imprime la llamada más reciente al final, así que la última línea te dice qué falló."},{"q":"Un campo acepta valores de 1 a 100. ¿Qué valores prueban los límites?","a":["Solo 50","Solo 1 y 100","0, 1, 100 y 101","-100 y 1000"],"c":2,"e":"Prueba justo por debajo, en el límite y justo por encima de cada límite."},{"q":"Has encontrado un error. ¿Cuál es el primer paso?","a":["Reescribir la función","Reproducirlo de forma fiable","Pedir a otra persona que lo arregle","Añadir logs por todas partes"],"c":1,"e":"Sin una reproducción no puedes confirmar que tu corrección funciona."},{"q":"¿Qué significa el código de estado HTTP 404?","a":["El servidor se ha caído","Recurso no encontrado","Éxito","Demasiadas peticiones"],"c":1,"e":"Los códigos 4xx son errores del cliente; 404 significa que el recurso solicitado no existe."},{"q":"¿Dónde deben guardarse secretos como las claves de API?","a":["En el código fuente","En un mensaje de commit","En variables de entorno o un gestor de secretos","En el README"],"c":2,"e":"Los secretos nunca se suben al repositorio; la configuración viene del entorno o de un almacén de secretos."},{"q":"¿Qué consulta devuelve los clientes de Polonia ordenados por nombre?","a":["SELECT * FROM customers ORDER BY country","SELECT name FROM customers WHERE country = 'PL' ORDER BY name","UPDATE customers SET country = 'PL'","SELECT name FROM customers GROUP BY name"],"c":1,"e":"WHERE filtra las filas; ORDER BY las ordena."}],"exam":[{"q":"¿Qué lenguaje se compila a bytecode y se ejecuta en una máquina virtual?","a":["C","Java","Bash","HTML"],"c":1,"e":"Java se compila a bytecode de la JVM, que la JVM ejecuta."},{"q":"En JavaScript, 1 == \"1\" es true pero 1 === \"1\" es false. ¿Por qué?","a":["=== es más rápido","=== compara sin conversión de tipos","== solo funciona con cadenas","Es un error del navegador"],"c":1,"e":"== convierte los tipos antes de comparar; === exige el mismo tipo."},{"q":"¿Qué debe ir en el .gitignore de un proyecto Node.js?","a":["package.json","node_modules/","src/","README.md"],"c":1,"e":"Las dependencias se reinstalan desde package.json y el archivo lock, así que node_modules/ nunca se sube al repositorio."},{"q":"¿Cuál es el mejor mensaje de commit?","a":["fix","changes","Fix off-by-one error in page count","asdf"],"c":2,"e":"Un buen mensaje dice en pocas palabras qué cambió y por qué."},{"q":"En Arrange-Act-Assert, ¿qué es el paso Act?","a":["Crear datos de prueba","Llamar al código que se prueba","Comprobar el resultado","Borrar la prueba"],"c":1,"e":"Arrange prepara, Act ejecuta el código y Assert comprueba el resultado."},{"q":"¿Qué indica el código de estado HTTP 500?","a":["Un error del cliente","Una redirección","Un error del servidor","Éxito"],"c":2,"e":"Los códigos 5xx indican que el servidor falló al procesar una petición válida."},{"q":"¿Qué es JSON?","a":["Una base de datos","Un formato de texto para objetos, arrays, cadenas, números, booleanos y null","Un lenguaje de programación","Un servidor web"],"c":1,"e":"JSON es el formato de datos más común en las API web."},{"q":"¿Qué devuelve un INNER JOIN?","a":["Todas las filas de ambas tablas","Solo las filas que coinciden en ambas tablas","Solo las filas de la tabla izquierda","Las filas sin coincidencia"],"c":1,"e":"INNER JOIN conserva solo las filas que cumplen la condición de unión."},{"q":"¿Qué es un ejemplo mínimo reproducible?","a":["Todo el proyecto comprimido","El código más pequeño que todavía muestra el problema","Una captura de pantalla del error","Una lista de todo lo que probaste"],"c":1,"e":"Reducir el problema suele revelar la causa y facilita que otros te ayuden."},{"q":"Llevas 45 minutos atascado. ¿Qué haces?","a":["Seguir intentándolo en silencio todo el día","Anotar lo que has probado y hacer una pregunta concreta","Empezar otra tarea sin decírselo a nadie","Copiar una respuesta cualquiera de internet"],"c":1,"e":"Los equipos valoran a quien lo intenta primero y luego hace preguntas precisas."},{"q":"En Python, ¿qué estructura es mejor para buscar valores por clave?","a":["list","tuple","dict","string"],"c":2,"e":"Un dict ofrece búsquedas rápidas por clave; buscar en una lista revisa cada elemento."},{"q":"¿Qué archivo configura un proyecto Maven en Java?","a":["package.json","pom.xml","Cargo.toml","go.mod"],"c":1,"e":"Maven lee pom.xml; Gradle usa build.gradle(.kts)."}]},{"id":"junior","name":"Junior","summary":"Responsabilízate de funcionalidades de principio a fin, escribe código idiomático y empieza a revisar el trabajo de otros.","overview":"Un desarrollador junior entrega funcionalidades pequeñas y medianas con supervisión limitada. El salto respecto a las prácticas es la responsabilidad: llevas una tarea desde un requisito poco claro hasta un código fusionado, probado y desplegado, y empiezas a revisar el trabajo de otras personas. Escribes el código como lo hace la comunidad de tu lenguaje y entiendes la base de datos, el pipeline de CI y los riesgos de seguridad más comunes.","expect":["Entregar funcionalidades de principio a fin con supervisión limitada","Escribir código idiomático en el lenguaje principal del equipo","Escribir pruebas de integración y usar mocks con criterio","Revisar pull requests y explicar las ventajas y desventajas","Trabajar con bases de datos: JOIN, transacciones y migraciones","Arreglar una build de CI rota y reconocer problemas de seguridad comunes"],"tasks":["Implementar un endpoint de API con validación, persistencia y pruebas","Añadir una migración de base de datos y datos iniciales","Encontrar y corregir una prueba inestable (flaky)","Revisar el pull request de un compañero","Investigar un error a partir de logs e informes de errores"],"lessons":[{"title":"Código idiomático","body":"El código idiomático tiene el aspecto que esperan los desarrolladores experimentados de ese lenguaje, lo que lo hace más fácil de leer, revisar y mantener. Usa el formateador y el linter oficiales, sigue las convenciones de nombres y recurre a la biblioteca estándar antes de añadir dependencias. Traducir otro lenguaje línea por línea es el error más común de un junior.","langs":[["Python","PEP 8, comprehensions, gestores de contexto (with), dataclasses y anotaciones de tipo; ruff para lint y formato."],["TypeScript","strict mode, tipos unión, async/await y estrechamiento de tipos; ESLint y Prettier."],["Java","Records para datos, streams cuando son más claros que los bucles, Optional para valores de retorno que pueden faltar."],["C#","LINQ, async en todos los niveles, nullable reference types y records."],["Go","gofmt, errores como valores, interfaces pequeñas; acepta interfaces, devuelve structs."],["Rust","clippy, Result con el operador ?, préstamos en lugar de clonar."]],"code":"junior-idiomatic"},{"title":"Módulos, dependencias y configuración","body":"Un gestor de paquetes instala las dependencias; un archivo lock fija las versiones exactas para que cada máquina y cada ejecución de CI obtengan la misma build. El versionado semántico (MAJOR.MINOR.PATCH) indica si una actualización puede romper algo. Mantén la configuración, como URL y credenciales, fuera del código: léela del entorno para que la misma build funcione en cualquier entorno.","langs":[["Python","pyproject.toml con uv o pip; trabaja siempre en un entorno virtual."],["Node.js","package.json con package-lock.json o pnpm-lock.yaml."],["Java","Maven (pom.xml) o Gradle (build.gradle.kts)."],[".NET","Paquetes NuGet declarados en el archivo .csproj."],["Go","go.mod y go.sum."],["Rust","Cargo.toml y Cargo.lock."]],"code":"junior-config"},{"title":"Pruebas más allá de las unitarias","body":"La pirámide de pruebas: muchas pruebas unitarias rápidas, menos de integración y unas pocas end-to-end. Las pruebas de integración hablan con dependencias reales, como una base de datos en un contenedor. Haz mocks de lo que no controlas (API de terceros, correo), pero no de tus propias consultas a la base de datos. Las pruebas inestables suelen deberse a tiempos, al orden de las pruebas o a estado compartido; corrígelas en lugar de volver a ejecutarlas.","langs":[["Python","Fixtures de pytest y Testcontainers para un PostgreSQL real."],["TypeScript","Vitest con MSW para simular HTTP a nivel de red."],["Java","JUnit 5, Mockito y Testcontainers."],["C#","xUnit con Moq o NSubstitute; WebApplicationFactory para pruebas de API."],["Go","Pruebas basadas en tablas: una prueba, muchos casos en un slice."]],"code":"junior-table-test"},{"title":"Bases de datos en el código de la aplicación","body":"El trabajo de un junior toca la base de datos a diario: JOIN de varias tablas, agregación con GROUP BY, transacciones, restricciones e índices. Cambia el esquema solo mediante migraciones versionadas. Los ORM ahorran tiempo, pero pueden ocultar el problema N+1: una consulta para la lista y otra más por cada elemento. Pasa siempre los valores como parámetros; nunca construyas cadenas SQL.","langs":[["Python","SQLAlchemy para consultas, Alembic para migraciones."],["TypeScript","Prisma o Drizzle, cada uno con sus propias migraciones."],["Java","JPA/Hibernate con Flyway o Liquibase."],["C#","Entity Framework Core y sus migraciones."],["Go","database/sql con sqlc, o pgx para PostgreSQL."]],"code":"junior-nplus1"},{"title":"Fundamentos de asincronía y concurrencia","body":"Distingue el trabajo limitado por E/S (esperar a la red o al disco) del trabajo limitado por CPU (calcular). El código asíncrono permite que un solo hilo espere muchas operaciones de E/S a la vez; para cálculos realmente paralelos hacen falta hilos o procesos. El estado mutable compartido entre tareas concurrentes provoca condiciones de carrera, y bloquear un bucle de eventos detiene todas las peticiones.","langs":[["Python","asyncio para E/S. En las builds estándar el GIL limita el paralelismo de CPU en hilos, así que usa multiprocessing para el trabajo pesado de CPU."],["JavaScript","Un bucle de eventos de un solo hilo: usa await para la E/S, ejecuta llamadas independientes con Promise.all y nunca lo bloquees con bucles largos de CPU."],["Java","Hilos, ExecutorService e hilos virtuales (Java 21) para muchas tareas concurrentes de E/S."],["C#","Task y async/await; evita .Result y .Wait(), que pueden provocar interbloqueos."],["Go","Goroutines y canales; sync.WaitGroup para esperar a un grupo de goroutines."]],"code":"jun
